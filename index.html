<section class="blk" data-sec="2026-04-ca--g7-foreign-ministers-meeting"><h2 id="2026-04-ca--g7-foreign-ministers-meeting">G7 Foreign Ministers’ Meeting</h2>
<ul>
<li><p><strong>Why in News:</strong> EAM attended the G7 Foreign Ministers’ Meeting in <strong>France</strong> as an invited partner country.</p></li>
<li><p><strong>Static Context (G7 Architecture):</strong></p>
<ul>
<li><p><strong>Nature:</strong> Informal grouping of 7 advanced industrialized economies (USA, UK, France, Germany, Italy, Canada, Japan) along with the European Union.</p></li>
<li><p><strong>Evolution:</strong> Originated in <strong>1975</strong> as G6; Canada joined in <strong>1976</strong> to make it G7; Russia joined in <strong>1998</strong> (forming G8) and was suspended in <strong>2014</strong> following the annexation of Crimea.</p></li>
<li><p><strong>Institutional Setup:</strong> Non-treaty-based grouping with <strong>no permanent secretariat</strong>; operates via consensus.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--transit-fees-for-strait-of-hormuz-unclos-princip"><h2 id="2026-04-ca--transit-fees-for-strait-of-hormuz-unclos-princip">Transit Fees for Strait of Hormuz (UNCLOS Principles)</h2>
<ul>
<li><p><strong>Why in News:</strong> Iran drafted a bill seeking to impose transit fees on vessels navigating the Strait of Hormuz, citing wartime security responsibilities.</p></li>
<li><p><strong>UNCLOS Rules on Waterway Levies:</strong></p>
<ul>
<li><p><strong>Transit Passage / Innocent Passage:</strong> Coastal states <strong>cannot levy charges</strong> on foreign vessels merely for transit passage through international straits or innocent passage through territorial waters.</p></li>
<li><p><strong>Service-Based Fees:</strong> Charges may only be levied for specific, rendered services (such as pilotage or towing) and must be strictly <strong>non-discriminatory</strong>.</p></li>
<li><p><strong>Artificial Canals:</strong> Unlike natural straits, artificial man-made canals (e.g., Suez, Panama) are permitted to charge transit tolls to recover construction and maintenance expenses.</p></li>
<li><p><strong>Contiguous Zone Powers:</strong> Coastal states hold enforcement powers to levy customs or fiscal penalties for territorial violations within their contiguous zone.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--united-nations-economic-and-social-council-ecoso"><h2 id="2026-04-ca--united-nations-economic-and-social-council-ecoso">United Nations Economic and Social Council (ECOSOC)</h2>
<ul>
<li><p><strong>Why in News:</strong> India was elected unopposed and by acclamation to <strong>four key subsidiary bodies</strong> of ECOSOC.</p></li>
<li><p><strong>Institutional Setup:</strong></p>
<ul>
<li><p>One of the <strong>six principal organs</strong> of the United Nations; established in <strong>1945</strong> under the UN Charter; headquartered in <strong>New York</strong>.</p></li>
<li><p>Coordinates economic, social, cultural, and environmental work of the UN and specialized agencies.</p></li>
</ul></li>
<li><p><strong>Composition &amp; Election:</strong></p>
<ul>
<li><p>Comprises <strong>54 member states</strong>, with <strong>18 members elected annually</strong> by the UN General Assembly for staggered <strong>three-year terms</strong> based on geographical distribution.</p></li>
<li><p><strong>India’s Representation:</strong> India was elected for the <strong>2026–2028 term</strong>, marking its 18th term on the Council.</p></li>
</ul></li>
</ul></section>

<li><p><strong>Escale à Sète 2026:</strong></p>
<ul>
<li><p><strong>Why in News:</strong> Sail training ship <strong>INS Sudarshini</strong> concluded its maiden participation at the biennial maritime heritage festival in <strong>Sète, France</strong> (under UNESCO patronage).</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--miscellaneous-international-developments"><h2 id="2026-04-ca--miscellaneous-international-developments">Miscellaneous International Developments</h2>
<ul>
<li><p><strong>US Blockade of Iranian Ports:</strong></p>
<ul>
<li><p><strong>Why in News:</strong> US initiated a naval blockade on Iranian ports following diplomatic fallout.</p></li>
<li><p><strong>Concepts:</strong> A blockade is a military operation by a belligerent state to stop ingress/egress to enemy coasts; divided into <strong>Close Blockade</strong> (ships stationed adjacent to enemy shores) and <strong>Distant Blockade</strong> (naval cordons placed further out to mitigate coastal weapon threats).</p></li>
</ul></li>
<li><p><strong>Druzhba Oil Pipeline:</strong></p>
<ul>
<li><p><strong>Why in News:</strong> Ukraine repaired the Druzhba pipeline.</p></li>
<li><p><strong>Geography &amp; Alignment:</strong> Also known as the <em>Friendship Pipeline</em>; spans ~5,500 km; starts at <strong>Almetyevsk, Russia</strong>, splits at <strong>Mozyr, Belarus</strong> into a Northern branch (towards Germany) and a Southern branch passing through Ukraine to Central/Eastern Europe.</p></li>
</ul></li>
<li><p><strong>Punatsangchhu-I Hydroelectric Project (HEP):</strong></p>
<ul>
<li><p><strong>Why in News:</strong> Construction on the HEP in <strong>Bhutan</strong> resumed after a 7-year suspension due to geological and slope stability challenges.</p></li>
<li><p><strong>Specs &amp; Financing:</strong> 1,200 MW run-of-the-river project on the Punatsangchhu River; fully funded by India (40% grant, 60% loan).</p></li>
<li><p><strong>Output:</strong> Generated surplus power will be exported to India; slated to expand Bhutan’s total hydropower generation capacity by ~30%.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--places-in-news"><h2 id="2026-04-ca--places-in-news">Places in News</h2>
<h3 class="topic" id="2026-04-ca--black-sea">Black Sea</h3>
<ul>
<li><p><strong>Why in News:</strong> A drone attack hit an oil tanker carrying Russian crude near the Black Sea.</p></li>
<li><p><strong>Geographical Nature:</strong> Semi-enclosed inland sea and marginal sea of the Atlantic Ocean located between Eastern Europe and Asia.</p></li>
<li><p><strong>Bordering Countries (6):</strong> Russia, Ukraine, Turkey, Romania, Bulgaria, and Georgia.</p></li>
<li><p><strong>Maritime Connectivity &amp; Straits:</strong></p>
<ul>
<li><p>Connects to the <strong>Mediterranean Sea</strong> via the <strong>Bosphorus Strait</strong>, <strong>Sea of Marmara</strong>, and <strong>Dardanelles Strait</strong>.</p></li>
<li><p>Connects to the <strong>Sea of Azov</strong> via the <strong>Strait of Kerch</strong>.</p></li>
</ul></li>
<li><p><strong>Major Inflowing Rivers:</strong> Danube, Dnieper, and Dniester.</p></li>
<li><p><strong>Oceanographic Feature (Meromictic Sea):</strong> <strong>Largest water body in the world</strong> with a meromictic (non-mixing) basin, where water movement between lower and upper layers is exceptionally rare.</p></li>
</ul>

<h3 class="topic" id="2026-04-ca--madagascar">Madagascar</h3>
<ul>
<li><p><strong>Why in News:</strong> Madagascar declared a 15-day nationwide energy emergency due to severe fuel shortages linked to the Iran conflict.</p></li>
<li><p><strong>Geography &amp; Topography:</strong></p>
<ul>
<li><p>The <strong>fourth-largest island in the world</strong>, situated in the southwestern Indian Ocean ~400 km off the coast of East Africa.</p></li>
<li><p>Separated from mainland Africa by the <strong>Mozambique Channel</strong>.</p></li>
<li><p>Nicknamed the <strong>"Great Red Island"</strong> due to dominant red lateritic soils in its central highlands.</p></li>
<li><p><strong>Highest Peak:</strong> Mount Maromokotro.</p></li>
</ul></li>
<li><p><strong>Climatic Linkage:</strong> <strong>Mascarene High</strong>, a semi-permanent subtropical high-pressure cell located near Madagascar, acts as a primary driver of the moisture-laden southwest monsoon winds towards India.</p></li>
<li><p><strong>Biodiversity ("Eighth Continent"):</strong> Exceptionally high degree of endemism (~90% of plant and animal species are endemic), notably lemurs such as the <strong>Indri</strong>.</p></li>
</ul>

<h3 class="topic" id="2026-04-ca--bab-el-mandeb-strait">Bab el-Mandeb Strait</h3>
<ul>
<li><p><strong>Why in News:</strong> Houthi movement in Yemen entered the US-Israel-Iran conflict, escalating risks of maritime transit disruption in the Bab el-Mandeb Strait.</p></li>
<li><p><strong>Geographical Chokepoint:</strong></p>
<ul>
<li><p>Narrow maritime strait positioned between the <strong>Arabian Peninsula</strong> and the <strong>Horn of Africa</strong>.</p></li>
<li><p>Separates <strong>Yemen</strong> from <strong>Djibouti</strong> and <strong>Eritrea</strong>.</p></li>
</ul></li>
<li><p><strong>Connectivity:</strong> Links the <strong>Red Sea</strong> in the north to the <strong>Gulf of Aden</strong> in the south, serving as the strategic southern gateway to the <strong>Suez Canal</strong> connecting the Indian Ocean to the Mediterranean Sea.</p></li>
<li><p><strong>Navigation Channels (Perim Island):</strong> Yemen's <strong>Perim Island</strong> bifurcates the strait into two channels:</p>
<ul>
<li><p>A <strong>wider western channel</strong> used for deep-draft international commercial shipping.</p></li>
<li><p>A <strong>shallower eastern channel</strong> utilized for local coastal navigation.</p></li>
</ul></li>
</ul>

<h3 class="topic" id="2026-04-ca--scarborough-shoal">Scarborough Shoal</h3>
<ul>
<li><p><strong>Why in News:</strong> China escalated maritime tensions by deploying floating barriers and naval vessels to blockade the disputed Scarborough Shoal.</p></li>
<li><p><strong>Nomenclature:</strong> Known as <strong>Huangyan Island</strong> (China) and <strong>Panatag Shoal / Bajo de Masinloc</strong> (Philippines).</p></li>
<li><p><strong>Location &amp; Geography:</strong> A strategic, triangular coral atoll in the <strong>South China Sea</strong>, located ~120 nautical miles west of Luzon (Philippines) and ~470 nautical miles from China's mainland coast.</p></li>
<li><p><strong>Territorial Dispute &amp; Law of the Sea:</strong></p>
<ul>
<li><p>Claimed by the Philippines as falling within its 200-nautical-mile Exclusive Economic Zone (EEZ) under <strong>UNCLOS</strong>.</p></li>
<li><p>China claims sovereignty via its historical <strong>Nine-Dash Line</strong>.</p></li>
<li><p><strong>2016 PCA Award:</strong> Permanent Court of Arbitration ruled against China's historic rights claims under the Nine-Dash Line and deemed its blockade actions unlawful.</p></li>
</ul></li>

<h3 class="topic" id="2026-04-ca--qeshm-island">Qeshm Island</h3>
<ul>
<li><p><strong>Why in News:</strong> Airstrikes damaged vital infrastructure on Iran’s Qeshm Island.</p></li>
<li><p><strong>Location &amp; Physical Geography:</strong></p>
<ul>
<li><p>The <strong>largest island in the Persian Gulf</strong>, aligned parallel to the Iranian coast at the western approach/entrance to the <strong>Strait of Hormuz</strong>.</p></li>
<li><p>Separated from the Iranian mainland by the <strong>Clarence Strait</strong> (also known as the <strong>Khuran Strait</strong>).</p></li>
</ul></li>
<li><p><strong>Strategic &amp; Environmental Significance:</strong></p>
<ul>
<li><p>Houses subterranean IRGC naval bases and missile facilities.</p></li>
<li><p>Serves as an open-air geological showcase: home to a <strong>UNESCO Global Geopark</strong>, the <strong>Namakdan Salt Cave</strong>, and protected <strong>Hara mangrove forests</strong>.</p></li>
</ul></li>
</ul>

<h3 class="topic" id="2026-04-ca--honshu-island">Honshu Island</h3>
<ul>
<li><p><strong>Why in News:</strong> A 6.2 magnitude earthquake struck off the east coast of Honshu Island, Japan.</p></li>
<li><p><strong>Geographical Position:</strong></p>
<ul>
<li><p>The <strong>largest and most populous</strong> of Japan's four primary main islands.</p></li>
<li><p>Situated south of <strong>Hokkaido</strong> and north of <strong>Shikoku</strong> and <strong>Kyushu</strong>.</p></li>
</ul></li>
<li><p><strong>Topography &amp; Significance:</strong> Economic and political core of Japan; rugged mountainous interior featuring <strong>Mount Fuji</strong>, Japan’s highest peak.</p></li>

<h3 class="topic" id="2026-04-ca--mount-semeru">Mount Semeru</h3>
<ul>
<li><p><strong>Why in News:</strong> Mount Semeru in Indonesia erupted multiple times.</p></li>
<li><p><strong>Location &amp; Volcanic Classification:</strong></p>
<ul>
<li><p>Located in <strong>East Java</strong>; stands as the <strong>highest peak on Java island</strong>.</p></li>
<li><p>A steep-sided <strong>stratovolcano</strong> housing the active summit crater <strong>Jonggring-Seloko</strong>, which has seen continuous low-level explosive activity since 1967.</p></li>
</ul></li>
<li><p><strong>Tectonic Setting:</strong> Formed along the subduction zone where the <strong>Indo-Australian Plate</strong> subducts beneath the <strong>Sunda Plate</strong> (part of the Eurasian Plate), creating the <strong>Sunda Trench</strong> (Java Trench) along the Pacific Ring of Fire.</p></li>
</ul></section>
<div class="divider" id="2026-04-ca--div-environment"><span>Environment</span></div>
<section class="blk" data-sec="2026-04-ca--microplastics-in-coastal-ecosystems"><h2 id="2026-04-ca--microplastics-in-coastal-ecosystems">Microplastics in Coastal Ecosystems</h2>
<ul>
<li><p><strong>Why in News:</strong> A recent study found low levels of microplastics on Chennai’s coast.</p></li>
<li><p><strong>Core Characteristics:</strong></p>
<ul>
<li><p>Defined as non-biodegradable synthetic particles <strong>less than 5 mm</strong> in size.</p></li>
<li><p>The majority measure <strong>less than 1000 µm</strong>, making them easily ingested by lower trophic-level marine organisms.</p></li>
</ul></li>
<li><p><strong>Classification:</strong></p>
<ul>
<li><p><strong>Primary Microplastics:</strong> Manufactured deliberately small (e.g., microbeads used in cosmetics, exfoliants, scrubs, and toothpaste).</p></li>
<li><p><strong>Secondary Microplastics:</strong> Formed by physical/chemical fragmentation and weathering of larger plastic waste via solar UV exposure, waves, and mechanical abrasion.</p></li>
</ul></li>
<li><p><strong>Ecosystem Pathway:</strong> Ingestion by marine fauna → Bioaccumulation in tissues → Trophic transfer through the marine food chain → Human exposure via seafood.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--state-of-global-marine-conservation"><h2 id="2026-04-ca--state-of-global-marine-conservation">State of Global Marine Conservation</h2>
<ul>
<li><p><strong>Why in News:</strong> According to the World Database on Protected and Conserved Areas (WDPCA), global ocean protection has <strong>risen by 1.41% since 2024</strong>, bringing <strong>nearly 10%</strong> of the world ocean under protection.</p></li>
<li><p><strong>Institutional Architecture:</strong></p>
<ul>
<li><p>Joint initiative of the <strong>United Nations Environment Programme (UNEP)</strong> and the <strong>International Union for Conservation of Nature (IUCN)</strong>.</p></li>
<li><p>Compiled and maintained by the <strong>UNEP World Conservation Monitoring Centre (UNEP-WCMC)</strong> in Cambridge.</p></li>
<li><p>Database updated on a <strong>monthly basis</strong>.</p></li>
</ul></li>
<li><p><strong>Policy Benchmark:</strong> Tracks progress toward <strong>Target 3 (30x30)</strong> of the <em>Kunming–Montreal Global Biodiversity Framework (KMGBF)</em>, which mandates protecting 30% of degraded terrestrial and marine ecosystems by 2030.</p></li>
<li><p><strong>Key Conservation Gaps:</strong></p>
<ul>
<li><p>While ~10% of total ocean surface is protected, only <strong>1.66% of the High Seas</strong> (areas beyond national jurisdiction) is conserved.</p></li>
<li><p>Only <strong>~3%</strong> of oceans fall under "fully or highly protected" regimes with strictly prohibited industrial fishing.</p></li>
<li><p>30–34% of marine <strong>Key Biodiversity Areas (KBAs)</strong> still lack formal protection.</p></li>
<li><p><strong>Largest Marine Protected Area (MPA):</strong> <strong>Tainui Atea</strong> (French Polynesia) is currently the world’s largest MPA.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--hydrofluorocarbons-hfcs-phase-down"><h2 id="2026-04-ca--hydrofluorocarbons-hfcs-phase-down">Hydrofluorocarbons (HFCs) Phase-Down</h2>
<ul>
<li><p><strong>Why in News:</strong> Government directed all authorities to halt environmental clearances for new or additional HFC production beyond <strong>December 31, 2027</strong>, amending the Ozone Depleting Substances Rules, 2000.</p></li>
<li><p><strong>Chemical Profile:</strong></p>
<ul>
<li><p>Potent synthetic greenhouse gases primarily used in refrigeration, air conditioning, foam-blowing agents, and aerosols.</p></li>
<li><p>Introduced as non-ozone-depleting alternatives to CFCs and HCFCs (i.e., <strong>zero Ozone Depletion Potential / ODP</strong>).</p></li>
<li><p>Possess an exceptionally <strong>high Global Warming Potential (GWP)</strong>, making them major contributors to climate change.</p></li>
</ul></li>
<li><p><strong>Kigali Amendment to the Montreal Protocol:</strong></p>
<ul>
<li><p>Adopted in <strong>2016</strong> (Kigali, Rwanda) as a <strong>legally binding</strong> international pact to phase down HFC consumption and production.</p></li>
<li><p>India ratified in <strong>2021</strong>; committed to <strong>freeze HFC production/consumption by 2028</strong> and achieve an <strong>85% reduction by 2047</strong>.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--india-withdrew-from-hosting-cop33-in-2028"><h2 id="2026-04-ca--india-withdrew-from-hosting-cop33-in-2028">India Withdrew from Hosting COP33 in 2028</h2>
<ul>
<li><p><strong>Why in News:</strong> India withdrew its bid to host the UNFCCC COP33 (2028), leaving <strong>South Korea</strong> as the sole contender from the Asia-Pacific regional group.</p></li>
<li><p><strong>India's Past Hosting Record:</strong> India has hosted the UN climate COP only once: <strong>COP8 in 2002 (New Delhi)</strong>.</p></li>
<li><p><strong>Upcoming COP Venues:</strong></p>
<ul>
<li><p><strong>COP31 (2026):</strong> Jointly hosted by <strong>Turkey and Australia</strong>.</p></li>
<li><p><strong>COP32 (2027):</strong> Scheduled to be held in <strong>Ethiopia</strong>.</p></li>
</ul></li>
<li><p><strong>UNFCCC Venue Rotation &amp; Selection:</strong></p>
<ul>
<li><p>Rotates sequentially through five UN regional groups: African, Asia-Pacific, Eastern European, Latin American &amp; Caribbean (GRULAC), and Western European &amp; Others (WEOG).</p></li>
<li><p>Member states within the eligible region consult internally to select and submit a single nominee.</p></li>
<li><p><strong>Default Venue:</strong> If no host comes forward or consensus fails, sessions default to the UNFCCC Secretariat headquarters in <strong>Bonn, Germany</strong>.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--bhavasagara-national-deep-sea-fauna-repository"><h2 id="2026-04-ca--bhavasagara-national-deep-sea-fauna-repository">Bhavasagara: National Deep-Sea Fauna Repository</h2>
<ul>
<li><p><strong>Why in News:</strong> MoEFCC designated the "Bhavasagara" Referral Centre as India’s <strong>National Repository for Deep-Sea Fauna</strong> under the <strong>Biological Diversity Act, 2002</strong>.</p></li>
<li><p><strong>Location &amp; Institutional Host:</strong> Located at the <strong>Centre for Marine Living Resources and Ecology (CMLRE)</strong> in <strong>Kochi, Kerala</strong>.</p></li>
<li><p><strong>Parent Ministry of CMLRE:</strong> Operates under the <strong>Ministry of Earth Sciences (MoES)</strong>.</p></li>
<li><p><strong>Core Mandate:</strong> Acts as the designated legal custodian for preserving specimen vouchers and genetic/taxonomic data of newly discovered marine organisms across India’s Exclusive Economic Zone (EEZ).</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--national-biodiversity-authority-nba"><h2 id="2026-04-ca--national-biodiversity-authority-nba">National Biodiversity Authority (NBA)</h2>
<ul>
<li><p><strong>Why in News:</strong> National Biodiversity Authority (NBA) launched a new short-term Internship Programme for graduates and postgraduates focusing on biodiversity conservation.</p></li>
<li><p><strong>Statutory Framework &amp; Ministry:</strong></p>
<ul>
<li><p>Autonomous <strong>statutory body</strong> established in <strong>2003</strong> under the <strong>Ministry of Environment, Forest and Climate Change (MoEFCC)</strong>.</p></li>
<li><p>Mandated to implement the <strong>Biological Diversity Act, 2002</strong> (as amended by the Amendment Act, 2023).</p></li>
</ul></li>
<li><p><strong>Composition:</strong> Led by a Central Government-appointed Chairperson; includes ex-officio ministry representatives and non-official biodiversity experts.</p></li>
<li><p><strong>Key Functions:</strong></p>
<ul>
<li><p>Operationalises <strong>Access and Benefit Sharing (ABS)</strong> mechanisms.</p></li>
<li><p>Ensures compliance with the international <strong>Nagoya Protocol</strong>.</p></li>
<li><p>Combats biopiracy and advises State Governments on notifying <strong>Biodiversity Heritage Sites (BHS)</strong>.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--kuala-lumpur-declaration-on-climate-justice"><h2 id="2026-04-ca--kuala-lumpur-declaration-on-climate-justice">Kuala Lumpur Declaration on Climate Justice</h2>
<ul>
<li><p><strong>Why in News:</strong> Kuala Lumpur Declaration on Climate Justice was issued ahead of COP31 and the Santa Marta Conference, calling for accelerated climate action in the Global South.</p></li>
<li><p><strong>Origin &amp; Adoption:</strong> Adopted by civil society organisations and climate experts from South and Southeast Asia.</p></li>
<li><p><strong>Santa Marta Conference:</strong> Upcoming international climate meeting in <strong>Colombia</strong> aimed at building global consensus on phasing out fossil fuels.</p></li>
<li><p><strong>Key Demands:</strong></p>
<ul>
<li><p><strong>Fossil Fuel Transition:</strong> Calls for a time-bound, equitable phase-out of coal, oil, and gas, and advocates a standalone <strong>Fossil Fuel Treaty</strong> alongside the Paris Agreement.</p></li>
<li><p><strong>Climate Finance:</strong> Seeks <strong>$5.1–6.8 trillion by 2030</strong> and approximately <strong>$5 trillion annually</strong> to fund energy transitions across developing economies.</p></li>
<li><p><strong>Equity &amp; Adaptation:</strong> Emphasises a people-centric just transition; demands a <strong>tripling of adaptation finance</strong> along with expanded Loss and Damage funding.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--ethanol-blending-in-aviation-turbine-fuel-atf"><h2 id="2026-04-ca--ethanol-blending-in-aviation-turbine-fuel-atf">Ethanol Blending in Aviation Turbine Fuel (ATF)</h2>
<ul>
<li><p><strong>Why in News:</strong> Government approved ethanol blending in Aviation Turbine Fuel (ATF).</p></li>
<li><p><strong>Technical Nuance:</strong> Ethanol <strong>cannot be directly blended into ATF</strong>; it must first be converted into <strong>synthetic hydrocarbons</strong>.</p></li>
<li><p><strong>Standards Compliance:</strong> Blended fuels must adhere strictly to <strong>Bureau of Indian Standards (BIS)</strong> criteria:</p>
<ul>
<li><p><strong>IS 1571</strong> for conventional ATF.</p></li>
<li><p><strong>IS 17081</strong> for synthetic kerosene blends.</p></li>
</ul></li>
<li><p><strong>Milestone:</strong> India achieved its <strong>20% ethanol blending target in petrol (E20) in 2025</strong>, advancing the timeline ahead of the original 2030 deadline set under the National Policy on Biofuels.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--marine-spatial-planning-msp"><h2 id="2026-04-ca--marine-spatial-planning-msp">Marine Spatial Planning (MSP)</h2>
<ul>
<li><p><strong>Why in News:</strong> Odisha became the <strong>first state</strong> to launch a Marine Spatial Plan (MSP), following pilot frameworks in Puducherry and Lakshadweep.</p></li>
<li><p><strong>Institutional Context:</strong> Part of Phase II of the <strong>Indo-Norway Integrated Ocean Initiative</strong>, launched in 2019 to improve sustainable ocean governance.</p></li>
<li><p><strong>Definition &amp; Methodology:</strong></p>
<ul>
<li><p>A data-driven, <strong>place-based</strong> zoning framework allocating maritime space for activities like fishing, shipping, and tourism while conserving marine ecosystems.</p></li>
<li><p>Transitions maritime administration from sector-wise silos to <strong>ecosystem-based management</strong>.</p></li>
<li><p>Follows the <strong>UNESCO-IOC 10-step "learning-by-doing" cycle</strong> for ecosystem mapping, zoning, stakeholder consultation, and adaptive monitoring.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--tar-balls"><h2 id="2026-04-ca--tar-balls">Tar Balls</h2>
<ul>
<li><p><strong>Why in News:</strong> MoEFCC released India’s first draft rules to manage tar balls, mandating coastal states to classify severe tar-ball pollution as a <strong>State Disaster</strong>.</p></li>
<li><p><strong>Origin &amp; Formation:</strong> Dark, sticky lumps of <strong>weathered crude oil</strong> formed when marine oil slicks lose volatile lighter fractions and mix with seawater into dense residues.</p></li>
<li><p><strong>Ecological &amp; Economic Impact:</strong> Toxic to marine life, disrupts sea turtle nesting habitats, degrades coastal beaches, and damages local tourism and fishing livelihoods.</p></li>
<li><p><strong>Remediation &amp; Degradation:</strong></p>
<ul>
<li><p>Marine hydrocarbon-degrading bacteria (e.g., <em><strong>Alcanivorax</strong></em>) degrade them <strong>very slowly</strong> due to their dense, solid structure.</p></li>
<li><p>Primary immediate response is <strong>manual shoreline sweeping</strong>; collected residues require disposal via high-temperature incineration or co-processing as alternative fuels in cement kilns.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--plastic-waste-management-amendment-rules-2026"><h2 id="2026-04-ca--plastic-waste-management-amendment-rules-2026">Plastic Waste Management (Amendment) Rules, 2026</h2>
<ul>
<li><p><strong>Why in News:</strong> Government notified amendments to the Plastic Waste Management Rules, 2016.</p></li>
<li><p><strong>Parent Statute:</strong> Enacted under the <strong>Environment (Protection) Act, 1986</strong>.</p></li>
<li><p><strong>Key Provisions &amp; Amendments:</strong></p>
<ul>
<li><p><strong>Recycling Mandates:</strong> Enforces progressive statutory recycling targets, mandating <strong>30% to 60% recycled content in rigid plastics by 2028–29</strong>.</p></li>
<li><p><strong>Compliance Flexibility:</strong> Allows carry-forward of unmet recycling quotas for <strong>up to 3 years</strong> and introduces <strong>tradable plastic credits/certificates</strong>.</p></li>
<li><p><strong>End-of-Life Disposal:</strong> Authorises waste-to-energy conversion, co-processing in cement kilns, and waste-to-oil technologies.</p></li>
<li><p><strong>Categorisation:</strong> Regulates packaging across distinct categories (rigid, flexible, and multi-layered plastics) with separate targets.</p></li>
<li><p><strong>Static Background:</strong> Anchored in the <strong>Extended Producer Responsibility (EPR)</strong> framework; earlier 2022 amendment banned identified single-use plastics (SUPs).</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--compressed-biogas-cbg-in-india"><h2 id="2026-04-ca--compressed-biogas-cbg-in-india">Compressed Biogas (CBG) in India</h2>
<ul>
<li><p><strong>Why in News:</strong> India plans to rapidly scale up compressed biogas (CBG) production to cut <strong>LNG import dependency</strong> amidst volatile global energy supply chains.</p></li>
<li><p><strong>Composition &amp; Fuel Properties:</strong></p>
<ul>
<li><p>Purified form of biogas containing <strong>~90–95% methane (</strong>CH<sub>4</sub><strong>)</strong>, giving it a calorific value and chemical profile comparable to conventional Natural Gas / CNG.</p></li>
<li><p>Produced via anaerobic digestion of agricultural residues, animal dung, municipal solid waste (MSW), and sewage sludge.</p></li>
<li><p>Processed by removing impurities like carbon dioxide (CO<sub>2</sub>), hydrogen sulphide (H<sub>2</sub>S), and moisture to boost energy density.</p></li>
</ul></li>
<li><p><strong>Major Government Initiatives:</strong></p>
<ul>
<li><p><strong>SATAT (Sustainable Alternative Towards Affordable Transportation):</strong> Promotes commercial CBG plants using agricultural and organic biomass for automotive fuel.</p></li>
<li><p><strong>GOBARdhan Scheme:</strong> Multi-ministerial initiative with a ₹10,000 crore commitment to convert rural cattle dung and organic waste into biogas and bio-slurry manure.</p></li>
<li><p><strong>National Biogas Programme:</strong> Launched in 2021 to support small/medium biogas installations for household cooking and off-grid rural power.</p></li>
<li><p><strong>Waste-to-Energy Programme:</strong> Provides capital subsidies for large-scale urban and industrial organic waste-to-biogas processing plants.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--nuclear-energy-in-india"><h2 id="2026-04-ca--nuclear-energy-in-india">Nuclear Energy in India</h2>
<ul>
<li><p><strong>Why in News:</strong> Central Electricity Authority (CEA) has set a target of <strong>100 GW of nuclear power by 2047</strong>, marking a tenfold increase from the current 8.8 GW.</p></li>
<li><p><strong>Share in Power Mix:</strong></p>
<ul>
<li><p>Nuclear energy currently accounts for <strong>3.1% of India’s total electricity generation</strong>.</p></li>
<li><p>Current installed nuclear capacity stands at <strong>8.78 GW</strong> (generating 56,681 million units).</p></li>
<li><p>Planned expansion aims to reach <strong>22.38 GW nationally by 2031–32</strong>.</p></li>
<li><p>The 100 GW target by 2047 is projected to meet roughly <strong>10% of India’s total energy requirements</strong>.</p></li>
</ul></li>
<li><p><strong>Civil Nuclear Cooperation:</strong> India maintains active civil nuclear agreements with <strong>18 countries</strong>.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--convention-on-migratory-species-cms-cop15"><h2 id="2026-04-ca--convention-on-migratory-species-cms-cop15">Convention on Migratory Species (CMS COP15)</h2>
<ul>
<li><p><strong>Why in News:</strong> The 15th Conference of the Parties (COP15) to the Convention on the Conservation of Migratory Species of Wild Animals (CMS) concluded in <strong>Campo Grande, Brazil</strong>, under the theme <em>"Connecting Nature to Sustain Life"</em>.</p></li>
<li><p><strong>Next Summit:</strong> <strong>COP16</strong> will be hosted by <strong>Germany in Bonn in 2029</strong>, marking the <strong>50th anniversary</strong> of the Convention (Bonn Convention, 1979).</p></li>
<li><p><strong>Key Outcomes &amp; Declarations:</strong></p>
<ul>
<li><p><strong>Species Listings:</strong> Added <strong>40 species</strong> to CMS Appendices (e.g., Giant Otter, Striped Hyena, and Thresher Sharks added to <strong>Appendix I</strong>).</p></li>
<li><p><strong>Habitat Protection:</strong> Designated <strong>seamounts</strong> as critical habitats with restrictions on destructive fishing.</p></li>
<li><p><strong>Blue Corridors:</strong> Endorsed transboundary migration routes ("Blue Corridors") for whales, sea turtles, and sharks; urged a <strong>moratorium on deep-seabed mining</strong> until ecological safety is proven.</p></li>
<li><p><strong>Global Initiative on the Taking of Migratory Species:</strong> Established to tackle illegal hunting, taking, and trade.</p></li>
<li><p><strong>Avian Conservation:</strong> Identified <strong>six major ocean flyways</strong> to coordinate seabird conservation over international waters; mandated wildlife-friendly infrastructure and noise limits for marine fauna.</p></li>
<li><p><strong>Regional Plans:</strong> Launched the <em>Atlas of Migratory Routes of the Americas</em> and adopted the <em>Amazonian Catfish Action Plan</em> (protecting the world's longest freshwater migration route).</p></li>
</ul></li>
<li><p><strong>Migratory Freshwater Fishes Report (Key Findings):</strong></p>
<ul>
<li><p>Populations of migratory freshwater fish have fallen by <strong>81% globally since 1970</strong>.</p></li>
<li><p><strong>"Megafish"</strong> species (weighing &gt;30 kg) dropped by <strong>94%</strong>.</p></li>
<li><p><strong>Asia</strong> holds the highest number of at-risk freshwater migratory species (205 species).</p></li>
<li><p>Proposed the creation of <strong>"Swimways"</strong> (migratory freshwater corridors modeled after avian flyways) in synergy with the Convention on Biological Diversity (CBD).</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--india-s-nationally-determined-contribution-ndc-3"><h2 id="2026-04-ca--india-s-nationally-determined-contribution-ndc-3">India’s Nationally Determined Contribution (NDC 3.0: 2031–2035)</h2>
<ul>
<li><p><strong>Why in News:</strong> Union Cabinet approved India's Nationally Determined Contribution (NDC) for the <strong>2031–2035</strong> period.</p></li>
<li><p><strong>Implementation Mechanism:</strong> Operationalised via the National Action Plan on Climate Change (NAPCC) across its <strong>nine national missions</strong>.</p></li>
<li><p><strong>NDC Conceptual Framework (Paris Agreement):</strong></p>
<ul>
<li><p>Nationally self-defined, non-punitive pledges submitted every <strong>five years</strong> under the <strong>"ratchet mechanism"</strong> (each submission must represent progression).</p></li>
<li><p>Global collective progress assessed via the <strong>Global Stocktake (GST)</strong> every 5 years.</p></li>
</ul></li>
<li><p><strong>India’s Quantitative Targets (NDC 2.0 vs. NDC 3.0 vs. Current Status):</strong></p>
<ul>
<li><p><strong>Emissions Intensity of GDP:</strong></p>
<ul>
<li><p><em>NDC 2.0 (2030):</em> 45% reduction from 2005 levels.</p></li>
<li><p><em>NDC 3.0 (2035):</em> <strong>47% reduction</strong> from 2005 levels.</p></li>
<li><p><em>Status:</em> Achieved 36% reduction (as of 2020).</p></li>
</ul></li>
<li><p><strong>Non-Fossil Electric Power Capacity:</strong></p>
<ul>
<li><p><em>NDC 2.0 (2030):</em> 50% cumulative electric power capacity.</p></li>
<li><p><em>NDC 3.0 (2035):</em> <strong>60% cumulative capacity</strong> from non-fossil sources.</p></li>
<li><p><em>Status:</em> Stood at 52.57% (as of February 2026).</p></li>
</ul></li>
<li><p><strong>Carbon Sink Creation:</strong></p>
<ul>
<li><p><em>NDC 2.0 (2030):</em> Additional 2.5 to 3.0 billion tonnes of CO<sub>2</sub> equivalent.</p></li>
<li><p><em>NDC 3.0 (2035):</em> <strong>3.5 to 4.0 billion tonnes of</strong> CO<sub>2</sub> <strong>equivalent</strong> through forest and tree cover.</p></li>
<li><p><em>Status:</em> Created 2.29 billion tonnes (as of 2021).</p></li>
</ul></li>
</ul></li>
<li><p><strong>Qualitative Pillars:</strong> Mainstreaming sustainable lifestyles through <strong>Mission LiFE</strong>, strengthening adaptation across coastal, Himalayan, and agro-ecosystems, and securing low-cost multilateral climate finance.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--shekha-jheel-bird-sanctuary"><h2 id="2026-04-ca--shekha-jheel-bird-sanctuary">Shekha Jheel Bird Sanctuary</h2>
<ul>
<li><p><strong>Why in News:</strong> Shekha Jheel Bird Sanctuary in <strong>Uttar Pradesh</strong> was designated as India’s <strong>99th Ramsar site</strong>.</p></li>
<li><p><strong>Ramsar Count:</strong> Takes Uttar Pradesh's Ramsar site tally to <strong>12</strong>.</p></li>
<li><p><strong>Geographical Context:</strong></p>
<ul>
<li><p>Freshwater perennial wetland located in <strong>Aligarh, Uttar Pradesh</strong>.</p></li>
<li><p>Formed in <strong>1852</strong> as a byproduct of the construction of the <strong>Upper Ganges Canal</strong>.</p></li>
</ul></li>
<li><p><strong>Avian Significance:</strong></p>
<ul>
<li><p>Critical stopover point along the <strong>Central Asian Flyway (CAF)</strong>; designated as an Important Bird Area (IBA).</p></li>
<li><p>Key bird species: Sarus Crane, Black-necked Stork, Eurasian Spoonbill, Bar-headed Goose, Painted Stork, Greylag Goose, and Northern Pintail.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--gourami-fish-fossil-discovery"><h2 id="2026-04-ca--gourami-fish-fossil-discovery">Gourami Fish Fossil Discovery</h2>
<ul>
<li><p><strong>Why in News:</strong> Scientists discovered India’s first-ever fossil of a gourami fish in the <strong>Siwalik foothills of Saharanpur, Uttar Pradesh</strong>.</p></li>
<li><p><strong>Paleontological Significance:</strong> This represents only the <strong>second gourami fossil discovered globally</strong> (the first was found in Sumatra, Indonesia).</p></li>
<li><p><strong>Biological Features of Gouramis:</strong></p>
<ul>
<li><p>Freshwater fish taxa native to <strong>Asia</strong>.</p></li>
<li><p>Possess an accessory <strong>labyrinth organ</strong> (lung-like vascular structure) enabling them to gulp and breathe atmospheric oxygen directly at the water surface.</p></li>
<li><p>Evolutionary adaptation allowing them to thrive in shallow, sluggish, or stagnant water bodies with <strong>low dissolved oxygen (hypoxic conditions)</strong>.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--emperor-penguins-antarctic-fur-seals-iucn-uplist"><h2 id="2026-04-ca--emperor-penguins-antarctic-fur-seals-iucn-uplist">Emperor Penguins &amp; Antarctic Fur Seals (IUCN Uplisting)</h2>
<ul>
<li><p><strong>Why in News:</strong> IUCN reclassified both emperor penguins and Antarctic fur seals as <strong>Endangered</strong> on its Red List of Threatened Species.</p>
<ul>
<li><p>Emperor penguins were uplisted from <em>Near Threatened</em>.</p></li>
<li><p>Antarctic fur seals jumped multiple categories from <em>Least Concern</em> directly to <em>Endangered</em>.</p></li>
</ul></li>
<li><p><strong>Concept (Sentinel Species):</strong> Organisms used as early-warning bio-indicators of environmental hazards due to high sensitivity to toxins or climatic shifts.</p>
<ul>
<li><p><em>Examples:</em> Canaries (carbon monoxide), amphibians (aquatic toxins), honeybees (pesticides/air quality), and emperor penguins (climate change/polar ice loss).</p></li>
</ul></li>
<li><p><strong>Emperor Penguin Profile:</strong></p>
<ul>
<li><p>Largest and heaviest of all living penguin species.</p></li>
<li><p><strong>Endemic to Antarctica</strong> (colonies distributed between 66<sup>∘</sup> and 78<sup>∘</sup> South latitude).</p></li>
<li><p>Only bird species that breeds during the harsh <strong>Antarctic winter</strong>.</p></li>
<li><p><strong>Physiological traits:</strong> Highest feather density of any bird; thick subdermal blubber layer.</p></li>
<li><p><strong>Diving capability:</strong> World’s deepest-diving birds (reach depths &gt;550 m and submerge for &gt;30 minutes).</p></li>
<li><p><strong>Behaviour:</strong> True polar birds dependent on stable sea ice (<em>fast ice</em>) and ice shelves; form dense social <strong>huddles</strong> to conserve body heat.</p></li>
</ul></li>
<li><p><strong>Antarctic Fur Seal Profile:</strong></p>
<ul>
<li><p>Marine mammal exhibiting extreme <strong>sexual dimorphism</strong> (dark brown males are up to 5× larger than greyish-brown females).</p></li>
<li><p><strong>Habitat &amp; Distribution:</strong> Rocky shores and tussock grasslands of sub-Antarctic islands; majority of breeding occurs on <strong>South Georgia Island</strong>; forages across the Southern Ocean.</p></li>
<li><p><strong>Diet:</strong> <strong>Antarctic krill</strong> accounts for ~95% of their diet.</p></li>
<li><p><strong>Breeding Behaviour:</strong> Males act as aggressive territorial <strong>"beachmasters"</strong>, defending shoreline territories via vocalisation and combat.</p></li>
<li><p>Historically targeted and hunted nearly to extinction in the 18th and 19th centuries for their pelts.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--tibetan-antelope-chiru"><h2 id="2026-04-ca--tibetan-antelope-chiru">Tibetan Antelope (Chiru)</h2>
<ul>
<li><p><strong>Why in News:</strong> A Delhi court convicted a trader for the illegal export of Shahtoosh shawls.</p></li>
<li><p><strong>Shahtoosh Fibre:</strong> High-value luxury shawls made from the ultra-fine underfur of the Chiru (known as "ring shawls").</p>
<ul>
<li><p>Crucial nuance: Chiru cannot be sheared; fibre is obtained strictly by <strong>killing the animal</strong>, triggering rampant poaching.</p></li>
<li><p>Trade, sale, and export are banned in India and globally under <strong>CITES</strong>.</p></li>
</ul></li>
<li><p><strong>Biological Profile:</strong></p>
<ul>
<li><p>Medium-sized bovid native to the cold, high-altitude alpine steppes of the <strong>Tibetan Plateau</strong> (3,250–5,500 m).</p></li>
<li><p>High-altitude adaptations: Possesses specialised internal air sacs and retains <strong>fetal haemoglobin into adulthood</strong> to maximize oxygen uptake in thin air.</p></li>
<li><p>Female Chiru undertake extensive long-distance seasonal migrations to specialized calving grounds.</p></li>
</ul></li>
<li><p><strong>Distribution:</strong> Primarily in <strong>China</strong> (Tibet, Xinjiang, and Qinghai); small seasonal migratory population enters <strong>Ladakh, India</strong>.</p></li>
<li><p><strong>Conservation Status:</strong></p>
<ul>
<li><p><strong>IUCN:</strong> Near Threatened (NT).</p></li>
<li><p><strong>Wildlife (Protection) Act, 1972:</strong> Schedule I.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--indian-crested-porcupine"><h2 id="2026-04-ca--indian-crested-porcupine">Indian Crested Porcupine</h2>
<ul>
<li><p><strong>Why in News:</strong> Saffron farmers in Kashmir reported significant crop damages due to Indian crested porcupines.</p></li>
<li><p><strong>Taxonomy &amp; Habitat:</strong> Large, nocturnal <strong>rodent</strong> native to South Asia and the Middle East; inhabits varied habitats from temperate scrub forests to agricultural fields.</p></li>
<li><p><strong>Geographical Range:</strong> Central and Southwest Asia, from Turkey and the Middle East across India, Nepal, and Sri Lanka.</p></li>
<li><p><strong>Feeding Behaviour &amp; Ecology:</strong></p>
<ul>
<li><p>Primarily herbivorous.</p></li>
<li><p>Exhibits <strong>osteophagia</strong> (chewing on bones and shed antlers) to obtain calcium for quill growth and wear down open-rooted, continuously growing incisors.</p></li>
<li><p>Functions as an <strong>ecological habitat modifier</strong> through soil aeration, burrow excavation, and seed caching/dispersal.</p></li>
</ul></li>
<li><p><strong>Conservation Status:</strong></p>
<ul>
<li><p><strong>IUCN:</strong> Least Concern (LC).</p></li>
<li><p><strong>Wildlife (Protection) Act, 1972:</strong> Schedule I.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--jumpstart-approach-wildlife-conservation"><h2 id="2026-04-ca--jumpstart-approach-wildlife-conservation">Jumpstart Approach (Wildlife Conservation)</h2>
<ul>
<li><p><strong>Why in News:</strong> A Great Indian Bustard (GIB) chick hatched in Kutch (Gujarat) using the Jumpstart Approach, marking India's first inter-state Jumpstart initiative.</p></li>
<li><p><strong>Concept &amp; Mechanism:</strong></p>
<ul>
<li><p>Targeted assisted reproductive conservation strategy deployed for highly endangered populations that are too small, fragmented, or male-biased to sustain natural breeding.</p></li>
<li><p>Entails locating an infertile egg in a wild nest and <strong>replacing it with a fertile, partially incubated captive-bred egg</strong>, allowing the wild female to incubate and rear the chick naturally in the wild.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--madras-hedgehog"><h2 id="2026-04-ca--madras-hedgehog">Madras Hedgehog</h2>
<ul>
<li><p><strong>Why in News:</strong> The first complete mitochondrial genome sequencing of the Madras hedgehog confirmed it is a sister species to the Indian hedgehog.</p></li>
<li><p><strong>Taxonomy &amp; Endemism:</strong> Also known as the bare-bellied hedgehog; strictly <strong>endemic to southeastern India</strong> (found only in southern and central Tamil Nadu).</p></li>
<li><p><strong>Habitat &amp; Diet:</strong> Inhabits arid/semi-arid dry thorny scrublands, dry grasslands, and dried ponds; omnivorous diet centered on insects, ground-nesting bird eggs, small vertebrates, and scorpions.</p></li>
<li><p><strong>Physiological Behaviour:</strong> Curls into a tight spiny ball for predator defense; nocturnal; enters periods of torpor/hibernation regulated by ambient temperature and prey availability.</p></li>
<li><p><strong>Hedgehog Species in India (4):</strong> Indian hedgehog, Indian long-eared hedgehog, Madras hedgehog, and Brandt’s hedgehog.</p></li>
<li><p><strong>Conservation Status:</strong> <strong>IUCN:</strong> Least Concern (LC).</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--sperm-whale"><h2 id="2026-04-ca--sperm-whale">Sperm Whale</h2>
<ul>
<li><p><strong>Why in News:</strong> Researchers documented footage of sub-adult sperm whales engaging in aggressive headbutting, challenging earlier assumptions that combat was restricted solely to mature adult bulls.</p></li>
<li><p><strong>Morphology &amp; Physical Traits:</strong></p>
<ul>
<li><p>The world's largest toothed predator; possesses the <strong>largest brain of any living animal</strong>.</p></li>
<li><p>The head constitutes roughly one-third of its entire body length and houses the <strong>spermaceti organ</strong> (filled with spermaceti wax) used to modulate buoyancy and amplify echolocation clicks.</p></li>
<li><p>Produces directional acoustic clicks reaching up to 230 dB, representing the loudest animal sound in the marine environment.</p></li>
</ul></li>
<li><p><strong>Ecology &amp; Behavior:</strong></p>
<ul>
<li><p>Found across deep, open ice-free waters (&gt;1,000 m), foraging along continental shelf breaks and submarine canyons for deep-sea giant squids.</p></li>
<li><p>Females and young calves reside in stable matrilineal social pods, communicating via unique dialect-based click sequences called <strong>"codas"</strong>.</p></li>
<li><p>Acts as a vital <strong>"whale pump"</strong>: dives deep to feed and releases nutrient-rich fecal plumes near the surface, seeding upper ocean photic zones with iron and nitrogen to stimulate primary phytoplankton productivity.</p></li>
</ul></li>
<li><p><strong>Conservation Status:</strong></p>
<ul>
<li><p><strong>IUCN:</strong> Vulnerable (VU).</p></li>
<li><p><strong>Wildlife (Protection) Act, 1972:</strong> Schedule II.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--jungle-cat-felis-chaus"><h2 id="2026-04-ca--jungle-cat-felis-chaus">Jungle Cat (<em>Felis chaus</em>)</h2>
<ul>
<li><p><strong>Why in News:</strong> The first comprehensive population assessment of the jungle cat was carried out.</p></li>
<li><p><strong>Habitat &amp; Niches:</strong> Medium-sized wild cat (also called <em>swamp cat</em> or <em>reed cat</em>) adapted specifically to <strong>wetlands, reed beds, and marshy habitats</strong>; typically avoids dense, deep interior forests.</p></li>
<li><p><strong>Distribution:</strong> Ranges from the Middle East through South and Southeast Asia. In India, it is the most common small wild cat, distributed across most regions except high altitudes and extreme arid deserts.</p></li>
<li><p><strong>Ecological Role:</strong> Functions as an opportunistic <strong>mesopredator</strong>; feeds predominantly on rodents (~70%), acting as a vital natural <strong>biological pest controller</strong> in agricultural landscapes.</p></li>
<li><p><strong>Conservation Status:</strong></p>
<ul>
<li><p><strong>IUCN Red List:</strong> Least Concern (LC).</p></li>
<li><p><strong>Wildlife (Protection) Act, 1972:</strong> Schedule I.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--rice-s-whale-balaenoptera-ricei"><h2 id="2026-04-ca--rice-s-whale-balaenoptera-ricei">Rice’s Whale (<em>Balaenoptera ricei</em>)</h2>
<ul>
<li><p><strong>Why in News:</strong> Emerged as a primary regulatory constraint on proposed offshore oil and gas expansion in the Gulf of Mexico due to its critically endangered, dwindling population.</p></li>
<li><p><strong>Distribution &amp; Endemism:</strong> The <strong>only resident baleen whale endemic to the Gulf of Mexico</strong> (primarily concentrated in the northeastern corner), with a global population of only ~50 individuals.</p></li>
<li><p><strong>Behavior &amp; Role:</strong></p>
<ul>
<li><p>Exhibits <strong>diel vertical migration</strong>: stays in deep water columns during daylight and surfaces at night.</p></li>
<li><p>Plays a critical role in vertical marine nutrient cycling between deep waters and the epipelagic photic zone.</p></li>
</ul></li>
<li><p><strong>Conservation Status:</strong></p>
<ul>
<li><p><strong>IUCN Red List:</strong> <strong>Critically Endangered (CR)</strong>.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--sanderling-calidris-alba"><h2 id="2026-04-ca--sanderling-calidris-alba">Sanderling (<em>Calidris alba</em>)</h2>
<ul>
<li><p><strong>Why in News:</strong> Recorded on <strong>Narcondam Island</strong> (volcanic island in the Andaman Sea).</p></li>
<li><p><strong>Migratory Cycle:</strong> Small wading shorebird that breeds in the high Arctic tundra and winters across temperate and tropical open sandy beaches along the <strong>East Asian–Australasian Flyway (EAAF)</strong>.</p>
<ul>
<li><p>In India, winter records occur along Andaman &amp; Nicobar, Goa, and Kerala.</p></li>
</ul></li>
<li><p><strong>Feeding Behaviour:</strong> Carnivorous shorebird showing classic <strong>"wave-chasing" feeding behavior</strong> (running after retreating waves to probe for small crabs, amphipods, and polychaetes).</p></li>
<li><p><strong>Ecological Importance:</strong> Bio-indicator of sandy beach and intertidal benthic ecological health.</p></li>
<li><p><strong>Conservation Status:</strong></p>
<ul>
<li><p><strong>IUCN Red List:</strong> Least Concern (LC).</p></li>
<li><p><strong>Wildlife (Protection) Act, 1972:</strong> Schedule II.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--green-pill-millipede"><h2 id="2026-04-ca--green-pill-millipede">Green Pill Millipede</h2>
<ul>
<li><p><strong>Why in News:</strong> Research revealed that the green pill millipede utilizes a natural <strong>self-cleaning mechanism</strong> functionally analogous to the <em>lotus effect</em>.</p></li>
<li><p><strong>Habitat &amp; Endemism:</strong> Forest-floor dwelling arthropod <strong>endemic to the Western Ghats</strong>.</p></li>
<li><p><strong>Morphology &amp; Defense:</strong> Possesses a water-repellent (hydrophobic) exoskeleton and exhibits <strong>volvation</strong> (curls tightly into an impenetrable spherical ball to protect soft underparts).</p></li>
<li><p><strong>Ecological Role:</strong> Primary <strong>detritivore</strong>; breaks down leaf litter and decomposing plant matter, accelerating humification.</p></li>
<li><p><strong>Biochemical Value:</strong> Its hemolymph contains bioactive compounds exhibiting antioxidant, antibacterial, and potential anti-cancer properties.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--hudsonian-godwit-limosa-haemastica"><h2 id="2026-04-ca--hudsonian-godwit-limosa-haemastica">Hudsonian Godwit (<em>Limosa haemastica</em>)</h2>
<ul>
<li><p><strong>Why in News:</strong> Proposed for inclusion in <strong>Appendix I</strong> of the Convention on Migratory Species (CMS).</p></li>
<li><p><strong>Taxonomy &amp; Range:</strong> Large, long-distance migratory wading shorebird of the sandpiper family (<em>Scolopacidae</em>).</p>
<ul>
<li><p>Native to the Americas (New World bird): breeds in remote sub-Arctic and boreal wetlands of North America and winters in southern South America.</p></li>
</ul></li>
<li><p><strong>Diet &amp; Fueling:</strong> Primarily invertivore; shifts to carbohydrate-dense plant tubers to build lipid stores ahead of non-stop migratory flights.</p></li>
<li><p><strong>Ecological Indicator:</strong> Indicator of connectivity and health across hemispheric wetland stopovers.</p></li>
<li><p><strong>Conservation Status:</strong></p>
<ul>
<li><p><strong>IUCN Red List:</strong> Vulnerable (VU).</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--morchella-mushrooms-guchhi-kangtaech"><h2 id="2026-04-ca--morchella-mushrooms-guchhi-kangtaech">Morchella Mushrooms (<em>Guchhi / Kangtaech</em>)</h2>
<ul>
<li><p><strong>Why in News:</strong> Scientists at SKUAST (Sher-e-Kashmir University of Agricultural Sciences and Technology) cultivated <em>Morchella</em> mushrooms for the first time under controlled laboratory conditions.</p></li>
<li><p><strong>Morphology &amp; Biology:</strong> Edible sac fungi (<em>Ascomycetes</em>) characterised by an intricate, pitted, honeycomb-structured cap.</p>
<ul>
<li><p>Difficult to cultivate commercially; traditionally collected wild.</p></li>
<li><p>Forms symbiotic mycorrhizal or saprobic associations with temperate host trees (e.g., ash, elm, sycamore) in well-drained, organic-rich, limestone-derived soils.</p></li>
</ul></li>
<li><p><strong>Distribution:</strong> Temperate zones of the Northern Hemisphere. In India, found wild in high-altitude moist temperate forests of <strong>Jammu &amp; Kashmir, Himachal Pradesh, and Uttarakhand</strong>.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--oak-trees-quercus-spp-in-himalayas"><h2 id="2026-04-ca--oak-trees-quercus-spp-in-himalayas">Oak Trees (<em>Quercus</em> spp.) in Himalayas</h2>
<ul>
<li><p><strong>Why in News:</strong> Uttarakhand High Court stayed the felling of oak trees in Mussoorie due to absence of mandatory forest clearance.</p></li>
<li><p><strong>Ecological Status:</strong> Genus <em>Quercus</em>; acts as the <strong>climax species</strong> in Himalayan moist temperate forests (800–3,000 m elevation), indicating ecological maturity and stability.</p></li>
<li><p><strong>Ecosystem Services:</strong> Crucial for perennial spring recharge, retaining high soil moisture, preventing erosion, and maintaining temperate mountain biodiversity balance.</p></li>
<li><p><strong>Key Species:</strong> Banj oak (<em>Q. leucotrichophora</em>), Moru oak (<em>Q. floribunda</em>), Kharsu oak (<em>Q. semecarpifolia</em>), Rianj, and Phaliath oak.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--painted-leopard-gecko"><h2 id="2026-04-ca--painted-leopard-gecko">Painted Leopard Gecko</h2>
<ul>
<li><p><strong>Why in News:</strong> Officially recorded in <strong>Chhattisgarh</strong> for the first time.</p></li>
<li><p><strong>Endemism &amp; Habitat:</strong> Nocturnal, terrestrial gecko <strong>endemic to peninsular India</strong>; inhabits dry evergreen forests interspersed with rock formations, scrubs, and open meadows.</p></li>
<li><p><strong>Hunting Sense:</strong> Uses its tongue to chemosensorily detect prey and navigate terrain by surface licking.</p></li>
<li><p><strong>Biogeographic Boundary:</strong> The <strong>Brahmani River</strong> forms the geographic barrier separating its distribution from its sister taxon, the East Indian Leopard Gecko.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--newly-discovered-species-taxonomy-distribution"><h2 id="2026-04-ca--newly-discovered-species-taxonomy-distribution">Newly Discovered Species (Taxonomy &amp; Distribution)</h2>
<ul>
<li><p><strong>Cyrtodactylus jayadityai:</strong></p>
<ul>
<li><p><em>Type:</em> Bent-toed gecko species.</p></li>
<li><p><em>Location:</em> Discovered in <strong>North Tripura district, Tripura</strong> (endemic to Northeast India).</p></li>
<li><p><em>Habitat:</em> Micro-endemic to rock crevices and burrows in lowland forest patches along seasonal streams.</p></li>
</ul></li>
<li><p><strong>Cyrtodactylus raimonaensis:</strong></p>
<ul>
<li><p><em>Type:</em> Nocturnal, semi-arboreal bent-toed gecko.</p></li>
<li><p><em>Location:</em> Discovered in and around <strong>Raimona National Park, Assam</strong>.</p></li>
<li><p><em>Habitat:</em> Humid, shaded understories of moist deciduous forests along slow-flowing streams.</p></li>
</ul></li>
<li><p><strong>Dillenia nagalim:</strong></p>
<ul>
<li><p><em>Type:</em> Short woody flowering shrub.</p></li>
<li><p><em>Location:</em> Discovered in <strong>Kamjong district, Manipur</strong> (part of Indo-Myanmar biodiversity hotspot).</p></li>
<li><p><em>Habitat:</em> Open tropical deciduous forest ecosystems.</p></li>
</ul></li>
<li><p><strong>Euthalia zubeengargi:</strong></p>
<ul>
<li><p><em>Type:</em> Butterfly species.</p></li>
<li><p><em>Location:</em> Discovered in <strong>Arunachal Pradesh</strong>.</p></li>
<li><p><em>Ecology:</em> Shaded understories of humid semi-evergreen forests; bio-indicator of canopy/forest health.</p></li>
</ul></li>
<li><p><strong>Fimbristylis wayanadensis:</strong></p>
<ul>
<li><p><em>Type:</em> Perennial grass-like sedge with characteristic triangular stems.</p></li>
<li><p><em>Location:</em> Discovered in <strong>Wayanad, Kerala</strong>.</p></li>
<li><p><em>Ecosystem Value:</em> Colonises fragile montane wetlands; acts as an effective soil stabilizer to curb erosion.</p></li>
</ul></li>
<li><p><strong>Calamaria garoensis:</strong></p>
<ul>
<li><p><em>Type:</em> Non-venomous, nocturnal fossorial (burrowing) reed snake.</p></li>
<li><p><em>Location:</em> Endemic to <strong>Meghalaya</strong> (West Garo Hills).</p></li>
<li><p><em>Habitat:</em> Inhabits leaf litter and loose humus soil in moist tropical forests.</p></li>
</ul></li>
<li><p><strong>Neoloboptera peninsularis:</strong></p>
<ul>
<li><p><em>Type:</em> Cockroach species endemic to <strong>Peninsular India</strong>.</p></li>
<li><p><em>Location:</em> Discovered in <strong>Pune, Maharashtra</strong>.</p></li>
<li><p><em>Significance:</em> Only the third <em>Neoloboptera</em> species recorded in India; <strong>first cockroach species identified in India using DNA sequencing</strong>.</p></li>
</ul></li>
<li><p><strong>Rove Beetles (3 New Species):</strong></p>
<ul>
<li><p><em>Type:</em> Staphylinid beetles (largest family of beetles); distinct elongated bodies with short, truncated wing covers (<em>elytra</em>).</p></li>
<li><p><em>Location:</em> Discovered in <strong>Arunachal Pradesh</strong>.</p></li>
<li><p><em>Niche:</em> Forest-floor detritivores and opportunistic predators in leaf litter/rotting organic matter; assist nutrient cycling and biological pest control.</p></li>
</ul></li>
<li><p><strong>Stauranthera aureoglossa:</strong></p>
<ul>
<li><p><em>Type:</em> Perennial caulescent herb.</p></li>
<li><p><em>Location:</em> Discovered in <strong>Arunachal Pradesh</strong>.</p></li>
<li><p><em>Habitat:</em> Lithophytic/terrestrial growth on damp rocks and stream banks in mid-elevation evergreen forests.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--protected-areas-in-news"><h2 id="2026-04-ca--protected-areas-in-news">Protected Areas in News</h2>
<h3 class="topic" id="2026-04-ca--tadoba-andhari-tiger-reserve-tatr">Tadoba-Andhari Tiger Reserve (TATR)</h3>
<ul>
<li><p><strong>Why in News:</strong> Conservation and operational management developments in Maharashtra's tiger corridor.</p></li>
<li><p><strong>Geography &amp; History:</strong></p>
<ul>
<li><p>Located in <strong>Maharashtra</strong> (Chandrapur district).</p></li>
<li><p>Designated as a National Park in <strong>1955</strong>; merged with Andhari Wildlife Sanctuary to create the <strong>Tadoba-Andhari Tiger Reserve in 1995</strong>.</p></li>
</ul></li>
<li><p><strong>Vegetation &amp; Forest Type:</strong> <strong>Tropical dry deciduous forests</strong> characteristic of the Central Deccan Plateau.</p>
<ul>
<li><p><strong>Teak</strong> (<em>Tectona grandis</em>) constitutes the dominant floral canopy.</p></li>
</ul></li>
<li><p><strong>Biodiversity:</strong></p>
<ul>
<li><p><strong>Mammals:</strong> Bengal tiger, leopard, sloth bear, dhole (Asiatic wild dog), gaur, sambar, chital, and wild boar.</p></li>
<li><p><strong>Avifauna:</strong> Forest eagles, Malabar pied hornbill, Indian pitta, Asian paradise flycatcher, and racket-tailed drongo.</p></li>
</ul></li>
</ul>
<h3 class="topic" id="2026-04-ca--amchang-wildlife-sanctuary">Amchang Wildlife Sanctuary</h3>
<ul>
<li><p><strong>Why in News:</strong> Gauhati High Court questioned the Assam government over unauthorized tree felling within Amchang WLS for the <strong>Guwahati Ring Road Project</strong>.</p></li>
<li><p><strong>Location &amp; Topography:</strong></p>
<ul>
<li><p>Situated along the eastern outskirts/fringe of <strong>Guwahati, Assam</strong>.</p></li>
<li><p>Riverine boundaries: Bounded to the north by the <strong>Brahmaputra River</strong> and to the east by the <strong>Digaru River</strong>.</p></li>
<li><p>Topographically acts as a northern extension/foothill system of Meghalaya’s <strong>Khasi and Jaintia Hills</strong>; declared a sanctuary in <strong>2004</strong>.</p></li>
</ul></li>
<li><p><strong>Forest Type &amp; Flora:</strong> Eastern Himalayan moist deciduous and patches of semi-evergreen forest along river valleys.</p>
<ul>
<li><p>Major trees: Teak, sal, <em>Terminalia</em>, and arjun.</p></li>
</ul></li>
<li><p><strong>Key Wildlife:</strong> Asiatic elephants (vital migratory corridor), western hoolock gibbons, slow lorises, Chinese pangolins, and the rare indigenous <strong>Tree Yellow butterfly</strong>.</p></li>
</ul>
<h3 class="topic" id="2026-04-ca--amrabad-tiger-reserve-atr">Amrabad Tiger Reserve (ATR)</h3>
<ul>
<li><p><strong>Why in News:</strong> Telangana government initiated a voluntary relocation and rehabilitation package for tribal families residing inside the core zone of Amrabad TR.</p></li>
<li><p><strong>Area &amp; Ranking:</strong></p>
<ul>
<li><p><strong>Second-largest tiger reserve in India by core area</strong>.</p></li>
<li><p><strong>Sixth-largest tiger reserve overall</strong> (spanning 2,611 km<sup>2</sup>).</p></li>
</ul></li>
<li><p><strong>Geography &amp; Drainage:</strong></p>
<ul>
<li><p>Situated across the <strong>Nallamala Hills</strong> in the <strong>Eastern Ghats</strong> of <strong>Telangana</strong>.</p></li>
<li><p>Originally part of the contiguous <em>Nagarjunasagar-Srisailam Tiger Reserve</em> prior to the bifurcation of Andhra Pradesh.</p></li>
<li><p>Functions as a vital catchment area for the <strong>Krishna River</strong>.</p></li>
</ul></li>
<li><p><strong>Forest Type &amp; Flora:</strong> <strong>Tropical dry deciduous forest</strong> dominated by Anjan, Teak, Bamboo, and Indian Kino (<em>Pterocarpus marsupium</em>).</p></li>
<li><p><strong>Fauna:</strong> Bengal tiger, Indian leopard, sloth bear, dhole, and <strong>Chousingha</strong> (four-horned antelope).</p></li>
<li><p><strong>Indigenous Communities:</strong> Inhabited by the <strong>Chenchus</strong>, a recognised <strong>Particularly Vulnerable Tribal Group (PVTG)</strong>.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--misc-topics"><h2 id="2026-04-ca--misc-topics">Misc Topics</h2>
<h3 class="topic" id="2026-04-ca--project-him-sarovar">Project Him Sarovar</h3>
<ul>
<li><p><strong>Why in News:</strong> Launched in <strong>Ladakh</strong> to tackle seasonal acute water stress.</p></li>
<li><p><strong>Mandate:</strong> Designed to secure year-round drinking and irrigation water security across Ladakh's cold desert through scientific <strong>snow harvesting, artificial glacier systems, and water conservation structures</strong>.</p></li>
</ul>
<h3 class="topic" id="2026-04-ca--world-earth-day-2026">World Earth Day 2026</h3>
<ul>
<li><p><strong>Why in News:</strong> Observed globally on <strong>April 22, 2026</strong>, to mobilise international support for environmental action.</p></li>
<li><p><strong>Theme (2026):</strong> <em>"Our Power, Our Planet"</em>.</p></li>
<li><p><strong>Historical Origins:</strong></p>
<ul>
<li><p>First organised on <strong>April 22, 1970</strong>, by U.S. Senator Gaylord Nelson.</p></li>
<li><p>Catalysed by widespread student-led environmental protests following the disastrous <strong>1969 Santa Barbara oil spill</strong> off the coast of California.</p></li>
</ul></li>
</ul></section>
<div class="divider" id="2026-04-ca--div-indian-economy"><span>Indian Economy</span></div>
<section class="blk" data-sec="2026-04-ca--payments-vision-2028"><h2 id="2026-04-ca--payments-vision-2028">Payments Vision 2028</h2>
<ul>
<li><p><strong>Why in News:</strong> Reserve Bank of India (RBI) released the Payments Vision 2028 policy roadmap.</p></li>
<li><p><strong>Liability &amp; Intermediary Oversight:</strong></p>
<ul>
<li><p>Introduces shared liability between <strong>sender and receiver banks</strong> for unauthorised transactions.</p></li>
<li><p>Brings e-commerce marketplaces and payment aggregators under direct RBI supervision.</p></li>
</ul></li>
<li><p><strong>Fintech &amp; Cybersecurity Framework:</strong></p>
<ul>
<li><p>Establishes a perpetual regulatory sandbox for fintech testing.</p></li>
<li><p>Introduces <strong>Cyber Key Risk Indicators (KRI)</strong> to monitor cybersecurity resilience across non-bank payment system operators.</p></li>
</ul></li>
<li><p><strong>User Control &amp; Infrastructure:</strong></p>
<ul>
<li><p><strong>Switch On/Off Facility:</strong> Expands universal controls across all digital payment modes.</p></li>
<li><p><strong>Payments Switching Service (PaSS):</strong> Enables seamless porting of standing instructions across banks.</p></li>
<li><p>Promotes e-cheque digitisation and mandates <strong>TReDS (Trade Receivables Discounting System)</strong> interoperability to enhance MSME trade financing.</p></li>
<li><p>Permits regulated non-bank entities to operate <strong>white-label AePS (Aadhaar Enabled Payment System)</strong> to improve rural last-mile reach.</p></li>
</ul></li>
<li><p><strong>Digital Payments Landscape:</strong></p>
<ul>
<li><p>India accounts for <strong>48.5% of global real-time payment transactions</strong>.</p></li>
<li><p>UPI comprises <strong>~83% of total retail digital payments by volume</strong>.</p></li>
<li><p>Credit card transactions are expanding at <strong>21% annually</strong> for high-value purchases, while debit card volumes decline.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--small-savings-schemes-sss"><h2 id="2026-04-ca--small-savings-schemes-sss">Small Savings Schemes (SSS)</h2>
<ul>
<li><p><strong>Why in News:</strong> Interest rates across all Small Savings Schemes remained unchanged for Q1 of FY27.</p></li>
<li><p><strong>Structure &amp; Classification:</strong></p>
<ul>
<li><p>Government-backed savings instruments operated predominantly via India Post and designated public/private commercial banks.</p></li>
<li><p><strong>Categorisation:</strong></p>
<ol type="1">
<li><p><em>Postal Deposits:</em> Post office savings accounts, recurring deposits, and time deposits.</p></li>
<li><p><em>Savings Certificates:</em> Kisan Vikas Patra (KVP), National Savings Certificate (NSC).</p></li>
<li><p><em>Social Security Schemes:</em> Sukanya Samriddhi Yojana (SSY), Public Provident Fund (PPF), Senior Citizens Savings Scheme (SCSS).</p></li>
</ol></li>
</ul></li>
<li><p><strong>Fiscal &amp; Interest Framework:</strong></p>
<ul>
<li><p>All proceeds are credited directly to the <strong>National Small Savings Fund (NSSF)</strong> within the <strong>Public Account of India</strong> under Article 266(2).</p></li>
<li><p>Rates are reviewed on a <strong>quarterly basis</strong> and linked to secondary market <strong>Government Security (G-Sec) yields</strong>.</p></li>
<li><p>Select schemes qualify for <strong>Exempt-Exempt-Exempt (EEE)</strong> tax status or offer deductions under <strong>Section 80C of the Income Tax Act</strong>.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--india-s-first-semiconductor-chip-fabrication-pla"><h2 id="2026-04-ca--india-s-first-semiconductor-chip-fabrication-pla">India’s First Semiconductor Chip Fabrication Plant</h2>
<ul>
<li><p><strong>Why in News:</strong> India notified its first dedicated semiconductor fabrication Special Economic Zone (SEZ) at <strong>Dholera, Gujarat</strong>.</p></li>
<li><p><strong>Partnership &amp; Application:</strong> Established by Tata Electronics (Tata Semiconductor Manufacturing) in technical partnership with <strong>PSMC (Powerchip Semiconductor Manufacturing Corp, Taiwan)</strong>.</p></li>
<li><p><strong>Target Segments:</strong> Manufacturing integrated circuits for automotive, artificial intelligence, edge data storage, power electronics, and 5G telecommunications.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--telangana-platform-based-gig-workers-bill-2026"><h2 id="2026-04-ca--telangana-platform-based-gig-workers-bill-2026">Telangana Platform-Based Gig Workers Bill, 2026</h2>
<ul>
<li><p><strong>Why in News:</strong> Telangana Legislative Assembly passed the Telangana Platform-Based Gig Workers (Registration, Social Security and Welfare) Bill, 2026.</p></li>
<li><p><strong>Institutional &amp; Funding Architecture:</strong></p>
<ul>
<li><p>Establishes the <strong>Telangana Gig and Platform Workers Welfare Board</strong>.</p></li>
<li><p>Sets up a dedicated social security welfare fund financed by a <strong>1–2% welfare fee levied on aggregator transaction values</strong>.</p></li>
</ul></li>
<li><p><strong>Worker Rights &amp; Protections:</strong></p>
<ul>
<li><p>Issues a centralised <strong>Unique Worker ID</strong> to all registered platform gig workers.</p></li>
<li><p>Enforces <strong>algorithmic transparency</strong> (prohibiting arbitrary automated deactivation).</p></li>
<li><p>Mandates a <strong>7-day prior written notice</strong> specifying reasons before aggregator-initiated worker termination.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--memflation"><h2 id="2026-04-ca--memflation">Memflation</h2>
<ul>
<li><p><strong>Why in News:</strong> Global semiconductor market value is projected to breach $1.3 trillion by 2026, driven by widespread "Memflation".</p></li>
<li><p><strong>Definition:</strong> Extreme price inflation and supply crunches specific to <strong>semiconductor memory chips</strong> (DRAM and High Bandwidth Memory / HBM).</p></li>
<li><p><strong>Root Drivers:</strong> Massive capacity diversion toward generative AI model training and data centres, compounded by preemptive stockpiling and supply-chain bottlenecks.</p></li>
<li><p><strong>Macro Impact:</strong> Increases enterprise IT capital expenditures and slows consumer tech delivery schedules.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--gdp-trends-comparative-economic-performance"><h2 id="2026-04-ca--gdp-trends-comparative-economic-performance">GDP Trends &amp; Comparative Economic Performance</h2>
<ul>
<li><p><strong>Why in News:</strong> India slipped to the <strong>world’s 6th largest economy by nominal GDP ($4.15 trillion)</strong> according to the IMF’s World Economic Outlook.</p></li>
<li><p><strong>Macro Standings:</strong></p>
<ul>
<li><p><strong>Top Economies by Nominal GDP:</strong> US leads ($32.38T), followed by China ($20.85T), Germany, Japan, and the UK.</p></li>
<li><p><strong>PPP Metric:</strong> India ranks <strong>3rd globally in Purchasing Power Parity (PPP)</strong>, behind China and the US.</p></li>
<li><p><strong>Growth Rate:</strong> Remains the fastest-growing major economy, with projected expansion of <strong>6.0–7.4%</strong>.</p></li>
<li><p><strong>Projections:</strong> Projected to rank 4th globally by 2027 and 3rd by 2031.</p></li>
</ul></li>
<li><p><strong>Per Capita GDP Nuances:</strong></p>
<ul>
<li><p>Ranks <strong>149th globally</strong> in nominal per capita GDP ($2,813 in 2026).</p></li>
<li><p>Ranks <strong>119th in PPP terms</strong> ($12,964 per capita).</p></li>
<li><p>Trails regional neighbors <strong>China, Bhutan, and Sri Lanka</strong> in per capita terms.</p></li>
<li><p>Classified within the World Bank’s <strong>Lower-Middle-Income</strong> bracket ($1,146–$4,515 GNI per capita).</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--ind-as-framework-for-insurance-sector"><h2 id="2026-04-ca--ind-as-framework-for-insurance-sector">Ind AS Framework for Insurance Sector</h2>
<ul>
<li><p><strong>Why in News:</strong> Insurance Regulatory and Development Authority of India (IRDAI) approved the transition to Indian Accounting Standards (Ind AS) for insurance reporting effective <strong>April 2026</strong>.</p></li>
<li><p><strong>Transition Anchors:</strong></p>
<ul>
<li><p>Replaces historical cost-based <strong>IGAAP (Indian Generally Accepted Accounting Principles)</strong> with fair-value, principle-based accounting.</p></li>
<li><p><strong>Core Standards:</strong></p>
<ul>
<li><p><strong>Ind AS 117:</strong> Overhauls insurance contracts accounting.</p></li>
<li><p><strong>Ind AS 109:</strong> Standardises recognition, measurement, and disclosures of financial instruments.</p></li>
</ul></li>
<li><p>Aligns domestic insurance financial disclosures directly with global <strong>IFRS (International Financial Reporting Standards)</strong>.</p></li>
<li><p>Mandatory across life insurers, non-life insurers, standalone health companies, and reinsurers.</p></li>
</ul></li>
<li><p><strong>Regulatory &amp; Institutional Architecture:</strong></p>
<ul>
<li><p><strong>IRDAI:</strong> Statutory autonomous body constituted under the IRDA Act, 1999 (recommended by the <strong>R.N. Malhotra Committee, 1994</strong>); located in <strong>Hyderabad</strong> under the Ministry of Finance.</p></li>
<li><p><strong>NFRA (National Financial Reporting Authority):</strong> Statutory body under Section 132 of the Companies Act, 2013; oversees auditing quality and advises MCA on accounting standards.</p></li>
<li><p><strong>ICAI:</strong> Statutory professional body under the Chartered Accountants Act, 1949; formulates accounting standards submitted to NFRA/MCA.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--digital-payments-e-mandate-framework-2026"><h2 id="2026-04-ca--digital-payments-e-mandate-framework-2026">Digital Payments E-Mandate Framework 2026</h2>
<ul>
<li><p><strong>Why in News:</strong> RBI issued the Digital Payments – E-Mandate Framework, 2026 under the Payment and Settlement Systems Act, 2007.</p></li>
<li><p><strong>Concept:</strong> E-mandates are digital standing instructions that automate recurring debits from bank accounts, cards, UPI, or prepaid payment instruments (PPIs).</p></li>
<li><p><strong>Registration &amp; AFA Thresholds:</strong></p>
<ul>
<li><p>Mandatory one-time registration backed by <strong>Additional Factor of Authentication (AFA)</strong> to capture explicit customer consent.</p></li>
<li><p>Auto-debits <strong>up to ₹15,000</strong> proceed without per-transaction AFA.</p></li>
<li><p>Elevated threshold of <strong>₹1 lakh</strong> without per-transaction AFA for <strong>insurance premiums, mutual fund SIPs, and credit card bill payments</strong>.</p></li>
<li><p>Any debit exceeding these limits requires full AFA.</p></li>
</ul></li>
<li><p><strong>Consumer Protection:</strong> Customers have the statutory right to modify, withdraw, or opt out of mandates at any time, with explicit validity periods; banks and payment providers are prohibited from levying charges (<strong>zero-cost access</strong>).</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--non-deliverable-derivatives-ndds"><h2 id="2026-04-ca--non-deliverable-derivatives-ndds">Non-Deliverable Derivatives (NDDs)</h2>
<ul>
<li><p><strong>Why in News:</strong> RBI banned banks from engaging in Non-Deliverable Derivative contracts to curb Indian Rupee (INR) exchange rate volatility.</p></li>
<li><p><strong>Instrument Nature:</strong></p>
<ul>
<li><p>Cash-settled currency derivative contracts traded in <strong>offshore financial hubs</strong> (e.g., Singapore, London) where physical exchange of the underlying principal currency does not take place.</p></li>
<li><p>Net settlements occur in convertible foreign currency (primarily <strong>USD</strong>) based on the spread between the agreed forward contract rate and the prevailing spot rate.</p></li>
<li><p>Used primarily by foreign investors and multinational entities for hedging exposure or speculating on rupee valuation outside onshore regulatory constraints.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--credit-default-swaps-cds"><h2 id="2026-04-ca--credit-default-swaps-cds">Credit Default Swaps (CDS)</h2>
<ul>
<li><p><strong>Why in News:</strong> RBI notified investment limits for Credit Default Swaps (CDS) sold by Foreign Portfolio Investors (FPIs) for FY 2026–27.</p></li>
<li><p><strong>Mechanism &amp; Structure:</strong></p>
<ul>
<li><p>Derivative contract that enables an investor to swap or transfer credit default risk to a protection seller.</p></li>
<li><p>Protection buyer makes regular premium payments; the seller agrees to compensate the buyer if the reference debt issuer suffers a default or credit event.</p></li>
</ul></li>
<li><p><strong>Prelims Traps &amp; Systemic Risks:</strong></p>
<ul>
<li><p>Used by institutional lenders to hedge against borrower default and free up risk-weighted regulatory capital.</p></li>
<li><p><strong>Naked CDS:</strong> Speculative trading where an investor buys credit default protection without holding the underlying bond/debt instrument; unchecked proliferation of naked CDS was a key amplifier of the <strong>2008 Global Financial Crisis</strong>.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--social-impact-funds-sif-social-stock-exchange-ss"><h2 id="2026-04-ca--social-impact-funds-sif-social-stock-exchange-ss">Social Impact Funds (SIF) &amp; Social Stock Exchange (SSE)</h2>
<ul>
<li><p><strong>Why in News:</strong> SEBI reduced the minimum application/investment size in Social Impact Funds (SIFs) to <strong>₹1,000</strong> (slashed from ₹2 lakh) to widen retail and philanthropic participation on the Social Stock Exchange.</p></li>
<li><p><strong>Architecture of SIFs:</strong></p>
<ul>
<li><p>SEBI-regulated privately pooled vehicles categorized under <strong>Category I Alternative Investment Funds (AIFs)</strong> (replaced the earlier "Social Venture Funds" nomenclature in 2022).</p></li>
<li><p><strong>Minimum Corpus:</strong> <strong>₹5 crore</strong> (much lower than the ₹20 crore minimum corpus required for other standard AIF categories).</p></li>
<li><p><strong>Deployment Mandate:</strong> Must invest <strong>at least 75% of investable funds</strong> in unlisted securities or partnership stakes of social enterprises.</p></li>
<li><p>Permitted to receive and disperse grants to social ventures; can issue <strong>Social Units</strong> to investors seeking pure social impact rather than financial yields.</p></li>
<li><p>Must undergo <strong>mandatory annual social audits</strong> conducted by independent practitioners.</p></li>
</ul></li>
<li><p><strong>SSE &amp; ZCZP Instruments:</strong></p>
<ul>
