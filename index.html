<section class="blk" data-sec="2026-04-ca--minerals-concession-rules-second-amendment-2026"><h2 id="2026-04-ca--minerals-concession-rules-second-amendment-2026">Minerals Concession Rules (Second Amendment), 2026</h2>
<ul>
<li><p><strong>Why in News:</strong> Ministry of Mines notified the Minerals (Other than Atomic and Hydro Carbons Energy Minerals) Concession (Second Amendment) Rules, 2026.</p></li>
<li><p><strong>Areal Caps on Contiguous Blocks:</strong></p>
<ul>
<li><p>Inclusion of contiguous non-mineralised or additional areas is capped at <strong>10% for Mining Leases (ML)</strong> and <strong>30% for Composite Licences (CL)</strong> to support the techno-economic viability of deep-seated deposits (e.g., gold, copper, lithium).</p></li>
</ul></li>
<li><p><strong>Critical Minerals Approval Timeline:</strong> Mandates that <strong>State Governments must approve</strong> the inclusion/addition of critical minerals within a strict statutory window of <strong>30 days</strong> of application.</p></li>
<li><p><strong>Reclassification of Blocks:</strong> If a <strong>major mineral</strong> is discovered within a block originally allocated for minor minerals, the entire block must be taken back and re-auctioned as a major mineral block.</p></li>
<li><p><strong>Exploration Mandate for Minor Minerals:</strong> Mining leases for minor minerals (excluding riverbed sand) require mandatory completion of <strong>G3-level preliminary exploration</strong> to prove commercial viability prior to approval.</p></li>
<li><p><strong>Captive Mine Liberalisation:</strong> Lifts previous restrictions, allowing captive leaseholders to sell <strong>surplus minerals in the open market</strong> after fulfilling the demand of their tied end-use plants.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--national-mineral-exploration-and-development-tru"><h2 id="2026-04-ca--national-mineral-exploration-and-development-tru">National Mineral Exploration and Development Trust (NMEDT)</h2>
<ul>
<li><p><strong>Why in News:</strong> Parliamentary Standing Committee on Coal, Mines and Steel presented its 23rd report on the National Mineral Exploration and Development Trust.</p></li>
<li><p><strong>Genesis &amp; Legal Architecture:</strong></p>
<ul>
<li><p>Established in <strong>2015</strong> under the <strong>Mines and Minerals (Development and Regulation) [MMDR] Act, 1957</strong>.</p></li>
<li><p>Reconstituted as a <strong>non-profit autonomous body</strong> following the MMDR Amendment Act, 2021.</p></li>
<li><p>Operates a two-tier governance structure: an apex <strong>Governing Body</strong> (chaired by the Union Minister of Mines) and an <strong>Executive Committee</strong> (chaired by the Secretary, Ministry of Mines).</p></li>
</ul></li>
<li><p><strong>Funding &amp; Functional Mandate:</strong></p>
<ul>
<li><p>Funded via <strong>statutory royalty contributions</strong> paid by mining leaseholders and prospecting licence-cum-mining lease holders.</p></li>
<li><p>Promotes scientific mineral reconnaissance, capacity building, and skill development.</p></li>
<li><p>The 2021 legislative amendment enables the Trust to directly accredit and fund <strong>private exploration agencies</strong>.</p></li>
<li><p>Prioritizes exploration of critical and strategic minerals, funding projects to advance resources from <strong>G4 (reconnaissance) and G3 (preliminary)</strong> stages to bankable <strong>G2/G1 (general/detailed) reserve levels</strong> under the United Nations Framework Classification (UNFC).</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--helium-supply-shock-physical-properties"><h2 id="2026-04-ca--helium-supply-shock-physical-properties">Helium Supply Shock &amp; Physical Properties</h2>
<ul>
<li><p><strong>Why in News:</strong> Iranian missile strikes on the Ras Laffan LNG hub in Qatar disrupted liquefied natural gas operations, taking offline <strong>one-third of global helium supply</strong>.</p></li>
<li><p><strong>Extraction &amp; Supply Concentration:</strong></p>
<ul>
<li><p>Commercial helium is extracted as a <strong>byproduct of natural gas processing/refining</strong>; LNG extraction interruptions trigger an immediate reduction in helium production.</p></li>
<li><p><strong>Qatar and the United States</strong> jointly control <strong>70–75% of total global helium supply</strong>; remaining reserves are largely dominated by Russia and Algeria.</p></li>
</ul></li>
<li><p><strong>Physical &amp; Terrestrial Characteristics:</strong></p>
<ul>
<li><p>Colourless, odourless, chemically inert noble gas with the <strong>lowest boiling point (</strong>−268.9<sup>∘</sup>C<strong>) and lowest melting point</strong> of any element.</p></li>
<li><p>Second-most abundant element in the universe, but rare in Earth's atmosphere.</p></li>
<li><p>Terrestrial deposits accumulate deep within the crust through the slow <strong>radioactive alpha-decay of uranium and thorium</strong> over geological epochs.</p></li>
</ul></li>
<li><p><strong>Strategic Applications:</strong></p>
<ul>
<li><p><strong>Healthcare:</strong> Cryogenic cooling of superconducting electromagnets in <strong>MRI scanners</strong> accounts for ~30% of world consumption.</p></li>
<li><p><strong>Manufacturing:</strong> Inert shielding gas for advanced semiconductor fabrication and drawing optical fibre preforms.</p></li>
<li><p><strong>Aerospace &amp; Rocketry:</strong> Remains non-reactive and gaseous at cryogenic temperatures, used to pressurize liquid hydrogen and liquid oxygen rocket propellant tanks.</p></li>
<li><p><strong>Deep-Sea Diving:</strong> Mixed with oxygen (Heliox) to prevent nitrogen narcosis and reduce oxygen toxicity under hyperbaric pressure.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--lead-contamination-health-hazards"><h2 id="2026-04-ca--lead-contamination-health-hazards">Lead Contamination &amp; Health Hazards</h2>
<ul>
<li><p><strong>Why in News:</strong> Toxics Link environmental study revealed severe concentrations of lead contamination in ambient soils and air around battery recycling clusters in Delhi-NCR.</p></li>
<li><p><strong>Chemical Profile:</strong> Naturally occurring, malleable, soft, corrosion-resistant heavy metal extracted from the Earth's crust; widely used in lead-acid batteries, pigments, alloys, and radiation shielding.</p></li>
<li><p><strong>Toxicology &amp; Bioaccumulation:</strong></p>
<ul>
<li><p><strong>Non-biodegradable</strong> persistent toxicant that bioaccumulates in human tissues, teeth, and bones over time.</p></li>
<li><p>The WHO maintains there is <strong>no known safe blood lead concentration threshold</strong>.</p></li>
</ul></li>
<li><p><strong>Clinical Health Impacts:</strong> Induces hypertension and irreversible renal/cardiovascular impairment in adults; causes permanent cognitive impairment, intellectual deficits, and neurodevelopmental disorders in children; triggers reduced foetal growth and premature delivery in pregnant women.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--aghanashini-vedavathi-river-linking-project"><h2 id="2026-04-ca--aghanashini-vedavathi-river-linking-project">Aghanashini–Vedavathi River-Linking Project</h2>
<ul>
<li><p><strong>Why in News:</strong> UNESCO advised the Government of India to adhere to strict World Heritage Conservation ecological norms for the proposed Aghanashini–Vedavathi river-interlinking project traversing the Western Ghats.</p></li>
<li><p><strong>Project Specifications:</strong></p>
<ul>
<li><p>Proposed inter-basin water transfer project located entirely within <strong>Karnataka</strong>.</p></li>
<li><p>Diverts surplus monsoon floodwaters from the westward-flowing <strong>Aghanashini River</strong> eastward to the water-scarce <strong>Vedavathi River basin</strong> via a 194-km pipeline network discharging into the <strong>Vani Vilas Sagar reservoir</strong>.</p></li>
<li><p>Targets drought-prone districts to irrigate ~2 lakh hectares.</p></li>
</ul></li>
<li><p><strong>Aghanashini River Profile:</strong></p>
<ul>
<li><p>One of the last remaining <strong>un-dammed, free-flowing rivers</strong> in Peninsular India.</p></li>
<li><p>Originates near Sirsi (Gadihalli) in the Western Ghats of Uttara Kannada and empties into the <strong>Arabian Sea</strong> near Kumta (home to the Aghanashini Estuary Ramsar site).</p></li>
</ul></li>
<li><p><strong>Vedavathi River Profile:</strong></p>
<ul>
<li><p>Right-bank tributary of the <strong>Tungabhadra River</strong> (Krishna river system).</p></li>
<li><p>Formed by the confluence of the <strong>Veda and Avathi</strong> rivers originating in the <strong>Bababudangiri Hills</strong> of the Western Ghats.</p></li>
<li><p>Flows northeast through central Karnataka, touches Andhra Pradesh, and re-enters Karnataka to join the Tungabhadra at Siruguppa.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--earthquake-lights-eqls"><h2 id="2026-04-ca--earthquake-lights-eqls">Earthquake Lights (EQLs)</h2>
<ul>
<li><p><strong>Why in News:</strong> Luminous Earthquake Lights were documented across Turkey and Greece following a series of seismic tremors in the Aegean Sea.</p></li>
<li><p><strong>Phenomenology:</strong> Rare atmospheric optical flashes, glowing columns, or diffuse auroral sheets observed immediately <strong>before, during, or shortly after tectonic earthquakes</strong> in seismically active corridors.</p></li>
<li><p><strong>Scientific Mechanism:</strong></p>
<ul>
<li><p>Extreme tectonic stresses accumulating within fault zones break chemical <strong>peroxy bonds</strong> in silicate minerals or generate electric charges through <strong>piezoelectric effects</strong> in quartz-rich rock beds.</p></li>
<li><p>Mobilised high-voltage charge carriers travel rapidly upward along fault planes to the surface.</p></li>
<li><p>At the surface, the escaping electrical charges <strong>ionise local air molecules</strong>, creating luminous, plasma-like discharges.</p></li>
</ul></li>
<li><p><strong>Occurrence Zones:</strong> Most frequently documented along <strong>steep, sub-vertical fault planes</strong> and active <strong>continental rift zones</strong>, where vertical fault geometries offer pathways for electric charge conduits.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--potomac-river"><h2 id="2026-04-ca--potomac-river">Potomac River</h2>
<ul>
<li><p><strong>Why in News:</strong> Declared the "most endangered river" due to sewage spills, aging urban infrastructure, and water extraction demands from data centres.</p></li>
<li><p><strong>Origin &amp; Course:</strong></p>
<ul>
<li><p>Rises in the <strong>Appalachian Highlands</strong>; its North and South branches converge in West Virginia.</p></li>
<li><p>Flows through Maryland and Virginia, drains through <strong>Washington, D.C.</strong>, and empties into the <strong>Chesapeake Bay</strong>.</p></li>
</ul></li>
<li><p><strong>Chesapeake Bay Nuances:</strong> The <strong>largest estuary in the United States</strong> and the third largest globally.</p></li>
<li><p><strong>Public Utility:</strong> Serves as the primary drinking water source for Washington, D.C.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--south-atlantic-anomaly-saa"><h2 id="2026-04-ca--south-atlantic-anomaly-saa">South Atlantic Anomaly (SAA)</h2>
<ul>
<li><p><strong>Why in News:</strong> The SAA is actively splitting into <strong>two distinct operational lobes/zones</strong>, compounding radiation hazards for satellites in Low Earth Orbit (LEO).</p></li>
<li><p><strong>Geophysical Identity:</strong></p>
<ul>
<li><p>A geographic <strong>dip/weak spot in Earth’s geomagnetic field</strong> over the South Atlantic Ocean, spanning between South America and southern Africa.</p></li>
<li><p>Reduced geomagnetic field intensity allows the inner <strong>Van Allen radiation belt</strong> to dip closer to Earth's surface.</p></li>
</ul></li>
<li><p><strong>Impact on Space Missions:</strong></p>
<ul>
<li><p>Satellites crossing the SAA encounter high doses of solar energetic protons and cosmic rays, risking memory bit flips, system glitches, and permanent sensor damage.</p></li>
<li><p>Known colloquially as the <strong>"Bermuda Triangle of Space"</strong>.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--solar-radio-burst-emissions"><h2 id="2026-04-ca--solar-radio-burst-emissions">Solar Radio Burst Emissions</h2>
<ul>
<li><p><strong>Why in News:</strong> Scientists from the Indian Institute of Astrophysics (IIA) explained the physical mechanism of why harmonic radio emissions appear significantly stronger than fundamental emissions in solar bursts.</p></li>
<li><p><strong>Mechanism &amp; Classification:</strong></p>
<ul>
<li><p>Intense, transient radio bursts produced during abrupt solar magnetic events like <strong>solar flares and Coronal Mass Ejections (CMEs)</strong>.</p></li>
<li><p><strong>Type II Solar Radio Bursts:</strong> Triggered by shock waves accelerating electrons as CMEs propagate through the Sun’s corona at speeds of ~1,000 km/s.</p></li>
</ul></li>
<li><p><strong>Observation &amp; Space Weather:</strong> Tracked via terrestrial <strong>radio telescopes</strong>; serve as advance warning proxies for geomagnetic storms, satellite dragging, and GPS/HF radio communications blackouts.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--disaster-funding-framework-under-16th-finance-co"><h2 id="2026-04-ca--disaster-funding-framework-under-16th-finance-co">Disaster Funding Framework under 16th Finance Commission</h2>
<ul>
<li><p><strong>Why in News:</strong> The disaster management funding architecture underwent a structural overhaul under the 16th Finance Commission.</p></li>
<li><p><strong>Disaster Risk Index (DRI) Formula:</strong></p>
<ul>
<li><p>Replaced the earlier additive model with a <strong>multiplicative formula</strong>:</p></li>
</ul></li>
</ul>
<p>Funding ∝ Hazard (H) × Exposure (E) × Vulnerability (V)</p>
<ul>
<li><p><strong>Hazard (H):</strong> Based on the historical frequency and severity of <strong>10 specific natural hazards</strong>.</p></li>
<li><p><strong>Exposure (E):</strong> Indexed against projected population for October 2026 as a proxy for vulnerable human lives and infrastructure assets.</p></li>
<li><p><strong>Vulnerability (V):</strong> Measured via per-capita Net State Domestic Product (NSDP); lower-income states score higher due to smaller fiscal safety margins.</p></li>
<li><p>States exhibiting equal aggregate risk receive identical baseline DRI allocations.</p></li>
</ul>
<ul>
<li><p><strong>Financial Allocations &amp; Windows:</strong></p>
<ul>
<li><p><strong>Total Corpus:</strong> <strong>₹2.04 lakh crore</strong> across 5 years for state-level disaster management.</p></li>
<li><p><strong>Window Split:</strong> Allocated in an <strong>80:20 ratio</strong> between the <strong>State Disaster Response Fund (SDRF)</strong> and the <strong>State Disaster Mitigation Fund (SDMF)</strong>.</p></li>
<li><p><strong>Cost-Sharing Ratio:</strong></p>
<ul>
<li><p><strong>75:25</strong> (Centre : State) for general category states.</p></li>
<li><p><strong>90:10</strong> (Centre : State) for North-Eastern and Himalayan States.</p></li>
</ul></li>
<li><p><strong>Release Mechanism:</strong> Disbursed in <strong>two equal annual instalments</strong>; states can expend up to <strong>10% of SDRF funds for locally severe disasters</strong> outside the national list.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--sijimali-bauxite-mining-conflict"><h2 id="2026-04-ca--sijimali-bauxite-mining-conflict">Sijimali Bauxite Mining Conflict</h2>
<ul>
<li><p><strong>Why in News:</strong> Clashes broke out between local tribal populations and police in Rayagada, Odisha, over access roads tied to the Sijimali bauxite lease.</p></li>
<li><p><strong>Geography &amp; Supply Chain:</strong></p>
<ul>
<li><p>Located in the <strong>Rayagada and Kalahandi districts</strong> of Odisha; allocated to Vedanta (2023) to feed its <strong>Lanjigarh alumina refinery</strong>.</p></li>
<li><p>Encompasses Fifth Schedule areas and ecologically sensitive catchment ridges, requiring statutory <strong>Gram Sabha consent under the Forest Rights Act (FRA), 2006</strong>.</p></li>
</ul></li>
<li><p><strong>Static Bauxite Facts:</strong></p>
<ul>
<li><p>Essential mineral ore refined into <strong>alumina</strong> (Bayer process) and smelted into <strong>aluminium</strong> (Hall–Héroult process).</p></li>
<li><p><strong>Odisha’s Preeminence:</strong> Accounts for <strong>~41% of India’s bauxite reserves</strong> and <strong>~73% of total national bauxite production</strong>.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--konyak-naga-tribe"><h2 id="2026-04-ca--konyak-naga-tribe">Konyak Naga Tribe</h2>
<ul>
<li><p><strong>Why in News:</strong> Nagaland University researchers documented a traditional five-plant herbal formulation utilized by the Konyak Naga tribe exhibiting potent anti-cancer properties.</p></li>
<li><p><strong>Demographics &amp; Distribution:</strong></p>
<ul>
<li><p>The <strong>largest among the Naga tribes</strong>; heavily concentrated in <strong>Mon district, Nagaland</strong>, with contiguous settlements in Arunachal Pradesh and across the border in Myanmar.</p></li>
<li><p>Historically recognized for skilled headhunting traditions, facial tattoos, and woodcraft.</p></li>
</ul></li>
<li><p><strong>Linguistic Lineage:</strong> Speak the Konyak language, belonging to the <strong>Tibeto-Burman / Sino-Tibetan language family</strong>.</p></li>
</ul></section>
<div class="divider" id="2026-04-ca--div-art-and-culture-history"><span>Art and Culture & History</span></div>
<section class="blk" data-sec="2026-04-ca--balirajgarh-fort"><h2 id="2026-04-ca--balirajgarh-fort">Balirajgarh Fort</h2>
<ul>
<li><p><strong>Why in News:</strong> Archaeological Survey of India (ASI) commenced excavations at Balirajgarh in <strong>Madhubani, Bihar</strong>, to uncover the urban antiquity of ancient Mithila.</p></li>
<li><p><strong>Historical &amp; Literary Associations:</strong></p>
<ul>
<li><p>Associated in local lore with <strong>King Bali</strong>; believed to have functioned as an administrative stronghold of the ancient <strong>Videha Kingdom</strong>.</p></li>
<li><p><em>Videha Kingdom:</em> Ancient seat of the Mithila region associated with <strong>King Janaka</strong>, revered in Vedic literature as a hub of <strong>Upanishadic philosophy and Vedic learning</strong>.</p></li>
</ul></li>
<li><p><strong>Material Culture &amp; Stratigraphy:</strong></p>
<ul>
<li><p>Multi-cultural fortified settlement showing continuous occupation spanning from the <strong>Mauryan to the Pala periods</strong>.</p></li>
<li><p>Yielded punch-marked coins, copper antimony rods, beads, and moulded terracotta plaques indicating planned urban trade networks.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--samrat-samprati"><h2 id="2026-04-ca--samrat-samprati">Samrat Samprati</h2>
<ul>
<li><p><strong>Why in News:</strong> Prime Minister inaugurated the Samrat Samprati Museum in <strong>Koba, Gujarat</strong>.</p></li>
<li><p><strong>Genealogy &amp; Dynasty:</strong></p>
<ul>
<li><p>Ruler of the <strong>Maurya Empire</strong> (reigned c. 230–215 BCE); <strong>grandson of Emperor Ashoka</strong> (and son of Kunala).</p></li>
</ul></li>
<li><p><strong>Religious Patronage:</strong></p>
<ul>
<li><p>Embraced <strong>Jainism</strong> after being initiated by the Jain monk <strong>Suhastin (Suhastisuri)</strong> at Ujjain.</p></li>
<li><p>Earned the epithet <strong>"Jain Ashoka"</strong> for financing thousands of Jain <em>derasars</em> (temples), establishing pilgrim rest-houses, and promoting ahimsa.</p></li>
<li><p>Deputed Jain missions to South India, Iran, and Arab coastal regions to propagate Jain teachings.</p></li>
</ul></li>
<li><p><strong>Literary Sources:</strong> Recorded in Hemachandra’s <em><strong>Parishishtaparva</strong></em>, the <em>Sampratikatha</em>, the <em>Prabhavakacharita</em>, and the <em>Samprati Nripa Charitra</em>.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--spero-norte-chico-civilisation"><h2 id="2026-04-ca--spero-norte-chico-civilisation">Áspero (Norte Chico Civilisation)</h2>
<ul>
<li><p><strong>Why in News:</strong> Archaeologists unearthed a two-level civic-ceremonial platform at Áspero.</p></li>
<li><p><strong>Archaeological Context:</strong></p>
<ul>
<li><p><strong>Late Preceramic coastal settlement</strong> located in <strong>Peru</strong>, on the right bank of the Supe River near the Pacific Ocean.</p></li>
<li><p>Component of the <strong>Caral-Supe (Norte Chico) civilisation</strong> (3000–1800 BCE) — the <strong>oldest known complex urban civilisation in the Americas</strong>.</p></li>
<li><p>Contemporary with the Old Kingdom of Egypt, Early Bronze Age Mesopotamia, and the mature Indus Valley Civilisation.</p></li>
</ul></li>
<li><p><strong>Material Characteristics:</strong></p>
<ul>
<li><p><strong>Aceramic Society:</strong> Flourished without fired pottery or metal tools, yet engineered large-scale monumental platform mounds.</p></li>
<li><p>Major ceremonial complexes include <strong>Huaca de los Ídolos</strong> and <strong>Huaca de los Sacrificios</strong>.</p></li>
<li><p>Sustained by marine fisheries using woven cotton nets and traded marine protein for agricultural staples inland.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--500-years-of-the-first-battle-of-panipat"><h2 id="2026-04-ca--500-years-of-the-first-battle-of-panipat">500 Years of the First Battle of Panipat</h2>
<ul>
<li><p><strong>Why in News:</strong> <strong>April 21, 2026</strong> marks the <strong>500th anniversary</strong> of the First Battle of Panipat (fought on April 21, 1526).</p></li>
<li><p><strong>Belligerents &amp; Outcome:</strong></p>
<ul>
<li><p>Fought in Panipat (modern-day Haryana) between Timurid prince <strong>Babur</strong> (~12,000 troops) and <strong>Ibrahim Lodi</strong>, the Sultan of Delhi (commanding an army exceeding 100,000 men and 1,000 war elephants).</p></li>
<li><p>Babur was invited into North India by disaffected Afghan nobles <strong>Alam Khan Lodi</strong> and <strong>Daulat Khan Lodi</strong> (Governor of Punjab).</p></li>
<li><p>Ended the <strong>Delhi Sultanate</strong>, dismantled the Lodi dynasty, and laid the foundations of the <strong>Mughal Empire</strong> in India.</p></li>
</ul></li>
<li><p><strong>Tactical Innovations (Gunpowder Age):</strong></p>
<ul>
<li><p>Marked the <strong>first decisive use of field artillery, gunpowder, and matchlocks</strong> in North Indian warfare.</p></li>
<li><p><strong>Tulughma Tactic:</strong> Dividing the mobile cavalry into central, left, right, and reserve flying divisions to wheel around and envelop the enemy's flanks and rear.</p></li>
<li><p><strong>Rumi Method (Araba):</strong> Ottoman-style tactical defense where hundreds of baggage carts were tethered with raw hide ropes to form a defensive barricade, with sheltered gaps for matchlockmen (<em>tufangchis</em>) and canons directed by Master Ustad Ali Quli.</p></li>
</ul></li>
<li><p><strong>Commemorative Sites in Panipat:</strong></p>
<ul>
<li><p><strong>Ibrahim Lodi’s Tomb:</strong> Rectangular platform grave marking the spot where Lodi was killed in the battle line.</p></li>
<li><p><strong>Kabuli Bagh Mosque:</strong> Built by Babur in 1527 to mark his victory, named in honour of his wife <strong>Mussammat Kabuli Begum</strong>.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--adi-shankaracharya"><h2 id="2026-04-ca--adi-shankaracharya">Adi Shankaracharya</h2>
<ul>
<li><p><strong>Why in News:</strong> PM Modi paid tribute to Adi Shankaracharya on his birth anniversary.</p></li>
<li><p><strong>Historical &amp; Philosophical Identity:</strong></p>
<ul>
<li><p>Major 8th-century Indian philosopher, mystic, and Bhakti leader.</p></li>
<li><p>Born in <strong>Kalady, Kerala</strong>; embraced sannyasa at a young age; devoted to Lord Shiva.</p></li>
<li><p>Propounded the philosophy of <strong>Advaita Vedanta</strong> (non-dualism): asserts that the individual self (<em>Atman</em>) and ultimate reality (<em>Brahman</em>) are fundamentally non-different.</p></li>
<li><p>Taught that the empirical world is an illusion (<strong>Maya</strong>) rooted in ignorance (<strong>Avidya</strong>); true liberation (<strong>Moksha</strong>) is achieved through direct experiential knowledge of one's identity as Brahman.</p></li>
</ul></li>
<li><p><strong>Literary Corpus:</strong></p>
<ul>
<li><p>Wrote profound commentaries (<em>Bhashyas</em>) on the <strong>Prasthanatrayi</strong>: Brahma Sutras, Principal Upanishads, and the Bhagavad Gita.</p></li>
<li><p>Composed devotional stotras/hymns including <em>Bhaja Govindam</em> and <em>Kanakadhara Stotram</em>.</p></li>
</ul></li>
<li><p><strong>Monastic Institutions &amp; Worship:</strong></p>
<ul>
<li><p>Organised ascetic renouncers into the <strong>Dashanami monastic order</strong>.</p></li>
<li><p>Popularised <strong>Panchayatana worship</strong> (simultaneous worship of Shiva, Vishnu, Shakti, Surya, and Ganesha) to harmonise disparate Hindu traditions.</p></li>
<li><p>Established four cardinal monastic centres (<strong>Amnaya Mathas</strong>) across four corners of the subcontinent:</p>
<ol type="1">
<li><p><strong>Sringeri</strong> (Sharada Peetham in Karnataka - South)</p></li>
<li><p><strong>Dwarka</strong> (Kalika Matha in Gujarat - West)</p></li>
<li><p><strong>Puri</strong> (Govardhana Matha in Odisha - East)</p></li>
<li><p><strong>Joshimath</strong> (Jyotirmath in Uttarakhand - North)</p></li>
</ol></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--guru-tegh-bahadur"><h2 id="2026-04-ca--guru-tegh-bahadur">Guru Tegh Bahadur</h2>
<ul>
<li><p><strong>Why in News:</strong> PM Modi paid tribute to Guru Tegh Bahadur on the occasion of <strong>Parkash Purab</strong> (birth anniversary).</p></li>
<li><p><strong>Life &amp; Early Years:</strong></p>
<ul>
<li><p>The <strong>ninth Sikh Guru</strong> (1621–1675).</p></li>
<li><p>Born as <strong>Tyag Mal</strong> in <strong>Amritsar</strong> to the sixth Sikh Guru, Guru Hargobind, and Mata Nanki.</p></li>
<li><p>Conferred the title <strong>"Tegh Bahadur"</strong> (Mighty of the Sword) at age 14 for showing gallantry during the <strong>Battle of Kartarpur</strong> against Mughal forces.</p></li>
</ul></li>
<li><p><strong>Spiritual Contributions &amp; Settlements:</strong></p>
<ul>
<li><p>Founded the historic township of <strong>Anandpur Sahib</strong> (originally settled as <em>Chak Nanaki</em>).</p></li>
<li><p>Composed <strong>116 hymns</strong> incorporated into the <strong>Guru Granth Sahib</strong>.</p></li>
</ul></li>
<li><p><strong>Martyrdom &amp; Legacy:</strong></p>
<ul>
<li><p>Revered with the title <strong>"Hind-di-Chadar"</strong> (Shield of India) for standing up to defend Kashmiri Pandits facing forced religious conversions under Mughal Emperor Aurangzeb.</p></li>
<li><p>Publicly executed in Delhi by orders of Aurangzeb in 1675 for refusing to renounce his faith and defending freedom of conscience.</p></li>
<li><p>Martyrdom is commemorated annually as <strong>Shaheedi Divas on 24 November</strong>.</p></li>
</ul></li>
<li><p><strong>Commemorative Historical Gurudwaras (Delhi):</strong></p>
<ul>
<li><p><strong>Gurudwara Sis Ganj Sahib:</strong> Marks Chandni Chowk, the public execution site where he was beheaded.</p></li>
<li><p><strong>Gurudwara Rakab Ganj Sahib:</strong> Marks the site where his mortal remains were cremated by his disciple Lakhi Shah Vanjara.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--sri-guru-bhairavaikya-mandira"><h2 id="2026-04-ca--sri-guru-bhairavaikya-mandira">Sri Guru Bhairavaikya Mandira</h2>
<ul>
<li><p><strong>Why in News:</strong> PM inaugurated the Sri Guru Bhairavaikya Mandira at the Adichunchanagiri Mutt in Karnataka.</p></li>
<li><p><strong>Architectural &amp; Spiritual Context:</strong></p>
<ul>
<li><p><strong>Dravidian-style temple</strong> dedicated to honouring Sri Balagangadharanatha Mahaswamiji, the 71st pontiff of the Mutt.</p></li>
<li><p>Adichunchanagiri Mahasamsthana Mutt is situated atop a granitic rocky hill at <strong>Nagamangala in Mandya district, Karnataka</strong>.</p></li>
<li><p>Revered as a <strong>Panchalinga Kshetra</strong>; <strong>Lord Kalabhairaveshwara Swamy</strong> presides as the primary deity.</p></li>
<li><p>Globally renowned for its philanthropic <strong>Tridasohi mission</strong> (providing free food, education, and healthcare).</p></li>
</ul></li>
<li><p><strong>Natha Sampradaya Heritage:</strong></p>
<ul>
<li><p>Major spiritual seat of the <strong>Natha Sampradaya</strong>, affiliated with the <strong>Jogi tradition</strong>.</p></li>
<li><p><em>Natha Sampradaya:</em> Syncretic medieval Shaivite philosophical tradition integrating Shaivism, esoteric Buddhism, rigorous asceticism, Hatha Yoga, and monastic wanderer practices.</p></li>
<li><p>Founded by <strong>Matsyendranath</strong> and consolidated across India by <strong>Guru Gorakhnath</strong>.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--mahatma-jyotiba-phule"><h2 id="2026-04-ca--mahatma-jyotiba-phule">Mahatma Jyotiba Phule</h2>
<ul>
<li><p><strong>Why in News:</strong> Ministry of Social Justice &amp; Empowerment commenced a two-year nationwide commemoration marking Mahatma Jyotiba Phule’s <strong>200th birth anniversary</strong>.</p></li>
<li><p><strong>Life &amp; Ideological Influences:</strong></p>
<ul>
<li><p>Born in <strong>1827</strong> into an agricultural <strong>Shudra Mali (gardener) family</strong> in Poona (Pune), Maharashtra.</p></li>
<li><p>Profoundly shaped by the radical humanism of <strong>Thomas Paine’s <em>Rights of Man</em></strong> and exposure to Christian missionary egalitarian schools.</p></li>
</ul></li>
<li><p><strong>Educational Pioneer:</strong></p>
<ul>
<li><p>Founded <strong>India’s first native-run school for girls</strong> at Bhide Wada, Pune, on <strong>January 1, 1848</strong>, alongside his wife Savitribai Phule.</p></li>
<li><p>Appeared before the <strong>Hunter Education Commission (1882)</strong>, forcefully advocating for free, universal, and compulsory primary education for the masses.</p></li>
</ul></li>
<li><p><strong>Social Reforms &amp; Satyashodhak Samaj:</strong></p>
<ul>
<li><p>Founded the <strong>Satyashodhak Samaj</strong> (Truth-Seekers' Society) in <strong>1873</strong> to organise lower castes, liberate them from upper-caste priestly hegemony, discard idolatry, and demand human dignity.</p></li>
</ul></li>
<li><p><strong>Seminal Literary Works:</strong></p>
<ul>
<li><p><strong><em>Gulamgiri</em> (Slavery - 1873):</strong> Dedicated the treatise to the abolitionists and soldiers of the <strong>American Civil War</strong> who fought to end Black enslavement. Drew direct sociological parallels between the exploitation of "lower" castes in India and chattel slavery of Black people in the United States.</p></li>
<li><p>Other books: <em>Trutiya Ratna</em> (play), <em>Brahmananche Kasab</em>, <em>Shetkaryacha Asood</em> (The Cultivator’s Whipcord), <em>Ishara</em>, and <em>Sarvajanik Satyadharma</em>.</p></li>
</ul></li>
<li><p><strong>Associated Reformist Journals:</strong></p>
<ul>
<li><p><em><strong>Deenbandhu</strong></em> (Voice of the Satyashodhak movement, edited by Krishnarao Bhalekar).</p></li>
<li><p><em><strong>Deenmitra</strong></em> (published by Mukundrao Patil).</p></li>
</ul></li>
</ul></section>
<div class="divider" id="2026-04-ca--div-social-sector"><span>Social Sector</span></div>
<section class="blk" data-sec="2026-04-ca--partnership-for-healthy-cities-summit"><h2 id="2026-04-ca--partnership-for-healthy-cities-summit">Partnership for Healthy Cities Summit</h2>
<ul>
<li><p><strong>Why in News:</strong> The Partnership for Healthy Cities Summit convened in <strong>Rio de Janeiro, Brazil</strong>, to accelerate international urban interventions against Non-Communicable Diseases (NCDs).</p></li>
<li><p><strong>Indian City Participation:</strong> <strong>Mumbai, Ahmedabad, and Bengaluru</strong> are active participating member cities in the network.</p></li>
<li><p><strong>NCD Burden &amp; Target Benchmarks:</strong></p>
<ul>
<li><p>Defined as chronic medical conditions with slow progression that are non-transmissible between people.</p></li>
<li><p><strong>Four Primary Categories (WHO):</strong> Cardiovascular diseases, cancers, chronic respiratory diseases, and diabetes.</p></li>
<li><p>Account for <strong>74% of all global deaths</strong> (~17 million premature deaths annually).</p></li>
<li><p>Responsible for nearly <strong>66% of all deaths in India</strong> (with one-fourth occurring prematurely).</p></li>
<li><p><strong>SDG Target 3.4:</strong> Aims to reduce premature mortality from NCDs by one-third by 2030 through prevention and treatment.</p></li>
</ul></li>
<li><p><strong>Key Indian Policy Interventions against NCDs:</strong></p>
<ul>
<li><p><strong>NP-NCD:</strong> National Programme for Prevention and Control of Non-Communicable Diseases operating across district healthcare systems.</p></li>
<li><p><strong>75/25 Initiative:</strong> Targets placing 75 million individuals with hypertension or diabetes on standard care by 2025.</p></li>
<li><p><strong>Ayushman Arogya Mandirs:</strong> Delivers population-based screenings for individuals over 30 for hypertension, diabetes, and oral/breast/cervical cancers.</p></li>
<li><p><strong>Eat Right India Movement:</strong> Led by FSSAI; capped industrial trans-fat levels in fats and oils at 2%.</p></li>
<li><p><strong>Fit India Movement:</strong> Launched in 2019 to counter sedentary lifestyles.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--ncert-deemed-to-be-university-status"><h2 id="2026-04-ca--ncert-deemed-to-be-university-status">NCERT: ‘Deemed to be University’ Status</h2>
<ul>
<li><p><strong>Why in News:</strong> National Council of Educational Research and Training (NCERT) was granted <strong>“deemed to be university” status</strong> under <strong>Section 3 of the UGC Act, 1956</strong>.</p></li>
<li><p><strong>New Academic Mandate &amp; Autonomy:</strong></p>
<ul>
<li><p>Empowers NCERT to offer undergraduate, postgraduate, and doctoral degrees directly, expanding operations beyond school curriculum research and textbook publishing.</p></li>
<li><p>Bound to UGC regulations regarding course structures, academic approvals, and standards.</p></li>
<li><p><strong>Mandatory Accreditations:</strong> Must participate in National Institutional Ranking Framework (<strong>NIRF</strong>) rankings, secure National Assessment and Accreditation Council (<strong>NAAC</strong>) accreditation, and integrate with the <strong>Academic Bank of Credits (ABC)</strong>.</p></li>
<li><p>Bound by a non-commercial clause prohibiting profit-making ventures.</p></li>
</ul></li>
<li><p><strong>Deemed-to-be-University Framework:</strong></p>
<ul>
<li><p>Conferred by the <strong>Central Government (Ministry of Education)</strong> on the advice of the University Grants Commission (UGC) under Section 3 of the UGC Act, 1956.</p></li>
<li><p>Enjoys university-level academic autonomy to design syllabus and confer degrees without requiring an individual Act of Parliament or State Legislature.</p></li>
</ul></li>
<li><p><strong>Static Profile of NCERT:</strong> Established in <strong>1961</strong> as an autonomous organization under the Ministry of Education to develop the National Curriculum Framework (NCF) and school textbooks.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--third-language-skill-based-curriculum-cbse"><h2 id="2026-04-ca--third-language-skill-based-curriculum-cbse">Third Language &amp; Skill-Based Curriculum (CBSE)</h2>
<ul>
<li><p><strong>Why in News:</strong> CBSE released a revised secondary school curriculum operationalising key provisions of the <strong>National Education Policy (NEP) 2020</strong>.</p></li>
<li><p><strong>Key Structural Changes:</strong></p>
<ul>
<li><p><strong>Third Language Mandate:</strong> Introduces a compulsory third language starting from <strong>Class 6</strong> (to be formally examined in the Class 10 Board exams by 2031).</p></li>
<li><p>Students must study at least <strong>two indigenous Indian languages</strong>, with English categorized as a foreign language option.</p></li>
<li><p>CBSE will offer testing options in all <strong>22 languages listed under the Eighth Schedule</strong> of the Constitution.</p></li>
<li><p><strong>Vocational Integration:</strong> Makes vocational education compulsory in <strong>Classes 9–10</strong> (assessed via board/annual exams starting 2027–28); integrates AI and computational thinking into Classes 3–8 curricula, making it a compulsory board subject in Class 10 by 2029.</p></li>
<li><p><strong>Two-Level Exam Hierarchy:</strong> Mathematics and Science will be offered across two difficulty tiers: Standard and Advanced.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--qs-world-university-rankings-by-subject-2026"><h2 id="2026-04-ca--qs-world-university-rankings-by-subject-2026">QS World University Rankings by Subject 2026</h2>
<ul>
<li><p><strong>Why in News:</strong> IIM Kozhikode broke into the global top 100 in the <em>QS World University Rankings by Subject 2026</em>.</p></li>
<li><p><strong>Methodology &amp; Publisher:</strong> Published annually by UK-based analytics agency <strong>Quacquarelli Symonds</strong>; evaluates institutions across <strong>five core metrics</strong>: academic reputation, employer reputation, citations per paper, H-index, and international research network.</p></li>
<li><p><strong>India’s Comparative Performance:</strong></p>
<ul>
<li><p>India ranks <strong>4th worldwide</strong> in overall institution count and fresh entries, trailing only the US, China, and the UK.</p></li>
<li><p><strong>IIT-ISM Dhanbad</strong> and <strong>IIM Ahmedabad</strong> secured India's highest individual subject global rankings.</p></li>
<li><p><strong>IIT Delhi</strong> leads domestic institutions in the Engineering &amp; Technology subject stream.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--morung-education-system"><h2 id="2026-04-ca--morung-education-system">Morung Education System</h2>
<ul>
<li><p><strong>Why in News:</strong> Prime Minister praised the traditional Morung education system for preserving tribal cultural heritage.</p></li>
<li><p><strong>Anthropological Identity:</strong></p>
<ul>
<li><p>Traditional community-based youth dormitory and informal educational institution central to the village structure of several <strong>Naga tribes</strong>.</p></li>
<li><p>Serves as an indigenous learning hub where youth undergo socialization, learning customary laws, oral folklore, warfare techniques, indigenous handicrafts, agricultural rituals, and music from tribal elders.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--haemophilus-influenzae-type-b-hib-disease"><h2 id="2026-04-ca--haemophilus-influenzae-type-b-hib-disease">Haemophilus Influenzae Type b (Hib) Disease</h2>
<ul>
<li><p><strong>Why in News:</strong> Resurging cases of <em>Haemophilus influenzae</em> type b (Hib) disease were reported across the United States due to falling childhood routine vaccination coverage.</p></li>
<li><p><strong>Pathogen Profile:</strong> Caused by a encapsulated <strong>gram-negative bacterium</strong> (<em>Haemophilus influenzae</em> type b) — <strong>not a viral influenza pathogen</strong>.</p></li>
<li><p><strong>Transmission Mode:</strong> Transmitted via <strong>inhalation of respiratory droplets</strong> or direct mucosal contact with infected nasopharyngeal secretions.</p></li>
<li><p><strong>Clinical Manifestations:</strong> Severe invasive disease leading to <strong>bacterial meningitis</strong> (inflammation of brain membranes), <strong>epiglottitis</strong> (acute swelling of the windpipe), severe pneumonia, and septicaemia.</p></li>
<li><p><strong>Vulnerable Cohort:</strong> Children <strong>under five years of age</strong> and immunocompromised adults.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--integrated-disease-surveillance-programme-idsp"><h2 id="2026-04-ca--integrated-disease-surveillance-programme-idsp">Integrated Disease Surveillance Programme (IDSP)</h2>
<ul>
<li><p><strong>Why in News:</strong> IDSP was upgraded by the Ministry of Health and Family Welfare (MoHFW) to enhance national preparedness against bio-emergencies and hybrid biological security threats.</p></li>
<li><p><strong>Genesis &amp; Administrative Umbrella:</strong> Launched in <strong>November 2004</strong>; operates under the aegis of the <strong>National Health Mission (NHM)</strong>.</p></li>
<li><p><strong>Core Mandate:</strong> Decentralised disease surveillance network tracking outbreak trends across district, state, and central tiers to provide early warnings for epidemic-prone pathogens, bio-warfare agents, and <strong>agro-/bio-terrorism threats</strong>.</p></li>
<li><p><strong>Institutional Coordination:</strong> Integrates multi-agency protocols supported by the <strong>National Disaster Management Authority (NDMA)</strong> and the <strong>National Disaster Response Force (NDRF)</strong> through standard operating procedures (SOPs) for bio-containment.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--qdenga-dengue-vaccine"><h2 id="2026-04-ca--qdenga-dengue-vaccine">Qdenga Dengue Vaccine</h2>
<ul>
<li><p><strong>Why in News:</strong> Drugs Controller General of India (DCGI) cleared the Qdenga vaccine for individuals aged 4 to 60 years, making it <strong>India’s first approved dengue vaccine</strong>.</p></li>
<li><p><strong>Vaccine Platform &amp; Developer:</strong></p>
<ul>
<li><p>Developed by <strong>Takeda Pharmaceutical (Japan)</strong>.</p></li>
<li><p>Formulated as a <strong>live-attenuated, tetravalent vaccine</strong> (uses a weakened live pathogen to generate immunity against all <strong>four dengue virus serotypes: DENV-1, DENV-2, DENV-3, and DENV-4</strong>).</p></li>
<li><p>Functions predominantly as a <strong>disease-modifying vaccine</strong> (significantly curtails hospitalization and severe dengue rather than guaranteeing complete sterilizing immunity or transmission block).</p></li>
</ul></li>
<li><p><strong>Static Context (Dengue):</strong></p>
<ul>
<li><p>Acute <strong>viral infection</strong> transmitted via the bite of female <em>Aedes</em> mosquitoes (primarily <em><strong>Aedes aegypti</strong></em>, as well as <em>Aedes albopictus</em>).</p></li>
<li><p>Has no specific targeted antiviral treatment; managed clinically through symptom-directed supportive care.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--semaglutide"><h2 id="2026-04-ca--semaglutide">Semaglutide</h2>
<ul>
<li><p><strong>Why in News:</strong> Dr. Reddy’s Laboratories received approval from the Central Drugs Standard Control Organisation (CDSCO) to manufacture and market generic <strong>oral semaglutide</strong> tablets.</p></li>
<li><p><strong>Mechanism of Action:</strong></p>
<ul>
<li><p>Functions as a <strong>GLP-1 (Glucagon-Like Peptide-1) receptor agonist</strong>.</p></li>
<li><p>Synthetically mimics endogenous GLP-1 incretin hormones to:</p>
<ol type="1">
<li><p>Stimulate glucose-dependent <strong>insulin secretion</strong> from pancreatic beta cells.</p></li>
<li><p>Inhibit inappropriate glucagon release.</p></li>
<li><p><strong>Delay gastric emptying</strong> and trigger central satiety signals in the hypothalamus, curbing appetite and inducing weight loss.</p></li>
</ol></li>
</ul></li>
<li><p><strong>Therapeutic Indications:</strong> Prescribed for managing Type-2 Diabetes Mellitus, chronic clinical obesity/overweight management, and cutting major adverse cardiovascular event (MACE) risks.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--subacute-sclerosing-panencephalitis-sspe"><h2 id="2026-04-ca--subacute-sclerosing-panencephalitis-sspe">Subacute Sclerosing Panencephalitis (SSPE)</h2>
<ul>
<li><p><strong>Why in News:</strong> Bombay High Court heard a PIL highlighting the absence of a structured state healthcare policy for Subacute Sclerosing Panencephalitis (SSPE).</p></li>
<li><p><strong>Etiology &amp; Nature:</strong></p>
<ul>
<li><p>Also known as <strong>Dawson disease</strong>; an extremely rare, progressive, and invariably fatal neurodegenerative inflammatory brain disorder.</p></li>
<li><p>Caused by a persistent, mutated, slow-reactivating <strong>measles virus</strong> (<em>Paramyxoviridae</em> family, single-stranded <strong>RNA virus</strong>) sequestered in central nervous system cells years after initial infection.</p></li>
</ul></li>
<li><p><strong>Clinical Course &amp; Management:</strong></p>
<ul>
<li><p>Characterized by progressive cognitive deterioration, behavioral changes, myoclonic jerks, focal seizures, blindness, vegetative state, and coma.</p></li>
<li><p>Has <strong>no curative antiviral treatment</strong>; management remains entirely palliative and symptomatic.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--keytruda-pembrolizumab-cancer-immunotherapy"><h2 id="2026-04-ca--keytruda-pembrolizumab-cancer-immunotherapy">Keytruda (Pembrolizumab) &amp; Cancer Immunotherapy</h2>
<ul>
<li><p><strong>Why in News:</strong> Keytruda (Pembrolizumab), manufactured by Merck &amp; Co., reached landmark clinical adoption milestones in transforming global oncological protocols.</p></li>
<li><p><strong>Therapeutic Mechanism:</strong></p>
<ul>
<li><p>Humanized <strong>monoclonal antibody</strong> belonging to the class of <strong>immune checkpoint inhibitors</strong>.</p></li>
<li><p>Targets and blocks the <strong>PD-1 (Programmed Death receptor-1)</strong> pathway on human T-cells, reversing tumor-induced immune evasion and enabling cytotoxic T-lymphocytes to recognize and destroy malignant cells.</p></li>
</ul></li>
<li><p><strong>Clinical Scope:</strong> Approved for advanced melanoma, non-small cell lung cancer (NSCLC), renal cell carcinoma, cervical cancer, and triple-negative breast cancer.</p></li>
<li><p><strong>Immunotherapy Advantage:</strong> Harnesses the patient's endogenous immune system for targeted cellular destruction, significantly reducing off-target systemic toxicities compared to cytotoxic chemotherapy.</p></li>
<li><p><strong>Major Immunotherapy Modalities:</strong> Immune checkpoint inhibitors, monoclonal antibodies, <strong>CAR-T cell therapy</strong>, and prophylactic/therapeutic cancer vaccines.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--calcium-carbide-in-fruit-ripening"><h2 id="2026-04-ca--calcium-carbide-in-fruit-ripening">Calcium Carbide in Fruit Ripening</h2>
<ul>
<li><p><strong>Why in News:</strong> Food safety enforcement drives targeted illegal chemical fruit ripening using calcium carbide during the summer harvest season.</p></li>
<li><p><strong>Chemical Mechanism:</strong></p>
<ul>
<li><p>Greyish-black industrial chemical (traditionally utilized in oxy-acetylene welding).</p></li>
<li><p>Reacts with ambient atmospheric moisture or fruit surface moisture to synthesize <strong>acetylene gas (</strong>C<sub>2</sub>H<sub>2</sub><strong>)</strong>, which acts as an analog to the natural plant-ripening hormone <strong>ethylene (</strong>C<sub>2</sub>H<sub>4</sub><strong>)</strong>:</p></li>
</ul></li>
</ul>
<p>CaC<sub>2</sub>+ 2H<sub>2</sub>O → Ca(OH)<sub>2</sub>+ C<sub>2</sub>H<sub>2</sub></p>
<ul>
<li><p><strong>Toxicological Hazards:</strong> Commercial-grade calcium carbide contains trace industrial residues of <strong>arsenic hydride (arsine)</strong> and <strong>phosphorus hydride (phosphine)</strong>, inducing acute gastroenteritis, mouth ulcers, systemic neurological deficits, hypoxia, and elevated carcinogenic risks.</p></li>
<li><p><strong>Regulatory Status:</strong> Completely <strong>prohibited for artificial fruit ripening</strong> in India under the <em>Food Safety and Standards (Prohibition and Restriction on Sales) Regulations, 2011</em>.</p></li>
</ul></section>

<section class="blk" data-sec="2026-04-ca--ivfrt-scheme-immigration-visa-foreigners-registr"><h2 id="2026-04-ca--ivfrt-scheme-immigration-visa-foreigners-registr">IVFRT Scheme (Immigration, Visa, Foreigners Registration &amp; Tracking)</h2>

<li><p>Executed by the <strong>Bureau of Immigration (BoI)</strong> with technical and digital system architecture managed by the <strong>National Informatics Centre (NIC)</strong>.</p></li>

</ul></li>

<section class="blk" data-sec="2026-04-ca--technology-development-and-investment-promotion-"><h2 id="2026-04-ca--technology-development-and-investment-promotion-">Technology Development and Investment Promotion Scheme (TDIP)</h2>

<ul>

<li><p>Priority focus on indigenous <strong>6G ecosystem architectures</strong> to displace reliance on foreign proprietary stacks.</p></li>
</ul></li>
<li><p><strong>Eligibility &amp; Institutional Partners:</strong></p>
<ul>
<li><p>Expanded beyond academic institutions to include <strong>startups, MSMEs, and private industry players</strong>.</p></li>

</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--scheme-for-india-s-hydrogen-startup-ecosystem"><h2 id="2026-04-ca--scheme-for-india-s-hydrogen-startup-ecosystem">Scheme for India’s Hydrogen Startup Ecosystem</h2>
<ul>
<li><p><strong>Why in News:</strong> Ministry of New and Renewable Energy (MNRE) launched the <em>‘Scheme for New and Novel Uses of Hydrogen Production and Applications’</em> under the broader <strong>National Green Hydrogen Mission (NGHM)</strong>.</p></li>
<li><p><strong>Implementation Agency:</strong> National Institute of Solar Energy (<strong>NISE</strong>) and Biotechnology Industry Research Assistance Council (<strong>BIRAC</strong>).</p></li>
<li><p><strong>Financial Allocations &amp; Outlay:</strong></p>
<ul>
<li><p>Allocates <strong>₹100 crore</strong> under Part B specifically for startup-led pilot initiatives.</p></li>
<li><p>Disburses non-dilutive financial grants of <strong>up to ₹5 crore per pilot project</strong> to transition lab prototypes into commercial-scale demonstrations.</p></li>
</ul></li>
<li><p><strong>Priority R&amp;D Areas:</strong> Next-generation electrolysers, biomass-to-green hydrogen thermochemical conversion, fuel cell efficiency, hydrogen cargo drone transport, smart AI-monitored hydrogen grids, and localized off-grid setups.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--modified-udan-scheme"><h2 id="2026-04-ca--modified-udan-scheme">Modified UDAN Scheme</h2>
<ul>
<li><p><strong>Why in News:</strong> Union Cabinet approved the revamped and redesigned <em>Ude Desh ka Aam Nagrik</em> scheme designated as <strong>‘Modified UDAN’</strong>.</p></li>
<li><p><strong>Extended Tenure:</strong> Extended for <strong>10 years</strong> spanning from <strong>FY 2026–27 to FY 2035–36</strong>.</p></li>
<li><p><strong>Key Strategic Shifts &amp; Targets:</strong></p>
<ul>
<li><p><strong>Geographical Priority:</strong> Redirects focus to underserved terrains: <strong>Northeast, Himalayan hill states, island territories, and remote tribal districts</strong>.</p></li>
<li><p><strong>Infrastructure Targets:</strong> Operationalise <strong>100 unserved/underserved airstrips</strong> through a challenge-based competitive framework and construct <strong>200 advanced helipads</strong>.</p></li>
<li><p><strong>Funding Overhaul:</strong> Regional Connectivity Fund (RCF) will receive <strong>direct fiscal budgetary support from the Union Government</strong>, replacing the earlier levy model on commercial trunk route passengers.</p></li>
<li><p><strong>Viability Gap Funding (VGF):</strong> VGF operational subsidy tenure extended from 3 years to <strong>5 years</strong> for designated difficult routes to ensure carrier viability.</p></li>
<li><p><strong>Indigenisation Clause:</strong> Proposes preferential induction of indigenous aircraft, including the <strong>HAL Dhruv (ALH)</strong> and <strong>HAL Dornier 228</strong> transport aircraft, for regional routes.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--pm-internship-scheme-pmis-eligibility-revisions"><h2 id="2026-04-ca--pm-internship-scheme-pmis-eligibility-revisions">PM Internship Scheme (PMIS) - Eligibility Revisions</h2>
<ul>
<li><p><strong>Why in News:</strong> Ministry of Corporate Affairs (MCA) expanded the eligibility guidelines of the Prime Minister’s Internship Scheme (PMIS).</p></li>
<li><p><strong>Revised Eligibility Criteria:</strong></p>
<ul>
<li><p>Now permits enrollment of <strong>final-year undergraduate and postgraduate students</strong>.</p></li>
<li><p><strong>Age Bracket:</strong> Broadened to <strong>18–25 years</strong> (widened from the earlier 21–24 years window).</p></li>
</ul></li>
<li><p><strong>Exclusions &amp; Disqualifications:</strong></p>
<ul>
<li><p>Family gross annual income ceiling capped at <strong>₹12 lakh</strong>; individuals with immediate family members holding <strong>permanent government jobs</strong> remain ineligible.</p></li>

</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--multi-hazard-early-warning-decision-support-syst"><h2 id="2026-04-ca--multi-hazard-early-warning-decision-support-syst">Multi-Hazard Early Warning Decision Support System (MHEW-DSS)</h2>
<ul>
<li><p><strong>Why in News:</strong> India Meteorological Department (IMD) under the Ministry of Earth Sciences (MoES) operationalised the MHEW-DSS digital platform under <strong>Mission Mausam</strong>.</p></li>
<li><p><strong>Technical Architecture &amp; Granularity:</strong></p>
<ul>
<li><p>WebGIS-based early warning architecture that ingests real-time inputs from Doppler weather radars, INSAT meteorological payloads, and automated surface weather stations.</p></li>
<li><p>Produces high-resolution, impact-based, colour-coded warnings covering <strong>1.5 lakh PIN codes and 6.2 lakh villages</strong> nationwide.</p></li>
</ul></li>
<li><p><strong>Dissemination &amp; Operational Gains:</strong></p>
<ul>
<li><p>Dispatches alerts using the Common Alerting Protocol (CAP) via SMS, WhatsApp, and the Mausam/Mausamgram applications.</p></li>
<li><p><strong>Automates</strong> &gt;90% <strong>of data processing pipelines</strong>, reducing forecast generation turnaround times from 6 hours to 3 hours while increasing localized accuracy by ~30% with a <strong>7-day lead time</strong>.</p></li>
</ul></li>
<li><p><strong>Regional Geopolitics:</strong> Functions as the primary multi-hazard meteorological data clearinghouse and early warning hub for <strong>12 partner littoral countries</strong> across the North Indian Ocean and Bay of Bengal rim.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--pradhan-mantri-awaas-yojana-gramin-10-years-of-p"><h2 id="2026-04-ca--pradhan-mantri-awaas-yojana-gramin-10-years-of-p">Pradhan Mantri Awaas Yojana – Gramin (10 Years of PMAY-G)</h2>
<ul>
<li><p><strong>Why in News:</strong> PMAY-G, operating since 2016, completed 10 years as one of India's largest rural housing welfare programmes.</p></li>
<li><p><strong>Nodal Ministry:</strong> Ministry of Rural Development.</p></li>
<li><p><strong>Core Objective:</strong> Provide pucca houses with basic amenities to all houseless households and those residing in kutcha/dilapidated dwellings in rural areas.</p></li>
<li><p><strong>Eligibility &amp; Standards:</strong></p>
<ul>
<li><p><strong>Minimum Unit Size:</strong> At least <strong>25 sq. m</strong>, including a dedicated hygienic cooking space.</p></li>
<li><p>Construction utilizes <strong>local materials</strong> and trained masons to ensure durability.</p></li>
</ul></li>
<li><p><strong>Funding Pattern:</strong></p>
<ul>
<li><p><strong>60:40</strong> (Centre : State) for plain areas.</p></li>
<li><p><strong>90:10</strong> for North-Eastern and Himalayan states.</p></li>
<li><p><strong>100% Central funding</strong> for Union Territories.</p></li>
</ul></li>
<li><p><strong>Financial Assistance:</strong> Direct Benefit Transfer (DBT) of <strong>₹1.20 lakh</strong> in plain areas and <strong>₹1.30 lakh</strong> in hilly, difficult, and North-Eastern states.</p></li>
<li><p><strong>Scheme Convergence:</strong></p>
<ul>
<li><p><strong>MGNREGA:</strong> Provides 90–95 person-days of unskilled wage employment for house construction.</p></li>
<li><p><strong>Swachh Bharat Mission-Gramin (SBM-G):</strong> ₹12,000 assistance for toilet construction.</p></li>
</ul></li>
<li><p><strong>Beneficiary Selection &amp; Targeting:</strong></p>
<ul>
<li><p>Identified via <strong>housing deprivation parameters under SECC 2011</strong> and validated by <strong>Awaas+ surveys</strong>, followed by mandatory <strong>Gram Sabha verification</strong>.</p></li>
<li><p>Covers landless households, with a statutory mandate that <strong>at least 60% of targets</strong> be reserved for SC/ST households.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--rebate-of-state-and-central-taxes-and-levies-ros"><h2 id="2026-04-ca--rebate-of-state-and-central-taxes-and-levies-ros">Rebate of State and Central Taxes and Levies (RoSCTL) Scheme</h2>
<ul>
<li><p><strong>Why in News:</strong> Ministry of Textiles extended the RoSCTL scheme until <strong>30 September 2026</strong>.</p></li>
<li><p><strong>Origin &amp; Administrative Machinery:</strong></p>
<ul>
<li><p>Introduced by the <strong>Ministry of Textiles in 2019</strong>.</p></li>
<li><p>Implemented and operationalised by the <strong>Department of Revenue, Ministry of Finance</strong>.</p></li>
<li><p>Replaced the Rebate of State Levies (RoSL) and the WTO-incompatible Merchandise Exports from India Scheme (MEIS) for the apparel sector.</p></li>
</ul></li>
<li><p><strong>Objective &amp; Scope:</strong></p>
<ul>
<li><p>Neutralises embedded non-GST domestic taxes (e.g., state VAT on transportation fuel, electricity duty, mandi tax) so domestic levies are not exported.</p></li>
<li><p><strong>Eligible Items:</strong> Exporters of ready-made garments under <strong>ITC-HS Chapters 61 and 62</strong>, as well as made-up textile articles under <strong>Chapter 63</strong>.</p></li>
</ul></li>
<li><p><strong>Mechanism &amp; Exclusivity:</strong></p>
<ul>
<li><p>Rebates are disbursed as duty-credit, freely <strong>transferable electronic scrips (e-scrips)</strong> via the customs ICEGATE portal.</p></li>
<li><p>Scrips can be used to pay <strong>Basic Customs Duty (BCD)</strong> on imported inputs.</p></li>
<li><p><strong>Mutually exclusive with RoDTEP:</strong> Exporters cannot simultaneously claim RoSCTL and RoDTEP benefits on the same export consignment.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--river-basin-management-rbm-scheme"><h2 id="2026-04-ca--river-basin-management-rbm-scheme">River Basin Management (RBM) Scheme</h2>
<ul>
<li><p><strong>Why in News:</strong> Union Cabinet approved the continuation of the River Basin Management (RBM) Scheme from <strong>2026-27 to 2030-31</strong>.</p></li>
<li><p><strong>Classification &amp; Ministry:</strong> <strong>Central Sector Scheme</strong> under the <strong>Ministry of Jal Shakti</strong>.</p></li>
<li><p><strong>Objective:</strong> Comprehensive, integrated basin-level hydrological planning to support irrigation efficiency, hydropower optimization, flood mitigation, and groundwater recharge.</p></li>
<li><p><strong>Implementing Agencies:</strong></p>
<ul>
<li><p><strong>Central Water Commission (CWC):</strong> Basin-wide hydrological surveys and water data analytics.</p></li>
<li><p><strong>Brahmaputra Board:</strong> Basin master planning and flood management works in the Northeast.</p></li>
<li><p><strong>National Water Development Agency (NWDA):</strong> Feasibility studies for inter-basin water transfers.</p></li>
</ul></li>
<li><p><strong>Geographical Focus &amp; Modern Technology:</strong> Prioritises the <strong>Indus, Brahmaputra, Barak, and Teesta</strong> river basins; deploys <strong>GIS, satellite remote sensing, and LiDAR-equipped drone surveys</strong> for high-resolution contour and basin modelling.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--pradhan-mantri-gram-sadak-yojana-pmgsy-iii-exten"><h2 id="2026-04-ca--pradhan-mantri-gram-sadak-yojana-pmgsy-iii-exten">Pradhan Mantri Gram Sadak Yojana (PMGSY-III Extension)</h2>
<ul>
<li><p><strong>Why in News:</strong> Union Cabinet extended Pradhan Mantri Gram Sadak Yojana-III (PMGSY-III) up to <strong>March 2028</strong>.</p></li>
<li><p><strong>Phase-III Mandate:</strong> Consolidation of existing <strong>Through Routes and Major Rural Links</strong> that connect rural habitations to Gramin Agricultural Markets (GrAMs), higher secondary schools, and healthcare facilities.</p></li>
<li><p><strong>Static Profile:</strong></p>
<ul>
<li><p>Launched in <strong>December 2000</strong> as a <strong>Centrally Sponsored Scheme</strong> under the <strong>Ministry of Rural Development</strong> to provide all-weather road connectivity.</p></li>
<li><p><strong>Implementing Architecture:</strong> Policy and monitoring driven by the National Rural Infrastructure Development Agency (<strong>NRIDA</strong>); execution handled by State Rural Roads Development Agencies (<strong>SRRDAs</strong>).</p></li>
<li><p><strong>Cost-Sharing Pattern:</strong> <strong>60:40</strong> (Centre : State) for plain states; <strong>90:10</strong> for North-Eastern and Himalayan States.</p></li>
<li><p><strong>Digital Oversight:</strong> Monitored via the Online Management, Monitoring and Accounting System (<strong>OMMAS</strong>) and the electronic Maintenance of Rural Roads platform (<strong>eMARG</strong>).</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--skills-outcomes-fund-sof"><h2 id="2026-04-ca--skills-outcomes-fund-sof">Skills Outcomes Fund (SOF)</h2>
<ul>
<li><p><strong>Why in News:</strong> Ministry of Skill Development and Entrepreneurship (MSDE) launched the Skills Outcomes Fund to finance livelihood programmes for low-income youth.</p></li>
<li><p><strong>Financing Innovation:</strong></p>
<ul>
<li><p><strong>Outcome-based financing model:</strong> Links payments and capital releases directly to <strong>verified employment outcomes</strong> (job placement rates and long-term workplace retention) rather than mere training completion.</p></li>
<li><p>Blends <strong>public, private, and philanthropic capital</strong> into a unified outcomes pool.</p></li>
</ul></li>
<li><p><strong>Implementing Agency:</strong> Operationalised by the <strong>National Skill Development Corporation (NSDC)</strong>.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--vishwa-sutra-initiative"><h2 id="2026-04-ca--vishwa-sutra-initiative">Vishwa Sutra Initiative</h2>
<ul>
<li><p><strong>Why in News:</strong> Ministry of Textiles, in collaboration with the National Institute of Fashion Technology (NIFT), launched the <em>‘Vishwa Sutra – Weaves of India for the World’</em> initiative.</p></li>
<li><p><strong>The "30x30" Concept:</strong> Pairs <strong>30 iconic Indian handloom weaves</strong> with design motifs inspired by <strong>30 foreign nations</strong>.</p>
<ul>
<li><p><em>Examples:</em> Odisha Ikat blended with Greek drapery; Kanchipuram silk featuring minimalist Norwegian lines; Assam Muga silk integrated with Egyptian motifs.</p></li>
</ul></li>
<li><p><strong>Strategic Intent:</strong> Boost export demand for rural handloom clusters and support <strong>women-led weaving cooperatives</strong>.</p></li>
<li><p><strong>Institutional Alignment:</strong> Executed by the Office of the Development Commissioner (Handlooms); anchors the PM’s <strong>5F Framework</strong> (<em>Farm to Fibre to Factory to Fashion to Foreign</em>) and the <em>Vocal for Local to Global</em> vision.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--poshan-2-0-mission-saksham-anganwadi-poshan-2-0"><h2 id="2026-04-ca--poshan-2-0-mission-saksham-anganwadi-poshan-2-0">Poshan 2.0 (Mission Saksham Anganwadi &amp; Poshan 2.0)</h2>
<ul>
<li><p><strong>Why in News:</strong> The 8th Poshan Pakhwada was organized under the overarching framework of Poshan 2.0.</p></li>
<li><p><strong>Genesis &amp; Scope:</strong></p>
<ul>
<li><p>Integrated national nutrition programme launched in <strong>2021</strong> by the <strong>Ministry of Women and Child Development (MoWCD)</strong>.</p></li>
<li><p>Subsumes the Supplementary Nutrition Programme (under erstwhile <strong>ICDS</strong>), the <strong>Scheme for Adolescent Girls (SAG)</strong>, and <strong>Poshan Abhiyaan</strong>.</p></li>
</ul></li>
<li><p><strong>Target Beneficiaries:</strong> Children aged <strong>0–6 years</strong>, pregnant women, lactating mothers, and <strong>adolescent girls aged 14–18 years in Aspirational Districts and the North-Eastern Region</strong>.</p></li>
<li><p><strong>Core Interventions:</strong></p>
<ul>
<li><p><strong>Holistic Nutrition:</strong> Supplementary nutrition integrated with <strong>AYUSH systems</strong> and local <em>Poshan Vatikas</em> (nutri-gardens).</p></li>
<li><p><strong>Early Education:</strong> Integrates Early Childhood Care and Education (ECCE) via the <em><strong>“Poshan Bhi Padhai Bhi”</strong></em> curriculum to transition Anganwadis into pre-primary learning hubs.</p></li>
<li><p><strong>Saksham Anganwadi Upgrades:</strong> Upgrading <strong>2 lakh Anganwadi Centres</strong> with enhanced infrastructure (smart learning tools, clean tap water, rainwater harvesting, and LED screens).</p></li>
<li><p><strong>Community Delivery:</strong> Driven by <em>Jan Bhagidari</em> through Gram Panchayats and Women Self-Help Groups (SHGs).</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--prism-sg-portal"><h2 id="2026-04-ca--prism-sg-portal">PRISM-SG Portal</h2>
<ul>
<li><p><strong>Why in News:</strong> PRISM-SG portal was launched to digitize and expedite approvals for Road Over Bridges (ROBs).</p></li>
<li><p><strong>Inter-Ministerial Collaboration:</strong> Developed jointly by the <strong>Ministry of Road Transport and Highways (MoRTH)</strong> and the <strong>Ministry of Railways</strong>.</p></li>
<li><p><strong>Mandate:</strong> Provides an integrated, end-to-end digital workflow for drawing submissions, engineering approvals, structural safety inspections, inter-departmental query resolutions, and real-time project milestone tracking for rail-road grade separation projects.</p></li>
</ul></section>
<div class="divider" id="2026-04-ca--div-agriculture"><span>Agriculture</span></div>
<section class="blk" data-sec="2026-04-ca--biometric-verification-at-agri-mandis"><h2 id="2026-04-ca--biometric-verification-at-agri-mandis">Biometric Verification at Agri-Mandis</h2>
<ul>
<li><p><strong>Why in News:</strong> Haryana Government introduced Aadhaar-based biometric verification at mandis to authenticate farmers prior to crop procurement.</p></li>
<li><p><strong>Core Objective:</strong> Curb fraudulent sales and stop traders/middlemen from recycling produce bought cheaply from other states under local farmers' identities to claim Minimum Support Price (MSP).</p></li>
<li><p><strong>Static Context (Mandi Architecture &amp; APMC):</strong></p>
<ul>
<li><p>Regulated market mechanism administered via Agricultural Produce Market Committees (<strong>APMCs</strong>) established under state-specific APMC Acts.</p></li>
<li><p>Discovery of prices operates via <strong>open outcry auction or electronic bidding</strong> within centralised yard premises.</p></li>
<li><p><strong>e-NAM (National Agriculture Market):</strong> Pan-India electronic trading portal integrating physical APMC mandis to create a unified national agricultural market.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--namo-drone-didi-yojana-nddy"><h2 id="2026-04-ca--namo-drone-didi-yojana-nddy">Namo Drone Didi Yojana (NDDY)</h2>
<ul>
<li><p><strong>Why in News:</strong> Karnataka emerged as the leading state under the Namo Drone Didi Yojana, having trained 145 women from Self-Help Groups (SHGs) as certified drone pilots.</p></li>
<li><p><strong>Classification &amp; Target:</strong></p>
<ul>
<li><p><strong>Central Sector Scheme</strong> aimed at empowering rural women by providing <strong>15,000 agricultural drones</strong> to women SHGs federated under <strong>DAY-NRLM</strong> (Deendayal Antyodaya Yojana – National Rural Livelihoods Mission).</p></li>
</ul></li>
<li><p><strong>Financial Model &amp; Subsidies:</strong></p>
<ul>
<li><p>Union Government provides an <strong>80% capital subsidy (capped at ₹8 lakh)</strong> for the drone and accessories package.</p></li>
<li><p>Remaining 20% balance is financed via loans under the <strong>Agriculture Infrastructure Fund (AIF)</strong> with a <strong>3% interest subvention</strong>.</p></li>
</ul></li>
<li><p><strong>Capacity Building:</strong></p>
<ul>
<li><p><strong>15-day mandatory training:</strong> 10 days of remote pilot training for DGCA certification plus 5 days of crop-specific agronomic spraying protocols.</p></li>
<li><p>Includes training an additional SHG member as a mechanical assistant for battery charging, maintenance, and field repairs.</p></li>
</ul></li>
<li><p><strong>Implementation Architecture:</strong></p>
<ul>
<li><p><strong>Nodal Authority:</strong> Department of Agriculture &amp; Farmers Welfare (DA&amp;FW).</p></li>
<li><p>Lead Fertiliser Companies (LFCs) coordinate equipment procurement, delivery, and field demonstration support.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--glufosinate"><h2 id="2026-04-ca--glufosinate">Glufosinate</h2>
<ul>
<li><p><strong>Why in News:</strong> Directorate General of Foreign Trade (DGFT) imposed six-month minimum import price (MIP) curbs on Glufosinate and its salts.</p></li>
<li><p><strong>Chemical Character &amp; Mechanism:</strong></p>
<ul>
<li><p><strong>Broad-spectrum, non-selective contact herbicide</strong> used to control annual and perennial weeds across agricultural plantations.</p></li>
<li><p><strong>Mode of Action:</strong> Selectively inhibits the <strong>glutamine synthetase</strong> enzyme, blocking plant nitrogen assimilation, which leads to toxic intracellular ammonia accumulation and rapid cellular death.</p></li>
<li><p>Used as an alternative to <strong>glyphosate</strong> in integrated weed management strategies against glyphosate-resistant weed biotypes.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--urea-consumption-green-urea"><h2 id="2026-04-ca--urea-consumption-green-urea">Urea Consumption &amp; Green Urea</h2>
<ul>
<li><p><strong>Why in News:</strong> India’s high import dependence on natural gas feedstocks, rising fiscal fertilizer subsidy outlays, and soil degradation from overuse are driving the push toward "Green Urea".</p></li>
<li><p><strong>National Consumption Dynamics:</strong></p>
<ul>
<li><p>Urea accounts for <strong>~56% of total chemical fertiliser consumption</strong> in India and makes up <strong>~80% of all nitrogenous fertilisers</strong>.</p></li>
<li><p><strong>~90% of urea consumption is import-dependent</strong> (either imported directly as finished prilled urea or produced domestically using imported Liquefied Natural Gas / LNG).</p></li>
</ul></li>
<li><p><strong>Grey Urea vs. Green Urea:</strong></p>
<ul>
<li><p><strong>Grey Urea:</strong> Manufactured via the Haber-Bosch process utilizing natural gas (CH<sub>4</sub>) as the feedstock, releasing high lifecycle carbon emissions.</p></li>
<li><p><strong>Green Urea:</strong> Synthesised by combining <strong>green hydrogen</strong> (produced via water electrolysis powered by renewable energy) with <strong>captured carbon dioxide (</strong>CO<sub>2</sub><strong>)</strong>, yielding a low-carbon fertiliser.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--pli-scheme-for-food-processing-industry-plisfpi"><h2 id="2026-04-ca--pli-scheme-for-food-processing-industry-plisfpi">PLI Scheme for Food Processing Industry (PLISFPI)</h2>
<ul>
<li><p><strong>Why in News:</strong> Government review revealed sustained growth in food processing outputs, agricultural exports, and processed millet-based products under the PLI scheme.</p></li>
<li><p><strong>Scheme Character &amp; Nodal Ministry:</strong> <strong>Central Sector Scheme</strong> administered by the <strong>Ministry of Food Processing Industries (MoFPI)</strong>; operational across a 6-year tenure (<strong>2021–22 to 2026–27</strong>).</p></li>
<li><p><strong>Core Objectives:</strong> Incentivise creation of global food champions, expand processing capacity, generate non-farm rural employment, and enhance international branding for Indian foods.</p></li>
<li><p><strong>Incentivised Segments:</strong></p>
<ul>
<li><p>Ready-to-Cook (RTC) and Ready-to-Eat (RTE) convenience foods.</p></li>
<li><p>Processed fruits and vegetables.</p></li>
<li><p>Marine products.</p></li>
<li><p>Mozzarella cheese and organic foods, alongside financial support for overseas branding and marketing.</p></li>
</ul></li>
<li><p><strong>Static Context (PLI Framework):</strong></p>
<ul>
<li><p>Performance-linked program launched in <strong>2020</strong> under the <em>Atmanirbhar Bharat</em> initiative to boost domestic manufacturing across <strong>14 strategic sectors</strong>.</p></li>
<li><p>Provides cash incentives calculated on <strong>incremental sales</strong> over a predetermined base year.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--buffer-stocks-of-foodgrains"><h2 id="2026-04-ca--buffer-stocks-of-foodgrains">Buffer Stocks of Foodgrains</h2>
<ul>
<li><p><strong>Why in News:</strong> Central pool foodgrain stocks surged significantly above mandatory buffer norms, providing a cushion against domestic production shocks and international price swings.</p></li>
<li><p><strong>Concept &amp; Origin:</strong></p>
<ul>
<li><p>Government-held strategic grain reserves (predominantly <strong>wheat and rice</strong>) to guarantee national food security, supply welfare safety nets, and stabilise open-market prices.</p></li>
<li><p>Formally institutionalised during the <strong>Fourth Five-Year Plan (1969–74)</strong>.</p></li>
</ul></li>
<li><p><strong>Stock Fixation &amp; Review:</strong></p>
<ul>
<li><p>Minimum buffer stock and strategic reserve norms are fixed by the <strong>Cabinet Committee on Economic Affairs (CCEA)</strong>.</p></li>
<li><p>Monitored and reviewed on a <strong>quarterly basis</strong> corresponding to the start of each quarter: <strong>1st April, 1st July, 1st October, and 1st January</strong>.</p></li>
</ul></li>
<li><p><strong>Operational Cycle:</strong></p>
<ul>
<li><p>Procured at Minimum Support Price (<strong>MSP</strong>) from farmers by the <strong>Food Corporation of India (FCI)</strong> and designated State Procuring Agencies.</p></li>
<li><p>Disbursed for targeted welfare distribution through the Public Distribution System (<strong>PDS</strong>) under the NFSA, with surpluses sold via the Open Market Sale Scheme (OMSS).</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--national-centre-for-organic-and-natural-farming-"><h2 id="2026-04-ca--national-centre-for-organic-and-natural-farming-">National Centre for Organic and Natural Farming (NCONF)</h2>

</ul></section>
<section class="blk" data-sec="2026-04-ca--fao-food-price-index-ffpi"><h2 id="2026-04-ca--fao-food-price-index-ffpi">FAO Food Price Index (FFPI)</h2>

<ul>
<li><p>Measures <strong>monthly changes in international export prices</strong> of a globally traded basket of basic food commodities.</p></li>
<li><p>Calculated using a trade-weighted <strong>Laspeyres index formula</strong>, combining export prices across 24 commodities pegged to a <strong>base period of 2014–2016 = 100</strong>.</p></li>
</ul></li>
<li><p><strong>Commodity Coverage:</strong> Derived from <strong>five commodity group sub-indices</strong>:</p>
<ol type="1">
<li><p>Cereals</p></li>
<li><p>Vegetable Oils</p></li>
<li><p>Dairy</p></li>
<li><p>Meat</p></li>
<li><p>Sugar</p></li>
</ol></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--sahiwal-cattle-breed"><h2 id="2026-04-ca--sahiwal-cattle-breed">Sahiwal Cattle Breed</h2>

<li><p><strong>Lactation &amp; Milk Quality:</strong></p>
