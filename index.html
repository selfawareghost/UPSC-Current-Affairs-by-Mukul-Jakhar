<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Current Line — UPSC 2027 current affairs by Mukul Jakhar</title>
<meta name="description" content="Month-by-month current affairs notes for UPSC CSE 2027 — PIB Prism, MEA outcomes, Down To Earth and major current affairs — mapped like a metro line. By Mukul Jakhar.">
<meta name="author" content="Mukul Jakhar">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2314213D'/%3E%3Cg fill='none' stroke-width='6' stroke-linecap='round'%3E%3Cpath d='M10 20h22l12 12h10' stroke='%237B3FBF'/%3E%3Cpath d='M10 30h18l12 12h14' stroke='%231F6FD1'/%3E%3Cpath d='M10 40h14l12 12h18' stroke='%2313955A'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Mukta:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --sunk:#E4E9F1; --ink:#14213D; --ink-2:#36435F; --muted:#66718A; --rule:#D6DCE6;
  --pib:#7B3FBF; --mea:#1F6FD1; --dte:#13955A; --ca:#E23B3B; --sp:#F2B705; --sp-ink:#5A4300;
  --pib-t:#7B3FBF14; --mea-t:#1F6FD114; --dte-t:#13955A14; --ca-t:#E23B3B12; --sp-t:#F2B70524;
  --trap:#D12F2F; --frame:#1F6FD1; --concept:#7B3FBF; --news:#B7791F; --mark:#FFE36E;
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif; --body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif; --hindi:'Mukta', 'Nirmala UI', sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:9px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1322; --surface:#141E33; --sunk:#1A2640; --ink:#EAF0FA; --ink-2:#C3CCDD; --muted:#8C98B0; --rule:#26334E;
  --pib:#A57BEA; --mea:#5B9EF0; --dte:#3CC383; --ca:#FF6B6B; --sp:#F7C94B; --sp-ink:#2A2000;
  --pib-t:#A57BEA1f; --mea-t:#5B9EF01f; --dte-t:#3CC3831f; --ca-t:#FF6B6B1c; --sp-t:#F7C94B22;
  --trap:#FF6B6B; --frame:#5B9EF0; --concept:#A57BEA; --news:#F7C94B; --mark:#6A5813; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1322; --surface:#141E33; --sunk:#1A2640; --ink:#EAF0FA; --ink-2:#C3CCDD; --muted:#8C98B0; --rule:#26334E;
  --pib:#A57BEA; --mea:#5B9EF0; --dte:#3CC383; --ca:#FF6B6B; --sp:#F7C94B; --sp-ink:#2A2000;
  --pib-t:#A57BEA1f; --mea-t:#5B9EF01f; --dte-t:#3CC3831f; --ca-t:#FF6B6B1c; --sp-t:#F7C94B22;
  --trap:#FF6B6B; --frame:#5B9EF0; --concept:#A57BEA; --news:#F7C94B; --mark:#6A5813; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--mea);outline-offset:2px;border-radius:6px}
.hi{font-family:var(--hindi);font-weight:500}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
@media (max-width:640px){.wrap{padding:0 16px}}

/* line badge */
.lb{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--display);font-weight:800;font-size:13px;flex:none;line-height:1}
.lb.sp{color:var(--sp-ink)}
.lb.lg{width:34px;height:34px;font-size:16px}
.lb.off{background:transparent;color:var(--c);box-shadow:inset 0 0 0 2.5px var(--c)}

/* ---------- nav ---------- */
header.nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--rule)}
header.nav .wrap{display:flex;align-items:center;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none}
.logo b{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.navr{margin-left:auto;display:flex;gap:6px;align-items:center}
.nb{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;font-weight:700;font-size:15px;color:var(--ink-2);text-decoration:none}
.nb:hover{background:var(--sunk)}
.nb.solid{background:var(--ink);color:var(--bg)}
.nb.solid:hover{background:var(--ink-2)}
.nb kbd{font-family:var(--body);font-size:12px;opacity:.65;border:1px solid currentColor;border-radius:5px;padding:0 5px;line-height:1.4}
@media (max-width:760px){.nb .t{display:none}.nb{padding:0 11px}.nb kbd{display:none}.nb.hide-s{display:none}}
#bar{position:fixed;top:0;left:0;height:4px;width:0;z-index:60;background:var(--c,var(--mea));transition:width .1s}

/* ---------- hero ---------- */
.hero{padding:46px 0 22px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:end}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:18px;padding-top:30px}}
.word{font-family:var(--display);font-weight:800;font-size:clamp(56px,10vw,136px);line-height:.86;letter-spacing:-.055em;margin:0}
.word span{display:block}
.word .l2{position:relative;padding-left:.04em}
.word .stripes{display:inline-flex;flex-direction:column;gap:.045em;vertical-align:middle;margin-left:.12em;transform:translateY(-.06em)}
.word .stripes i{display:block;height:.075em;width:1.05em;border-radius:99px}
.intro p{margin:0 0 14px;font-size:19px;color:var(--ink-2);max-width:42ch}
.by{display:flex;align-items:center;gap:12px;margin:18px 0 18px}
.by .mj{width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.02em}
.by small{display:block;color:var(--muted);font-size:14px;line-height:1.2}
.by b{font-size:18px;font-family:var(--display)}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:9px;height:48px;padding:0 20px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--rule);color:var(--ink)}
.btn:hover{box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.btn.go{background:var(--ink);color:var(--bg);box-shadow:none}
.btn.go:hover{background:var(--ink-2)}

/* ---------- map ---------- */
.mapcard{background:var(--surface);border-radius:28px;padding:26px 26px 18px;margin-top:22px;position:relative;box-shadow:0 1px 0 var(--rule),0 24px 50px -30px #14213d55}
@media (max-width:640px){.mapcard{padding:16px 10px 12px;border-radius:22px}}
.maphead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:0 6px 6px}
.maphead h2{font-family:var(--display);font-size:26px;letter-spacing:-.02em;margin:0;font-weight:800}
.maphead p{margin:2px 0 0;color:var(--muted);font-size:15px}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px}
@media (max-width:760px){.keys{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;width:100%}.key{font-size:14px}.key small{display:none}}
.key{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ink-2);padding:4px 10px 4px 4px;border-radius:999px}
.key:hover,.key.on{background:var(--c-t,var(--sunk))}
.key small{font-weight:400;color:var(--muted)}
svg.map{display:block;width:100%;height:auto;overflow:visible;user-select:none}
.map .trk{fill:none;stroke-width:10;stroke-linecap:round}
.map .trk.dash{stroke-dasharray:1 13;opacity:.55;stroke-width:7}
.map .trk.solid{stroke-dasharray:1;stroke-dashoffset:1;animation:lay .5s ease-out forwards}
@keyframes lay{to{stroke-dashoffset:0}}
.map.dim .trk:not(.hot),.map.dim .sdot:not(.hot){opacity:.12}
.map .stn{cursor:pointer}
.map .stn .pill{fill:var(--surface);stroke:var(--ink);stroke-width:3.5}
.map .stn:hover .pill,.map .stn:focus .pill{stroke-width:5}
.map .stn.fut .pill{stroke:var(--muted);stroke-dasharray:4 4}
.map .sdot.on{stroke:none}
.map .sdot.off{fill:var(--surface);stroke:var(--rule);stroke-width:2}
.map .lab{font-family:var(--display);font-weight:800;fill:var(--ink);letter-spacing:-.01em}
.map .lab.fut{fill:var(--muted);font-weight:600}
.map .hil{font-family:var(--hindi);fill:var(--muted);font-weight:500}
.map .yr{font-family:var(--body);fill:var(--muted)}
.map .here{animation:drop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:1.4s}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.map .here-ring{fill:none;stroke:var(--ca);stroke-width:2.5;animation:ring 2s ease-out infinite;animation-delay:2s;opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
.map .term{cursor:default}
.map .br{fill:none;stroke:var(--sp);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.map .bstn{cursor:pointer}
.map .bstn circle{fill:var(--surface);stroke:var(--ink);stroke-width:3.5}
.map .bstn:hover circle{stroke-width:5}
.map .blab{font-family:var(--display);font-weight:700;fill:var(--ink)}
@media (prefers-reduced-motion: reduce){.map .trk.solid{animation:none;stroke-dashoffset:0}.map .here{animation:none}.map .here-ring{display:none}}
.mapnote{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:14px;padding:8px 6px 0}
.mapnote span{display:inline-flex;align-items:center;gap:8px}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.4;width:250px;opacity:0;transform:translateY(6px);transition:opacity .12s,transform .12s;box-shadow:0 20px 40px -18px #000a}
.tip.on{opacity:1;transform:none}
.tip h4{margin:0 0 8px;font-family:var(--display);font-size:18px;letter-spacing:-.01em}
.tip h4 .hi{font-weight:500;opacity:.7;font-size:14px;margin-left:6px}
.tip ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.tip li{display:flex;align-items:center;gap:8px}
.tip li .d{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.tip li.no{opacity:.55}
.tip li.no .d{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}

/* ---------- home blocks ---------- */
.h2{font-family:var(--display);font-weight:800;font-size:clamp(30px,4vw,44px);letter-spacing:-.035em;margin:0;line-height:1}
.blockhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:64px 0 18px;flex-wrap:wrap}
.blockhead p{margin:8px 0 0;color:var(--muted);max-width:56ch}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:22px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

/* tickets (special editions) */
.tickets{display:grid;gap:16px}
.ticket{display:grid;grid-template-columns:minmax(0,1fr) 112px;text-decoration:none;border-radius:18px;overflow:hidden;background:var(--surface);position:relative;box-shadow:0 1px 0 var(--rule);transition:transform .2s}
.ticket:hover{transform:translateY(-3px) rotate(-.4deg)}
.ticket .main{padding:20px 22px;border-left:10px solid var(--sp)}
.ticket .stub{background:var(--sp);color:var(--sp-ink);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:12px;position:relative;font-weight:700;font-size:13px;line-height:1.25}
.ticket .stub b{font-family:var(--display);font-size:34px;line-height:1;font-weight:800}
.ticket .stub::before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;border-left:3px dotted var(--surface)}
.ticket::before,.ticket::after{content:"";position:absolute;right:101px;width:22px;height:22px;border-radius:50%;background:var(--bg);z-index:2}
.ticket::before{top:-11px}.ticket::after{bottom:-11px}
.ticket h3{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0 0 4px;line-height:1.05}
.ticket p{margin:0;color:var(--muted);font-size:15px}
.ticket .from{font-size:14px;font-weight:700;color:var(--ink-2);margin-bottom:8px;display:flex;gap:8px;align-items:center}

/* departures board */
.board{background:var(--ink);color:var(--bg);border-radius:20px;padding:6px 6px 8px;overflow:hidden}
.board .bh{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;padding:12px 14px 8px;font-size:13px;opacity:.6}
.board a{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;text-decoration:none}
.board a:hover{background:#ffffff14}
:root[data-theme="dark"] .board a:hover{background:#00000022}
.board .nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .nm small{display:block;font-weight:400;opacity:.65;font-size:13px}
.board .st{font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sp);color:var(--sp-ink);white-space:nowrap}
.board .st.done{background:var(--dte);color:#fff}

/* line progress */
.lines{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.lines{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lcard{background:var(--surface);border-radius:20px;padding:18px;box-shadow:0 1px 0 var(--rule);position:relative;overflow:hidden}
.lcard::after{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--c)}
.lcard h3{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.015em;margin:10px 0 2px}
.lcard p{margin:0 0 12px;color:var(--muted);font-size:14.5px;line-height:1.45}
.stops{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:center;position:relative}
.stops::before{content:"";position:absolute;left:var(--l,4px);right:4px;top:50%;height:3px;margin-top:-1.5px;background:var(--rule);border-radius:3px}
.stops a{position:relative;width:12px;height:12px;border-radius:50%;justify-self:center;background:var(--surface);box-shadow:inset 0 0 0 2.5px var(--rule)}
.stops a.on{background:var(--c);box-shadow:none}
.stops a:hover{transform:scale(1.4)}
.lcard .nums{display:flex;justify-content:space-between;margin-top:10px;font-size:13.5px;color:var(--muted)}
.lcard .nums b{color:var(--ink)}

footer{margin-top:90px;padding:34px 0 50px;border-top:1px solid var(--rule);color:var(--muted);font-size:15px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
footer b{color:var(--ink);font-family:var(--display)}

/* ---------- station page ---------- */
.sign{margin-top:24px;background:var(--ink);color:var(--bg);border-radius:var(--r-lg);padding:22px 26px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;position:relative;overflow:hidden}
.sign .rail{position:absolute;left:0;right:0;bottom:0;height:8px;display:flex}
.sign .rail i{flex:1}
.sign .sym{width:62px;height:62px;border-radius:50%;border:6px solid var(--bg);display:grid;place-items:center}
.sign .sym b{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.04em}
.sign h1{font-family:var(--display);font-weight:800;font-size:clamp(38px,6.4vw,72px);letter-spacing:-.045em;line-height:.95;margin:0}
.sign .hi{font-size:clamp(18px,2.4vw,26px);opacity:.75;display:block;margin-top:4px}
.sign .lbs{display:flex;gap:6px}
@media (max-width:640px){.sign{grid-template-columns:minmax(0,1fr);padding:20px 18px 24px;gap:10px}.sign .sym{display:none}}
.adj{display:flex;justify-content:space-between;gap:10px;margin:12px 0 22px}
.adj a{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;color:var(--ink-2);padding:8px 14px 8px 10px;border-radius:999px}
.adj a:hover{background:var(--sunk)}
.adj a small{display:block;font-weight:400;color:var(--muted);font-size:13px;line-height:1.1}
.adj a.nx{text-align:right;padding:8px 10px 8px 14px}
.chev{width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--rule)}
.plats{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:thin}
.plat{flex:none;display:flex;align-items:center;gap:11px;text-decoration:none;padding:10px 18px 10px 10px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--rule);font-weight:700}
.plat small{display:block;font-weight:400;color:var(--muted);font-size:13px;line-height:1.15}
.plat.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--rule);color:var(--muted)}
.plat.on{box-shadow:inset 0 0 0 3px var(--c);background:var(--surface);color:var(--ink)}
.empty{margin-top:10px;border-radius:var(--r-lg);padding:60px 24px;text-align:center;background:repeating-linear-gradient(-45deg,transparent 0 14px,var(--sunk) 14px 28px);border:2px dashed var(--rule)}
.empty .lb{margin-bottom:14px}
.empty h3{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.empty p{color:var(--muted);margin:0 auto;max-width:44ch}

/* ---------- reader ---------- */
.reader{display:grid;grid-template-columns:280px minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:1000px){.reader{grid-template-columns:minmax(0,1fr)}}
.strip{position:sticky;top:80px;max-height:calc(100vh - 96px);overflow:auto;padding:4px 4px 24px 0;scrollbar-width:thin}
.prog{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding:14px;border-radius:16px;background:var(--surface);box-shadow:0 1px 0 var(--rule)}
.prog b{display:block;font-family:var(--display);font-size:17px}
.prog small{color:var(--muted);font-size:13.5px}
.route{list-style:none;margin:0;padding:0 0 0 4px;position:relative}
.route::before{content:"";position:absolute;left:13px;top:8px;bottom:8px;width:5px;border-radius:5px;background:var(--c)}
.route li{position:relative}
.route a{display:flex;gap:12px;align-items:flex-start;text-decoration:none;font-size:14.5px;line-height:1.3;padding:7px 8px 7px 0;color:var(--ink-2);border-radius:10px}
.route a .s{flex:none;width:19px;height:19px;border-radius:50%;background:var(--surface);border:4px solid var(--c);margin-top:-1px;position:relative;z-index:1;transition:transform .15s}
.route a.done .s{background:var(--c)}
.route a:hover{color:var(--ink)}
.route a.active{color:var(--ink);font-weight:700}
.route a.active .s{transform:scale(1.35);box-shadow:0 0 0 4px var(--t)}
.route .ix{display:block;margin:12px 0 6px 0;padding:3px 10px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;width:max-content;position:relative;z-index:1}
.route .gx{display:flex;align-items:center;gap:8px;cursor:pointer;font-family:var(--body)}
.route .gx small{font-weight:400;opacity:.7;font-size:12px}
.route .gx::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);margin-left:2px;transition:transform .15s}
.route .grp.gopen>.gx::after{transform:rotate(45deg) translate(-2px,-2px)}
.route .gl{list-style:none;margin:0;padding:0}
.route .grp:not(.gopen)>.gl{display:none}
.route .sub{list-style:none;padding:0 0 4px 31px;margin:0;display:none}
.route li.open .sub{display:block}
.route .sub a{font-size:13px;color:var(--muted);padding:3px 0}
@media (max-width:1000px){
  .strip{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:70;max-height:74vh;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 18px 30px;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -24px 60px #0006}
  .strip.open{transform:none}
}

<section class="blk" data-sec="2026-04-mea--india-israel-prime-ministerial-visit-feb-2026"><h2 id="2026-04-mea--india-israel-prime-ministerial-visit-feb-2026">India–Israel (Prime Ministerial Visit, Feb 2026)</h2>
<h4 id="2026-04-mea--strategic-institutional-upgrades">Strategic &amp; Institutional Upgrades</h4>
<ul>
<li><p><strong>Bilateral Status:</strong> Elevated to a <strong>Special Strategic Partnership</strong>.</p></li>
<li><p><strong>Science &amp; Technology:</strong> Joint Committee Meeting (JCM) on S&amp;T upgraded to the <strong>Ministerial level</strong>.</p></li>
<li><p><strong>Critical &amp; Emerging Technologies:</strong> New bilateral initiative established, led directly by the <strong>National Security Advisors (NSAs)</strong>.</p></li>
<li><p><strong>New Platforms:</strong> Launch of a bilateral <strong>Financial Dialogue</strong>, <strong>Tech-Gateway Initiative</strong>, <strong>Academic Cooperation Forum</strong>, and <strong>Parliamentary Friendship Group</strong>.</p></li>
</ul>
<h4 id="2026-04-mea--key-mous-operational-agreements">Key MoUs &amp; Operational Agreements</h4>
<ul>
<li><p><strong>Fintech &amp; Remittances:</strong></p>
<ul>
<li><p><strong>Parties:</strong> NPCI International Payments Limited (NIPL) and MASAV (Israel).</p></li>
<li><p><strong>Objective:</strong> Enable cross-border remittances via <strong>UPI</strong>.</p></li>
<li><p><strong>Regulatory Linkage:</strong> MoU signed between <strong>IFSCA</strong> (GIFT City regulator) and the <strong>Israel Securities Authority (ISA)</strong> for fintech/regtech sharing.</p></li>
</ul></li>
<li><p><strong>Agriculture &amp; Water Tech:</strong></p>
<ul>
<li><p><strong>India-Israel Innovation Centre for Agriculture (IINCA):</strong> Joint innovation center established at <strong>ICAR</strong> in partnership with <strong>MASHAV</strong> (Israel’s Agency for International Development Cooperation).</p></li>
<li><p><strong>Focus:</strong> Precision farming, satellite-based irrigation, integrated pest management, and germplasm exchange.</p></li>
<li><p><strong>Research Quota:</strong> 20 Joint Fellowships instituted in agricultural research.</p></li>
</ul></li>
<li><p><strong>Cybersecurity, AI &amp; Strategic Tech:</strong></p>
<ul>
<li><p><strong>Indo-Israel Cyber Centre of Excellence:</strong> Letter of Intent signed to set up the center <strong>in India</strong>.</p></li>
<li><p><strong>Artificial Intelligence:</strong> Broad cooperation covering civilian AI applications, ethical AI frameworks, and AI integration into school/teacher education.</p></li>
<li><p><strong>Horizon Scanning:</strong> Declaration of Intent on joint AI-driven strategic foresight, technology planning, and risk assessment.</p></li>
</ul></li>
<li><p><strong>Heritage &amp; Academic Tie-ups:</strong></p>
<ul>
<li><p><strong>National Maritime Heritage Complex (NMHC):</strong> Israel to collaborate on exhibitions, research, and technical expertise for the NMHC located at <strong>Lothal, Gujarat</strong>.</p></li>
<li><p><strong>Higher Education:</strong> MoU between <strong>Nalanda University</strong> and <strong>The Hebrew University of Jerusalem (HUJI)</strong> covering archaeology, Buddhist studies, mathematics, and international relations.</p></li>
<li><p><strong>Culture:</strong> Cultural Exchange Programme (CEP) operationalized for <strong>2026–2029</strong>.</p></li>
</ul></li>
<li><p><strong>Resource Exploration &amp; Blue Economy:</strong></p>
<ul>
<li><p><strong>Geophysical Exploration:</strong> Joint use of advanced geophysical and AI technologies for mineral exploration and sustainable resource mapping.</p></li>
<li><p><strong>Fisheries &amp; Aquaculture:</strong> Technology sharing in mariculture, seaweed cultivation, and disease management, including the establishment of a dedicated Centre of Excellence.</p></li>
</ul></li>
</ul>
<h4 id="2026-04-mea--labour-mobility-migration-framework">Labour Mobility &amp; Migration Framework</h4>
<ul>
<li><p><strong>Overall Cap:</strong> Quota of <strong>up to 50,000 Indian workers over the next 5 years</strong>.</p></li>
<li><p><strong>Target Sectors:</strong> Formalized via three implementation protocols:</p>
<ol type="1">
<li><p><em>Commerce &amp; Services:</em> Retail, logistics, warehousing, hospitality, cleaning, recycling.</p></li>
<li><p><em>Manufacturing:</em> Electronics, textiles, chemicals, plastics, metals, food processing.</p></li>
<li><p><em>Restaurant Sector:</em> Dining spaces, cafés, and food preparation.</p></li>
</ol></li>
</ul></section>
<section class="blk" data-sec="2026-04-mea--india-canada-prime-ministerial-visit-feb-march-2"><h2 id="2026-04-mea--india-canada-prime-ministerial-visit-feb-march-2">India–Canada (Prime Ministerial Visit, Feb–March 2026)</h2>
<h4 id="2026-04-mea--nuclear-energy-civil-cooperation">Nuclear Energy &amp; Civil Cooperation</h4>
<ul>
<li><p><strong>Commercial Uranium Deal:</strong> Long-term contract signed between the <strong>Department of Atomic Energy (DAE)</strong> and <strong>Cameco (Canada)</strong> for the supply of <strong>Uranium Ore Concentrates</strong>.</p></li>
<li><p><strong>Strategic Target:</strong> Supports India’s nuclear expansion roadmap targeting <strong>100 GW of nuclear power capacity by 2047</strong> (under the <em>Viksit Bharat</em> initiative).</p></li>
</ul>
<h4 id="2026-04-mea--trade-trilateral-multilateral-platforms">Trade, Trilateral &amp; Multilateral Platforms</h4>
<ul>
<li><p><strong>CEPA Terms of Reference:</strong> Finalized Terms of Reference (ToR) to formally launch negotiations for an India-Canada <strong>CEPA</strong>; sets a bilateral trade target of <strong>USD 50 billion by 2030</strong>.</p></li>
<li><p><strong>Trilateral Tech Grouping:</strong> <strong>ACITI Partnership</strong> (Australia-Canada-India Technology and Innovation Partnership) for emerging tech and innovation.</p></li>
<li><p><strong>Canada joins Global Initiatives:</strong></p>
<ul>
<li><p>Joined the <strong>International Solar Alliance (ISA)</strong>.</p></li>
<li><p>Joined the <strong>Global Biofuels Alliance (GBA)</strong>.</p></li>
</ul></li>
<li><p><strong>Regional Maritime Support:</strong> India officially supported Canada’s bid to join the <strong>Indian Ocean Rim Association (IORA) as a Dialogue Partner</strong>.</p></li>
</ul>
<h4 id="2026-04-mea--critical-minerals-sectoral-mous">Critical Minerals &amp; Sectoral MoUs</h4>
<ul>
<li><p><strong>Critical Minerals:</strong> MoU to develop secure and resilient supply chains across exploration, extraction, beneficiation, and processing.</p></li>
<li><p><strong>Nutrition &amp; Agro-processing:</strong></p>
<ul>
<li><p>Setting up the <strong>India-Canada Pulse Protein Centre of Excellence</strong>.</p></li>
<li><p>Hosted at <strong>NIFTEM-K (National Institute of Food Technology Entrepreneurship and Management, Kundli, Haryana)</strong>.</p></li>
</ul></li>
<li><p><strong>Research Mobility:</strong> AICTE–Mitacs (Canada) agreement for <strong>Globalink Research Internships</strong> (up to 300 fully funded 12-week research internships annually for Indian students, starting 2027).</p></li>
<li><p><strong>Defence &amp; Dialogue:</strong> Institutionalization of the <strong>India-Canada Defence Dialogue</strong> and reconstitution of the <strong>India-Canada CEO Forum</strong>.</p></li>
</ul></section>
<div class="divider" id="2026-04-mea--div-march-2026"><span>March 2026</span></div>
<section class="blk" data-sec="2026-04-mea--india-finland-state-visit-march-2026"><h2 id="2026-04-mea--india-finland-state-visit-march-2026">India–Finland (State Visit, March 2026)</h2>
<h4 id="2026-04-mea--strategic-status-trade">Strategic Status &amp; Trade</h4>
<ul>
<li><p><strong>Bilateral Status:</strong> Elevated to <strong>Strategic Partnership in Digitalization and Sustainability</strong>.</p></li>

<section class="blk" data-sec="2026-05-mea--brics-foreign-ministers-meeting-new-delhi-may-20"><h2 id="2026-05-mea--brics-foreign-ministers-meeting-new-delhi-may-20">BRICS Foreign Ministers’ Meeting (New Delhi, May 2026)</h2>

<ul>

<ul>

<ul>
<li><p>Called for implementation of the <strong>16th Review of Quotas</strong> and early realignment under the <strong>17th General Review of Quotas (GRQ)</strong>.</p></li>

<li><p>Supported the <strong>BRICS Cross-Border Payments Initiative</strong> and expansion of local currency settlements.</p></li>
<li><p>Progress on the <strong>Contingent Reserve Arrangement (CRA)</strong>, including a revised Treaty and regulatory consensus.</p></li>
<li><p><strong>New Development Bank (NDB):</strong> Celebrated its second decade; 11th NDB Annual Meeting held in Moscow (May 2026).</p></li>

</ul></section>

<section class="blk" data-sec="2026-05-mea--india-norway-prime-ministerial-visit-may-2026"><h2 id="2026-05-mea--india-norway-prime-ministerial-visit-may-2026">India–Norway (Prime Ministerial Visit, May 2026)</h2>

<section class="blk" data-sec="2026-05-mea--11th-quad-foreign-ministers-meeting-new-delhi-ma"><h2 id="2026-05-mea--11th-quad-foreign-ministers-meeting-new-delhi-ma">11th Quad Foreign Ministers’ Meeting (New Delhi, May 2026)</h2>

</ul></li>
</ul></section>

<section class="blk" data-sec="2026-07-mea--india-japan-16th-annual-summit-july-2026"><h2 id="2026-07-mea--india-japan-16th-annual-summit-july-2026">India–Japan (16th Annual Summit, July 2026)</h2>

<section class="blk" data-sec="2026-07-mea--india-indonesia-prime-ministerial-visit-july-202"><h2 id="2026-07-mea--india-indonesia-prime-ministerial-visit-july-202">India–Indonesia (Prime Ministerial Visit, July 2026)</h2>

<section class="blk" data-sec="2026-07-mea--india-australia-prime-ministerial-visit-july-202"><h2 id="2026-07-mea--india-australia-prime-ministerial-visit-july-202">India–Australia (Prime Ministerial Visit, July 2026)</h2>

<section class="blk" data-sec="2026-04-dte--climate-resilient-agriculture-food-and-nutrition"><h2 id="2026-04-dte--climate-resilient-agriculture-food-and-nutrition">Climate-resilient agriculture, food and nutrition</h2>
<ul>
<li><p><strong>Low-input farming:</strong> high-cost inputs do not guarantee higher <em>net</em> farm income. Productivity gains must be judged after cultivation costs, especially for smallholders without economies of scale.</p></li>
<li><p><strong>Water first:</strong> soil health and irrigation water are the biggest levers on yield; rainwater harvesting improves water availability.</p></li>
<li><p><strong>Risk minimisation:</strong> multi-cropping and crop diversity spread weather and market risk; livestock adds a separate income stream (like diversifying an investment portfolio).</p></li>
<li><p><strong>Crop choice should fit local ecology:</strong> in water-scarce areas, water-prudent crops such as millets suit better. Procurement, pricing and public programmes (e.g. including millets in school meals) shape what farmers grow.</p></li>
<li><p><strong>Soil biology:</strong> crop diversity supports diverse soil bacteria and fungi, which drive soil health.</p></li>
<li><p><strong>Pest resilience:</strong> climate change brings new pests; resilience means changed practices and non-chemical options, not simply more pesticide.</p></li>
<li><p><strong>Nutrition link:</strong> diverse, high-fibre, minimally processed diets support gut-microbiome diversity; ultra-processed and high-sugar foods harm it. Soil health and gut health are linked through crop and diet diversity. (Magazine p. 3)</p></li>
</ul>
<div class="callout c-frame"><span class="c-tag">Prelims lens</span><p><strong>Prelims framing:</strong> Climate-smart agriculture is not the same as high-tech or high-input farming. Judge crop, water, soil, livelihood and nutrition outcomes together.</p></div></section>
<section class="blk" data-sec="2026-04-dte--cbg-ethanol-and-bioenergy"><h2 id="2026-04-dte--cbg-ethanol-and-bioenergy">CBG, ethanol and bioenergy</h2>
<ul>
<li><p><strong>Biogas</strong> forms when organic matter decomposes <strong>without oxygen</strong> (anaerobic digestion). Feedstocks: manure, crop residues, organic municipal waste.</p></li>
<li><p><strong>Compressed Biogas (CBG)</strong> = biogas upgraded to a higher methane content and compressed for transport or use. It links waste management with energy supply.</p></li>
<li><p>The digestate (by-product) can return nutrients to soil; plant success depends on feedstock quality, waste segregation, logistics and offtake.</p></li>
<li><p><strong>SATAT</strong> = <strong>Sustainable Alternative Towards Affordable Transportation</strong> — supports CBG production and offtake.</p></li>
<li><p>Issue-reported figures (from a CSE course advert): CBG potential <strong>~62 million tonnes/year</strong>; SATAT target <strong>15 million tonnes</strong>; only <strong>~190 plants</strong> installed. Treat as issue-period figures. (Magazine p. 2)</p></li>
<li><p>⚠ <strong>CBG</strong> here = <em>Compressed</em> Biogas. In the India–Japan outcomes (July 2026) CBG meant <em>Cooperative</em> Biogas for Growth.</p></li>
</ul>
<h3 class="topic" id="2026-04-dte--e20">E20</h3>
<p><strong>E20</strong> = petrol blended with <strong>up to 20% ethanol</strong> by volume. <strong>Mandatory for oil marketing companies from 1 April 2026.</strong> Stated aims: cut crude imports and emissions.</p>
<ul>
<li><p>Vehicles made from <strong>April 2023</strong> must be E20 "material-compliant"; older vehicles have no retrofit plan.</p></li>
<li><p>Ethanol has <strong>~30–35% less energy by volume</strong> than petrol; mileage may fall <strong>2–7%</strong> in vehicles not tuned for E20.</p></li>
<li><p>Ethanol is <strong>hygroscopic</strong> (absorbs water) and a strong solvent — corrosion and wear risk in older fuel lines, seals, tanks.</p></li>
<li><p>Emissions are mixed: oxygen-rich fuel can cut carbon monoxide, hydrocarbons and soot, but may raise <strong>NOx</strong> and <strong>acetaldehyde</strong> (unregulated in India). E20 also raises <strong>Reid Vapour Pressure</strong> (volatility) → more evaporative emissions and ground-level ozone.</p></li>
<li><p>Food-versus-fuel: ethanol demand contributed to corn shortages; India now imports both industrial ethanol and corn. Sugarcane feedstock strains groundwater.</p></li>
<li><p><strong>2G ethanol</strong> from crop residues and waste avoids food competition; <strong>PM JI-VAN Yojana</strong> supports 2G bioethanol from non-food biomass.</p></li>
<li><p>Comparisons: the US limits blending to 10–15% and uses surplus ethanol industrially; EU/UK exclude food-crop fuels from sustainable aviation fuel (only 2G allowed).</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-dte--menstrual-hygiene-and-solid-waste"><h2 id="2026-04-dte--menstrual-hygiene-and-solid-waste">Menstrual hygiene and solid waste</h2>
<ul>
<li><p>Used pads and diapers are <strong>sanitary waste</strong>. Mixing with other waste, burial, flushing or open dumping creates environmental and occupational health risks.</p></li>
<li><p>Manual sorting exposes sanitation ("green") workers to infection, odour and indignity. Incineration is costly at city scale.</p></li>
<li><p>Reusable cloth pads and menstrual cups cut disposable waste; adoption depends on information, access, cleaning facilities, product design and social acceptance (older women were slower to adopt cups).</p></li>
<li><p>A Dehradun-based non-profit, <strong>Waste Warriors Society</strong>, ran workshops and sample distribution through panchayats, women's groups, anganwadis and schools — first in <strong>Kangra (Bir, Dharamshala)</strong>, Himachal, then Uttarkashi and Dehradun, Uttarakhand.</p></li>
<li><p>Issue-reported local figures: Harrawala ward (Dehradun) produced 1,348 tonnes of solid waste (Apr 2024–Dec 2025), ~60 tonnes of it sanitary waste (&gt;4%). In six Sahastradhara panchayats, 258 of 295 women used reusable cloth pads. Treat as a local case study, not national estimates.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-dte--biodiversity-wildlife-and-ecological-change"><h2 id="2026-04-dte--biodiversity-wildlife-and-ecological-change">Biodiversity, wildlife and ecological change</h2>
<h3 class="topic" id="2026-04-dte--fireflies-and-biodiversity-baselines">Fireflies and biodiversity baselines</h3>
<ul>
<li><p>A species checklist sets a baseline for distribution, endemism and future monitoring, and shows knowledge gaps.</p></li>
<li><p>The issue reports India's <strong>first comprehensive firefly checklist: 92 species, more than 60% endemic</strong>, compiling records from <strong>1881 to October 2025</strong>; published in the journal <em><strong>Zootaxa</strong></em> (10 March 2026). (Magazine p. 9)</p></li>
</ul>
<h3 class="topic" id="2026-04-dte--human-wildlife-conflict">Human–wildlife conflict</h3>
<ul>
<li><p><strong>Landscape of fear:</strong> prey animals change behaviour, habitat use and feeding in response to perceived predation risk.</p></li>
<li><p>A proposed mechanism is not proof of causation. A reader's letter challenges the claim (made at the Anil Agarwal Dialogue 2026) that hunting bans reduced animals' fear of humans and drove crop raids.</p></li>
<li><p>Other drivers: forest degradation, farming expansion into wildlife corridors, settlement growth and population rise in adaptable species (wild boar, nilgai, monkeys).</p></li>
<li><p>Coexistence depends on institutions, livelihoods, norms and mitigation — scarecrows, community mitigation, designated feeding areas.</p></li>
<li><p><strong>Bishnoi</strong> community: no hunting for 500+ years, yet not a conflict hotspot; main crop-raiders are <strong>blackbuck and nilgai</strong>. India's wildlife law dates to <strong>1972</strong>.</p></li>
</ul>
<h3 class="topic" id="2026-04-dte--climate-effects-on-ecological-timing">Climate effects on ecological timing</h3>
<ul>
<li><p><strong>Phenology</strong> = timing of recurring biological events (flowering, breeding, migration, insect emergence).</p></li>
<li><p>Early flowering can precede pollinator activity → <strong>timing mismatch</strong>. In Kashmir, flowering of <em>Iris reticulata</em>, <em>Narcissus</em>, <em>Sternbergia</em> came <strong>20–25 days early</strong>; flame-of-the-forest and red silk-cotton bloomed in March instead of April.</p></li>
<li><p>Raptor nesting (Bonelli's eagle, short-toed snake eagle) was delayed to late January; early fires destroyed nests of ground-nesting birds.</p></li>
<li><p><strong>Amphibians</strong> are heat- and drought-sensitive (permeable skin); <em>Indirana</em> frogs sheltered in caves in Sindhudurg and Chorla Ghats.</p></li>
<li><p>Pest responses are species-specific: onion maggot moved from Kargil to Leh/Changthang; extreme heat killed mustard aphids in Rajasthan — and the predators that feed on them.</p></li>
</ul>
<h3 class="topic" id="2026-04-dte--other-biodiversity-items">Other biodiversity items</h3>
<ul>
<li><p><strong>Rajasthan camels:</strong> 7.5 lakh (2004) → 3.2 lakh (2015) → <strong>1.5 lakh (2021)</strong>, despite the <strong>Rajasthan Camel (Prohibition of Slaughter and Regulation of Temporary Migration or Export) Act, 2015</strong>. Concern: sale restrictions remove the incentive to rear camels. Rajasthan High Court took suo motu note (10 March). A livestock-policy case study, not proof that protection laws generally reduce populations.</p></li>
<li><p><strong>Heat dome</strong> = a persistent high-pressure system that traps hot air. Record March heat in the US south-west (California, Nevada, Arizona); World Weather Attribution called it "virtually impossible" without climate change.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-dte--urban-commons-and-participatory-planning"><h2 id="2026-04-dte--urban-commons-and-participatory-planning">Urban commons and participatory planning</h2>
<ul>
<li><p><strong>Urban commons</strong> = shared spaces and resources with ecological, livelihood or cultural functions: ponds, drainage channels, fields, festival grounds, school grounds, markets, places used by traditional occupations.</p></li>
<li><p>Conventional land-use maps use broad categories (residential, commercial, agricultural, industrial) and miss seasonal, cultural and livelihood uses.</p></li>
<li><p>Participatory planning combines local knowledge with GIS mapping, terrain modelling and ground verification.</p></li>
</ul>
<h3 class="topic" id="2026-04-dte--case-study-chittur-thathamangalam-kerala">Case study: Chittur-Thathamangalam, Kerala</h3>
<ul>
<li><p>A town and municipality in <strong>Palakkad district</strong> (~32,000 residents). Residents objected to the state's <strong>Draft Master Plan 2031</strong> (Oct 2021), whose road widening, bypasses and terminal market would have hit homes, farms, water networks and commons.</p></li>
<li><p>The municipality formed a <strong>Master Plan Expert Committee</strong>; over 33 months residents, experts and institutions (IIT Bombay, NIT Calicut) prepared the <strong>Chittur-Thathamangalam Master Plan 2042</strong> ("CTM People's Plan"), published by the state in <strong>July 2024</strong> — described as <strong>India's first municipality-led participatory master plan</strong>.</p></li>
<li><p>About half the area is cultivated (paddy, banana, coconut, arecanut). A network of <strong>171 human-made kulams</strong> (ponds/tanks) links with irrigation channels and the <strong>Sokanisini river</strong> — a ~1,500-year-old water system.</p></li>
<li><p>The plan maps all waterbodies and drainage, creates an <strong>ecological protection zone</strong> and a <strong>flood/riverine buffer (no-development)</strong>, and identifies 18 critical drains for restoration.</p></li>
<li><p>It protects heritage assets (<em>aalmarams</em> — large banyans; <em>chumadthangis</em> — load-relieving stones on old trade routes), favours walking and road safety over road widening, and proposes <strong>nature-based sanitation (constructed wetlands)</strong>.</p></li>
<li><p>Festival grounds, school playing fields and weavers' yarn-stretching grounds are recognised as commons, not "unused land".</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-dte--warm-winters-climate-risk-and-monsoon-links"><h2 id="2026-04-dte--warm-winters-climate-risk-and-monsoon-links">Warm winters, climate risk and monsoon links</h2>
<h4 id="2026-04-dte--concepts">Concepts</h4>
<ul>
<li><p><strong>Western disturbances (WDs):</strong> eastward-moving extratropical systems bringing winter rain/snow to north-west India and the western Himalaya. Weak or few WDs → clear skies, less winter precipitation, faster warming.</p></li>
<li><p><strong>Anti-cyclonic circulation</strong> over western India trapped heat in March 2026.</p></li>
<li><p><strong>Snowpack and meltwater:</strong> winter snow stores water and releases it in spring. Less snow or earlier melt shifts water away from the spring irrigation window.</p></li>
<li><p><strong>Snow drought:</strong> a deficit in snow accumulation — total precipitation alone may not reflect water availability.</p></li>
<li><p><strong>Phenological mismatch:</strong> climate shifts put interacting species (flowers and pollinators) out of sync.</p></li>
<li><p><strong>Shift to two seasons?</strong> Warmer winters and vanishing springs suggest <em>compression</em> of seasons, not yet a full two-season pattern; the monsoon stays distinct because of <strong>ITCZ</strong> dynamics.</p></li>
</ul>

<h4 id="2026-04-dte--effects-of-a-warmer-drier-winter">Effects of a warmer, drier winter</h4>
<div class="table-wrap"><table>

<thead>
<tr class="header">
<th><strong>System</strong></th>
<th><strong>Mechanism / concern in the issue</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Water</td>
<td>Less snow and earlier melt cut spring flows; groundwater recharge and wetland hydrology affected</td>
</tr>
<tr class="even">
<td>Agriculture</td>
<td>Erratic rain delays sowing; heat at grain filling cuts wheat yields; frost after early flowering hits fruit</td>
</tr>
<tr class="odd">
<td>Horticulture</td>
<td>Temperate fruits need winter <strong>chilling: 0–7°C, 500–1,500 hours</strong> for many varieties; too little chill disrupts bud-break and flowering</td>
</tr>
<tr class="even">
<td>Pests</td>
<td>Milder winters let some pests survive, emerge earlier, breed faster or spread</td>
</tr>
<tr class="odd">
<td>Forest fires</td>
<td>Warmth and dry fuel raise fire risk and lengthen the season; fires destroy nests</td>
</tr>
<tr class="even">
<td>Species</td>
<td>Flowering, breeding, migration and amphibian behaviour shift unevenly</td>
</tr>
</tbody>
</table></div>
<h3 class="topic" id="2026-04-dte--issue-period-examples-winter-2025-26">Issue-period examples: winter 2025–26</h3>
<ul>
<li><p><strong>February 2026 recorded zero cold days/cold waves</strong> — first time in five years; the whole winter had 24 such events across 15 states/UTs. Post-monsoon 2025 had <strong>49</strong> (highest in four years).</p></li>
<li><p>All-India Jan–Feb rainfall ~<strong>60% below</strong> normal. J&amp;K: Dec–Feb deficit <strong>66%</strong>, February <strong>89%</strong>; Srinagar got 5.3 mm in February; seventh consecutive dry winter. The <strong>Jhelum ran below the zero-gauge level</strong> in early March.</p></li>
<li><p>Leh winter mean <strong>−2.3°C</strong> vs eight-year mean −4.3°C (warmest in 8 years; Kargil warmest in 14). Leh snow ~72% below average while <strong>Kargil got ~248%</strong> — local variation matters.</p></li>
<li><p>Himachal's <strong>earliest heatwave in five years on 6 March</strong>. India: <strong>2025 = 8th warmest year since 1901</strong>.</p></li>
<li><p>23 of 34 cities had above-normal maximum temperatures on at least half the days of 1 Jan–17 Mar 2026.</p></li>
<li><p>Forest-fire detections, Jan–Feb 2026: <strong>28,727 vs 15,427 in 2014 (+80%)</strong> (NASA FIRMS). Most intense in the North-East; IAF water-drops in Arunachal's <strong>Lohit valley/Anjaw</strong>.</p></li>
</ul>
<h3 class="topic" id="2026-04-dte--enso-and-el-ni-o">ENSO and El Niño</h3>
<ul>
<li><p><strong>ENSO</strong> = coupled ocean–atmosphere pattern in the tropical Pacific: El Niño (warm), La Niña (cool), neutral.</p></li>
<li><p>El Niño = abnormal warming of the central/eastern equatorial Pacific <strong>plus</strong> atmospheric circulation changes; ocean warming alone is not the whole event.</p></li>
<li><p>Issue forecast: NOAA's Climate Prediction Center gave <strong>&gt;80% chance of El Niño in 2026</strong> (~1 in 3 chance of a strong event); the signal is heat stored <strong>below the surface</strong> of the equatorial Pacific.</p></li>
<li><p>A strong El Niño is often linked to a <strong>weaker south-west monsoon</strong>, a warmer season, more <strong>monsoon breaks</strong> and sometimes delayed onset over Kerala — probabilistic, not certain for every year or region.</p></li>
<li><p>Global warming raises background sea-surface temperatures and can blur the natural ENSO signal.</p></li>
<li><p>The forecast is time-sensitive, not a current forecast.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-dte--west-asia-energy-security-and-oil-shocks"><h2 id="2026-04-dte--west-asia-energy-security-and-oil-shocks">West Asia, energy security and oil shocks</h2>
<h3 class="topic" id="2026-04-dte--strait-of-hormuz">Strait of Hormuz</h3>
<ul>
<li><p>Narrow passage between <strong>Iran and Oman</strong> linking the <strong>Persian Gulf</strong> with the <strong>Gulf of Oman</strong> and Arabian Sea; the issue gives ~<strong>33 km</strong> width and ~100 ships a day before the war.</p></li>
<li><p><strong>28 Feb 2026:</strong> US and Israeli strikes on Iran; Iran largely closed the strait. Traffic fell ~97% within days; ~3,000 ships stranded, including 22 Indian-flagged ships; India's Navy escorted LPG tankers in mid-March.</p></li>
<li><p>UNCTAD share of world seaborne trade through Hormuz in the week before the war: <strong>crude ~35–38%, LPG 29%, LNG 19%, refined products 19%, chemicals incl. fertilisers 13%</strong>.</p></li>
<li><p><strong>18 Mar:</strong> Israel struck <strong>South Pars</strong> (Iran — world's largest gas field); Iran hit <strong>Ras Laffan</strong> (Qatar — world's largest LNG export plant), removing ~<strong>one-third of world helium supply</strong> (helium is needed for MRI, semiconductors, space missions).</p></li>
<li><p>Brent rose from ~$80 (2 Mar) to ~$120 (9 Mar). <strong>IEA released 400 million barrels</strong> (11 Mar) — largest coordinated drawdown on record, over twice the 2022 release; the US supplied 172 million.</p></li>
<li><p>Rapidan Energy Group: disruption more than <strong>double the Suez Crisis (1956–57)</strong> record; spare capacity (Saudi Arabia, UAE) was itself cut off.</p></li>
<li><p>A <strong>chokepoint</strong> is a narrow route whose disruption cuts a large share of trade and raises freight, insurance and commodity prices. China, India, Japan and South Korea take ~75% of Hormuz oil and ~60% of its LNG.</p></li>
</ul>
<h3 class="topic" id="2026-04-dte--india-s-exposure-and-energy-resilience">India's exposure and energy resilience</h3>
<ul>
<li><p>Issue-period estimates: India imports <strong>88–90% of crude</strong>, about half via Hormuz (from Iraq, Saudi Arabia, UAE, Kuwait); ~<strong>60% of LPG</strong> is imported, ~90% of it via Hormuz; ~<strong>68% of LNG</strong> comes from the Gulf (mainly Qatar).</p></li>
<li><p>Government invoked the <strong>Essential Commodities Act, 1955</strong> with <strong>four-tier rationing</strong>: households and CNG vehicles full supply; industrial/commercial users 50%; <strong>fertiliser (and petrochemical) plants 70%</strong> of gas. Refineries told to maximise LPG (+38%); new reforms to expand <strong>piped natural gas (PNG)</strong>.</p></li>
<li><p>LPG use doubled from <strong>15 MT (2011–12) to 31 MT (2024–25)</strong>, with &gt;93% of the rise met by imports (IISD) — <strong>PM Ujjwala Yojana</strong> improved indoor air but deepened import dependence.</p></li>
<li><p>Strategic reserves buffer short shocks but cannot cover a prolonged one. Subsidies cushion households but carry fiscal costs; targeted transfers protect the vulnerable.</p></li>
<li><p><strong>Energy security</strong> = availability, affordability, reliability, resilience and low emissions together.</p></li>
<li><p>Renewables reduce exposure to fossil-fuel shocks but need grids, storage, viable discoms and domestic manufacturing. Renewable intermittency is a technical challenge; fossil-fuel disruption is geopolitical and sudden.</p></li>
<li><p>IRENA (issue-cited): solar PV ~<strong>41%</strong> and onshore wind ~<strong>53%</strong> cheaper than the cheapest fossil option. But high fuel prices raise interest rates, which hurts capital-heavy renewables — the crisis strengthens the case for renewables while weakening financing conditions.</p></li>
<li><p>Examples: <strong>Ethiopia</strong> banned import of internal-combustion vehicles (2023); <strong>Nepal</strong> generated all its electricity from renewables (2023).</p></li>
</ul>

<section class="blk" data-sec="2026-04-dte--fertiliser-security-soils-and-food-security"><h2 id="2026-04-dte--fertiliser-security-soils-and-food-security">Fertiliser security, soils and food security</h2>
<ul>
<li><p>Fertilisers supply plant nutrients, mainly <strong>nitrogen (N), phosphorus (P) and potassium (K)</strong>.</p></li>
<li><p>Dependence is not only on finished fertilisers — <strong>natural gas, rock phosphate and phosphoric acid</strong> are upstream inputs.</p></li>
<li><p>India is the <strong>world's second-largest fertiliser importer</strong> by volume and value (FAO).</p></li>
<li><p>Issue-reported 2024–25 figures: production <strong>46.5 MT</strong>; demand <strong>64.9 MT</strong>; imports ~<strong>16 MT</strong>. Urea is the largest share of demand, then NPK, DAP, potash.</p></li>
<li><p>Effective dependence on global supply chains: <strong>68–70%</strong> after counting feedstocks (ICRIER, March 2026). ~<strong>85%</strong> of gas for urea is imported; <strong>90–95%</strong> of rock phosphate; about half of phosphoric acid.</p></li>
<li><p>~<strong>70% of urea imports</strong> from Oman, Saudi Arabia, Qatar and the UAE; <strong>Saudi Arabia &gt;40% of DAP</strong> imports. India is fully import-dependent for <strong>potash</strong> (no commercially viable reserves). About 30–40% of India's nitrogen supply passes through Hormuz (IFFCO).</p></li>
<li><p>Of ~16 MT of fertiliser shipped from the Persian Gulf in 2024, urea was ~67%, DAP ~20%.</p></li>
<li><p>Response (issue period): Essential Commodities Act invoked on <strong>10 March</strong> to cap gas to fertiliser plants at 70%; urea, DAP and NPK stocks were higher than a year earlier. Disruption can raise prices and subsidy costs, cut output and affect kharif planning.</p></li>
</ul>
<h3 class="topic" id="2026-04-dte--subsidy-and-reform-facts">Subsidy and reform facts</h3>
<ul>
<li><p>Fertiliser subsidy 2024–25: <strong>₹1,77,157 crore</strong>, ~70% on urea. Government bears 85–90% of urea's cost.</p></li>
<li><p><strong>Urea retail price fixed at ₹242 per 45 kg bag since 2018.</strong> The <strong>Economic Survey 2025–26</strong> suggests raising it while compensating farmers through per-acre direct transfers.</p></li>
<li><p>Chemical fertiliser subsidy ~₹1.68 lakh crore vs only ~₹150 crore for organic fertiliser promotion (opinion piece).</p></li>
<li><p>Phosphate use is skewed towards <strong>DAP</strong>; some suggest <strong>single super phosphate</strong> and <strong>ammonium sulphate</strong> as alternatives.</p></li>
<li><p><strong>Morocco holds ~70% of global rock-phosphate reserves</strong> — a suggested upstream investment location. Existing overseas JV: <strong>OMIFC (Oman India Fertiliser Company)</strong>.</p></li>
</ul>
<h3 class="topic" id="2026-04-dte--reform-options-discussed">Reform options discussed</h3>
<ul>
<li><p>Diversify import sources and products (South-East Asia, Australia, Africa, Central Asia, Latin America); long-term offtake deals and overseas mineral investments.</p></li>
<li><p>Improve nutrient-use efficiency: soil testing, balanced application, crop-specific advice.</p></li>
<li><p>Heavy urea subsidy encourages imbalanced use; nutrient runoff harms soil and water.</p></li>
<li><p>Recycle nutrients through compost from dung, food and green waste, crop residue; segregated wet waste and working compost plants are prerequisites. Dung ~1.6 billion tonnes a year (~570 MT recoverable); city compost output ~0.2 MT against a potential 5.4 MT.</p></li>
<li><p>Pulses, green manures and nitrogen-fixing crops reduce pressure on synthetic nitrogen.</p></li>
<li><p><strong>Nitrogen-fixing microbes</strong> convert atmospheric N into plant-usable forms — not a complete substitute in every crop and soil.</p></li>
<li><p><strong>Green ammonia</strong> (from renewable hydrogen; National Green Hydrogen Mission, 2023) could decarbonise fertiliser; cost and scale remain constraints.</p></li>
</ul>
