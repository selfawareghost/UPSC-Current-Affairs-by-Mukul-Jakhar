<li><p><strong>Zero-Coupon Zero-Principal (ZCZP):</strong> Non-commercial securities issued by registered Not-for-Profit Organisations (NPOs) on the SSE; pay <strong>no interest</strong> and return <strong>no principal</strong> (treated purely as philanthropic donations).</p></li>
<li><p>NPOs can stay registered on the SSE platform for up to <strong>3 years</strong> without being compelled to execute active fundraising.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--special-additional-excise-duty-saed"><h2 id="2026-04-ca--special-additional-excise-duty-saed">Special Additional Excise Duty (SAED)</h2>
<ul>
<li><p><strong>Why in News:</strong> Union Government reduced the Special Additional Excise Duty (SAED) levied on petrol and diesel.</p></li>
<li><p><strong>Tax Character &amp; Statutory Authority:</strong></p>
<ul>
<li><p>Central <strong>indirect tax</strong> imposed primarily on upstream domestic crude oil output and refined petroleum fuel exports.</p></li>
<li><p>Levied under <strong>Section 147 of the Finance Act, 2002</strong>, read with the Fourth Schedule of the <strong>Central Excise Act, 1944</strong>.</p></li>
</ul></li>
<li><p><strong>Economic Function:</strong></p>
<ul>
<li><p>Functions as a flexible <strong>windfall tax</strong> to mop up extraordinary supernormal profits earned by oil refiners and producers during spikes in global crude prices.</p></li>
<li><p>Rates undergo <strong>fortnightly revisions</strong> pegged to international crude market benchmarks.</p></li>
<li><p>Non-divisible central levy: collections are <strong>not shared with States</strong> under the divisible tax pool (Finance Commission formula).</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--unified-payments-interface-upi-at-10-years-npci"><h2 id="2026-04-ca--unified-payments-interface-upi-at-10-years-npci">Unified Payments Interface (UPI at 10 Years) &amp; NPCI</h2>
<ul>
<li><p><strong>Why in News:</strong> UPI completed 10 years of operations since its public rollout in <strong>2016</strong>.</p></li>
<li><p><strong>Global Footprint:</strong> Live across <strong>more than 8 countries</strong>, including the UAE, Singapore, Bhutan, Nepal, Sri Lanka, France, Mauritius, and Qatar.</p></li>
<li><p><strong>NPCI (National Payments Corporation of India):</strong></p>
<ul>
<li><p>Established in <strong>2008</strong> as a not-for-profit company (under Section 25/Section 8) by the <strong>RBI</strong> and the <strong>Indian Banks' Association (IBA)</strong>.</p></li>
<li><p>Regulatory oversight governed by the <strong>Payment and Settlement Systems Act, 2007</strong>.</p></li>
<li><p>Product ecosystem: UPI, RuPay, IMPS, AePS, NETC FASTag, and NACH.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--export-realisation-timelines"><h2 id="2026-04-ca--export-realisation-timelines">Export Realisation Timelines</h2>
<ul>
<li><p><strong>Why in News:</strong> RBI extended the timeline for realising and repatriating export proceeds from 9 to 15 months (up to 18 months for INR-invoiced transactions) due to supply-chain logjams and West Asian shipping reroutings.</p></li>
<li><p><strong>Statutory Framework:</strong></p>
<ul>
<li><p>Mandated under the <strong>Foreign Exchange Management Act (FEMA), 1999</strong>; non-compliance is treated as a <strong>civil contravention</strong> under Section 13 (not a criminal offense).</p></li>
<li><p>Monitored end-to-end via the RBI's <strong>Export Data Processing and Monitoring System (EDPMS)</strong> to maintain foreign exchange liquidity and reserve stability.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--nbfc-classification-scale-based-regulation-sbr-n"><h2 id="2026-04-ca--nbfc-classification-scale-based-regulation-sbr-n">NBFC Classification: Scale-Based Regulation (SBR) &amp; NBFC-UL</h2>
<ul>
<li><p><strong>Why in News:</strong> RBI proposed replacing the multi-factor parametric scoring model with a single, absolute balance sheet size threshold to identify <strong>NBFC-Upper Layer (NBFC-UL)</strong> entities.</p></li>
<li><p><strong>Key Reforms Proposed:</strong></p>
<ul>
<li><p><strong>Size Threshold:</strong> NBFCs with total asset books of <strong>₹1 lakh crore or more</strong> automatically qualify for NBFC-UL status.</p></li>
<li><p><strong>Government NBFC Inclusion:</strong> Large <strong>government-owned non-bank lenders</strong> (e.g., PFC, REC, IREDA) will be brought directly under the NBFC-UL umbrella if they breach the asset cutoff.</p></li>
<li><p><strong>Periodic Recalibration:</strong> RBI will review the asset ceiling every <strong>five years</strong> to adjust for GDP growth and inflation.</p></li>
<li><p><strong>Risk Transfer:</strong> Permits Upper-Layer NBFCs to use State Government guarantees as credit risk mitigation instruments without numerical caps.</p></li>
</ul></li>
<li><p><strong>Static Comparison: NBFCs vs. Commercial Banks:</strong></p>
<ul>
<li><p>Registered under the <strong>Companies Act</strong>; financial operations regulated by the RBI under the <strong>RBI Act, 1934</strong> (Chapter III-B).</p></li>
<li><p><strong>Cannot accept demand deposits</strong> (only eligible deposit-taking NBFCs can accept term deposits).</p></li>
<li><p><strong>Cannot issue cheques</strong> drawn on themselves; do not form part of the core payment and settlement mechanism.</p></li>
<li><p><strong>No DICGC Cover:</strong> Depositors in NBFCs are <strong>not insured</strong> by the Deposit Insurance and Credit Guarantee Corporation (DICGC).</p></li>
<li><p>Up to <strong>100% FDI</strong> is permitted under the automatic route for most non-bank financial activities.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--inflation-targeting-in-india"><h2 id="2026-04-ca--inflation-targeting-in-india">Inflation Targeting in India</h2>
<ul>
<li><p><strong>Why in News:</strong> Government extended the inflation targeting framework for another five years (<strong>2026–2031</strong>) in consultation with the Reserve Bank of India.</p></li>
<li><p><strong>Core Framework:</strong></p>
<ul>
<li><p>India follows <strong>Flexible Inflation Targeting (FIT)</strong> to balance price stability with economic growth.</p></li>
<li><p><strong>Target Benchmark:</strong> Retail inflation (<strong>Consumer Price Index - Combined / CPI</strong>) pegged at a central target of <strong>4%</strong>.</p></li>
<li><p><strong>Tolerance Band:</strong> Fluctuation band of 2%–6% (± 2%).</p></li>
</ul></li>
<li><p><strong>Evolutionary Context:</strong></p>
<ul>
<li><p><em>1960s–mid-1980s:</em> Credit planning operating through Statutory Liquidity Ratio (SLR) and Cash Reserve Ratio (CRR).</p></li>
<li><p><em>Mid-1980s–1990s:</em> Monetary targeting with broad money supply targets (M<sub>3</sub>) and inflation tolerance of 5%–7%.</p></li>
<li><p><em>Post-2014:</em> Recommended by the <strong>Urjit Patel Committee Report (2014)</strong>; statutory backing granted via the <strong>RBI Act Amendment (2016)</strong>, establishing the 6-member <strong>Monetary Policy Committee (MPC)</strong>.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--kerosene-in-public-distribution-system-pds"><h2 id="2026-04-ca--kerosene-in-public-distribution-system-pds">Kerosene in Public Distribution System (PDS)</h2>
<ul>
<li><p><strong>Why in News:</strong> Government reintroduced kerosene in the Public Distribution System (PDS) for 60 days as an emergency fuel to alleviate localized LPG shortages.</p></li>
<li><p><strong>Chemical Profile:</strong> Flammable, liquid hydrocarbon fuel obtained as a <strong>middle distillate</strong> during petroleum refining, containing hydrocarbons in the C<sub>10</sub>–C<sub>16</sub> <strong>chain length range</strong>.</p></li>
<li><p><strong>Consumption Trends:</strong> Household dependence dropped from ~43% in 2011 to &lt;1% presently, driven by rural grid electrification and LPG expansion under <strong>PM Ujjwala Yojana</strong>.</p></li>
<li><p><strong>Uses:</strong> Household cooking and lighting, heating, and as an aviation fuel variant (Aviation Turbine Fuel / ATF).</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--mylic-super-sales-saathi"><h2 id="2026-04-ca--mylic-super-sales-saathi">‘MyLIC’ &amp; ‘Super Sales Saathi’</h2>
<ul>
<li><p><strong>Why in News:</strong> Ministry of Finance launched the <em>MyLIC</em> customer portal and <em>Super Sales Saathi</em> mobile platform for Life Insurance Corporation of India (LIC).</p></li>
<li><p><strong>Platform Mandates:</strong></p>
<ul>
<li><p><strong>MyLIC:</strong> Policyholder-facing digital app for portfolio management, premium remittances, policy revival, paperless policy loans, and digital e-KYC compliance.</p></li>
<li><p><strong>Super Sales Saathi:</strong> Intermediary-facing platform equipping sales agents with automated reminders, policy tracking dashboards, and AI-driven client nudges.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--corporate-average-fuel-efficiency-caf-iii-norms"><h2 id="2026-04-ca--corporate-average-fuel-efficiency-caf-iii-norms">Corporate Average Fuel Efficiency (CAFÉ-III) Norms</h2>
<ul>
<li><p><strong>Why in News:</strong> Union Government and automobile industry reached broad consensus on draft CAFÉ-III norms.</p></li>
<li><p><strong>Core Mandates &amp; Timeline:</strong></p>
<ul>
<li><p>Enforces <strong>fleet-wide fuel efficiency targets and</strong> CO<sub>2</sub> <strong>emissions reduction</strong> effective from <strong>April 1, 2027</strong>.</p></li>
<li><p>Grants auto manufacturers a <strong>5-year compliance window</strong> to overhaul engine line-ups.</p></li>
</ul></li>
<li><p><strong>Incentive Architecture:</strong></p>
<ul>
<li><p>Introduces market-based <strong>credit trading</strong> (efficient manufacturers sell surplus credits to non-compliant firms).</p></li>
<li><p>Allocates <strong>super credits</strong> for producing pure Electric Vehicles (EVs).</p></li>
<li><p>Retains <strong>weight-based concessions</strong> for small/entry-level passenger cars to preserve economic affordability.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--periodic-labour-force-survey-plfs-2025"><h2 id="2026-04-ca--periodic-labour-force-survey-plfs-2025">Periodic Labour Force Survey (PLFS) 2025</h2>
<ul>
<li><p><strong>Why in News:</strong> National Statistical Office (NSO) released PLFS 2025, marking the first calendar-year based survey (Jan–Dec) under a revamped sampling methodology.</p></li>
<li><p><strong>Core Labour Indicators:</strong></p>
<ul>
<li><p><strong>LFPR (Labour Force Participation Rate):</strong> Stable at <strong>59.3%</strong>, with a persistent gender divide.</p></li>
<li><p><strong>WPR (Worker Population Ratio):</strong> Stood at <strong>57.4%</strong>.</p></li>
<li><p><strong>Unemployment Rate (UR):</strong> Low at <strong>3.1%</strong> overall; youth unemployment (15–29 years) declined to <strong>9.9%</strong>.</p></li>
<li><p><strong>Structural Shifts:</strong> Share of agriculture in employment declined; manufacturing and service sector jobs expanded.</p></li>
<li><p><strong>Skill Gap:</strong> Only <strong>4.2%</strong> of the surveyed workforce reported having received formal vocational training.</p></li>
</ul></li>
<li><p><strong>Gender Nuances:</strong></p>
<ul>
<li><p><strong>Pay Disparity:</strong> Women earned only <strong>76% of men's wages</strong> in regular salaried jobs and <strong>36% of men's income</strong> in self-employment.</p></li>
<li><p><strong>Casual Wages:</strong> Female casual wages rose to <strong>69% of male casual wages</strong> in 2025 (up from 66% in 2024).</p></li>
<li><p><strong>Formalisation:</strong> Share of women in salaried jobs rose from 16.6% (2024) to <strong>18.2% in 2025</strong>.</p></li>
<li><p><strong>Workforce Representation:</strong> Women accounted for <strong>32.5% of total national employment</strong>.</p></li>
<li><p><strong>Caregiving Burden:</strong> 40% to 44% of working-age women outside the labour force cited unpaid caregiving as the primary reason, compared to &lt;1% among men.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--energy-statistics-india-2026"><h2 id="2026-04-ca--energy-statistics-india-2026">Energy Statistics India 2026</h2>
<ul>
<li><p><strong>Why in News:</strong> National Statistical Office (NSO) released the <strong>33rd edition</strong> of the <em>Energy Statistics India 2026</em> report.</p></li>
<li><p><strong>Key Energy Indicators:</strong></p>
<ul>
<li><p><strong>Total Primary Energy Supply:</strong> Stood at ~9.32 lakh Kilo Tonnes of Oil Equivalent (ktoe) in 2024–25; per capita electricity consumption rose to <strong>18,096 megajoules/person</strong>.</p></li>
<li><p><strong>Fossil Base:</strong> <strong>Coal remains the dominant primary energy source</strong> in India's overall mix.</p></li>
<li><p><strong>Renewable Energy Status:</strong> Installed RE capacity reached ~2.29 lakh MW (2025); estimated national RE potential stands at <strong>47 lakh MW</strong> (with solar contributing ~71%).</p></li>
<li><p><strong>Regional RE Concentration:</strong> Over <strong>70% of total RE potential</strong> is concentrated across 5 states: Rajasthan, Maharashtra, Gujarat, Andhra Pradesh, Karnataka, and Madhya Pradesh.</p></li>
<li><p><strong>Grid Efficiency:</strong> Aggregate transmission &amp; distribution (T&amp;D) losses dropped from 22% down to 17%.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--india-s-first-private-gold-mining-project"><h2 id="2026-04-ca--india-s-first-private-gold-mining-project">India’s First Private Gold Mining Project</h2>
<ul>
<li><p><strong>Why in News:</strong> India’s first large-scale private gold mine is set to commence operations in <strong>Andhra Pradesh</strong>.</p></li>
<li><p><strong>Location &amp; Developer:</strong> Located across 598 hectares in <strong>Kurnool district</strong> (Jonnagiri, Erragudi, and Pagidirayi villages); developed by <strong>Geomysore Services India Pvt Ltd</strong>, backed by Thriveni Earthmovers and Deccan Gold.</p></li>
<li><p><strong>Output Expectations:</strong> Projected to produce ~1,000 kg (1 tonne) of refined gold annually for <strong>15 years</strong>.</p></li>
<li><p><strong>Mining &amp; Metallurgy Techniques:</strong></p>
<ul>
<li><p><strong>Open-Pit Mining:</strong> Surface excavation technique where overlying rock is stripped away to access shallow mineral deposits.</p></li>
<li><p><strong>Carbon-In-Leach (CIL) Extraction:</strong> Gold recovery process where crushed ore is treated with an alkaline cyanide solution, and dissolved gold is simultaneously adsorbed onto activated carbon.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--multi-lane-free-flow-mlff-tolling-system"><h2 id="2026-04-ca--multi-lane-free-flow-mlff-tolling-system">Multi-Lane Free Flow (MLFF) Tolling System</h2>
<ul>
<li><p><strong>Why in News:</strong> NHAI directed banks to validate Vehicle Registration Numbers (VRN) linked to FASTags to prepare for Multi-Lane Free Flow (MLFF) tolling rollouts.</p></li>
<li><p><strong>Working Principle:</strong></p>
<ul>
<li><p>Barrier-free open electronic tolling eliminating toll plazas, physical boom gates, and mandatory deceleration.</p></li>
<li><p>Combines overhead <strong>Radio Frequency Identification (RFID)</strong> gantries (to scan FASTags) with <strong>Automatic Number Plate Recognition (ANPR)</strong> high-speed cameras (to read VRNs).</p></li>
</ul></li>
<li><p><strong>Deployment Route:</strong> First implemented at <strong>Choryasi Fee Plaza (Gujarat, NH-48)</strong>; expanded to <strong>Gharaunda (Haryana, NH-44)</strong>.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--bharat-maritime-insurance-pool-bmi-pool"><h2 id="2026-04-ca--bharat-maritime-insurance-pool-bmi-pool">Bharat Maritime Insurance Pool (BMI Pool)</h2>
<ul>
<li><p><strong>Why in News:</strong> Union Cabinet approved the establishment of the Bharat Maritime Insurance Pool (BMI Pool).</p></li>
<li><p><strong>Mandate &amp; Scope:</strong></p>
<ul>
<li><p>Domestic reinsurance and co-insurance risk-pooling mechanism covering <strong>Hull &amp; Machinery (H&amp;M)</strong>, Cargo, <strong>Protection and Indemnity (P&amp;I)</strong>, and War Risk insurance.</p></li>
<li><p>Mitigates domestic exposure to volatile foreign maritime underwriters and guarantees protection for shipping lines carrying trade to and from Indian ports.</p></li>
<li><p>Applies to Indian-flagged vessels, Indian-controlled bottoms, and global liners moving freight to/from Indian ports.</p></li>
</ul></li>
<li><p><strong>Nodal Administration:</strong> Jointly anchored by the <strong>Ministry of Ports, Shipping and Waterways</strong> and the <strong>Ministry of Finance</strong>; administered by <strong>General Insurance Corporation of India (GIC Re)</strong> under an apex Governing Body.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--truck-mounted-attenuators-tmas"><h2 id="2026-04-ca--truck-mounted-attenuators-tmas">Truck-Mounted Attenuators (TMAs)</h2>
<ul>
<li><p><strong>Why in News:</strong> Ministry of Road Transport and Highways (MoRTH) commenced deploying Truck-Mounted Attenuators (TMAs) on National Highways to reduce construction work-zone fatalities.</p></li>
<li><p><strong>Mechanism &amp; Safety Utility:</strong></p>
<ul>
<li><p>Energy-absorbing crash cushions mounted behind heavy maintenance vehicles to absorb and dissipate kinetic impact energy from colliding vehicles.</p></li>
<li><p>Acts as a barrier shielding roadside maintenance crews while reducing deceleration forces on passengers of striking vehicles.</p></li>
<li><p>Fitted with high-intensity <strong>wig-wag flashing warning lights</strong> to signal oncoming high-speed traffic during fog, rain, or low-visibility conditions.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--noida-international-airport-jewar"><h2 id="2026-04-ca--noida-international-airport-jewar">Noida International Airport (Jewar)</h2>
<ul>
<li><p><strong>Why in News:</strong> Prime Minister inaugurated the first operational phase of Noida International Airport (Jewar Airport) in Uttar Pradesh.</p></li>
<li><p><strong>Operational Model:</strong> Executed via Public-Private Partnership (PPP) by <strong>Yamuna International Airport Private Limited (YIAPL)</strong>.</p></li>
<li><p><strong>Green Design:</strong> Engineered as a <strong>net-zero emissions airport</strong> constructed with sustainable, eco-friendly materials and energy-efficient building standards.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--infrastructure-initiatives-in-news"><h2 id="2026-04-ca--infrastructure-initiatives-in-news">Infrastructure Initiatives in News</h2>
<h3 class="topic" id="2026-04-ca--kalai-ii-hydro-electric-project-hep">Kalai-II Hydro Electric Project (HEP)</h3>
<ul>
<li><p><strong>Why in News:</strong> Cabinet Committee on Economic Affairs (CCEA) approved the 1,200 MW Kalai-II Hydro Electric Project.</p></li>
<li><p><strong>River &amp; Location:</strong> Situated on the <strong>Lohit River</strong> (a major tributary of the Brahmaputra) in <strong>Anjaw district, Arunachal Pradesh</strong>.</p></li>
<li><p><strong>Project Specifications:</strong> Developed as a <strong>run-of-river project with pondage</strong>, featuring a 128.5 m high concrete gravity dam and an underground powerhouse.</p></li>
</ul>
<h3 class="topic" id="2026-04-ca--mohra-power-project">Mohra Power Project</h3>
<ul>
<li><p><strong>Why in News:</strong> Jammu &amp; Kashmir government is reviving the Mohra Power Project to accelerate hydel power generation.</p></li>
<li><p><strong>Historical Significance:</strong> Also known as the <strong>Mahura Project</strong>, it was originally commissioned in <strong>1905</strong> as the <strong>first hydroelectric plant in the Kashmir Valley</strong>.</p></li>
<li><p><strong>River &amp; Location:</strong> Built as a <strong>run-of-the-river plant</strong> on the <strong>Jhelum River</strong> in Uri, Baramulla district.</p></li>
</ul>
<h3 class="topic" id="2026-04-ca--mahi-banswara-nuclear-power-project">Mahi Banswara Nuclear Power Project</h3>
<ul>
<li><p><strong>Why in News:</strong> Atomic Energy Regulatory Board (AERB) approved excavation work for Units 1 and 2 of the Mahi Banswara Nuclear Power Project.</p></li>
<li><p><strong>Location &amp; Capacity:</strong></p>
<ul>
<li><p>Located in <strong>Banswara, Rajasthan</strong>.</p></li>
<li><p>Total capacity of <strong>2,800 MW</strong>, comprising <strong>4 units of 700 MW each</strong>.</p></li>
<li><p>Utilises indigenous <strong>Pressurised Heavy Water Reactors (PHWRs)</strong> running on natural uranium fuel with heavy water (D<sub>2</sub>O) as both moderator and coolant.</p></li>
</ul></li>
<li><p><strong>Implementing Agency:</strong> <strong>Anushakti Vidyut Nigam Limited (ANVNL)</strong> — a joint venture between Nuclear Power Corporation of India Limited (<strong>NPCIL</strong>) and <strong>NTPC Limited</strong> set up to build, own, and operate nuclear power plants.</p></li>
<li><p><strong>AERB Profile:</strong> Statutory nuclear safety regulator established in <strong>1983</strong> under the <strong>Atomic Energy Act, 1962</strong> to enforce safety and radiation standards.</p></li>
</ul>
<h3 class="topic" id="2026-04-ca--shaktipeeth-expressway">Shaktipeeth Expressway</h3>
<ul>
<li><p><strong>Why in News:</strong> Maharashtra government approved a revised alignment for the Shaktipeeth Expressway.</p></li>
<li><p><strong>Corridor Profile:</strong> An 856.7 km, six-lane greenfield access-controlled expressway connecting <strong>Nagpur with Goa</strong> across Maharashtra.</p></li>
<li><p><strong>Pilgrimage Connectivity:</strong> Connects <strong>21 religious centres</strong>, including major seats of Shaktism in Maharashtra: <strong>Mahalakshmi</strong> (Kolhapur), <strong>Tuljabhavani</strong> (Tuljapur), and <strong>Mahur</strong> (Renuka Devi).</p></li>
<li><p><strong>Route Revision:</strong> Revised to pass through a <strong>13-district corridor</strong> including Satara, bypassing parts of Kolhapur and Sangli following agrarian protests over land acquisition.</p></li>
</ul>
<h3 class="topic" id="2026-04-ca--purvanchal-expressway">Purvanchal Expressway</h3>
<ul>
<li><p><strong>Why in News:</strong> Indian Air Force (IAF) conducted a comprehensive two-day emergency airstrip landing drill on the Purvanchal Expressway.</p></li>
<li><p><strong>Corridor Profile:</strong> A <strong>341-km</strong>, six-lane access-controlled expressway in <strong>Uttar Pradesh</strong>, connecting <strong>Lucknow to Ghazipur</strong>.</p></li>
<li><p><strong>Strategic Utility:</strong> Connects eastern Uttar Pradesh directly to the National Capital Region (NCR) via the Agra–Lucknow and Yamuna Expressways; serves dual use as an alternate runway for wartime operations and <strong>Humanitarian Assistance and Disaster Relief (HADR)</strong>.</p></li>
</ul>
<h3 class="topic" id="2026-04-ca--musi-riverfront-development-project">Musi Riverfront Development Project</h3>
<ul>
<li><p><strong>Why in News:</strong> National Green Tribunal (NGT) dismissed a plea against the Musi Riverfront Development Project, allowing works to proceed.</p></li>
<li><p><strong>Scope &amp; Financing:</strong> Rejuvenates a 55-km stretch in Hyderabad into an ecological, urban mobility, and heritage corridor; executed by the Musi Riverfront Development Corporation Ltd. (MRDCL) with support from an <strong>Asian Development Bank (ADB) loan</strong> of ~$500 million for Phase I.</p></li>
<li><p><strong>Musi River Static Profile:</strong></p>
<ul>
<li><p><strong>Ancient Name:</strong> Historically known as the <strong>Muchukunda River</strong>.</p></li>
<li><p><strong>Confluence:</strong> Originates in the <strong>Ananthagiri Hills</strong> (near Vikarabad, ~90 km west of Hyderabad) and forms a major <strong>left-bank tributary of the Krishna River</strong> in Telangana.</p></li>
<li><p><strong>Formation &amp; Reservoirs:</strong> Formed by the confluence of the <strong>Musa and Esi</strong> rivulets near Bapu Ghat; feeds the twin storage reservoirs <strong>Osman Sagar</strong> and <strong>Himayat Sagar</strong>.</p></li>
</ul></li>
</ul>
<h3 class="topic" id="2026-04-ca--delhi-dehradun-expressway">Delhi–Dehradun Expressway</h3>
<ul>
<li><p><strong>Why in News:</strong> Delhi–Dehradun Expressway was inaugurated, reducing transit time between Delhi and Dehradun from 6.5 hours to approximately <strong>2.5 hours</strong>.</p></li>
<li><p><strong>Key Feature:</strong> Features <strong>Asia’s longest elevated wildlife corridor</strong> spanning the ecologically sensitive Shivalik forest belt and <strong>Rajaji National Park</strong> to mitigate human-wildlife collisions.</p></li>
</ul>
<h3 class="topic" id="2026-04-ca--integrated-dashboard-for-infrastructure-performa">Integrated Dashboard for Infrastructure Performance Monitoring (PAIMANA)</h3>
<ul>
<li><p><strong>Why in News:</strong> Ministry of Statistics and Programme Implementation (MoSPI) launched an integrated real-time dashboard to monitor infrastructure sector performance under the PAIMANA framework.</p></li>
<li><p><strong>Core Function:</strong> Shifts infrastructure tracking from conventional output monitoring to a multidimensional performance framework, tracking <strong>116 indicators</strong> covering access, service quality, utilisation, affordability, and fiscal expenditure.</p></li>
<li><p><strong>PAIMANA Acronym &amp; Role:</strong> <em>Project Assessment, Infrastructure Monitoring and Analytics for Nation-Building</em> — acts as a centralised national data repository for infrastructure project analytics.</p></li>
</ul></section>
<div class="divider" id="2026-04-ca--div-science-and-technology"><span>Science and Technology</span></div>
<section class="blk" data-sec="2026-04-ca--streptococcus-bacteria"><h2 id="2026-04-ca--streptococcus-bacteria">Streptococcus Bacteria</h2>
<ul>
<li><p><strong>Why in News:</strong> DNA analysis of a 700-year-old Bolivian mummy revealed the earliest confirmed presence of <em>Streptococcus</em> bacteria in the Americas, marking the first confirmed detection in ancient remains globally.</p></li>
<li><p><strong>Microbial Profile &amp; Pathogenicity:</strong></p>
<ul>
<li><p>Refers to a diverse genus of Gram-positive bacteria, particularly <em>Streptococcus pyogenes</em> (Group A Streptococcus), that commonly infect humans.</p></li>
<li><p>Associated with mild infections like strep throat, impetigo, and scarlet fever, but can cause invasive life-threatening conditions like <strong>necrotising fasciitis</strong> (flesh-eating disease) and streptococcal toxic shock syndrome.</p></li>
</ul></li>
<li><p><strong>Transmission Mode:</strong> Primarily spreads through respiratory droplets from coughing or sneezing, direct skin-to-skin contact, or touch-transfer via contaminated surfaces.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--asraam-advanced-short-range-air-to-air-missile"><h2 id="2026-04-ca--asraam-advanced-short-range-air-to-air-missile">ASRAAM (Advanced Short-Range Air-to-Air Missile)</h2>
<ul>
<li><p><strong>Why in News:</strong> Ministry of Defence issued a request for proposals to integrate ASRAAM with IAF MiG-29 fighter jets, replacing ageing Russian-origin R-73 missiles.</p></li>
<li><p><strong>Technical Specifications:</strong></p>
<ul>
<li><p>Fourth-generation, short-range <strong>air-to-air missile (AAM)</strong> developed by European multinational consortium <strong>MBDA</strong>.</p></li>
<li><p>Capable of flying at speeds <strong>&gt; Mach 3</strong> with an engagement envelope exceeding <strong>25 km</strong>.</p></li>
</ul></li>
<li><p><strong>Guidance &amp; Avionics:</strong></p>
<ul>
<li><p><strong>Fire-and-forget</strong> capability guided by an Imaging Infrared (IIR) seeker resistant to countermeasures.</p></li>
<li><p>Supports dual engagement modes: <strong>Lock-On Before Launch (LOBL)</strong> and <strong>Lock-On After Launch (LOAL)</strong>, facilitating off-boresight target acquisition and dogfight agility.</p></li>
</ul></li>
<li><p><strong>IAF Integration:</strong> Already integrated into the IAF's upgraded <strong>SEPECAT Jaguar</strong> strike aircraft and <strong>LCA Tejas</strong> fighters.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--ins-agray-asw-swc"><h2 id="2026-04-ca--ins-agray-asw-swc">INS Agray (ASW SWC)</h2>
<ul>
<li><p><strong>Why in News:</strong> <em>Agray</em>, the 4th Anti-Submarine Warfare Shallow Water Craft (ASW SWC), was delivered to the Indian Navy.</p></li>
<li><p><strong>Class &amp; Indigenisation:</strong> Belongs to the <strong>Arnala class</strong>; built by <strong>Garden Reach Shipbuilders and Engineers (GRSE), Kolkata</strong>, featuring <strong>~80% indigenous content</strong>.</p></li>
<li><p><strong>Operational Mandate:</strong></p>
<ul>
<li><p>Conducts <strong>sub-surface surveillance</strong>, shallow-water coastal patrolling, search-and-attack ASW missions, and coordinated mine-laying operations.</p></li>
<li><p>Suited for low-intensity maritime operations (LIMO) and choke-point defense.</p></li>
</ul></li>
<li><p><strong>Speed Profile:</strong> Attains speeds of <strong>~25 knots</strong>, providing high agility and hydro-acoustic stealth in littoral waters.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--operation-urja-suraksha"><h2 id="2026-04-ca--operation-urja-suraksha">Operation Urja Suraksha</h2>
<ul>
<li><p><strong>Why in News:</strong> Launched by the Indian Navy to protect India-bound energy shipments transiting through the <strong>Strait of Hormuz</strong> amid rising West Asia maritime hostilities.</p></li>
<li><p><strong>Nature of Mission:</strong> A <strong>strategic, non-combat maritime security mission</strong> centered on independent deterrence, merchant tanker escort, and risk mitigation rather than joining multilateral military coalitions.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--prajna-ai-satellite-imaging-system"><h2 id="2026-04-ca--prajna-ai-satellite-imaging-system">Prajna AI Satellite Imaging System</h2>
<ul>
<li><p><strong>Why in News:</strong> Ministry of Home Affairs inducted the 'Prajna' system to enhance real-time surveillance and intelligence gathering in national security operations.</p></li>
<li><p><strong>System Capabilities:</strong></p>
<ul>
<li><p><strong>AI-enabled satellite imaging system</strong> designed to provide real-time situational awareness and actionable decision support to internal security agencies.</p></li>
<li><p>Uses automated computer-vision algorithms to parse big Earth-observation datasets, identifying anomalies, unauthorized cross-border movements, and covert infrastructure.</p></li>
</ul></li>
<li><p><strong>Developer:</strong> Developed by the <strong>Centre for Artificial Intelligence and Robotics (CAIR)</strong>, a dedicated laboratory under the <strong>DRDO</strong>.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--project-chetak"><h2 id="2026-04-ca--project-chetak">Project Chetak</h2>
<ul>
<li><p><strong>Why in News:</strong> Border Roads Organisation (BRO) marked the <strong>47th Raising Day</strong> of Project Chetak.</p></li>
<li><p><strong>Jurisdiction &amp; Assets:</strong></p>
<ul>
<li><p>BRO project responsible for constructing and maintaining over 4,000 km of border roads and 214 km of <strong>Ditch-cum-Bund (DCB)</strong> tactical defenses.</p></li>
<li><p>Deployed across the western operational theatre: <strong>Rajasthan, Punjab, and northern Gujarat</strong> along the India–Pakistan border.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--qader-cruise-missiles"><h2 id="2026-04-ca--qader-cruise-missiles">Qader Cruise Missiles</h2>
<ul>
<li><p><strong>Why in News:</strong> Iran claimed it launched Qader cruise missiles targeting the USS <em>Abraham Lincoln</em> (a Nimitz-class nuclear-powered aircraft carrier) amid maritime clashes.</p></li>
<li><p><strong>Origin &amp; System Profile:</strong></p>
<ul>
<li><p>Medium-range coastal and anti-ship cruise missile (ASCM) developed by <strong>Iran</strong>.</p></li>
<li><p>Upgraded iteration of the Iranian <em>Noor</em> missile, drawing heritage from Chinese C-802 anti-ship missile architectures.</p></li>
</ul></li>
<li><p><strong>Propulsion &amp; Flight Regime:</strong> Powered by a <strong>turbojet engine</strong> paired with a solid rocket booster; executes low-altitude sea-skimming trajectories to defeat long-range naval radar detection.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--r-37m-missile"><h2 id="2026-04-ca--r-37m-missile">R-37M Missile</h2>
<ul>
<li><p><strong>Why in News:</strong> Russia cleared the export and integration of the R-37M missile for the Indian Air Force's Su-30MKI fighter fleet.</p></li>
<li><p><strong>Classification &amp; NATO Designation:</strong> Designated by NATO as <strong>AA-13 Axehead</strong>; Russian-built <strong>ultra-long-range air-to-air missile</strong>.</p></li>
<li><p><strong>Target Profile:</strong> Optimized to engage high-value airborne assets (HVAA) at extreme stand-off ranges, including Airborne Early Warning and Control (AEW&amp;C) planes and aerial refueling tankers.</p></li>
<li><p><strong>Performance Metrics:</strong></p>
<ul>
<li><p><strong>Range:</strong> <strong>300–400 km</strong>; climbs along a lofted sub-orbital trajectory before diving onto targets.</p></li>
<li><p><strong>Propulsion &amp; Velocity:</strong> Driven by a <strong>dual-pulse solid-fuel rocket motor</strong>, accelerating to near-hypersonic speeds of <strong>around Mach 6</strong>.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--s-400-triumf-air-defence-system"><h2 id="2026-04-ca--s-400-triumf-air-defence-system">S-400 Triumf Air Defence System</h2>
<ul>
<li><p><strong>Why in News:</strong> India is scheduled to induct its final two operational regiments of the S-400 air defence system from Russia.</p></li>
<li><p><strong>Indian Designation:</strong> Inducted under the operational name <strong>'Sudarshan'</strong>.</p></li>
<li><p><strong>Core Combat Capabilities:</strong></p>
<ul>
<li><p>Mobile, long-range surface-to-air missile (SAM) platform with a multi-function tracking radar envelope extending <strong>up to 600 km</strong> and weapons engagement reaching <strong>up to 400 km</strong>.</p></li>
<li><p>Interception velocity reaches <strong>Mach 14</strong> against aerodynamic and ballistic targets.</p></li>
<li><p>Deploys <strong>four missile types</strong> to construct layered airspace defense (very long, long, medium, and short ranges).</p></li>
</ul></li>
<li><p><strong>Launch Mechanism:</strong> Employs a <strong>cold launch method</strong> (gas generators eject the canisterized missile vertically before booster ignition), facilitating immediate 360<sup>∘</sup> omnidirectional engagement without turning the vehicle.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--calm-brain-repository"><h2 id="2026-04-ca--calm-brain-repository">CALM-Brain Repository</h2>
<ul>
<li><p><strong>Why in News:</strong> Launched as India’s first digital repository of psychiatric and neurodevelopmental disorder data.</p></li>
<li><p><strong>Collaborating Institutions:</strong> Developed jointly by the <strong>National Institute of Mental Health and Neurosciences (NIMHANS)</strong> and the <strong>National Centre for Biological Sciences (NCBS-TIFR)</strong>.</p></li>
<li><p><strong>Institutional Umbrella:</strong> Anchored under the Rohini Nilekani Centre for Brain and Mind (CBM).</p></li>
<li><p><strong>Core Mandate:</strong> Aggregate large-scale, deep-phenotyped multi-omic, clinical, and neuroimaging datasets to accelerate clinical diagnosis and biomarker discovery for psychiatric diseases.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--patent-filings-ecosystem-in-india"><h2 id="2026-04-ca--patent-filings-ecosystem-in-india">Patent Filings &amp; Ecosystem in India</h2>
<ul>
<li><p><strong>Why in News:</strong> India’s annual patent filings surged by 30.2% to a record <strong>1.43 lakh in FY 2025–26</strong>.</p></li>
<li><p><strong>Global Standing:</strong></p>
<ul>
<li><p>India is the <strong>world’s 6th largest patent filer</strong>.</p></li>
<li><p>Domestic applicants account for <strong>over 69%</strong> of total filings (surpassing foreign resident applications).</p></li>
<li><p><strong>Top Performing States:</strong> Tamil Nadu, Karnataka, and Maharashtra lead in aggregate filings.</p></li>
</ul></li>
<li><p><strong>Legal Framework (Patents Act, 1970):</strong></p>
<ul>
<li><p>Grants negative monopoly rights for <strong>20 years</strong> from the date of application filing.</p></li>
<li><p><strong>Eligibility Criteria:</strong> Invention must satisfy three statutory tests: <strong>novelty</strong>, non-obvious <strong>inventive step</strong>, and <strong>industrial applicability</strong>.</p></li>
<li><p>Recognizes both <strong>product patents</strong> (protecting the tangible item/molecule) and <strong>process patents</strong> (protecting the specific method of manufacturing).</p></li>
<li><p><strong>Public Opposition Windows:</strong> Allows <strong>pre-grant opposition</strong> (filed by <em>any person</em> post-publication) and <strong>post-grant opposition</strong> (filed strictly by <em>persons interested</em> within 12 months of grant) to prevent evergreening and ensure patent quality.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--ins-aridaman-ins-taragiri"><h2 id="2026-04-ca--ins-aridaman-ins-taragiri">INS Aridaman &amp; INS Taragiri</h2>
<ul>
<li><p><strong>Why in News:</strong> Indian Navy commissioned the indigenous nuclear-powered ballistic missile submarine <strong>INS Aridaman</strong> and the stealth frigate <strong>INS Taragiri</strong> at Visakhapatnam.</p></li>
<li><p><strong>INS Taragiri (Static Context):</strong> Fourth stealth guided-missile frigate of the <strong>Nilgiri class</strong> constructed under <strong>Project 17A</strong>, built with over 75% indigenous components.</p></li>
<li><p><strong>About INS Aridaman:</strong></p>
<ul>
<li><p>India’s <strong>3rd indigenous SSBN</strong> (Ship Submersible Ballistic Nuclear), following INS Arihant (2016) and INS Arighaat (2024).</p></li>
<li><p>Constructed under the <strong>Advanced Technology Vessel (ATV) programme</strong> at the Ship Building Centre (SBC), Visakhapatnam.</p></li>
<li><p><em>ATV Programme Background:</em> Began in the 1980s with initial technical assistance from Russia; managed by DRDO, Department of Atomic Energy (DAE), and the Indian Navy.</p></li>
</ul></li>
<li><p><strong>Technical &amp; Strike Specifications:</strong></p>
<ul>
<li><p><strong>Displacement &amp; Reactor:</strong> Displacement of <strong>~7,000 tonnes</strong> (larger than the ~6,000 tonnes of Arihant and Arighaat); powered by an 83 MW compact light-water reactor (CLWR).</p></li>
<li><p><strong>VLS Capacity:</strong> Houses <strong>8 Vertical Launch System (VLS) tubes</strong> (doubling the 4 VLS tubes on Arihant and Arighaat).</p></li>
<li><p><strong>Missile Armament:</strong> Capable of carrying either <strong>24 K-15</strong> submarine-launched ballistic missiles (SLBMs; range ~750 km) or <strong>8 K-4</strong> SLBMs (range ~3,500 km).</p></li>
</ul></li>
<li><p><strong>Submarine Classifications:</strong></p>
<ul>
<li><p><strong>SSBN:</strong> Strategic nuclear deterrence carrying nuclear-armed ballistic missiles.</p></li>
<li><p><strong>SSN:</strong> Nuclear-powered attack submarine armed with conventional weapons for combat, escort, and maritime surveillance.</p></li>
<li><p><strong>SSGN:</strong> Nuclear-powered submarine armed with guided cruise missiles for land and naval precision strikes.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--prototype-fast-breeder-reactor-pfbr"><h2 id="2026-04-ca--prototype-fast-breeder-reactor-pfbr">Prototype Fast Breeder Reactor (PFBR)</h2>
<ul>
<li><p><strong>Why in News:</strong> India's Prototype Fast Breeder Reactor (PFBR) at Kalpakkam, Tamil Nadu, attained <strong>first criticality</strong> by achieving a self-sustaining nuclear chain reaction.</p></li>
<li><p><strong>Programme Milestone:</strong></p>
<ul>
<li><p>Marks India's formal entry into <strong>Stage II</strong> of its indigenous three-stage nuclear power programme.</p></li>
<li><p>India is only the <strong>second country</strong> after Russia to operate a commercial-scale fast breeder reactor.</p></li>
</ul></li>
<li><p><strong>Design &amp; Technical Nuances:</strong></p>
<ul>
<li><p><strong>Capacity &amp; Developer:</strong> <strong>500 MWe</strong> reactor built indigenously by <strong>BHAVINI</strong> (Bharatiya Nabhikiya Vidyut Nigam Limited) under the Department of Atomic Energy.</p></li>
<li><p><strong>Fuel Type:</strong> <strong>Mixed Oxide (MOX) fuel</strong> (blend of plutonium and uranium oxides), reprocessing spent fuel from Stage I Pressurised Heavy Water Reactors (PHWRs).</p></li>
<li><p><strong>Breeder Mechanism:</strong> Reactor core is enveloped by a <strong>Depleted Uranium-238 blanket</strong> that captures neutrons to breed fissile <strong>Plutonium-239</strong> (<sub></sub><sup>239</sup>Pu); produces more fissile material than it consumes.</p></li>
<li><p><strong>Fast Neutrons (No Moderator):</strong> Uses <strong>high-energy unmoderated fast neutrons</strong> to maintain fission (unlike thermal reactors that require heavy water or graphite moderators).</p></li>
<li><p><strong>Coolant:</strong> Uses <strong>liquid sodium</strong> due to its high thermal conductivity and inability to slow down fast neutrons.</p></li>
<li><p><strong>Efficiency:</strong> Extracts <strong>60 times more energy</strong> from natural uranium compared to Stage I PHWRs.</p></li>
<li><p><strong>Safety Features:</strong> Pool-type design housing the primary radioactive sodium loop within a single reactor vessel; operates with a <strong>negative power coefficient</strong> (nuclear chain reaction decelerates automatically if temperatures rise).</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--tunguska-air-defence-missile-systems"><h2 id="2026-04-ca--tunguska-air-defence-missile-systems">Tunguska Air Defence Missile Systems</h2>
<ul>
<li><p><strong>Why in News:</strong> Ministry of Defence signed a contract with <strong>Russia</strong> to procure Tunguska Air Defence Missile Systems.</p></li>
<li><p><strong>System Identity:</strong></p>
<ul>
<li><p>NATO reporting name: <strong>SA-19 "Grison"</strong>.</p></li>
<li><p>Soviet/Russian-origin mobile, self-propelled low-altitude air defence system mounted on a tracked armoured chassis.</p></li>
</ul></li>
<li><p><strong>Dual Weapon Configuration:</strong> Combines <strong>surface-to-air missiles (SAMs)</strong> and twin 30 mm high-rate <strong>anti-aircraft autocannons</strong> into a single platform.</p></li>
<li><p><strong>Role &amp; Coverage:</strong> Functions as <strong>Short-Range Air Defence (SHORAD)</strong>; bridges the operational layer between man-portable air-defense systems (MANPADS) and medium-range surface-to-air missile batteries, featuring a 360-degree target acquisition radar with an 18 km detection envelope.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--agnite-semi-cryogenic-rocket-engine"><h2 id="2026-04-ca--agnite-semi-cryogenic-rocket-engine">Agnite (Semi-Cryogenic Rocket Engine)</h2>
<ul>
<li><p><strong>Why in News:</strong> Indian private space-tech startup <strong>Agnikul Cosmos</strong> successfully test-fired the "Agnite" booster engine.</p></li>
<li><p><strong>Engineering Breakthrough:</strong> World's <strong>largest single-piece, 3D-printed, semi-cryogenic rocket engine</strong>.</p></li>
<li><p><strong>Application &amp; Metallurgy:</strong></p>
<ul>
<li><p>Designed to power the booster stage of Agnikul's orbital small satellite launch vehicle, <strong>Agnibaan</strong>.</p></li>
<li><p>Fabricated from <strong>Inconel</strong> (a high-performance nickel-chromium superalloy capable of withstanding extreme aerospace thermal stresses).</p></li>
<li><p>Uses <strong>electric motor-driven pumps</strong> instead of complex gas-generator turbopumps for propellant feed and combustion regulation.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--antariksh-venture-capital-fund"><h2 id="2026-04-ca--antariksh-venture-capital-fund">Antariksh Venture Capital Fund</h2>
<ul>

<li><p><strong>Institutional Setup:</strong></p>
<ul>
<li><p><strong>Fund Manager:</strong> Managed by <strong>SIDBI Venture Capital Ltd</strong> with a dedicated corpus of <strong>₹1,005 crore</strong>.</p></li>

<section class="blk" data-sec="2026-04-ca--cern-antimatter-transport-experiment-base-step"><h2 id="2026-04-ca--cern-antimatter-transport-experiment-base-step">CERN Antimatter Transport Experiment (BASE-STEP)</h2>
<ul>
<li><p><strong>Why in News:</strong> Scientists at CERN successfully executed the first-ever road transport of <strong>antimatter (antiprotons)</strong> inside a movable magnetic trap.</p></li>
<li><p><strong>Project Framework:</strong> Executed under the <strong>BASE-STEP</strong> (Baryon Antibaryon Symmetry Experiment – Storage, Transport &amp; Experimental Programme) initiative.</p>
<ul>
<li><p><em>BASE Mandate:</em> Conducts ultra-high precision comparisons between fundamental properties of protons and antiprotons to explain the <strong>baryon asymmetry / matter-antimatter imbalance</strong> in the universe.</p></li>
</ul></li>
<li><p><strong>Antimatter Fundamentals:</strong></p>
<ul>
<li><p>Subatomic particles identical in mass to normal matter but carrying an <strong>opposite electric charge</strong> (e.g., positron vs. electron, antiproton vs. proton).</p></li>
<li><p><strong>Annihilation:</strong> Complete conversion of mass into high-energy photons/energy upon direct physical contact between matter and antimatter.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--dwarf-spheroidal-galaxies-intermediate-mass-blac"><h2 id="2026-04-ca--dwarf-spheroidal-galaxies-intermediate-mass-blac">Dwarf Spheroidal Galaxies &amp; Intermediate-Mass Black Holes</h2>
<ul>
<li><p><strong>Why in News:</strong> Researchers from the Indian Institute of Astrophysics (IIA), Bengaluru, investigated whether dwarf spheroidal galaxies host central black holes.</p></li>
<li><p><strong>Morphology &amp; Physical Traits:</strong></p>
<ul>
<li><p>Small, extremely faint, and <strong>gas-poor</strong> satellite stellar systems orbiting massive host galaxies.</p></li>
<li><p>Dominated predominantly by <strong>dark matter</strong> with low stellar density.</p></li>
</ul></li>
<li><p><strong>Key Research Findings:</strong></p>
<ul>
<li><p><strong>Black Hole Scale:</strong> Central black hole masses in these dwarfs fall <strong>below one million solar masses (</strong>&lt;10<sup>6</sup>M<sub>⊙</sub><strong>)</strong>, classifying them as elusive <strong>Intermediate-Mass Black Holes (IMBHs)</strong>.</p></li>
<li><p><strong>Unified M-</strong>σ <strong>Scaling Law:</strong> Confirmed that the correlation between central black hole mass and stellar velocity dispersion (σ) remains consistent from dwarf galaxies up to supermassive elliptical galaxies.</p></li>
<li><p><strong>Evolutionary Mechanics:</strong> Dwarf galaxies grew black holes via momentum-driven accretion before their gas stripped away; many were originally larger galaxies that experienced <strong>tidal stripping</strong> of outer stars due to the gravitational pull of the Milky Way.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--mission-mitra"><h2 id="2026-04-ca--mission-mitra">Mission MITRA</h2>
<ul>
<li><p><strong>Why in News:</strong> ISRO launched Mission MITRA to study astronaut performance under extreme environments ahead of the Gaganyaan crewed mission.</p></li>
<li><p><strong>Acronym:</strong> <strong>M</strong>apping of <strong>I</strong>nteroperable <strong>T</strong>raits and <strong>R</strong>esponse <strong>A</strong>ssessment.</p></li>
<li><p><strong>Testbed Location:</strong> Conducted in <strong>Leh (Ladakh)</strong> at ~3,500 m altitude.</p>
<ul>
<li><p>Terrestrial analogue simulating space flight conditions: environmental <strong>hypoxia</strong> (low oxygen), sub-zero temperatures, sensory deprivation, and isolation.</p></li>
</ul></li>
<li><p><strong>Core Focus:</strong> Assessing human factors, team cohesion, crew-ground communication dynamics under delay/stress, and neuro-psychological resilience.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--nasa-s-artemis-ii-mission"><h2 id="2026-04-ca--nasa-s-artemis-ii-mission">NASA’s Artemis II Mission</h2>
<ul>
<li><p><strong>Why in News:</strong> Artemis II launched as the <strong>first crewed lunar mission in over 50 years</strong> (since Apollo 17 in 1972).</p></li>
<li><p><strong>Crew Milestones:</strong> Carried a crew of four astronauts, including the <strong>first woman</strong> and the <strong>first person of colour</strong> on a lunar mission.</p></li>
<li><p><strong>Launch Architecture:</strong> Propelled by NASA’s <strong>Space Launch System (SLS)</strong> rocket carrying the <strong>Orion spacecraft</strong> from Kennedy Space Center, Florida.</p></li>
<li><p><strong>International Collaboration:</strong> NASA partnered with the European Space Agency (<strong>ESA</strong>), Japan Aerospace Exploration Agency (<strong>JAXA</strong>), and the Canadian Space Agency (<strong>CSA</strong>).</p></li>
<li><p><strong>Orbital Profile:</strong> Traveled along a lunar flyby trajectory, looping around the Moon to reach ~6,500 km beyond its far side—marking the farthest distance humans have ventured into deep space.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--claude-mythos"><h2 id="2026-04-ca--claude-mythos">Claude Mythos</h2>
<ul>
<li><p><strong>Why in News:</strong> AI lab Anthropic withheld the general public release of its flagship AI model, Claude Mythos, citing severe global cybersecurity risks.</p></li>
<li><p><strong>Core Risk Profile:</strong></p>
<ul>
<li><p>Advanced Large Language Model (LLM) exhibiting autonomous reasoning capabilities.</p></li>
<li><p>Capable of <strong>autonomously discovering and writing working exploits for Zero-Day Vulnerabilities</strong> (previously unknown, unpatched software security flaws) without human supervision.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--hafnium-oxide-memristor"><h2 id="2026-04-ca--hafnium-oxide-memristor">Hafnium-Oxide Memristor</h2>
<ul>
<li><p><strong>Why in News:</strong> Cambridge researchers developed a stable hafnium-oxide (HfO<sub>2</sub>) memristor to curb AI energy consumption.</p></li>
<li><p><strong>Circuit Identity:</strong> Memristors represent the <strong>fourth fundamental passive circuit element</strong> (alongside resistors, capacitors, and inductors).</p>
<ul>
<li><p>Regulates electric current while <strong>retaining memory of past charge flow</strong> even when power is turned off.</p></li>
</ul></li>
<li><p><strong>Neuromorphic Edge &amp; Efficiency:</strong></p>
<ul>
<li><p>Mimics biological synapses by performing data storage (memory) and processing in the same physical unit.</p></li>
<li><p>Solves the <strong>Von Neumann bottleneck</strong> (the energy/speed penalty of shuttling data between separate CPU and RAM units).</p></li>
<li><p>Potential to reduce AI/ML hardware power consumption by <strong>up to ~70%</strong> across IoT, brain-like computing, and edge devices.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--humidity-responsive-neuromorphic-sensor"><h2 id="2026-04-ca--humidity-responsive-neuromorphic-sensor">Humidity-Responsive Neuromorphic Sensor</h2>
<ul>
<li><p><strong>Why in News:</strong> Scientists at JNCASR (Jawaharlal Nehru Centre for Advanced Scientific Research) fabricated a bio-inspired neuromorphic sensor mimicking cricket frog synaptic responses.</p></li>
<li><p><strong>Material Architecture:</strong> Uses <strong>supramolecular nanofibres</strong> (non-covalently bonded molecular assemblies) derived from charge-transfer complexes.</p></li>
<li><p><strong>Mechanism:</strong> Ambient humidity shifts modulate internal electrical conductivity, creating memory traces of previous environmental exposures.</p></li>
<li><p><strong>Features:</strong> Combines sensing, biological memory, and compute on a single platform; demonstrates neural phenomena like <strong>synaptic facilitation</strong> and <strong>metaplasticity</strong> for low-power edge IoT and wearable biomedical patches.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--india-s-first-quantum-computing-testing-beds"><h2 id="2026-04-ca--india-s-first-quantum-computing-testing-beds">India’s First Quantum Computing Testing Beds</h2>

<section class="blk" data-sec="2026-04-ca--kaynes-semiconductor-osat-plant"><h2 id="2026-04-ca--kaynes-semiconductor-osat-plant">Kaynes Semiconductor OSAT Plant</h2>

<section class="blk" data-sec="2026-04-ca--somato-cognitive-action-network-scan"><h2 id="2026-04-ca--somato-cognitive-action-network-scan">Somato-Cognitive Action Network (SCAN)</h2>
<ul>
<li><p><strong>Why in News:</strong> Neurological research identified that the Somato-Cognitive Action Network (SCAN) plays a central operational role in Parkinson’s disease (PD).</p></li>
<li><p><strong>Functional Role:</strong> A brain network that bridges abstract cognitive intent and physiological motor planning/coordination.</p></li>
<li><p><strong>Pathological Finding:</strong> In Parkinson's patients, SCAN exhibits aberrant <strong>hyperconnectivity</strong> with deeper subcortical brain nodes, disrupting smooth motor signaling.</p>
<ul>
<li><p>Functions as an objective neuroimaging <strong>biomarker</strong> correlating with severity of resting tremors, motor rigidity, and postural instability.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--non-newtonian-fluids"><h2 id="2026-04-ca--non-newtonian-fluids">Non-Newtonian Fluids</h2>
<ul>
<li><p><strong>Why in News:</strong> Physicists resolved the mechanical transition puzzle of how cornstarch-water suspensions (<em>oobleck</em>) instantly transition from liquid to solid states under stress.</p></li>
<li><p><strong>Core Physics:</strong></p>
<ul>
<li><p>Unlike <strong>Newtonian fluids</strong> (e.g., water), whose viscosity remains constant regardless of shear rate and depends only on temperature/pressure.</p></li>
<li><p><strong>Non-Newtonian fluids</strong> have a variable viscosity that alters under applied shear stress.</p></li>
<li><p><strong>Types:</strong></p>
<ul>
<li><p><em>Shear-thickening (Dilatant):</em> Viscosity increases rapidly when stress is applied (e.g., behaves as a solid on impact, as seen in oobleck).</p></li>
<li><p><em>Shear-thinning (Pseudoplastic):</em> Viscosity decreases and flows more easily under stress (e.g., ketchup, blood, paints).</p></li>
</ul></li>
<li><p><strong>Applications:</strong> Body armour/protective gear, soft robotics, dampers, and biomedical materials.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--phase-change-material-pcm-bricks"><h2 id="2026-04-ca--phase-change-material-pcm-bricks">Phase Change Material (PCM) Bricks</h2>
<ul>
<li><p><strong>Why in News:</strong> Researchers at IIT Guwahati engineered energy-efficient composite bricks using Phase Change Materials (PCM) to stabilise indoor building temperatures.</p></li>
<li><p><strong>Working Mechanism:</strong></p>
<ul>
<li><p>Uses paraffin-based PCM (OM35) embedded in a <strong>biochar matrix</strong>.</p></li>
<li><p><em>Thermal cycle:</em> Melts during peak daytime temperatures to absorb latent heat, solidifies at night to release stored warmth into the structure.</p></li>
<li><p>Biochar prevents molten chemical leakage from the interior brick porosity.</p></li>
</ul></li>
<li><p><strong>Thermal Performance:</strong> Drops internal wall temperatures by <strong>~3°C</strong>, cutting household air-conditioning/cooling energy demand by <strong>10–20%</strong>.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--project-glasswing"><h2 id="2026-04-ca--project-glasswing">Project Glasswing</h2>
<ul>
<li><p><strong>Why in News:</strong> Anthropic launched Project Glasswing, an international initiative deploying AI to secure critical global software infrastructure.</p></li>
<li><p><strong>Industry Coalition:</strong> Includes Amazon Web Services (AWS), Apple, Google, Microsoft, and NVIDIA.</p></li>
<li><p><strong>Mandate:</strong> Deploys a restricted defensive variant—<strong>Claude Mythos Preview</strong>—to scan, identify, and remediate systemic software code vulnerabilities across critical infrastructure like banking, healthcare, and telecommunications.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--narit-ai"><h2 id="2026-04-ca--narit-ai">NARIT-AI</h2>
<ul>

<li><p><strong>Acronym:</strong> <strong>N</strong>arcotics <strong>A</strong>nalysis &amp; <strong>R</strong>AG-based <strong>I</strong>nvestigation <strong>T</strong>ool.</p></li>
<li><p><strong>Architecture:</strong> Employs <strong>Retrieval-Augmented Generation (RAG)</strong> linked to a closed, curated corpus of criminal statutes and judicial precedents.</p></li>
<li><p><strong>Operational Edge:</strong> Operates offline without generic internet hallucinations, providing investigating officers with procedural checklists, mandatory timeline trackers, and statutory compliance guides during drug raids and seizures.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--saral-ai"><h2 id="2026-04-ca--saral-ai">SARAL AI</h2>
<ul>
<li><p><strong>Why in News:</strong> Anusandhan National Research Foundation (ANRF) is developing SARAL AI to provide wider public access to scientific knowledge.</p></li>
<li><p><strong>Acronym:</strong> <strong>S</strong>implified and <strong>A</strong>utomated <strong>R</strong>esearch <strong>A</strong>mplification and <strong>L</strong>earning.</p></li>
<li><p><strong>Core Mandate:</strong> AI-powered platform that translates complex, technical scientific publications into simplified, digestible formats to bridge the lab-to-citizen gap.</p></li>

<li><p>Capable of generating scientific summaries across <strong>18 Indian languages</strong>.</p></li>

</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--biotechnology-research-and-innovation-council-br"><h2 id="2026-04-ca--biotechnology-research-and-innovation-council-br">Biotechnology Research and Innovation Council (BRIC)</h2>
<ul>
<li><p><strong>Why in News:</strong> The BRIC-Research Advisory Board (BRIC-RAB) held its inaugural meeting at the Regional Centre for Biotechnology (RCB), Faridabad.</p></li>
<li><p><strong>Institutional Hierarchy &amp; Mandate:</strong></p>
<ul>
<li><p>Apex <strong>autonomous body</strong> under the Department of Biotechnology (DBT), Ministry of Science &amp; Technology; established in <strong>2023</strong> to integrate 14 autonomous DBT institutions under a single governance framework.</p></li>
<li><p><strong>BRIC-RAB:</strong> Operates as a high-level <strong>statutory scientific body</strong> that steers overarching strategic priorities and long-term biotechnology directives.</p></li>

<li><p><strong>Operational Model &amp; Schemes:</strong></p>
<ul>
<li><p>Functions on a <strong>decentralised national laboratory</strong> model to pool national resources and improve global competitiveness.</p></li>
<li><p>Directly anchors the <strong>BioE3 Policy</strong> (Biotechnology for Economy, Environment and Employment).</p></li>
<li><p>Leverages the <strong>SAHAJ portal/scheme</strong> to provide open, nationwide access to high-end analytical equipment and shared lab infrastructure.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--cell-therapy-for-aging-related-frailty-laromestr"><h2 id="2026-04-ca--cell-therapy-for-aging-related-frailty-laromestr">Cell Therapy for Aging-Related Frailty (Laromestrocel)</h2>
<ul>
<li><p><strong>Why in News:</strong> Clinical trials demonstrated that Laromestrocel (Lomecel-B) significantly improved physical functionality and endurance in frail older adults.</p></li>
<li><p><strong>Therapeutic Mechanism:</strong></p>
<ul>
<li><p>Allogeneic intravenous infusion of <strong>mesenchymal stem cells (MSCs)</strong> harvested from the bone marrow of young, healthy adult donors.</p></li>
<li><p>MSCs home to injured, inflamed, or degraded vascular niches to secrete immunomodulatory and regenerative bioactive cytokines.</p></li>
</ul></li>
<li><p><strong>Clinical Significance:</strong> Mitigates chronic systemic inflammation (inflamm-aging), enhances microvascular endothelial function, and supports musculoskeletal repair, shifting eldercare from palliative management toward functional rejuvenation.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--extracellular-rna-exrna"><h2 id="2026-04-ca--extracellular-rna-exrna">Extracellular RNA (exRNA)</h2>
<ul>
<li><p><strong>Why in News:</strong> A study demonstrated that bacterial extracellular RNA (exRNA) persists in aquatic environments even after aggressive chemical water disinfection.</p></li>
<li><p><strong>Biological Nature:</strong></p>
<ul>
<li><p>RNA molecules that <strong>exist outside cellular membranes</strong>, circulating in extracellular matrices and body fluids like blood plasma, saliva, urine, and cerebrospinal fluid.</p></li>
<li><p>Encapsulated within membrane-bound protective extracellular vesicles (exosomes) or protein complexes that shield them from degradation by extracellular RNase enzymes.</p></li>
</ul></li>
<li><p><strong>Functions:</strong> Mediates intercellular communication, epigenetic regulation, post-transcriptional gene silencing, tissue regeneration, and systemic immune modulation.</p></li>
<li><p><strong>Static RNA Basics (Prelims Pointers):</strong></p>
<ul>
<li><p>Typically a <strong>single-stranded nucleic acid</strong> containing a <strong>ribose sugar</strong> and a phosphate backbone.</p></li>
<li><p>Employs four nitrogenous bases: Adenine (A), Guanine (G), Cytosine (C), and <strong>Uracil (</strong>U<strong>)</strong>, with uracil substituting for thymine (T) found in DNA.</p></li>
<li><p>Present across both the cell <strong>nucleus and cytoplasm</strong>; inherently more chemically reactive and less structurally stable than double-stranded DNA.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--gene-drive-technology-for-malaria-control"><h2 id="2026-04-ca--gene-drive-technology-for-malaria-control">Gene Drive Technology for Malaria Control</h2>
<ul>
<li><p><strong>Why in News:</strong> Genetically modified mosquitoes engineered with synthetic Gene Drives demonstrated real-world efficacy in suppressing malaria parasites.</p></li>
<li><p><strong>Mechanism &amp; Mendelian Exception:</strong></p>
<ul>
<li><p>Synthetic genetic editing systems (leveraging <strong>CRISPR-Cas9</strong>) engineered to <strong>bias inheritance rates</strong>.</p></li>
<li><p>Overrides standard Mendelian inheritance (50% probability), guaranteeing that modified traits are passed on to &gt;90% <strong>of offspring</strong> to rapidly sweep through entire wild populations.</p></li>
</ul></li>
<li><p><strong>Two Main Strategic Approaches:</strong></p>
<ol type="1">
<li><p><strong>Population Suppression:</strong> Drives infertility genes (e.g., disrupting female reproductive viability) to crash mosquito numbers.</p></li>
<li><p><strong>Population Modification (Replacement):</strong> Inserts malaria-blocking or parasite-refractory genes into mosquitoes without destroying vector populations.</p></li>
</ol></li>
<li><p><strong>Field Evidence:</strong> Validated in <em>Anopheles gambiae</em> field lines, showing ~94% inheritance efficiency and significant reductions in <em>Plasmodium</em> transmission.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--measuring-distance-in-deep-space-via-pulsars"><h2 id="2026-04-ca--measuring-distance-in-deep-space-via-pulsars">Measuring Distance in Deep Space via Pulsars</h2>
<ul>
<li><p><strong>Why in News:</strong> Indian astronomers formulated a novel technique to measure cosmic distances by analyzing radio signal distortions as pulsar emissions traverse the interstellar medium (ISM).</p></li>
<li><p><strong>Pulsar Fundamentals:</strong></p>
<ul>
<li><p>Highly magnetized, rapidly rotating <strong>neutron stars</strong> that sweep regular beams of electromagnetic and radio waves from their magnetic poles across space.</p></li>
<li><p>Formed as superdense collapsed cores of massive progenitor stars following violent <strong>supernova explosions</strong>.</p></li>
<li><p>Typically contain 1.4–2.3 solar masses compressed into a dense sphere of only ~20 km <strong>diameter</strong>.</p></li>
<li><p>Exhibit surface magnetic fields <strong>trillions of times stronger than Earth’s</strong>, accelerating relativistic charged particles to emit narrow beams of radiation.</p></li>
</ul></li>
<li><p><strong>Interstellar Measurement Mechanics:</strong></p>
<ul>
<li><p><strong>Dispersion Delay:</strong> High frequencies travel faster than lower frequencies through ionized ISM; the time delay directly reflects the total free electron column density along the sightline.</p></li>
<li><p><strong>Scattering:</strong> Radio wave fronts blur and broaden due to turbulence and electron density fluctuations in the interstellar medium.</p></li>
<li><p><strong>K-Factor Metric &amp; Ratio Analysis:</strong> Correlates dispersion delay with temporal scattering to resolve <strong>distance ambiguity</strong>, effectively distinguishing between a thin, highly turbulent cloud nearby and a long, diffuse interstellar path.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--temperature-controlled-nanomaterials"><h2 id="2026-04-ca--temperature-controlled-nanomaterials">Temperature-Controlled Nanomaterials</h2>
<ul>
<li><p><strong>Why in News:</strong> Indian researchers developed temperature-responsive smart nanomaterials capable of reversibly shifting optical, structural, and electrical properties with temperature changes.</p></li>
<li><p><strong>Chemical Architecture:</strong></p>
<ul>
<li><p>Built using amphiphilic <strong>naphthalene diimide (NDI)</strong> molecules driven by <strong>supramolecular self-assembly</strong> (governed by weak non-covalent interactions).</p></li>
<li><p><em>Amphiphilic nature:</em> Possesses both water-attracting (hydrophilic) and water-repelling (hydrophobic) domains.</p></li>
</ul></li>
<li><p><strong>Phase Switching Behavior:</strong></p>
<ul>
<li><p>Exists as conductive <strong>nanodisks</strong> at room temperature.</p></li>
<li><p>Transforms upon heating into <strong>nanosheets</strong> with reduced electrical conductivity, acting as a reversible solid-state thermal switch.</p></li>
</ul></li>
<li><p><strong>Static Context (Nanomaterials):</strong></p>
<ul>
<li><p>Materials engineered with spatial dimensions constrained within the 1–100 nm <strong>range (</strong>10<sup>−9</sup>m<strong>)</strong>.</p></li>
<li><p>Display distinct surface-area-to-volume ratios, leading to enhanced mechanical strength, quantum confinement effects, and tailored optical reactivity.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--india-s-first-advanced-3d-chip-packaging-unit"><h2 id="2026-04-ca--india-s-first-advanced-3d-chip-packaging-unit">India’s First Advanced 3D Chip Packaging Unit</h2>
<ul>
<li><p><strong>Why in News:</strong> Foundation stone laid for India’s first advanced 3D semiconductor chip packaging plant at <strong>Info Valley, Bhubaneswar, Odisha</strong>, by US-based 3D Glass Solutions.</p></li>
<li><p><strong>Facility Classification:</strong> Operates as an integrated <strong>ATMP</strong> (Assembly, Testing, Marking, and Packaging) unit.</p></li>
<li><p><strong>Programme Umbrella:</strong> Anchored under the <strong>India Semiconductor Mission (ISM)</strong>.</p></li>
<li><p><strong>Core Technological Architecture:</strong></p>
<ul>
<li><p>Employs advanced <strong>glass substrate technology</strong> paired with <strong>3D Heterogeneous Integration (3DHI)</strong>.</p></li>
<li><p>Dramatically improves thermal dissipation, cuts electrical losses, and maximizes interconnect density for 5G, defense avionics, and high-performance computing.</p></li>
</ul></li>
<li><p><strong>Regional Milestone:</strong> Makes <strong>Odisha the first Indian state</strong> to host both a dedicated compound semiconductor fab and an advanced 3D packaging plant.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--national-cadet-corps-ncc"><h2 id="2026-04-ca--national-cadet-corps-ncc">National Cadet Corps (NCC)</h2>
<ul>
<li><p><strong>Why in News:</strong> National Cadet Corps (NCC), in collaboration with the National Institute of Electronics and Information Technology (NIELIT), launched a nationwide Cyber Security Capacity Building Programme to train 'Cyber Cadets', supporting Digital India and National Skills Qualifications Framework (NSQF) skill development.</p></li>

<ul>
<li><p>Voluntary <strong>Tri-Services youth organisation</strong> (Army, Navy, and Air Force) under the <strong>Ministry of Defence</strong>.</p></li>
<li><p>Established under the <strong>National Cadet Corps Act, 1948</strong>, based on the recommendations of the <strong>H. N. Kunzru Committee</strong>.</p></li>
<li><p>Recognised as the world's largest uniformed youth organisation.</p></li>
</ul></li>
<li><p><strong>Leadership &amp; Headquarters:</strong> Headed by a <strong>Director General</strong> (holding the rank of Lieutenant General) with headquarters in <strong>New Delhi</strong>.</p></li>
</ul></section>

<li><p><strong>Static Context (ISEA Framework):</strong> Flagship capacity-building initiative of the <strong>Ministry of Electronics and Information Technology (MeitY)</strong> aimed at human resource development, training professionals, and fostering public information security awareness.</p></li>
<li><p><strong>Target &amp; Execution:</strong></p>
