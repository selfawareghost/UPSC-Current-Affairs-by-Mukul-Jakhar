<section class="blk" data-sec="2026-07-dte--cover-story-a-sea-of-plastic-marine-litter"><h2 id="2026-07-dte--cover-story-a-sea-of-plastic-marine-litter">Cover story: "A sea of plastic" — marine litter</h2>
<h5>Concepts:</h5>
<ul>
<li><p><strong>Marine litter (UNEP):</strong> "any persistent, manufactured or processed solid material discarded, disposed of or abandoned in the marine and coastal environment". Plastic is the largest component.</p></li>
<li><p><strong>Plastic size classes:</strong></p>
<ul>
<li><p><strong>macro: 2.5 cm–1 m</strong>;</p></li>
<li><p><strong>meso: 5 mm–2.5 cm</strong>;</p></li>
<li><p><strong>micro: under 5 mm</strong>;</p></li>
<li><p>then <strong>nanoplastics</strong>.</p></li>
<li><p>Microplastics are now found in almost every major human organ.</p></li>
</ul></li>
<li><p><strong>Sources:</strong> <strong>70–80% is land-based</strong>, reaching the sea through rivers and drains. Sea-based sources include fishing gear (<strong>ghost nets</strong>) and shipping.</p></li>
<li><p><strong>Ocean gyres:</strong> five major <strong>garbage patches</strong> sit at their centres: <strong>North and South Pacific, North and South Atlantic, and Indian Ocean</strong>.</p></li>
</ul>
<h5>Global figures:</h5>
<ul>
<li><p>About <strong>400 Mt</strong> of plastic is produced a year, and only <strong>about 10% is recycled</strong> (UN <strong>World Ocean Assessment</strong>, released <strong>8 June</strong>, World Oceans Day). About <strong>4,000 marine species</strong> are threatened.</p></li>
<li><p><strong><em>Nature Communications</em> (2017):</strong> rivers carry <strong>1.15–2.41 Mt</strong> of plastic to the sea each year.</p>
<ul>
<li><p>The <strong>top 20 rivers (mostly Asian) carry 67%</strong>, and Asian rivers carry <strong>86%</strong> in all.</p></li>
<li><p>The <strong>Yangtze is first (0.33 Mt)</strong> and the <strong>Ganga second (0.12 Mt)</strong>.</p></li>
<li><p>About 74% enters between May and October, peaking in August.</p></li>
</ul></li>
<li><p><strong>Treaty status:</strong> <strong>UNEA-5.2 resolution 5/14 (2022)</strong> set up an <strong>Intergovernmental Negotiating Committee</strong> for a <strong>legally binding plastics treaty</strong> covering the <strong>full life cycle</strong> of plastic. No agreement has been reached; the 2025 draft was not accepted.</p></li>
</ul>
<h5>India:</h5>
<ul>
<li><p><strong>MSC ELSA 3</strong> sank <strong>24 km off Kerala on 25 May 2025</strong>, spilling <strong>plastic pellets (nurdles)</strong>. They washed up along Kerala, Tamil Nadu and Sri Lanka, including the <strong>Gulf of Mannar and Palk Bay</strong>, and remained visible in 2026.</p></li>
<li><p><strong>Lakshadweep (KUFOS surveys):</strong> microplastics were found even on <strong>uninhabited islands</strong>; <strong>polyethylene</strong> is the dominant polymer.</p></li>
<li><p><strong>Abandoned fibre-reinforced plastic (FRP) boats:</strong> <strong>572</strong> were found across 23 landing centres in Kerala (ICAR-CIFT, April 2026). FRP is a <strong>thermoset</strong>, which makes it hard to recycle.</p></li>
<li><p><strong>Mithi river (Mumbai):</strong> <strong>17 km</strong>, from <strong>Vihar lake to Mahim Bay</strong>. It carried the floodwaters of the <strong>2005 floods</strong> (about 1,000 deaths); after widening, its carrying capacity has <strong>doubled</strong>.</p></li>
<li><p><strong>Draft National Marine Litter Policy</strong> (zero draft by <strong>NCCR Chennai</strong>, under the Ministry of Earth Sciences): <strong>4 targets</strong> (land-based sources, sea-based sources, beaches as source and sink, mitigation) and <strong>20 strategies</strong>, including EPR, deposit-refund schemes and trash booms.</p></li>
<li><p><strong>CMFRI</strong> has mapped litter on <strong>261 beaches</strong>. India's <strong>single-use plastic ban</strong> came in <strong>2022</strong>.</p></li>
<li><p><strong>Good practice:</strong></p>
<ul>
<li><p><strong>ROKA "We Segregate"</strong> in Kasturba Nagar, Chennai, has diverted 90 t of dry waste;</p></li>
<li><p><strong>Plastic Fischer</strong> and <strong>River Recycle</strong> run <strong>trash booms</strong> in Mumbai drains.</p></li>
</ul></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> <strong>Microplastics are under 5 mm</strong>. <strong>Land-based</strong> sources dominate, not shipping. The plastics treaty process comes from <strong>UNEA (UNEP)</strong>, not UNFCCC or the Basel Convention, though Basel's <strong>2019 plastic waste amendments</strong> regulate trade in plastic waste.</p></div></section>
<section class="blk" data-sec="2026-07-dte--pfas-forever-chemicals-in-the-ganga"><h2 id="2026-07-dte--pfas-forever-chemicals-in-the-ganga">PFAS ("forever chemicals") in the Ganga</h2>
<div class="callout c-concept"><span class="c-tag">Concept</span><p><strong>Concept:</strong> <strong>PFAS (per- and polyfluoroalkyl substances)</strong> are synthetic carbon–fluorine compounds. The <strong>C–F bond is very strong</strong>, so they persist for decades. They are used in non-stick cookware, clothing and food packaging, and are linked to <strong>cancer, thyroid problems, immune suppression and reproductive harm</strong>.</p></div>
<p><strong>Study</strong> (<em>Environment International</em>, January 2026; University of Graz and IIT Roorkee):</p>
<ul>
<li><p>Sediments were sampled at <strong>14 sites</strong> along a <strong>58-km stretch from Rishikesh to Roorkee</strong>, covering the Ganga and the Upper Ganga Canal.</p></li>
<li><p><strong>Main finding:</strong></p>
<ul>
<li><p>targeted tests (LC-MS/MS) found only <strong>16 known PFAS</strong>;</p></li>
<li><p>these account for <strong>under 1% of the total extractable organic fluorine</strong>;</p></li>
<li><p>known PFAS measured 0.02–5.3 ng/g, against total organic fluorine of 180–780 ng/g;</p></li>
<li><p>so <strong>about 99% of the fluorine is unidentified</strong>.</p></li>
</ul></li>
<li><p>Sites near the <strong>SIDCUL industrial area</strong> (pharma, cosmetics) carried roughly <strong>double</strong> the upstream fluorine load.</p></li>
<li><p><strong>Precursor compounds</strong> that later turn into persistent PFAS explained up to <strong>26%</strong> of the load after oxidation testing (the TOP assay).</p></li>
<li><p><strong>Short-chain PFAS</strong> dominate. These came into use after long-chain PFAS were restricted under the <strong>Stockholm Convention</strong>, but they are <strong>more mobile</strong>.</p></li>
<li><p><strong>India has no PFAS standards</strong> for drinking water, soil, sediment or food, and no dedicated monitoring programme.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> <strong>PFOS, PFOA and PFHxS</strong> are listed under the <strong>Stockholm Convention (POPs)</strong>. India has ratified the Convention but still has <strong>no PFAS standards</strong>. "Short-chain" PFAS do <strong>not</strong> mean safe.</p></div></section>
<section class="blk" data-sec="2026-07-dte--lac-a-sticky-decline"><h2 id="2026-07-dte--lac-a-sticky-decline">Lac: a "sticky decline"</h2>
<h4 id="2026-07-dte--concepts">Concepts</h4>
<ul>
<li><p><strong>Lac</strong> is a natural resin secreted by the <strong>female lac insect, <em>Kerria lacca</em></strong>. Its refined form, <strong>shellac</strong>, is used for tablet coatings, food, cosmetics, bangles and defence uses.</p></li>
<li><p><strong>There are two strains:</strong></p></li>
</ul>
<div class="table-wrap"><table>

<thead>
<tr class="header">
<th><strong>Strain</strong></th>
<th><strong>Host trees</strong></th>
<th><strong>Note</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>Rangeeni</strong> (deep red)</td>
<td><strong>Ber</strong> (<em>Ziziphus mauritiana</em>), <strong>palash</strong> (<em>Butea monosperma</em>)</td>
<td>Was about 80% of output, but fell after attacks by the <strong>parasitic wasp <em>Aprostocetus purpureus</em></strong> as winters warmed</td>
</tr>
<tr class="even">
<td><strong>Kusmi</strong> (lighter, fetches a higher price)</td>
<td><strong>Kusum</strong> (<em>Schleichera oleosa</em>)</td>
<td>Overtook rangeeni by the late 2000s and was <strong>68% of output in 2019–20</strong></td>
</tr>
</tbody>
</table></div>
<ul>
<li><p><strong>Production:</strong></p>
<ul>
<li><p><strong>India is the world's largest producer</strong>; lac is grown in 11 states and supports <strong>3–4 million families</strong>.</p></li>
<li><p><strong>Jharkhand produces about 54%</strong>, followed by Chhattisgarh and MP.</p></li>
<li><p>Output <strong>peaked at 21,590 t in 2020–21</strong>, fell about 37% by 2023–24, and was <strong>17,061 t in 2024–25</strong>.</p></li>
<li><p>Chhattisgarh (+29%) and MP (+40%) grew over the decade, while West Bengal collapsed.</p></li>
</ul></li>
<li><p><strong>Climate effects:</strong></p>
<ul>
<li><p>heat skews the <strong>sex ratio towards males</strong>, and only <strong>females secrete lac</strong>;</p></li>
<li><p>fog, excess rain and hail kill the settled insects;</p></li>
<li><p>warmer winters favour the parasitic wasp.</p></li>
</ul></li>
<li><p><strong>New hosts:</strong> <em><strong>Flemingia semialata</strong></em> and <em><strong>Calliandra calothyrsus</strong></em>, both drought-tolerant.</p></li>
<li><p><strong>Exports:</strong> <strong>12,858 t worth $154.44 million (2024–25)</strong>, up from $17.81 million in 2013–14. Global demand is 5–6 times production, and Indonesia and Thailand are emerging competitors.</p></li>
<li><p><strong>Policy gaps:</strong></p>
<ul>
<li><p><strong>TRIFED's MSP of ₹235/kg (fixed 2020) is unchanged</strong>, while market prices are ₹1,000–1,200/kg;</p></li>
<li><p>lac is still treated as <strong>minor forest produce</strong>, not as an agricultural product.</p></li>
</ul></li>
<li><p><strong>Research body:</strong> <strong>ICAR–National Institute of Secondary Agriculture, Ranchi</strong>, formerly the Indian Institute of Natural Resins and Gums (renamed in <strong>2022</strong>).</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> Lac is an <strong>insect secretion</strong>, not a plant resin. <strong>Kusmi</strong> lac is grown on <strong>kusum</strong>; <strong>rangeeni</strong> on <strong>ber and palash</strong>. Lac counts as <strong>minor forest produce</strong> (FRA, PESA, MSP for MFP).</p></div></section>
<section class="blk" data-sec="2026-07-dte--illness-linked-suicides-ncrb-adsi-2024"><h2 id="2026-07-dte--illness-linked-suicides-ncrb-adsi-2024">Illness-linked suicides (NCRB ADSI 2024)</h2>
<p><strong>Facts</strong>:</p>
<ul>
<li><p><strong>Total suicides in 2024: 170,746.</strong> The national <strong>suicide rate is 12.2 per lakh</strong>.</p></li>
<li><p><strong>Causes:</strong> <strong>family problems are first (33.5%)</strong>, and <strong>illness is second (17.9%, or 30,617 deaths)</strong>. Within illness:</p>
<ul>
<li><p>mental illness: <strong>14,305</strong>;</p></li>
<li><p>prolonged illness: 14,075.</p></li>
</ul></li>
<li><p>That is about <strong>84 deaths a day</strong> from illness, three times the <strong>10,546 farm-sector suicides</strong>.</p></li>
<li><p><strong>Trend:</strong> illness-linked suicides rose <strong>about 45% in a decade</strong>, from <strong>21,178 (2015) to 30,617 (2024)</strong>. The number of states above the national share rose from 12 to 16.</p></li>
<li><p><strong>Punjab:</strong></p>
<ul>
<li><p><strong>50.4%</strong> of its suicides are illness-linked, the highest among states and up from 23.5% in 2015;</p></li>
<li><p><strong>95%</strong> of those are linked to mental illness;</p></li>
<li><p>yet Punjab's overall suicide rate is only 7.2.</p></li>
</ul></li>
<li><p><strong>Lakshadweep:</strong> 100% (all 3 cases).</p></li>
<li><p><strong>Cities:</strong> <strong>Bengaluru recorded the most suicides (469)</strong>, followed by Chennai, Surat, Delhi and Ludhiana.</p></li>
<li><p><strong>Mental-health treatment gap:</strong> about <strong>85%</strong>.</p></li>
<li><p><strong>Under-reporting:</strong> the <strong>Million Death Study (2010)</strong> put suicide rates at about twice NCRB's figures.</p></li>
</ul>
<div class="callout c-frame"><span class="c-tag">Prelims lens</span><h5>Prelims framing:</h5><ul>
<li><p><strong>Mental Healthcare Act, 2017 (Section 115):</strong> a person attempting suicide is <strong>presumed to be under severe stress</strong>, which in effect decriminalised attempts.</p></li>
<li><p><strong>National Suicide Prevention Strategy (2022):</strong> targets a <strong>10% cut in suicide deaths by 2030</strong>.</p></li>
<li><p><strong>Tele-MANAS</strong> is the national mental-health helpline.</p></li>
<li><p>NCRB comes under the <strong>Ministry of Home Affairs</strong>.</p></li>
</ul></div></section>
<section class="blk" data-sec="2026-07-dte--food-safety-forest-diversion-and-industry-regula"><h2 id="2026-07-dte--food-safety-forest-diversion-and-industry-regula">Food safety, forest diversion and industry regulation</h2>
<h3 class="topic" id="2026-07-dte--antibiotics-in-food">Antibiotics in food</h3>
<ul>
<li><p><strong>Background:</strong> the <strong>EU</strong> banned imports of animal products raised with antibiotics as <strong>growth promoters</strong>. In <strong>2023</strong> it <strong>left India off</strong> the list of countries cleared to export aquaculture and poultry products from <strong>September 2026</strong>.</p></li>
<li><p><strong>India's response:</strong></p>
<ul>
<li><p><strong>October 2024:</strong> <strong>FSSAI</strong> listed <strong>banned antibiotics</strong> and set <strong>Maximum Residue Limits (MRLs)</strong> for meat, milk, poultry, eggs and fish.</p></li>
<li><p><strong>May 2025:</strong> a draft notification banned <strong>veterinary use of 34 of the 37</strong> antibiotics the EU classes as critical for humans; it was <strong>notified in September 2025</strong>.</p></li>
<li><p><strong>May 2026:</strong> the <strong>EU added India</strong> to its approved list.</p></li>
</ul></li>
<li><p><strong>Earlier steps:</strong></p>
<ul>
<li><p>an advisory against antibiotics in <strong>honey (2010)</strong>, later a ban;</p></li>
<li><p>a <strong>ban on colistin in food animals (2019)</strong>; colistin is a last-resort antibiotic for humans.</p></li>
</ul></li>
<li><p>The <strong>US FDA refused about 2,700 Indian food consignments in 2024–25</strong>, mainly over pesticide residues.</p></li>
<li><p>The <strong>NDDB</strong> promotes <strong>ethno-veterinary medicine</strong> to cut antibiotic use.</p></li>
</ul>
<h3 class="topic" id="2026-07-dte--forest-diversion-factsheet">Forest diversion factsheet</h3>
<ul>
<li><p>From <strong>July 2023 to May 2026</strong>, the Centre approved <strong>242 of 288 proposals (80%)</strong> under the <strong>Van (Sanrakshan Evam Samvardhan) Adhiniyam, 1980</strong>, the former Forest (Conservation) Act renamed in 2023. They divert <strong>22,644 ha</strong>, mainly for mining, hydropower and rehabilitation.</p></li>
<li><p>More than <strong>2.8 million trees</strong> were felled on forest land in three years. The states most affected are <strong>Arunachal Pradesh, Odisha and Chhattisgarh</strong>.</p></li>
<li><p><strong>Hasdeo (Chhattisgarh):</strong> protests against felling about <strong>0.4 million trees for coal</strong>. Data comes from <strong>PARIVESH 2.0</strong> Advisory Committee minutes.</p></li>
</ul>
<h3 class="topic" id="2026-07-dte--industry">Industry</h3>
<ul>
<li><p><strong>A CSR framework for coal:</strong> the coal ministry, <strong>Coal India</strong> and the <strong>Indian Institute of Corporate Affairs</strong> are drafting the first <strong>sector-specific CSR framework</strong>. It is expected to include outcome-based KPIs, SDG mapping, BRSR alignment and a Green Credit link.</p></li>
<li><p><strong>The CSR law itself:</strong> under <strong>Section 135 of the Companies Act, 2013</strong>, CSR applies to companies with <strong>net worth ≥ ₹500 crore, or turnover ≥ ₹1,000 crore, or net profit ≥ ₹5 crore</strong>. They must spend <strong>2% of average net profit</strong> over the preceding three years.</p></li>
<li><p><strong>Brick kilns in the NCR:</strong> despite the <strong>CAQM ban on coal</strong>, <strong>72% of 152 kilns</strong> used coal in 2026, mixed with biomass. All have <strong>switched to zig-zag technology</strong>, but <strong>78% had no green cover</strong>.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> <strong>Colistin</strong> is a <strong>last-resort (reserve) antibiotic</strong> for humans. <strong>MRL</strong> stands for <strong>Maximum Residue Limit</strong>. The <strong>Forest (Conservation) Act</strong> was <strong>renamed</strong> by the 2023 amendment; it was not repealed.</p></div></section>
<section class="blk" data-sec="2026-07-dte--economy-inequality-and-development-goals"><h2 id="2026-07-dte--economy-inequality-and-development-goals">Economy, inequality and development goals</h2>
<h3 class="topic" id="2026-07-dte--the-first-trillionaire-and-the-poverty-debate">The first trillionaire and the poverty debate</h3>
<ul>
<li><p><strong>Elon Musk became the world's first trillionaire on 12 June 2026</strong>, worth <strong>$1.11 trillion</strong> (Forbes).</p></li>
<li><p><strong>Wider picture:</strong></p>
<ul>
<li><p>billionaires <strong>passed 3,000</strong> in 2025;</p></li>
<li><p><strong>Oxfam:</strong> the <strong>richest 1% gained $33.9 trillion</strong> in 2015–25;</p></li>
<li><p><strong>UNCTAD:</strong> <strong>3.4 billion</strong> people live in countries that spend more on <strong>debt interest than on health or education</strong>.</p></li>
</ul></li>
<li><p><strong>"The Roadmap for Eradicating Poverty Beyond Growth" (10 June)</strong>, issued under <strong>Olivier De Schutter</strong>, the <strong>UN Special Rapporteur on extreme poverty and human rights</strong>, for the <strong>62nd session of the UN Human Rights Council</strong>.</p>
<ul>
<li><p>Supporters include Stiglitz, Jayati Ghosh, Piketty, Raworth and Hickel.</p></li>
<li><p>It argues for ending poverty <strong>without treating GDP growth as the main condition</strong>, through redistribution.</p></li>
</ul></li>
</ul>
<h3 class="topic" id="2026-07-dte--supreme-court-homemakers-as-nation-builders">Supreme Court: homemakers as "nation builders"</h3>
<ul>
<li><p>On <strong>11 June 2026</strong> (Justices Sanjay Karol and N Kotiswar Singh), the Court ruled that <strong>₹30,000 a month</strong> must be taken as a homemaker's minimum notional income for motor-accident compensation under the <strong>Motor Vehicles Act</strong>.</p></li>
<li><p>Women's <strong>unpaid care work</strong> is estimated at <strong>15–17% of India's GDP</strong>.</p></li>
<li><p><strong>SC (separate ruling):</strong> the <strong>right to walk on a demarcated footpath is a fundamental right</strong>.</p></li>
</ul>
<h3 class="topic" id="2026-07-dte--r-d-deficit">R&amp;D deficit</h3>
<ul>
<li><p>India's <strong>R&amp;D spending is only 0.64% of GDP</strong> (rank <strong>55th</strong> for intensity).</p></li>
<li><p><strong>Business funds only 36%</strong> of India's R&amp;D, against over <strong>70%</strong> in leading economies (Israel <strong>93%</strong>, Vietnam 90.5%).</p></li>
<li><p><strong>Total R&amp;D spend (WIPO):</strong></p>
<ul>
<li><p>India rose from <strong>$20.8 billion (2000) to $75.7 billion (2024)</strong>, putting it in the top 15;</p></li>
<li><p>China rose to <strong>$785.9 billion</strong>.</p></li>
</ul></li>
<li><p><strong>Chief Economic Adviser V Anantha Nageswaran</strong> has written about industry's reluctance to invest in R&amp;D.</p></li>
</ul>
<h3 class="topic" id="2026-07-dte--sdgs-after-2030">SDGs after 2030</h3>
<ul>
<li><p><strong>17 SDGs with 169 targets</strong> were adopted in <strong>2015</strong>. They are <strong>universal</strong>, whereas the <strong>8 MDGs (2000–2015)</strong> applied only to developing countries.</p></li>
<li><p><strong>SDG Report 2025:</strong></p>
<ul>
<li><p>only <strong>18% of targets are on track</strong>;</p></li>
<li><p><strong>35% have stalled or regressed</strong>;</p></li>
<li><p><strong>18% are below the 2015 baseline</strong>;</p></li>
<li><p>about <strong>8.9%</strong> of people will still be in extreme poverty in 2030.</p></li>
</ul></li>
<li><p>Implementation needs about <strong>$17 trillion</strong>. <strong>Post-2030 negotiations begin in 2027</strong>.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> <strong>MDGs = 8 goals (2000–2015)</strong> for developing countries only; <strong>SDGs = 17 goals, 169 targets (2015–2030)</strong> for all countries. India's GERD has stayed <strong>below 1% of GDP</strong>; the <strong>Anusandhan National Research Foundation (2023)</strong> aims to raise private R&amp;D.</p></div></section>
<section class="blk" data-sec="2026-07-dte--science-and-biodiversity"><h2 id="2026-07-dte--science-and-biodiversity">Science and biodiversity</h2>
<h3 class="topic" id="2026-07-dte--avian-malaria-in-the-us-and-india">Avian malaria in the US and India</h3>
<ul>
<li><p><strong>Avian malaria:</strong> the parasite <em><strong>Plasmodium relictum</strong></em> is spread by <strong>mosquitoes</strong>. It destroys red blood cells, causing anaemia and organ failure.</p></li>
<li><p><strong>Hawaiʻi:</strong> the southern house mosquito (<em>Culex quinquefasciatus</em>) arrived in <strong>1826</strong>. Native <strong>honeycreepers</strong> fell from <strong>55 to 17 species</strong>, and avian malaria was found at <strong>63 of 64 sites</strong> (<em>Nature Communications</em>, February 2026).</p></li>
<li><p><strong>India: the Shola "sky islands" of the Western Ghats</strong> (1,200–2,600 m) carry <strong>three parasite groups</strong>:</p></li>
</ul>
<div class="table-wrap"><table>

<thead>
<tr class="header">
<th><strong>Parasite</strong></th>
<th><strong>Vector</strong></th>
<th><strong>Type</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><em><strong>Plasmodium</strong></em> (avian malaria)</td>
<td>Mosquitoes</td>
<td><strong>Generalist</strong> (switches hosts)</td>
</tr>
<tr class="even">
<td><em><strong>Haemoproteus</strong></em></td>
<td>Biting midges, louse flies</td>
<td>Specialist</td>
</tr>
<tr class="odd">
<td><em><strong>Leucocytozoon</strong></em></td>
<td>Black flies</td>
<td>Specialist</td>
</tr>
</tbody>
</table></div>
<ul>
<li><p>About <strong>40%</strong> of 1,000 Shola birds were infected (2020 study). Disturbance <strong>reduces specialists and favours generalists</strong> ("<strong>biotic homogenisation</strong>"). Warming lets <em>Plasmodium</em> spread higher.</p></li>
</ul>
<h3 class="topic" id="2026-07-dte--woh-g64-a-giant-star-nearing-supernova">WOH G64: a giant star nearing supernova</h3>
<ul>
<li><p>WOH G64 is a <strong>red supergiant</strong> in the <strong>Large Magellanic Cloud</strong>, about <strong>163,000 light-years</strong> away. It is about <strong>1,540 times the Sun's size</strong> and about 30 times its mass.</p></li>
<li><p>It appears to be changing into a <strong>yellow hypergiant</strong> (<em>Nature Astronomy</em>, February 2026; Poland's <strong>OGLE</strong> survey).</p></li>
<li><p>It is part of a <strong>binary system</strong>; its surface temperature has risen by about 1,000 K.</p></li>
<li><p><strong>Other candidates:</strong> <strong>Betelgeuse</strong> (Orion, about 640 light-years) and <strong>Spica</strong> (about 240 light-years).</p></li>
<li><p><strong>Historical supernovae:</strong> <strong>SN 185</strong> (RCW 86), <strong>1006</strong>, <strong>1054 (Crab Nebula)</strong>, <strong>1572 (Tycho)</strong> and <strong>1604 (Kepler)</strong>.</p></li>
<li><p>The <strong>Vera C Rubin Observatory's LSST</strong> (Chile, 2025) will find more candidates.</p></li>
</ul>
<h3 class="topic" id="2026-07-dte--other-snippets">Other snippets</h3>
<ul>
<li><p><strong>Tapanuli orangutan</strong> (<em>Pongo tapanuliensis</em>), the <strong>rarest great ape</strong>, found only in <strong>Batang Toru, North Sumatra</strong>: <strong>Cyclone Senyar (November 2025)</strong> set off landslides that killed <strong>58</strong>, about <strong>7%</strong> of the population (<em>Current Biology</em>).</p></li>
<li><p><strong>"Whale necropolis":</strong> Chinese scientists found <strong>476 whale fossils and 5 active whale falls</strong> in the <strong>Diamantina Zone</strong> of the southeastern Indian Ocean (about 1,200 km west of Perth, 4,200–7,000 m deep). It is about <strong>5 million years</strong> old (<em>Nature</em>, 10 June).</p></li>
<li><p><strong>Bots now generate 57.5% of web traffic</strong>, overtaking humans for the first time (Cloudflare).</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> A <strong>light-year</strong> measures <strong>distance</strong> (about 9.46 trillion km), not time. The <strong>Crab Nebula</strong> is the remnant of the <strong>1054</strong> supernova recorded by Chinese astronomers. The Tapanuli orangutan was described only in <strong>2017</strong> and is <strong>Critically Endangered</strong>.</p></div></section>
<div class="divider" id="2026-07-dte--div-july-2026-part-ii"><span>July 2026 · Part II</span></div>
<section class="blk" data-sec="2026-07-dte--cover-story-reverse-migration-back-to-farms"><h2 id="2026-07-dte--cover-story-reverse-migration-back-to-farms">Cover story: reverse migration back to farms</h2>
<div class="callout c-concept"><span class="c-tag">Concept</span><p><strong>Core idea:</strong> In normal development (the Lewis model), workers move <em>out</em> of farming into industry and services. India has seen the reverse since about 2018–19: the share of workers in agriculture went <strong>up</strong>. (Magazine pp30–42)</p></div>
<div class="table-wrap"><table>

<thead>
<tr class="header">
<th><strong>Year (PLFS, usual status)</strong></th>
<th><strong>Share of workforce in agriculture</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>2017–18</td>
<td>44.1%</td>
</tr>
<tr class="even">
<td>2018–19</td>
<td>42.5% (lowest)</td>
</tr>
<tr class="odd">
<td>2019–20</td>
<td>45.6%</td>
</tr>
<tr class="even">
<td>2023–24</td>
<td>about 46%</td>
</tr>
</tbody>
</table></div>
<ul>
<li><p><strong>PLFS 2025</strong> shows about 43%, but it is <strong>not comparable</strong>: PLFS moved to a calendar-year, monthly-estimate design. (p32)</p></li>
<li><p>Mehrotra and Parida (<em>India Out of Work</em>): about <strong>80 million</strong> workers added to agriculture between 2019–20 and 2023–24.</p></li>
<li><p><strong>ILO–IHD India Employment Report 2024</strong> calls it a “reversal of structural transformation”; the youth share in agriculture rose by 5.6 percentage points (2019–22).</p></li>
<li><p>R Nagaraj (<em>World Development</em>, 2025): in <strong>UP</strong> the agriculture share rose 48.8% → 55.9% while manufacturing fell 12.8% → 8.5%. Bihar +9.1 points, Kerala +7.1 points. Causes cited: <strong>demonetisation, GST, COVID-19</strong>.</p></li>
<li><p>Mismatch: agriculture holds about <strong>45–46% of jobs</strong> but only about <strong>16–18% of GVA</strong>, so output per worker is low. Real rural casual wages have been nearly flat since 2012.</p></li>
<li><p>Goldar and Aggarwal: the main driver was <strong>rural women</strong> joining the workforce (mostly as unpaid helpers on family farms). ICAR study: “distress-induced diversification”.</p></li>
<li><p>Doubling Farmers’ Income target: announced 2016, deadline 2022 (missed).</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> A rising female LFPR is <em>not</em> automatically good news. Much of the rise is self-employment and unpaid family work in agriculture. Also, a rise in agriculture’s <em>employment</em> share alongside a falling <em>GVA</em> share signals disguised unemployment, not farm prosperity.</p></div></section>
<section class="blk" data-sec="2026-07-dte--ethanol-push-beyond-e20"><h2 id="2026-07-dte--ethanol-push-beyond-e20">Ethanol push: beyond E20</h2>
<div class="callout c-news"><span class="c-tag">In the news</span><p><strong>News:</strong> On 13 June 2026 Union Road Transport Minister Nitin Gadkari announced legal recognition of <strong>100% ethanol (E100)</strong> as a fuel and a plan for <strong>isobutanol</strong> blending (with diesel). <strong>E85</strong> was launched on 5 June at Puri. (Magazine pp22–28)</p></div>
<h4 id="2026-07-dte--key-figures">Key figures</h4>
<ul>
<li><p><strong>E20</strong> (20% ethanol in petrol) was reached in <strong>2025</strong>. Claimed savings: ₹1.91 lakh crore of forex and 30.2 Mt of crude.</p></li>
<li><p>The ethanol supply year (ESY) runs <strong>November–October</strong>.</p></li>
<li><p><strong>Maize</strong> is now the largest feedstock, ahead of sugarcane juice/molasses and rice.</p></li>
</ul>

<li><p>Bihar maize area +45% (helped by Bihar’s 2021 ethanol policy). Maize ethanol price: ₹71.86/litre.</p></li>
<li><p><strong>Water per litre of ethanol:</strong> maize 3,764 L; sugarcane 3,837 L; rice 9,854 L. Spring maize in Punjab draws down groundwater.</p></li>
<li><p>Economic Survey 2025–26 flags a trade-off between <strong>energy Aatmanirbharta</strong> and <strong>food (edible oil, pulses) Aatmanirbharta</strong>: maize displaced soybean and pulses.</p></li>
</ul>
<h4 id="2026-07-dte--second-generation-2g-ethanol">Second-generation (2G) ethanol</h4>
<ul>
<li><p><strong>PM JI-VAN Yojana</strong> (2019, ₹1,969.50 crore) supports 2G bio-ethanol plants that use crop residue and other lignocellulosic biomass.</p></li>
<li><p>IOCL <strong>Panipat</strong> (100 klpd, rice straw) is running at about 62% capacity. BPCL <strong>Bargarh</strong> (Odisha). <strong>Numaligarh</strong> (Assam), bamboo-based, 185 klpd.</p></li>
<li><p>Cost: 2G ethanol about ₹120/L against about ₹72/L for 1G.</p></li>
<li><p>Local protests against grain-ethanol plants: Bemetara (Chhattisgarh), Jhajjar (Haryana), Hanumangarh (Rajasthan).</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> The National Policy on Biofuels 2018 (amended <strong>2022</strong>) advanced the E20 target from 2030 to <strong>2025–26</strong>. 1G uses food crops (cane, grain); 2G uses non-food biomass (straw, bamboo); 3G uses algae. Rice needs the most water per litre of ethanol, not sugarcane.</p></div></section>
<section class="blk" data-sec="2026-07-dte--supreme-court-walking-on-footpaths-is-a-fundamen"><h2 id="2026-07-dte--supreme-court-walking-on-footpaths-is-a-fundamen">Supreme Court: walking on footpaths is a fundamental right</h2>
<ul>
<li><p><strong>Case:</strong> <em>Maniyar Iliyaz v. P Ayyappan</em>, judgment of <strong>19 June 2026</strong>, Justices <strong>P S Narasimha and A S Chandurkar</strong>. (Magazine pp14–17)</p></li>
<li><p>Held: a safe, usable footpath is part of <strong>Article 21</strong> (life and personal liberty) and <strong>Article 19(1)(d)</strong> (freedom to move freely throughout India).</p></li>
<li><p>The Court opened a suo motu case, “Re: Fundamental Right to Walk and Footpath”, and asked the <strong>Law Commission</strong> to examine a legal framework.</p></li>
<li><p><strong>Data (2024):</strong> 36,526 pedestrians killed, <strong>20.6%</strong> of road deaths. Pedestrians plus two-wheeler riders make up about <strong>67%</strong> of road deaths.</p></li>
</ul>
<div class="table-wrap"><table>

<thead>
<tr class="header">
<th><strong>Existing provision</strong></th>
<th><strong>What it says</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Central Motor Vehicles Rules</td>
<td>Bar parking on footpaths</td>
</tr>
<tr class="even">
<td>Motor Vehicles Act, Section 198A</td>
<td>Penalises authorities/contractors for failing road design and maintenance standards</td>
</tr>
<tr class="odd">
<td>RPwD Act 2016, Sections 40–41</td>
<td>Accessibility of the built environment and transport</td>
</tr>
<tr class="even">
<td>Street Vendors Act 2014</td>
<td>Vending zones, so footpaths are not simply cleared by eviction</td>
</tr>
<tr class="odd">
<td>IRC guideline</td>
<td>Minimum clear footpath width of 1.8 m</td>
</tr>
<tr class="even">
<td>NUTP 2006; Metro Rail Policy 2017</td>
<td>Priority to people over vehicles; last-mile walking access</td>
</tr>
</tbody>
</table></div>
<ul>
<li><p><strong>Good practice:</strong> Chennai Non-Motorised Transport (NMT) policy (2014), with 60% of the transport budget for walking and cycling; Pimpri-Chinchwad ₹200 crore green bond (“Harit Setu”); Srinagar 100 km pedestrian network; Punjab and Haryana HC order (2022) mandating footpaths.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> Article 19(1)(d) is a right of <strong>citizens</strong> only; Article 21 covers every person. The “right to walk” was read into existing Articles; no new Article was added.</p></div></section>
<section class="blk" data-sec="2026-07-dte--uttar-pradesh-rivers-recorded-as-drains"><h2 id="2026-07-dte--uttar-pradesh-rivers-recorded-as-drains">Uttar Pradesh: rivers recorded as drains</h2>
<ul>
<li><p>UP admitted in an affidavit to the <strong>NGT</strong> (9 April 2026, in M C Mehta, OA 200/2014) that about <strong>20 rivers in 37 districts</strong> are recorded and treated as drains (nallahs). This followed an NGT order of 23 July 2025. (pp18–21)</p></li>
<li><p>Examples: <strong>Tilodki Ganga</strong>, <strong>Karodan / Gayatri Ganga</strong>, <strong>Tamsa (Ton)</strong>, <strong>Suav</strong>, <strong>Chandrawal</strong>.</p></li>
<li><p>Elsewhere: in Uttarakhand the <strong>Rispana, Bindal</strong>, Rambha and Kalyani are listed as drains; in Delhi the <strong>Sahibi</strong> river is the <strong>Najafgarh drain</strong>.</p></li>
<li><p><strong>Why it matters legally:</strong> the <strong>Ganga Authorities Order 2016</strong> (under the Environment Protection Act 1986) covers the Ganga <em>and its tributaries</em>. Under the <strong>Water Act 1974</strong>, “stream” includes rivers and drains, so calling a river a drain does not remove protection.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> The Water (Prevention and Control of Pollution) Act is <strong>1974</strong>; it created the CPCB and SPCBs. The NGT was set up under the <strong>NGT Act 2010</strong>.</p></div></section>
<section class="blk" data-sec="2026-07-dte--monsoon-deficit-and-drought-preparedness"><h2 id="2026-07-dte--monsoon-deficit-and-drought-preparedness">Monsoon deficit and drought preparedness</h2>
<ul>
<li><p><strong>June 2026 rainfall:</strong> about <strong>40% deficient</strong>; 76% of districts deficient; the <strong>5th driest June</strong> in over 125 years. The deficit narrowed to about 12% in the first week of July. (Magazine pp12, 58)</p></li>
<li><p>Kharif sowing was down about 23%. IMD forecast July rain <strong>below 94% of the LPA</strong> (July LPA: 280.4 mm). July gives about <strong>30%</strong> of season rainfall, so a July deficit makes drought likely (as in 2009 and 2014).</p></li>
<li><p><strong>Response:</strong> PMO meeting with 15 ministries on 7 July; a multi-ministry task force; 262 districts updated District Agriculture Contingency Plans; <strong>ICAR</strong> issued SOPs on “Managing El Niño Risks in Indian Agriculture”.</p></li>
<li><p><strong>315 vulnerable districts</strong>: 111 with under 25% irrigation, 76 with 25–50%, 128 better irrigated.</p></li>
<li><p><strong>Background:</strong> DST: 279 districts at “very high” or “high” drought risk; about one-third of India is chronically drought-prone; a severe drought every 8–9 years historically. MGNREGA created 12.5 million water-conservation assets.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> El Niño is warming of the <strong>central and eastern equatorial Pacific</strong>; it usually weakens the Indian monsoon. A positive <strong>Indian Ocean Dipole</strong> can offset it. IMD calls seasonal rain “below normal” at 90–95% of LPA and “deficient” below 90%.</p></div></section>

<td>95% of new registrations electric by 2027</td>
</tr>
</tbody>
</table></div>
<ul>
<li><p>Incentives (year 1): up to ₹30,000 for e-2W, up to ₹50,000 for e-3W; road tax and registration fee waivers till March 2030; scrappage support.</p></li>
<li><p>Delhi’s 2020 EV policy took EV share of sales to <strong>13%</strong> (2025) vs about 7% nationally. Two-wheelers are 68% of Delhi’s registered vehicles. Delhi has 13,000 public chargers and needs 36,000–37,000.</p></li>
<li><p><strong>BluSmart:</strong> SEBI interim order of 15 April 2025 found founders (also running <strong>Gensol Engineering</strong>) allegedly diverted ₹262 crore of EV loans. BluSmart was the first Indian mobility firm with <strong>Verra</strong> carbon-credit accreditation. Fleet break-even needs about 200–220 km/day.</p></li>
<li><p>Gig workers: the <strong>Code on Social Security 2020</strong> covers gig and platform workers, but rules remain incomplete.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> The fleet ICE ban is for <strong>new</strong> inductions, not existing vehicles. SEBI (not RBI or MCA) issued the BluSmart/Gensol order.</p></div></section>
<section class="blk" data-sec="2026-07-dte--war-and-the-environment"><h2 id="2026-07-dte--war-and-the-environment">War and the environment</h2>
<ul>
<li><p>Iran sought <strong>UNEP</strong> help (19 June 2026) after strikes on oil facilities; “black rain” was reported in Tehran (and earlier Moscow). (Magazine p10)</p></li>
<li><p><strong>Ukraine:</strong> about 230 Mt CO2e in three years of war; the <strong>Kakhovka dam</strong> breach (2023). <strong>Gaza</strong> (UNEP): 61 Mt of debris; 97% of tree crops, 95% of shrubs and 82% of annual crops lost.</p></li>
<li><p>Militaries occupy 1–6% of land and cause about <strong>5.5% of global GHG emissions</strong>; military emissions reporting is voluntary under Kyoto and Paris.</p></li>
</ul>
<div class="table-wrap"><table>

<thead>
<tr class="header">
<th><strong>Instrument</strong></th>
<th><strong>Point to remember</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>ENMOD Convention</strong> (1976, in force 1978)</td>
<td>Bans military use of environmental modification techniques</td>
</tr>
<tr class="even">
<td><strong>Additional Protocol I</strong> to the Geneva Conventions (1977)</td>
<td>Bans methods causing “widespread, long-term and severe” environmental damage</td>
</tr>
<tr class="odd">
<td><strong>6 November</strong></td>
<td>International Day for Preventing the Exploitation of the Environment in War and Armed Conflict</td>
</tr>
<tr class="even">
<td>UNEA-2 resolution (2016)</td>
<td>Protection of the environment in areas affected by armed conflict</td>
</tr>
<tr class="odd">
<td><strong>ICJ advisory opinion on climate change</strong> (July 2025)</td>
<td>States have climate obligations under international law; a separate opinion raised conflict emissions</td>
</tr>

</table></div>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> The day is <strong>6 November</strong>, not 5 June (World Environment Day). ENMOD and AP I use different damage tests: ENMOD says widespread, long-lasting <strong>or</strong> severe; AP I requires all three.</p></div></section>
<section class="blk" data-sec="2026-07-dte--pharma-india-s-api-dependence-on-china"><h2 id="2026-07-dte--pharma-india-s-api-dependence-on-china">Pharma: India’s API dependence on China</h2>
<ul>
<li><p>About <strong>70%</strong> of India’s API needs, and up to <strong>90%</strong> of inputs for critical antibiotics (penicillin, cephalosporin), come from China (Drug Patent Watch 2026). (pp44–45)</p></li>
<li><p>Critical KSM: <strong>6-APA</strong> (for penicillin and amoxicillin). The global API market is about $247.8 billion.</p></li>
<li><p>India: generics to 190+ countries; pharma exports <strong>$31.1 billion (2025–26)</strong>; domestic market about $60 billion; meets 65–70% of WHO vaccine needs.</p></li>
<li><p><strong>PLI for bulk drugs/pharma:</strong> outlay ₹6,940 crore; investment of only ₹4,763.34 crore by December 2025.</p></li>
<li><p>AI in drug discovery: Anthropic launched <strong>Claude Science</strong> on 30 June 2026, a research workspace with 60+ scientific databases.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> API = the active ingredient; KSM = key starting material, the bottom of the chain. China’s grip is tightest on KSMs and intermediates.</p></div></section>
<section class="blk" data-sec="2026-07-dte--venezuela-earthquake-doublet-24-june-2026"><h2 id="2026-07-dte--venezuela-earthquake-doublet-24-june-2026">Venezuela earthquake doublet (24 June 2026)</h2>
<ul>
<li><p>Two quakes, <strong>M7.2 and M7.5</strong>, <strong>39 seconds apart</strong>; 1,719+ dead. The first was on the <strong>Boconó</strong> fault branch, which transferred stress to the <strong>San Sebastián</strong> fault on the northern coast. (pp52–53)</p></li>
<li><p><strong>Doublet:</strong> two independent mainshocks of similar size, close in time and place (unlike a mainshock–aftershock pair). DTE counts <strong>37</strong> doublets above M6 since 1907; Venezuela’s is the <strong>third-shortest</strong> interval.</p></li>
<li><p><strong>Background:</strong> Venezuela sits on the boundary of the <strong>Caribbean and South American plates</strong> (a transform/strike-slip boundary).</p></li>
</ul></section>
<section class="blk" data-sec="2026-07-dte--gitchak-nakana-first-subterranean-fish-from-assa"><h2 id="2026-07-dte--gitchak-nakana-first-subterranean-fish-from-assa"><em>Gitchak nakana</em>: first subterranean fish from Assam</h2>
<ul>
<li><p>Found in a dug well in <strong>Goalpara district</strong>, Assam; described in <em>Scientific Reports</em> (February 2026). (pp54–57)</p></li>
<li><p>Eyeless, translucent blood-red, max 20.8 mm, four pairs of barbels, and <strong>no skull roof</strong>. Name from Garo: fish + blind.</p></li>
<li><p><strong>Phreatobitic</strong> (lives in groundwater aquifers): only about 23 of 272 subterranean fish species worldwide are aquifer-dwellers.</p></li>
<li><p>India has <strong>22</strong> subterranean fish species, ranks <strong>4th</strong> globally; hotspots are <strong>Kerala</strong> and <strong>Meghalaya</strong>. <em>Aenigmachanna gollum</em> (Gollum snakehead, Kerala) is a “living fossil” from about 120 million years ago (Gondwana).</p></li>
<li><p>Threats: groundwater decline (India draws about 247 bcm a year, more than the US and China combined), chlorination of wells, aquarium trade.</p></li>
</ul></section>

<div class="divider" id="2026-04-ca--div-polity-and-governance"><span>Polity and Governance</span></div>
<section class="blk" data-sec="2026-04-ca--premature-release-of-convicts"><h2 id="2026-04-ca--premature-release-of-convicts">Premature Release of Convicts</h2>
<ul>
<li><p><strong>Why in News:</strong> Delhi HC questioned the denial of premature release of the convict in the Priyadarshini Mattoo case.</p></li>
<li><p><strong>Constitutional Framework:</strong></p>
<ul>
<li><p><strong>Article 72:</strong> Clemency/remission powers of the President.</p></li>
<li><p><strong>Article 161:</strong> Clemency/remission powers of the Governor.</p></li>
</ul></li>
<li><p><strong>Statutory Framework:</strong> Provisions under <strong>Bharatiya Nagarik Suraksha Sanhita (BNSS)</strong>.</p></li>
<li><p><strong>Eligibility &amp; Conditions:</strong></p>
<ul>
<li><p>Requires a mandatory minimum of <strong>14 years of actual imprisonment</strong> for serious offences.</p></li>
<li><p>Premature release is <strong>not automatic</strong>; eligibility creates a right to be considered, not an absolute guarantee of release.</p></li>
</ul></li>
<li><p><strong>Sentencing Review Board (SRB):</strong></p>
<ul>
<li><p><strong>Status:</strong> State-level administrative body assessing remission for life convicts.</p></li>
<li><p><strong>Composition:</strong> Senior bureaucrats/officials, including DG Prisons, Police Commissioner, Home Department officials, and Chief Secretary.</p></li>
<li><p><strong>Nature of Advice:</strong> Recommendations are <strong>advisory (not binding/final)</strong>; final authority rests with the executive/state government.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--prime-minister-s-term-comparative-term-limits"><h2 id="2026-04-ca--prime-minister-s-term-comparative-term-limits">Prime Minister’s Term &amp; Comparative Term Limits</h2>
<ul>
<li><p><strong>Why in News:</strong> PM Modi has become India's longest-serving Prime Minister.</p></li>
<li><p><strong>Constitutional Position (India):</strong></p>
<ul>
<li><p><strong>No fixed tenure:</strong> The Constitution does <strong>not</strong> specify a fixed term for the Prime Minister.</p></li>
<li><p><strong>Article 75:</strong> The PM holds office during the pleasure of the President, contingent upon enjoying the <strong>confidence of the Lok Sabha</strong>.</p></li>
<li><p><strong>Article 75(3):</strong> The Council of Ministers is collectively responsible to the House of the People (Lok Sabha).</p></li>
<li><p><strong>Anti-Defection Law (10th Schedule, 52nd CAA, 1985):</strong> Enforces party whip discipline; curbs cross-voting and weakens the practical leverage of no-confidence motions.</p></li>
<li><p><strong>Convention:</strong> Informal convention restricting the President to two terms (Constitution itself sets no term cap).</p></li>
</ul></li>
<li><p><strong>Global Term Limits:</strong></p>
<ul>
<li><p><strong>United States:</strong> 22<sup>nd</sup> Amendment limits the President to <strong>2 terms</strong> (maximum 8 years).</p></li>
<li><p><strong>Brazil:</strong> Up to <strong>2 consecutive terms</strong> (eligible again after a mandatory break).</p></li>
<li><p><strong>South Korea:</strong> Strictly a <strong>single 5-year term</strong> (no re-election allowed).</p></li>
<li><p><strong>Indonesia:</strong> Maximum of <strong>two terms</strong>.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--online-gaming-regulation-prog-act-2025-rules-202"><h2 id="2026-04-ca--online-gaming-regulation-prog-act-2025-rules-202">Online Gaming Regulation (PROG Act, 2025 &amp; Rules, 2026)</h2>
<ul>
<li><p><strong>Why in News:</strong> Ministry of Electronics and IT notified Promotion and Regulation of Online Gaming (PROG) Rules, 2026, effective from 1 May 2026, to operationalise the PROG Act, 2025.</p></li>
<li><p><strong>Parent Act &amp; Date:</strong> Promotion and Regulation of Online Gaming (PROG) Act, 2025; Rules effective from <strong>1 May 2026</strong>.</p></li>
<li><p><strong>Nodal Ministry:</strong> Ministry of Electronics and Information Technology (MeitY).</p></li>
<li><p><strong>Regulatory Body:</strong> <strong>Online Gaming Authority of India (OGAI)</strong> — set up as a "digital-first" attached office under MeitY for classification, registration, and enforcement.</p></li>
<li><p><strong>Core Mandates &amp; Controls:</strong></p>
<ul>
<li><p><strong>Complete Ban on Online Money Gaming:</strong> Blanket prohibition on monetary-stake games (applies to both chance and skill models).</p></li>
<li><p><strong>Permitted Categories:</strong> E-sports (subject to registration) and casual/social games (unless flagged for consumer risk).</p></li>
<li><p><strong>Registration Validity:</strong> Digital certificate for registered games/e-sports is valid for <strong>up to 10 years</strong>.</p></li>
<li><p><strong>90-Day Determination Test:</strong> Objective mechanism to classify and distinguish prohibited money games from permissible categories.</p></li>
</ul></li>
<li><p><strong>Safeguards &amp; Enforcement:</strong></p>
<ul>
<li><p>Mandatory age verification, parental controls, and fair-play mechanisms.</p></li>
<li><p>Financial gatekeeping: Banks and payment aggregators barred from facilitating transactions to prohibited platforms; ban on advertising money games.</p></li>
</ul></li>
<li><p><strong>Grievance Redressal &amp; Penalties:</strong></p>
<ul>
<li><p><strong>Two-tier system:</strong> First appeal to OGAI → Final appeal to Secretary, MeitY.</p></li>
<li><p><strong>Penalties:</strong> Up to ₹1 crore fine and up to 3 years imprisonment for offering/facilitating prohibited platforms.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--foreign-contribution-regulation-act-fcra-amendme"><h2 id="2026-04-ca--foreign-contribution-regulation-act-fcra-amendme">Foreign Contribution Regulation Act (FCRA) &amp; Amendment Bill, 2026</h2>
<ul>
<li><p><strong>Why in News:</strong> Government introduced the FCRA Amendment Bill.</p></li>
<li><p><strong>Nodal Authority:</strong> Ministry of Home Affairs (MHA).</p></li>
<li><p><strong>Static Context (FCRA 2010 &amp; 2020 Amendment):</strong></p>
<ul>
<li><p>Originally enacted in 1976; overhauled in 2010.</p></li>
<li><p><strong>2020 Amendments:</strong> Barred sub-granting of foreign funds to other entities, made Aadhaar mandatory for key functionaries, and mandated receiving funds exclusively via a designated SBI branch (Main Branch, New Delhi).</p></li>
</ul></li>
<li><p><strong>Proposed Amendments (2026 Bill):</strong></p>
<ul>
<li><p><strong>Vesting in Designated Authority:</strong> Creation of an authority empowered to take over, manage, or dispose of assets created using foreign funds if registration is cancelled, surrendered, or lapsed (deemed cessation).</p></li>
<li><p><strong>Broadened Accountability Definition:</strong> Liability expanded beyond the applicant entity to include directors, trustees, partners, governing council members, and controlling persons.</p></li>
<li><p><strong>State Probes:</strong> State law enforcement/investigative agencies must obtain prior Central Government approval before initiating FCRA inquiries.</p></li>
<li><p><strong>Fund Timelines:</strong> Statutory limits on utilization timelines; automatic cancellation upon expiry/non-renewal.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--governor-bound-by-cabinet-advice"><h2 id="2026-04-ca--governor-bound-by-cabinet-advice">Governor Bound by Cabinet Advice</h2>
<ul>
<li><p><strong>Why in News:</strong> Madras High Court held that under <strong>Article 161</strong>, the Governor is bound by State Cabinet advice in granting remission and cannot act independently, reaffirming the Governor's formal role in exercising pardon, reprieve, remission, or commutation under state law.</p></li>
<li><p><strong>Judicial Precedents:</strong></p>
<ul>
<li><p><strong>2004 M.P. Special Police Establishment Case:</strong> The "bias exception" (pertaining to sanction for prosecution) does not apply to Article 161 executive powers.</p></li>
<li><p><strong><em>Perarivalan</em> Ruling:</strong> Reaffirmed that the Governor is a formal head with no personal authority in purely executive matters.</p></li>
<li><p><strong><em>Nabam Rebia</em> Case:</strong> Exercise of gubernatorial discretion is subject to <strong>judicial review</strong> if arbitrary.</p></li>
<li><p><strong><em>State of Punjab</em> Case:</strong> On bill assents under Article 200, the Governor must act <strong>"as soon as possible"</strong> and cannot indefinitely delay action.</p></li>
</ul></li>
<li><p><strong>Constitutional Articles on Cabinet Advice:</strong></p>
<ul>
<li><p><strong>Article 154:</strong> State executive power is vested in the Governor, to be exercised directly or through subordinate officers (i.e., Council of Ministers).</p></li>
<li><p><strong>Article 163(1):</strong> Mandates the Council of Ministers to "aid and advise" the Governor, except in matters requiring constitutional discretion.</p></li>
<li><p><strong>Article 163(2) (Finality Clause):</strong> If a question arises whether a matter falls under the Governor's discretion, the <strong>Governor's decision is final</strong>.</p></li>
<li><p><strong>Article 163(3) (Advice Immunity):</strong> Courts are strictly barred from inquiring into the nature/content of advice tendered by Ministers.</p></li>
</ul></li>
<li><p><strong>Discretionary Powers &amp; Assent (Article 200):</strong></p>
<ul>
<li><p><strong>Constitutional Discretion:</strong> Reserving a bill for the President (<strong>Article 200</strong>), recommending President’s Rule (<strong>Article 356</strong>), and calling for administrative information from the CM (<strong>Article 167B</strong>).</p></li>
<li><p><strong>Situational Discretion:</strong> Appointing a Chief Minister when no party has a clear majority; dismissing a ministry that has lost floor confidence.</p></li>
<li><p><strong>Compulsory Reservation:</strong> Governor <strong>must reserve</strong> any Bill that endangers/diminishes the constitutional position and powers of the High Court.</p></li>
<li><p><strong>Mandatory Assent:</strong> If an Assembly repasses a returned non-money bill, the Governor <strong>must give assent</strong>.</p></li>
<li><p><strong>Special Responsibilities &amp; Tribal Areas:</strong> Governors of Nagaland and Arunachal Pradesh hold individual judgment regarding law and order; <strong>Sixth Schedule</strong> grants limited discretionary authority over Autonomous District Councils in Assam, Meghalaya, Tripura, and Mizoram.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--recusal-of-a-judge"><h2 id="2026-04-ca--recusal-of-a-judge">Recusal of a Judge</h2>
<ul>
<li><p><strong>Why in News:</strong> Delhi High Court heard a recusal plea by Arvind Kejriwal alleging bias against Justice Swarana Kanta Sharma in excise policy proceedings.</p></li>
<li><p><strong>Core Concept &amp; Basis:</strong></p>
<ul>
<li><p>Judge steps aside from hearing a matter due to potential bias or conflict of interest to preserve public faith in the judicial process.</p></li>
<li><p>Anchored in the natural justice maxim: <em><strong>Nemo judex in causa sua</strong></em> ("no one should be a judge in their own cause") and the doctrine that "justice must not only be done, but seen to be done".</p></li>
</ul></li>
<li><p><strong>Legal &amp; Regulatory Framework:</strong></p>
<ul>
<li><p>India has <strong>no statutory or constitutional provision</strong> governing judge recusal; it is purely judge-driven and voluntary.</p></li>
<li><p><strong>Final Decision:</strong> Lies solely with the <strong>concerned judge</strong>; litigants or parties cannot demand it as an absolute right.</p></li>
<li><p><strong>Bangalore Principles of Judicial Conduct (2002):</strong> Formulated by the Judicial Group on Strengthening Judicial Integrity and endorsed by the UN in 2006 as non-binding global ethical standards.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--indian-information-service-iis"><h2 id="2026-04-ca--indian-information-service-iis">Indian Information Service (IIS)</h2>
<ul>
<li><p><strong>Why in News:</strong> Ministry of External Affairs (MEA) rejected a proposal from the Ministry of Information &amp; Broadcasting (MoIB) to deploy Indian Information Service (IIS) officers in diplomatic missions abroad.</p></li>
<li><p><strong>Cadre Classification:</strong> <strong>Central Group 'A' Civil Service</strong>.</p></li>
<li><p><strong>Cadre Controlling Authority:</strong> Ministry of Information and Broadcasting (MoIB).</p></li>
<li><p><strong>Primary Mandate:</strong> Managing Government of India communication, public relations, policy dissemination, and executing public outreach across national media/broadcasting networks.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--national-civil-services-day"><h2 id="2026-04-ca--national-civil-services-day">National Civil Services Day</h2>
<ul>
<li><p><strong>Why in News:</strong> The 18th National Civil Services Day is observed on <strong>April 21, 2026</strong>.</p></li>
<li><p><strong>Theme (2026):</strong> <em>"Viksit Bharat: Citizen-Centric Governance and Development at the Last Mile"</em>.</p></li>
<li><p><strong>Historical Background:</strong></p>
<ul>
<li><p>Commemorates <strong>Sardar Vallabhbhai Patel’s 1947 address</strong> to the first batch of civil service probationers at Metcalfe House, Delhi, where he famously referred to civil servants as the <strong>"Steel Frame of India"</strong>.</p></li>
</ul></li>
<li><p><strong>Organizing Body:</strong> Department of Administrative Reforms and Public Grievances (DARPG), celebrated annually since <strong>2006</strong>.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--andhra-pradesh-reorganisation-amendment-bill-202"><h2 id="2026-04-ca--andhra-pradesh-reorganisation-amendment-bill-202">Andhra Pradesh Reorganisation (Amendment) Bill, 2026</h2>
<ul>
<li><p><strong>Why in News:</strong> Parliament passed the amendment designating <strong>Amaravati as the sole and permanent capital</strong> of Andhra Pradesh, nullifying the earlier three-capital plan.</p></li>
<li><p><strong>Parliamentary Precedent:</strong> Marks the <strong>first instance</strong> of the Union Parliament explicitly specifying a state capital via parliamentary enactment.</p></li>
<li><p><strong>Retrospective Application:</strong> Deemed effective retrospectively from <strong>2 June 2024</strong>, ensuring institutional and statutory continuity after Hyderabad ceased to be the shared/joint capital.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--annual-survey-of-incorporated-services-sector-en"><h2 id="2026-04-ca--annual-survey-of-incorporated-services-sector-en">Annual Survey of Incorporated Services Sector Enterprises (ASISSE)</h2>
<ul>
<li><p><strong>Why in News:</strong> National Statistical Office (NSO) launched ASISSE, India’s <strong>first dedicated survey</strong> covering the incorporated services sector under the <strong>Collection of Statistics Act, 2008</strong>.</p></li>
<li><p><strong>Scope &amp; Coverage:</strong></p>
<ul>
<li><p>Covers <strong>Companies</strong> (registered under Companies Act 1956/2013) and <strong>LLPs</strong> (Limited Liability Partnership Act, 2008).</p></li>
<li><p>Encompasses service verticals including trade, logistics, hospitality, IT, education, and healthcare.</p></li>
</ul></li>
<li><p><strong>Complementary Statistical Framework:</strong></p>
<ul>
<li><p><strong>ASISSE:</strong> Covers <em>incorporated</em> services.</p></li>
<li><p><strong>ASI (Annual Survey of Industries):</strong> Covers the organized/registered manufacturing sector.</p></li>
<li><p><strong>ASUSE (Annual Survey of Unincorporated Sector Enterprises):</strong> Covers the <em>unincorporated</em> non-agricultural enterprise universe.</p></li>
</ul></li>
<li><p><strong>Static Context (NSO Architecture):</strong></p>
<ul>
<li><p>Created in <strong>2019</strong> under MoSPI by merging the Central Statistics Office (CSO) and National Sample Survey Office (NSSO).</p></li>
<li><p><strong>CSO Wing:</strong> Handles macro aggregates like GDP compilation, Index of Industrial Production (IIP), Consumer Price Index (CPI), and ASI.</p></li>
<li><p><strong>NSSO Wing:</strong> Conducts large-scale field sample surveys, including Periodic Labour Force Survey (PLFS), household consumption expenditure, and health surveys.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--gujarat-uniform-civil-code-ucc-bill"><h2 id="2026-04-ca--gujarat-uniform-civil-code-ucc-bill">Gujarat Uniform Civil Code (UCC) Bill</h2>
<ul>
<li><p><strong>Why in News:</strong> Gujarat Assembly passed the UCC Bill, 2026, becoming the <strong>second state</strong> (after Uttarakhand) to enact a state-level Uniform Civil Code.</p></li>
<li><p><strong>Constitutional Anchors:</strong></p>
<ul>
<li><p><strong>Article 44 (DPSP):</strong> Sets a non-justiciable directive for the State to secure a Uniform Civil Code for all citizens throughout India.</p></li>
<li><p><strong>Fundamental Rights Interface:</strong> Balances tensions between <strong>Article 25</strong> (freedom of conscience and free profession, practice, and propagation of religion) and <strong>Article 14</strong> (equality before the law and equal protection of the laws) via standard civil personal law frameworks.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--jan-vishwas-amendment-bill-2026"><h2 id="2026-04-ca--jan-vishwas-amendment-bill-2026">Jan Vishwas Amendment Bill 2026</h2>
<ul>
<li><p><strong>Why in News:</strong> Lok Sabha passed the Jan Vishwas (Amendment of Provisions) Bill, 2026.</p></li>
<li><p><strong>Decriminalisation Scope:</strong> Decriminalises <strong>717 provisions</strong> involving technical and procedural defaults.</p></li>
<li><p><strong>Adjudicatory Shift:</strong> Shifts adjudication away from criminal courts to designated <strong>Adjudicating Officers</strong> (including Deputy Commissioners) to determine monetary penalties.</p></li>
<li><p><strong>Administrative Powers:</strong> Central Ministries can appoint designated officers to conduct inquiries, summon evidence, and levy penalties directly.</p></li>
<li><p><strong>Compounding of Offences:</strong> Allows entities to settle specified violations via compounding (paying a prescribed fee) instead of facing trial in court.</p></li>
<li><p><strong>Inflation Adjustment Clause:</strong> Mandates an increase of <strong>10% on minimum fines and penalties every 3 years</strong> to retain deterrent impact.</p></li>
<li><p><strong>Warning Mechanism:</strong> First-time or minor infractions can be issued warning notices prior to imposing financial penalties.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--official-language-in-states"><h2 id="2026-04-ca--official-language-in-states">Official Language in States</h2>
<ul>
<li><p><strong>Why in News:</strong> Meghalaya Cabinet approved the Meghalaya Official Languages Ordinance, 2026, designating <strong>Khasi</strong> and <strong>Garo</strong> as official state languages alongside English.</p></li>
<li><p><strong>Linguistic Classifications:</strong></p>
<ul>
<li><p><strong>Khasi:</strong> Belongs to the <strong>Austroasiatic language family</strong>; traditionally oral, written in the <strong>Latin script</strong>.</p></li>
<li><p><strong>Garo:</strong> Belongs to the <strong>Sino-Tibetan language family</strong>; written using the Latin script in India and the Bengali script in Bangladesh.</p></li>
</ul></li>
<li><p><strong>Constitutional Framework (State Official Languages):</strong></p>
<ul>
<li><p><strong>Article 345:</strong> Empowers state legislatures to adopt <strong>any language in use</strong> within the state (not restricted to the 22 Eighth Schedule languages) or Hindi; English continues until state law provides otherwise.</p></li>
<li><p><strong>Article 347:</strong> Empowers the <strong>President</strong> to direct a state to officially recognize a language if a <strong>substantial proportion</strong> of the state population desires it.</p></li>
<li><p><strong>Multi-Language Adoption:</strong> States are permitted to adopt multiple official languages (e.g., Sikkim recognizes 11 regional languages; Jharkhand recognizes Hindi plus 16 others).</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--media-reporting-of-fir"><h2 id="2026-04-ca--media-reporting-of-fir">Media Reporting of FIR</h2>
<ul>
<li><p><strong>Why in News:</strong> Sikkim High Court held that media can name accused persons while reporting First Information Report (FIR) contents, ruling that such reporting does not violate the right to privacy.</p></li>
<li><p><strong>FIR Legal Nature &amp; Procedure:</strong></p>
<ul>
<li><p>First official record of a <strong>cognizable offence</strong> registered by the police under the <strong>Bharatiya Nagarik Suraksha Sanhita (BNSS)</strong> to initiate investigation.</p></li>
<li><p>Can be registered by a victim, witness, or <strong>any person</strong> aware of the cognizable offence.</p></li>
<li><p>Police can act and investigate without prior court approval in cognizable matters.</p></li>
</ul></li>
<li><p><strong>FIR as a Public Document:</strong></p>
<ul>
<li><p>Classified as a <strong>public document</strong> under the <strong>Bharatiya Sakshya Adhiniyam, 2023</strong>, permitting public access and media reporting (including naming the accused).</p></li>
</ul></li>
<li><p><strong>Article 21 Safeguards:</strong> Media reporting must not <strong>prejudge guilt</strong> or prejudice judicial proceedings; courts retain powers to restrict defamatory reporting or selective investigation leaks.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--anti-doping-aiu-classification-wada-collaboratio"><h2 id="2026-04-ca--anti-doping-aiu-classification-wada-collaboratio">Anti-Doping: AIU Classification &amp; WADA Collaboration</h2>
<ul>
<li><p><strong>Why in News:</strong> Athletics Integrity Unit (AIU) upgraded the Athletics Federation of India from Category B to <strong>Category A</strong>.</p></li>
<li><p><strong>Athletics Integrity Unit (AIU):</strong></p>
<ul>
<li><p>Independent body founded in <strong>2017</strong> by <strong>World Athletics</strong>; headquartered in <strong>Monaco</strong>.</p></li>
<li><p>Mandate covers tackling both <strong>doping and non-doping integrity issues</strong> in athletics (track and field).</p></li>
</ul></li>
<li><p><strong>AIU Category A Implications:</strong></p>
<ul>
<li><p>Denotes the <strong>highest risk classification</strong> assigned to member federations with elevated doping violations.</p></li>
<li><p>Mandates strict surveillance, enhanced testing, and extensive testing programmes for national athletes.</p></li>
</ul></li>
<li><p><strong>WADA–CBI Collaboration &amp; Operation Upstream:</strong></p>
<ul>
<li><p><strong>Context:</strong> India is moving towards <strong>criminalising drug supply chains</strong> rather than solely sanctioning individual athletes.</p></li>
<li><p><strong>Operation Upstream:</strong> Global intelligence-driven operation led by <strong>WADA</strong> with <strong>CBI, INTERPOL, and EUROPOL</strong> targeting illicit production, trafficking, and organized crime networks supplying performance-enhancing drugs.</p></li>
<li><p><strong>Legal Backing:</strong> Requires proposed statutory reforms under the <strong>Bharatiya Nyaya Sanhita (BNS)</strong> to criminalise doping distribution activities.</p></li>
</ul></li>
<li><p><strong>World Anti-Doping Agency (WADA) Static Facts:</strong></p>
<ul>
<li><p>Established in <strong>1999</strong>; formulates the <strong>World Anti-Doping Code</strong>.</p></li>
<li><p>Oversees global compliance, intelligence, testing standards, and accredits anti-doping testing laboratories globally.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--firework-factory-explosions-regulation-in-india"><h2 id="2026-04-ca--firework-factory-explosions-regulation-in-india">Firework Factory Explosions &amp; Regulation in India</h2>
<ul>
<li><p><strong>Why in News:</strong> Two major firecracker explosions in Kerala and Tamil Nadu within 48 hours killed at least 38 people.</p></li>
<li><p><strong>Regulatory &amp; Administrative Framework:</strong></p>
<ul>
<li><p><strong>Parent Act:</strong> <strong>Explosives Act, 1884</strong> (governs manufacture, possession, sale, transport, import, and export).</p></li>
<li><p><strong>Certifying Authority:</strong> <strong>Petroleum and Explosives Safety Organisation (PESO)</strong> under the <strong>Ministry of Commerce and Industry (MoCI)</strong>.</p></li>
<li><p><strong>Green Crackers:</strong> Formulated, developed, and certified by <strong>CSIR-NEERI</strong> (National Environmental Engineering Research Institute).</p></li>
<li><p><strong>Prohibited Substances:</strong> Supreme Court bans the use of <strong>barium salts, lithium, arsenic, lead</strong>, and prohibits <strong>joined firecrackers (<em>laris</em>)</strong> across India.</p></li>
</ul></li>
<li><p><strong>Cold Spark Technology (Alternative):</strong></p>
<ul>
<li><p><strong>Mechanism:</strong> Uses electric heating and fan-driven air to propel glowing composite granules <strong>without gunpowder</strong>.</p></li>
<li><p><strong>Material Composition:</strong> Specialised alloy powders primarily made of <strong>titanium and zirconium</strong> that react to thermal heat without combustion.</p></li>
<li><p><strong>Physical &amp; Eco Properties:</strong> Sparks dissipate heat rapidly (remain cool to touch; do not ignite skin or fabric); virtually <strong>smokeless and odourless</strong>.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--film-piracy-in-india"><h2 id="2026-04-ca--film-piracy-in-india">Film Piracy in India</h2>
<ul>
<li><p><strong>Why in News:</strong> Leak of Tamil movie <em>Jana Nayagan</em> has raised concerns over piracy.</p></li>
<li><p><strong>Core Definition &amp; Forms:</strong></p>
<ul>
<li><p>Piracy constitutes unauthorised copying, distribution, or sharing of copyrighted content without the owner's permission.</p></li>
<li><p>Takes forms like illegal downloads, streaming, recording, and sharing via direct links or torrents.</p></li>
</ul></li>
<li><p><strong>Primary Governing Laws:</strong></p>
<ul>
<li><p><strong>Copyright Act, 1957</strong>.</p></li>
<li><p><strong>Cinematograph Act, 1952</strong>.</p></li>
</ul></li>
<li><p><strong>Judicial Instrument (John Doe Orders):</strong></p>
<ul>
<li><p>Court-issued pre-emptive injunctions against unknown/unidentified persons (infringers) to <strong>block potential piracy sources</strong> before content is leaked.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--ai-governance-and-economic-group-aigeg"><h2 id="2026-04-ca--ai-governance-and-economic-group-aigeg">AI Governance and Economic Group (AIGEG)</h2>
<ul>
<li><p><strong>Why in News:</strong> Government constituted the AI Governance and Economic Group (AIGEG) under the Ministry of Electronics and Information Technology (MeitY).</p></li>
<li><p><strong>Nature &amp; Mandate:</strong></p>
<ul>
<li><p>High-level <strong>inter-ministerial apex body</strong> designed to coordinate a whole-of-government AI governance framework across ministries, regulators, and institutions.</p></li>
<li><p>Balances innovation, safety, accountability, and ethical deployment by leveraging expertise across tech, economics, policy, and national security domains.</p></li>
</ul></li>
<li><p><strong>Leadership &amp; Structure:</strong></p>
<ul>
<li><p><strong>Chairperson:</strong> Minister of Electronics &amp; IT.</p></li>
<li><p><strong>Vice-Chairperson:</strong> Minister of State for Electronics &amp; IT.</p></li>
<li><p>Supported technically and regulatorily by the <strong>Technology and Policy Expert Committee (TPEC)</strong>.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--capacity-building-commission-cbc"><h2 id="2026-04-ca--capacity-building-commission-cbc">Capacity Building Commission (CBC)</h2>
<ul>
<li><p><strong>Why in News:</strong> Prime Minister addressed <em>Karmayogi Sadhana Saptah</em> on the foundation day of the Capacity Building Commission (CBC).</p></li>

</ul></li>
<li><p><strong>Key Objective:</strong> Transition civil service functioning from a rules-based system to a <strong>roles-based administration</strong>.</p></li>

<section class="blk" data-sec="2026-04-ca--national-scheduled-tribes-finance-and-developmen"><h2 id="2026-04-ca--national-scheduled-tribes-finance-and-developmen">National Scheduled Tribes Finance and Development Corporation (NSTFDC)</h2>

<section class="blk" data-sec="2026-04-ca--national-panchayati-raj-day-2026"><h2 id="2026-04-ca--national-panchayati-raj-day-2026">National Panchayati Raj Day 2026</h2>

<section class="blk" data-sec="2026-04-ca--india-south-korea-relations-futuristic-partnersh"><h2 id="2026-04-ca--india-south-korea-relations-futuristic-partnersh">India–South Korea Relations ("Futuristic Partnership")</h2>

<section class="blk" data-sec="2026-04-ca--14th-ministerial-conference-of-wto-mc14"><h2 id="2026-04-ca--14th-ministerial-conference-of-wto-mc14">14th Ministerial Conference of WTO (MC14)</h2>
<ul>
<li><p><strong>Why in News:</strong> The 14th Ministerial Conference (MC14) of the WTO took place in <strong>Yaoundé, Cameroon</strong>.</p></li>
<li><p><strong>Institutional Context:</strong></p>
<ul>
<li><p>Highest decision-making body of the WTO, established under the <strong>Marrakesh Agreement (1994)</strong>; meets at least <strong>once every two years</strong>.</p></li>
</ul></li>
<li><p><strong>Key Outcomes &amp; Deadlocks:</strong></p>
<ul>
<li><p><strong>Lapse of E-Commerce Moratorium:</strong> For the first time since its 1998 adoption (which barred tariffs on digital transmissions like software, music, media), the moratorium <strong>expired on March 31, 2026</strong>.</p></li>
<li><p><strong>Public Stockholding (PSH) for Food Security:</strong> Deadlock persisted; developing nations (led by India and the African Group) demanded a "Permanent Solution", facing resistance from developed countries.</p></li>
<li><p><strong>Fisheries Subsidies:</strong> No consensus reached on "Phase 2" disciplines (targeting overfishing and overcapacity); talks deferred to the General Council in Geneva.</p></li>
<li><p><strong>Lapse of TRIPS Safeguard:</strong> Temporary safeguard preventing non-violation complaints under the TRIPS Agreement lapsed, raising legal uncertainty over IP disputes.</p></li>
<li><p><strong>IFD Agreement (Investment Facilitation for Development):</strong> Failed to achieve multilateral consensus; remains a plurilateral initiative solely among signatories.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--saarc-currency-swap-framework"><h2 id="2026-04-ca--saarc-currency-swap-framework">SAARC Currency Swap Framework</h2>
<ul>
<li><p><strong>Why in News:</strong> India approved the first withdrawal of ₹30 billion for Maldives under the SAARC Currency Swap Framework.</p></li>
<li><p><strong>Concept:</strong> Bilateral agreement between central banks to exchange domestic currencies at a predetermined rate, with an agreement to reverse the transaction later at the exact same rate.</p></li>
<li><p><strong>Origin &amp; Mandate:</strong> Instituted by the <strong>Reserve Bank of India (RBI)</strong> in <strong>2012</strong> to provide short-term liquidity support to SAARC member nations during sudden balance-of-payments (BoP) crises.</p></li>
<li><p><strong>Current Framework (2024–2027):</strong></p>
<ul>
<li><p>Features a dedicated <strong>₹250 billion Indian Rupee swap window</strong>.</p></li>
<li><p>Retains a separate <strong>$2 billion US Dollar/Euro facility</strong>.</p></li>
</ul></li>
<li><p><strong>Mechanism &amp; Tenor:</strong> SAARC members execute bilateral swap pacts with the RBI; withdrawals typically hold a <strong>three-month tenor</strong> and can be rolled over up to <strong>two times</strong>.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--9th-indian-ocean-conference-ioc"><h2 id="2026-04-ca--9th-indian-ocean-conference-ioc">9th Indian Ocean Conference (IOC)</h2>
<ul>

<li><p>Acts as an annual flagship <strong>Track 1.5 diplomatic forum</strong>, bringing together both government officials and non-governmental experts.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--azec-plus-powerr-asia-initiative"><h2 id="2026-04-ca--azec-plus-powerr-asia-initiative">AZEC Plus &amp; POWERR Asia Initiative</h2>
<ul>

<li><p><strong>AZEC Framework:</strong></p>
<ul>
<li><p><strong>Origin:</strong> Proposed by <strong>Japan</strong> in 2022; launched in <strong>2023</strong> with 11 partner countries across the Asia-Pacific.</p></li>
<li><p><strong>Objective:</strong> Decarbonisation, clean energy transition, and energy security across Asia.</p></li>
<li><p><strong>Core Members (11):</strong> Japan, Australia, Brunei Darussalam, Cambodia, Indonesia, Lao PDR, Malaysia, Philippines, Singapore, Thailand, and Vietnam.</p></li>
<li><p><strong>AZEC Plus:</strong> Extends participation beyond core members to include partner nations like <strong>India</strong> and other ASEAN members.</p></li>
</ul></li>
<li><p><strong>POWERR Asia Initiative (Partnership on Wide Energy and Resources Resilience):</strong></p>
<ul>
<li><p><strong>Origin:</strong> Japan-led regional framework introduced at the AZEC Plus meeting in <strong>April 2026</strong>.</p></li>
<li><p><strong>Focus:</strong> Strengthening energy and resource resilience, stabilizing regional supply chains, and hedging against global disruptions.</p></li>
<li><p><strong>Participants:</strong> ASEAN nations alongside India, South Korea, Bangladesh, Sri Lanka, and Timor-Leste.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-04-ca--brics-health-working-group-meeting"><h2 id="2026-04-ca--brics-health-working-group-meeting">BRICS Health Working Group Meeting</h2>
