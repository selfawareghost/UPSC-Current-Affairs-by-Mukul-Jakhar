<section class="blk" data-sec="nobel-2026--chemistry-chirality-asymmetric-catalysis"><h2 id="nobel-2026--chemistry-chirality-asymmetric-catalysis">Chemistry (Chirality &amp; Asymmetric Catalysis)</h2>
<h3 id="nobel-2026--awardees-core-contribution">Awardees &amp; Core Contribution</h3>
<ul>
<li><p><strong>Laureates:</strong> <strong>Henri Kagan</strong> (France) and <strong>Kenso Soai</strong> (Japan).</p></li>
<li><p><strong>Core Discovery:</strong> Demonstrated that molecular <strong>"handedness" (chirality)</strong> can be amplified and directed to synthesize single-enantiomer, high-purity chemical and pharmaceutical products.</p></li>
<li><p><strong>Evolutionary Significance:</strong> Provides an experimental proof-of-concept for how <strong>homochirality</strong> in biological molecules could have spontaneously originated from non-chiral prebiotic precursors.</p></li>
</ul>
<h3 id="nobel-2026--fundamental-scientific-concepts">Fundamental Scientific Concepts</h3>
<ul>
<li><p><strong>Chirality (Handedness):</strong></p>
<ul>
<li><p>Derived from the Greek word <em>kheir</em> (hand).</p></li>
<li><p>Defined as a geometric property where an object/molecule is <strong>non-superimposable on its mirror image</strong>.</p></li>
</ul></li>
<li><p><strong>Enantiomers &amp; Racemates:</strong></p>
<ul>
<li><p><strong>Enantiomers:</strong> The pair of non-superimposable mirror-image molecules (termed "left-handed" / L or "right-handed" / D).</p></li>
<li><p><strong>Racemate (Racemic Mixture):</strong> Standard laboratory chemical reactions naturally yield an equal <strong>50:50 mixture</strong> of both enantiomers.</p></li>
</ul></li>
<li><p><strong>Biological Homochirality:</strong></p>
<ul>
<li><p>Living systems are strictly asymmetric:</p>
<ul>
<li><p><strong>Amino acids</strong> (building blocks of proteins) occur almost universally in the <strong>left-handed (L)</strong> form.</p></li>
<li><p><strong>Sugars</strong> in <strong>DNA/RNA</strong> (deoxyribose/ribose) occur almost universally in the <strong>right-handed (D)</strong> form.</p></li>
</ul></li>
</ul></li>
</ul>
<h3 id="nobel-2026--pharmaceutical-implications-real-world-examples">Pharmaceutical Implications &amp; Real-World Examples</h3>
<ul>
<li><p><strong>Mechanism:</strong> Enzymes and cell receptors are chiral targets; drug enantiomers interact like a key in a lock—one hand produces therapeutic value, while the mirror enantiomer may be inactive or toxic.</p></li>
<li><p><strong>Ethambutol (First-line Tuberculosis Drug):</strong></p>
<ul>
<li><p><strong>(S,S)-form:</strong> ~500× more potent against <em>Mycobacterium tuberculosis</em>.</p></li>
<li><p><strong>(R,R)-form:</strong> Associated with severe optic-nerve damage (ethambutol-induced optic neuropathy).</p></li>
</ul></li>
<li><p><strong>Thalidomide:</strong> Historical sedative tragedy (1960s birth defects/phocomelia); highlighted the critical regulatory and pharmacological necessity of enantiomeric separation and purity.</p></li>
</ul>
<h3 id="nobel-2026--the-kagan-soai-breakthroughs">The Kagan &amp; Soai Breakthroughs</h3>
<ul>
<li><p><strong>Frank's Theoretical Model (1953 - Charles Frank):</strong></p>
<ul>
<li><p>Postulated that homochirality requires three conditions: (1) <strong>Autocatalysis</strong> (a product catalyses its own synthesis), (2) <strong>Enantioselectivity</strong> (catalyses one specific handedness), and (3) <strong>Mutual Antagonism</strong> (suppresses the opposite mirror image).</p></li>
</ul></li>
<li><p><strong>Henri Kagan’s Non-linear Effect (1986):</strong></p>
<ul>
<li><p>Overturned the dogma that product purity cannot exceed catalyst purity.</p></li>
<li><p>Showed that metals in catalysts bind two chiral ligands; when mixed, matched enantiomers drive the reaction forward while mixed/mismatched pairs remain idle, causing <strong>chirality amplification</strong>.</p></li>
</ul></li>
<li><p><strong>The Soai Reaction (1995 - Kenso Soai):</strong></p>
<ul>
<li><p>The first known reaction exhibiting <strong>asymmetric autocatalysis with amplification</strong>: the chiral product serves as its own catalyst, compounding purity in successive rounds.</p></li>
<li><p><strong>Spontaneous Absolute Asymmetric Synthesis:</strong> Demonstrated that a purely <strong>non-chiral starting mixture</strong> can generate near-pure single-enantiomer products solely initiated by microscopic statistical chance.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="nobel-2026--physiology-or-medicine-optogenetics"><h2 id="nobel-2026--physiology-or-medicine-optogenetics">Physiology or Medicine (Optogenetics)</h2>
<h3 id="nobel-2026--laureates-citation">Laureates &amp; Citation</h3>
<ul>
<li><p><strong>Awardees:</strong> <strong>Karl Deisseroth</strong> (Stanford University, USA), <strong>Peter Hegemann</strong> (Humboldt University of Berlin, Germany), and <strong>Georg Nagel</strong> (University of Würzburg, Germany).</p></li>
<li><p><strong>Citation:</strong> <em>"For their discoveries concerning light-gated ion channels and optogenetics"</em>.</p></li>
<li><p><strong>Prize Awarding Body:</strong> Nobel Assembly at the <strong>Karolinska Institute</strong>, Stockholm, Sweden.</p></li>
</ul>
<h3 id="nobel-2026--fundamental-scientific-concepts-2">Fundamental Scientific Concepts</h3>
<ul>
<li><p><strong>What is Optogenetics?</strong></p>
<ul>
<li><p>A portmanteau of <strong>optics</strong> (light technology) and <strong>genetics</strong> (genetic engineering).</p></li>
<li><p>Coined in late 2006; formally defined as the <strong>fusion of genetic targeting and optical control in neural circuits</strong>.</p></li>
<li><p>Allows researchers to selectively switch individual neurons or specific neural circuits <strong>"on" (depolarize/activate)</strong> or <strong>"off" (hyperpolarize/silence)</strong> with millisecond precision using pulses of light.</p></li>
</ul></li>
<li><p><strong>Biological Origin (The Light-Sensitive Proteins):</strong></p>
<ul>
<li><p><strong>Organism:</strong> Discovered in <em><strong>Chlamydomonas reinhardtii</strong></em>, a single-celled green alga that uses a primitive eyespot to swim toward light (phototaxis).</p></li>
<li><p><strong>Opsins:</strong> Hegemann and Nagel identified algal light-sensitive proteins called <strong>channelrhodopsins</strong>.</p></li>
<li><p><strong>Mechanism:</strong> When illuminated with <strong>blue light</strong>, channelrhodopsin opens an ion pore through the protein, allowing charged ions to cross the membrane and trigger an electrical impulse (action potential).</p></li>
</ul></li>
</ul>
<h3 id="nobel-2026--how-optogenetics-works-three-stage-process">How Optogenetics Works (Three-Stage Process)</h3>
<ol type="1">
<li><p><strong>Gene Delivery (Targeting):</strong> A harmless <strong>viral vector</strong> (e.g., adeno-associated virus / AAV) is engineered to deliver the gene for a light-sensitive opsin into specific types of target neurons.</p></li>
<li><p><strong>Expression:</strong> The infected neurons manufacture the opsin and express it on their outer cell membranes.</p></li>
<li><p><strong>Optical Modulation:</strong> Precise pulses of light are delivered via tiny <strong>fiber-optic cables or micro-LEDs</strong>:</p>
<ul>
<li><p>Certain opsins open channels allowing cation influx to <strong>excite/activate</strong> the neuron (switch "on").</p></li>
<li><p>Other opsins act as chloride/proton pumps that <strong>inhibit/silence</strong> the neuron (switch "off").</p></li>
</ul></li>
</ol>
<h3 id="nobel-2026--scientific-impact-clinical-applications">Scientific Impact &amp; Clinical Applications</h3>
<ul>
<li><p><strong>Mapping Brain Causality:</strong> Unlike passive brain imaging (fMRI/EEG), optogenetics establishes <strong>direct causal relationships</strong> between specific neuronal firing patterns and behavior, emotions, and memory recall.</p></li>
<li><p><strong>Neurological &amp; Psychiatric Disorders:</strong> Used to map pathological brain circuits in <strong>Alzheimer’s disease, dementia, depression, and addiction</strong>.</p></li>
<li><p><strong>Restoration of Vision:</strong> In clinical trials to treat degenerative retinal conditions (like retinitis pigmentosa) by introducing opsin genes directly into surviving retinal ganglion cells to restore photoreception.</p></li>
</ul></section>
<section class="blk" data-sec="nobel-2026--physics-icecube-observatory-neutrino-astronomy"><h2 id="nobel-2026--physics-icecube-observatory-neutrino-astronomy">Physics (IceCube Observatory &amp; Neutrino Astronomy)</h2>
<h3 id="nobel-2026--laureate-core-contribution">Laureate &amp; Core Contribution</h3>
<ul>
<li><p><strong>Laureate:</strong> <strong>Francis Halzen</strong> (Belgian-American physicist).</p></li>
<li><p><strong>Core Contribution:</strong> Pioneered the concept and led the multi-decade international construction of the <strong>IceCube Neutrino Observatory</strong> at the South Pole in Antarctica.</p></li>
<li><p><strong>Primary Funding Agency:</strong> U.S. National Science Foundation (NSF).</p></li>
</ul>
<h3 id="nobel-2026--fundamental-physics-cosmic-rays-vs-neutrinos">Fundamental Physics: Cosmic Rays vs. Neutrinos</h3>
<ul>
<li><p><strong>The Cosmic Ray Problem:</strong></p>
<ul>
<li><p>Cosmic rays consist largely of high-energy <strong>charged particles</strong> (protons, alpha particles/helium, and heavier nuclei like iron).</p></li>
<li><p>Because they carry an electric charge, their trajectories are <strong>bent and deflected by interstellar/intergalactic magnetic fields</strong>, making it impossible to trace them back in a straight line to their astronomical points of origin.</p></li>
</ul></li>
<li><p><strong>Neutrino Properties (The "Ghost Particle"):</strong></p>
<ul>
<li><p><strong>Zero electric charge</strong> (electrically neutral).</p></li>
<li><p>Extremely tiny non-zero rest mass.</p></li>
<li><p>Governed almost entirely by the <strong>weak nuclear force</strong> and gravity; interacts very rarely with normal matter.</p></li>
<li><p>Travel across cosmological distances in <strong>straight lines</strong> unaffected by magnetic fields, acting as pristine astronomical messengers.</p></li>
</ul></li>
</ul>
<h3 id="nobel-2026--how-icecube-operates-detection-mechanism">How IceCube Operates (Detection Mechanism)</h3>
<ul>
<li><p><strong>Location &amp; Scale:</strong></p>
<ul>
<li><p>Located at the South Pole, Antarctica, embedded deep within clear glacial ice between <strong>1.4 km and 2.4 km depth</strong>.</p></li>
<li><p>Instrument volume spans roughly <strong>one cubic kilometre of ice</strong> instrumented with <strong>5,160 optical sensors</strong> distributed along 86 vertical cable strings.</p></li>
<li><p>Holes were drilled using high-pressure jets of <strong>hot water</strong>.</p></li>
</ul></li>
<li><p><strong>Detection Principle (Cherenkov Radiation):</strong></p>
<ol type="1">
<li><p>A high-energy astrophysical neutrino collides with an atomic nucleus inside the Antarctic ice.</p></li>
<li><p>The collision produces secondary relativistic charged subatomic particles (such as muons, electrons, or taus).</p></li>
<li><p>These secondary particles travel through the ice <strong>faster than the phase velocity of light in ice</strong> (<em>c</em>/<em>n</em>, where <em>n</em> ≈ 1.31).</p></li>
<li><p>This superluminal optical shockwave produces <strong>Cherenkov radiation</strong>—a characteristic faint <strong>blue glow</strong>.</p></li>
<li><p>Digital Optical Modules (DOMs) register the photon timing, direction, and intensity to reconstruct the neutrino's original trajectory and energy.</p></li>
</ol></li>
</ul>
<h3 id="nobel-2026--landmark-astronomical-breakthroughs">Landmark Astronomical Breakthroughs</h3>
<ul>
<li><p><strong>Diffuse Astrophysical Flux (2013):</strong> First detection of ultra-high-energy cosmic neutrinos originating outside our solar system, with energies exceeding 100 times the capability of CERN's Large Hadron Collider (LHC).</p></li>
<li><p><strong>Blazar Coincidence (2017):</strong> Traced a high-energy neutrino directly back to a flaring <strong>blazar</strong> (an active galaxy with a supermassive black hole firing relativistic jets directly toward Earth).</p></li>
<li><p><strong>Active Galactic Nuclei (2022):</strong> Observed significant neutrino emissions from <strong>NGC 1068 (Messier 77)</strong>, an active Seyfert galaxy ~46 million light-years away.</p></li>
</ul></section>
<section class="blk" data-sec="nobel-2026--nobel-peace-prize-navi-pillay"><h2 id="nobel-2026--nobel-peace-prize-navi-pillay">Nobel Peace Prize (Navi Pillay)</h2>
<h3 id="nobel-2026--laureate-awarding-institution">Laureate &amp; Awarding Institution</h3>
<ul>
<li><p><strong>Awardee:</strong> <strong>Navanethem "Navi" Pillay</strong> (South African jurist of Indian Tamil descent).</p></li>
<li><p><strong>Awarding Body:</strong> <strong>Norwegian Nobel Committee</strong> (Oslo, Norway).</p></li>
<li><p><strong>Key Context:</strong> Recognised for her lifelong commitment to international rule of law, defending political prisoners, and adjudicating major international war crimes and human rights violations.</p></li>
</ul>
<h3 id="nobel-2026--biographical-anti-apartheid-track-record">Biographical &amp; Anti-Apartheid Track Record</h3>
<ul>
<li><p><strong>Roots:</strong> Born in Durban, South Africa, into a Tamil diaspora family whose grandparents were indentured plantation labourers in Natal.</p></li>
<li><p><strong>Legal Firsts:</strong> First woman of colour to establish a law practice in South Africa's Natal province (1967); earned a doctorate in law (SJD) from Harvard Law School.</p></li>
<li><p><strong>Defending Political Prisoners:</strong> Defended anti-apartheid dissidents; successfully established the <strong>legal right to attorney representation for prisoners of Robben Island (1973)</strong>, including Nelson Mandela.</p></li>
<li><p><strong>Post-Apartheid South Africa:</strong> Actively campaigned for the inclusion of the <strong>equality clause</strong> in South Africa’s post-apartheid Constitution.</p></li>
</ul>
<h3 id="nobel-2026--landmark-international-judicial-roles-precedents">Landmark International Judicial Roles &amp; Precedents</h3>
<ul>
<li><p><strong>International Criminal Tribunal for Rwanda (ICTR) (1995–2003):</strong></p>
<ul>
<li><p>Nominated by President Nelson Mandela; served as an eight-year tribunal judge and later ICTR President.</p></li>
<li><p>Delivered two foundational precedents in international humanitarian law:</p>
<ol type="1">
<li><p><em><strong>Jean-Paul Akayesu Case (1998):</strong></em> First international ruling establishing that <strong>systematic rape and sexual violence constitute an act of genocide</strong>.</p></li>
<li><p><em><strong>Media Case (Ferdinand Nahimana et al., 2003):</strong></em> First international judgment determining that <strong>hate propaganda broadcast via radio/print constitutes direct and public incitement to commit genocide</strong>.</p></li>
</ol></li>
</ul></li>
<li><p><strong>International Criminal Court (ICC) (2003–2008):</strong></p>
<ul>
<li><p>Served as one of the inaugural judges of the ICC in The Hague following the adoption of the Rome Statute.</p></li>
</ul></li>
<li><p><strong>UN High Commissioner for Human Rights (UNHCHR) (2008–2014):</strong></p>
<ul>
<li><p>Headed the Office of the United Nations High Commissioner for Human Rights (OHCHR) in Geneva.</p></li>
</ul></li>
<li><p><strong>Independent UN Commission of Inquiry on the Occupied Palestinian Territory (2021–2025):</strong></p>
<ul>
<li><p>Appointed by the UN Human Rights Council (UNHRC) to chair the ongoing independent international commission examining human rights and international humanitarian law violations in the OPT.</p></li>
<li><p>Concluded in landmark legal findings that actions met the statutory thresholds of the <strong>1948 Genocide Convention</strong>.</p></li>
</ul></li>
<li><p><strong>International Court of Justice (ICJ) Ad Hoc Judge:</strong></p>
<ul>
<li><p>Appointed as judge <em>ad hoc</em> by <strong>The Gambia</strong> in its landmark ICJ case (<em>Application of the Convention on the Prevention and Punishment of the Crime of Genocide</em>) against <strong>Myanmar</strong> concerning the Rohingya genocide.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="nobel-2026--literature-anne-carson"><h2 id="nobel-2026--literature-anne-carson">Literature (Anne Carson)</h2>
<h3 id="nobel-2026--laureate-awarding-institution-2">Laureate &amp; Awarding Institution</h3>
<ul>
<li><p><strong>Laureate:</strong> <strong>Anne Carson</strong> (Canadian poet, essayist, translator, and classicist; also holds Icelandic citizenship).</p></li>
<li><p><strong>Awarding Body:</strong> <strong>Swedish Academy</strong>, Stockholm.</p></li>
<li><p><strong>Citation / Academy Rationale:</strong> <em>"Almost all her literary production has centred upon the intersection between the philologist’s obsession with words and the poet’s desire for new meaning"</em>.</p></li>
</ul>
<h3 id="nobel-2026--literary-style-thematic-architecture">Literary Style &amp; Thematic Architecture</h3>
<ul>
<li><p><strong>Genre-Bending Aesthetics:</strong> Blurs the boundaries between classical scholarship, poetry, and prose, moving between ancient Greek literature/mythology and contemporary motifs.</p></li>
<li><p><strong>Core Influence:</strong> Classical antiquity—specifically <strong>Sappho</strong> (archaic Greek lyric poet) and <strong>Homer</strong>.</p></li>
</ul>
<h3 id="nobel-2026--major-notable-works">Major Notable Works</h3>
<ul>
<li><p><strong><em>Eros the Bittersweet</em> (1986):</strong></p>
<ul>
<li><p>Debut critical/literary book developed from her doctoral research on Sappho.</p></li>
<li><p>Examines the nature of <em>eros</em> (desire) as an experience rooted simultaneously in lack and longing.</p></li>
</ul></li>
<li><p><strong><em>Short Talks</em> (1992):</strong></p>
<ul>
<li><p>First poetry collection; structured as brief, prose-like poems addressing eclectic subjects (ranging from Van Gogh to orchids).</p></li>
</ul></li>
<li><p><strong><em>Plainwater</em> (1995):</strong></p>
<ul>
<li><p>Collection of essays and travelogues exploring memory and intellectual movement.</p></li>
</ul></li>
<li><p><strong><em>Autobiography of Red</em> (1998):</strong></p>
<ul>
<li><p>Her most widely known verse novel.</p></li>
<li><p>Reimagines the ancient Greek myth of the red-winged monster <strong>Geryon</strong> and the hero <strong>Herakles</strong> as a modern coming-of-age narrative.</p></li>
</ul></li>
<li><p><strong><em>Men in the Off Hours</em> (2000):</strong></p>
<ul>
<li><p>Hybrid collection juxtaposing classical figures (e.g., Thucydides) with modern thinkers/writers (e.g., Virginia Woolf).</p></li>
</ul></li>
<li><p><strong><em>The Beauty of the Husband</em> (2001):</strong></p>
<ul>
<li><p>Subtitled <em>"a fictional essay in 29 tangoes"</em>; semi-autobiographical narrative verse recounting the collapse of a marriage.</p></li>
<li><p><strong>Historic Milestone:</strong> Won the prestigious <strong>T.S. Eliot Prize</strong>, making Carson the <strong>first woman</strong> to receive the honor.</p></li>
</ul></li>
</ul></section>

<section class="blk" data-sec="pib-building-new-india--economy-industrial-policy"><h2 id="pib-building-new-india--economy-industrial-policy">Economy &amp; Industrial Policy</h2>
<h3 id="pib-building-new-india--a-semiconductors-electronics">A. Semiconductors &amp; Electronics</h3>
<ul>
<li><p><strong>India Semiconductor Mission (ISM) 1.0 vs 2.0:</strong></p>
<ul>
<li><p><strong>ISM 1.0 (2021):</strong> ₹76,000 crore outlay; provides up to <strong>50% fiscal support</strong> for fabrication, assembly, testing, and chip design.</p></li>
<li><p><strong>ISM 2.0 (Union Budget 2026–27):</strong> Additional ₹1,000 crore allocated; focuses on equipment/materials manufacturing, full-stack Indian IP design, tech development, and workforce training.</p></li>
<li><p><strong>Key Locations in News:</strong></p>
<ul>
<li><p><strong>Sanand, Gujarat:</strong> Site of India's first end-to-end OSAT (Outsourced Semiconductor Assembly and Test) facility (inaugurated August 2025).</p></li>
<li><p><strong>Odisha:</strong> Site of India's first commercial Silicon Carbide (SiC) fab.</p></li>
</ul></li>
</ul></li>
<li><p><strong>Electronics Component Manufacturing Scheme (ECMS):</strong> Notified in 2025 with ₹22,919 crore; outlay enhanced to <strong>₹40,000 crore</strong> in Budget 2026–27. Utilizes turnover-linked, capex, and hybrid incentives.</p></li>
<li><p><strong>Status in Global Rankings:</strong></p>
<ul>
<li><p>India is the <strong>2nd largest mobile phone manufacturer</strong> globally (grew from 2 units in 2014 to 300+ units in 2025–26).</p></li>
<li><p>Mobile phone production saw a 28-fold rise from FY15 to FY25.</p></li>
</ul></li>
</ul>
<h3 id="pib-building-new-india--b-automobiles-e-mobility">B. Automobiles &amp; E-Mobility</h3>
<ul>
<li><p><strong>Market Standing:</strong> World’s <strong>largest market</strong> for 2-wheelers and 3-wheelers; <strong>3rd largest globally</strong> for passenger and commercial vehicles.</p></li>
<li><p><strong>PM E-DRIVE Scheme:</strong> Launched September 2024 (outlay ₹10,900 crore). Provides demand incentives for e-2W, e-3W, and extends coverage to <strong>e-trucks and e-ambulances</strong>, alongside EV charging infrastructure. <em>(Successor scheme to FAME-II).</em></p></li>
</ul>
<h3 id="pib-building-new-india--c-pharmaceuticals-medical-devices-ayush">C. Pharmaceuticals, Medical Devices &amp; AYUSH</h3>
<ul>
<li><p><strong>Global Standing:</strong> <strong>3rd largest producer by volume</strong>, <strong>11th largest by value</strong>. India is the <strong>3rd largest producer of APIs</strong> (Active Pharmaceutical Ingredients). Supplies over <strong>70% of global anti-retroviral drugs</strong> and 55–60% of UNICEF’s vaccines.</p></li>
<li><p><strong>Biopharma SHAKTI (Union Budget 2026–27):</strong> Targeted support for biologics and biosimilars; plans a network of 1,000+ accredited clinical trial sites; sets up 3 new NIPERs and upgrades 7 existing NIPERs.</p></li>
<li><p><strong>AYUSH &amp; WHO Collaboration:</strong></p>
<ul>
<li><p><strong>WHO Global Traditional Medicine Centre:</strong> Located at <strong>Jamnagar, Gujarat</strong>.</p></li>
<li><p><strong>ICH Module:</strong> India signed an MoU with WHO to develop the <em>International Classification of Health Interventions (ICHI)</em> traditional medicine module.</p></li>
</ul></li>
</ul>
<h3 id="pib-building-new-india--d-taxation-regulatory-frameworks">D. Taxation &amp; Regulatory Frameworks</h3>
<ul>
<li><p><strong>GST 2.0 (Effective 22 Sept 2025):</strong> Transition toward a streamlined two-rate baseline (5% and 18%), retaining 40% on sin/luxury goods.</p>
<ul>
<li><p><strong>Drone Rationalisation:</strong> Reduced from 18%/28% to <strong>5%</strong>.</p></li>
<li><p><strong>Inverted Duty Structure (IDS) Corrections:</strong> Fertiliser raw materials (Ammonia, Sulphuric Acid, Nitric Acid) slashed from 18% to 5%; Man-Made Fibres (MMF) slashed from 18% to 5%.</p></li>
</ul></li>
<li><p><strong>Minimum Alternate Tax (MAT):</strong></p>
<ul>
<li><p>MAT rate reduced from 15% to <strong>14%</strong> and treated as a final tax.</p></li>
<li><p>Non-residents opting for presumptive taxation exempted from MAT.</p></li>
</ul></li>
<li><p><strong>Insurance Sector Reform (Sabka Bima, Sabki Raksha Act, 2025):</strong></p>
<ul>
<li><p>Raised FDI cap in insurance to <strong>100%</strong>.</p></li>
<li><p>Net Owned Fund (NOF) requirement for foreign reinsurers slashed from ₹5,000 crore to <strong>₹1,000 crore</strong>.</p></li>
<li><p>IRDAI share transfer approval threshold raised from 1% to 5%.</p></li>
</ul></li>
<li><p><strong>Decriminalisation &amp; Ease of Doing Business:</strong></p>
<ul>
<li><p><strong>Jan Vishwas Act 2023:</strong> Decriminalised 183 provisions across 42 Central Acts.</p></li>
<li><p><strong>Jan Vishwas Bill 2025:</strong> Covers 355 provisions (288 for EoDB, 67 for Ease of Living).</p></li>
<li><p><strong>Securities Markets Code (SMC) 2025:</strong> Consolidates SCRA 1956, SEBI Act 1992, and Depositories Act 1996 into a unified legal code.</p></li>
<li><p><strong>Authorised Economic Operator (AEO):</strong> Duty deferral ("Clear first, Pay later") extended from 15 to 30 days for Tier-2 and Tier-3 AEOs under WCO standards.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="pib-building-new-india--international-trade-agreements"><h2 id="pib-building-new-india--international-trade-agreements">International Trade &amp; Agreements</h2>
<h3 id="pib-building-new-india--a-unctad-trade-diversity-indices-2025">A. UNCTAD Trade Diversity Indices (2025)</h3>
<ul>
<li><p>India ranks among the <strong>top 5</strong> Global South nations for trade product diversity and <strong>top 3</strong> for trade partnership diversity.</p></li>
</ul>
<h3 id="pib-building-new-india--b-recent-free-trade-agreements-ftas">B. Recent Free Trade Agreements (FTAs)</h3>
<ul>
<li><p><strong>India–EU FTA:</strong> Negotiations concluded January 2026. Preferential access across 97% of EU tariff lines (99.5% trade value). Immediate duty elimination on 70.4% lines (benefiting textiles, gems/jewellery, leather). <em>Excludes sensitive agricultural/dairy lines</em>.</p></li>
<li><p><strong>India–UK CETA (2025):</strong> Duty-free access to nearly 99% of Indian exports. Incorporates a <strong>Double Contribution Convention</strong> to prevent dual social security deductions.</p></li>
<li><p><strong>India–EFTA TEPA (Signed 2024; Effective Oct 2025):</strong> First FTA linking trade concessions to legally bound investment flows: <strong>USD 100 billion FDI over 15 years</strong> (generating 1 million jobs); explicitly <strong>excludes FPI</strong>.</p></li>
<li><p><strong>India–Oman CEPA (Dec 2025):</strong> First FTA globally to extend commitments on <strong>traditional medicine (AYUSH) across all 4 modes of supply</strong>.</p></li>
<li><p><strong>India–New Zealand FTA (2025):</strong> 100% tariff lines eliminated by NZ at entry into force; USD 20 billion investment commitment over 15 years.</p></li>
<li><p><strong>India–Australia ECTA:</strong> Covers 100% of Australian tariff lines at zero-duty effective January 2026. Includes a Mutual Recognition Arrangement on organic products.</p></li>
</ul>
<h3 id="pib-building-new-india--c-export-facilitation-financing">C. Export Facilitation &amp; Financing</h3>
<ul>
<li><p><strong>Export Promotion Mission (EPM) [FY26 to FY31; Outlay ₹25,060 Cr]:</strong></p>
<ul>
<li><p>Operated by <strong>DGFT (Ministry of Commerce &amp; Industry)</strong> via two arms: <em>Niryat Protsahan</em> (finance) and <em>Niryat Disha</em> (market access).</p></li>
<li><p>Sub-initiatives:</p>
<ul>
<li><p><strong>Export Factoring:</strong> 2.75% interest subvention, capped at ₹50 lakh/MSME.</p></li>
<li><p><strong>TRACE:</strong> Testing &amp; certification cost reimbursement (60% Positive List; 75% Priority List; capped at ₹25 lakh/IEC).</p></li>
<li><p><strong>LIFT:</strong> Offsets freight disadvantages in low-export districts (up to 30% freight reimbursed).</p></li>
<li><p><strong>FLOW:</strong> Subsidises overseas warehousing and e-commerce fulfillment hubs (up to 30% of project cost).</p></li>
</ul></li>
</ul></li>
<li><p><strong>FEMA Amendment (2025):</strong> Realisation/repatriation of export proceeds extended from 9 months to <strong>15 months</strong>; shipment window against advance payment extended from 1 year to <strong>3 years</strong>.</p></li>
</ul></section>
<section class="blk" data-sec="pib-building-new-india--labour-law-reforms-4-labour-codes"><h2 id="pib-building-new-india--labour-law-reforms-4-labour-codes">Labour Law Reforms (4 Labour Codes)</h2>
<p><strong>Status:</strong> Rationalised 29 Central labour laws into 4 Codes; fully implemented with effect from <strong>21 November 2025</strong>.</p>
<div class="table-wrap"><table>

<thead>
<tr class="header">
<th><strong>Labor Code</strong></th>
<th><strong>Key Prelims Anchors &amp; Nuances</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>Code on Wages, 2019</strong></td>
<td><p>• Subsumes 4 laws (Payment of Wages, Minimum Wages, Payment of Bonus, Equal Remuneration).</p>
<p>• Universal floor wage set by Centre; state minimum wages cannot fall below it.</p>
<p>• Prohibits gender discrimination, including <strong>transgender identity</strong>.</p>
<p>• Overtime wage mandated at <strong>at least 2x</strong> normal rate.</p>
<p>• Replaces "Inspector" with "Inspector-cum-Facilitator".</p></td>
</tr>
<tr class="even">
<td><strong>Industrial Relations Code, 2020</strong></td>
<td><p>• Subsumes 3 laws (Trade Unions Act, Standing Orders Act, Industrial Disputes Act).</p>
<p>• Threshold for prior government permission for lay-off/retrenchment/closure raised from 100 to <strong>300 workers</strong>.</p>
<p>• Standing Orders applicability raised to <strong>300 workers</strong>.</p>
<p>• Recognition of Negotiating Union requires <strong>51%</strong> worker membership (else Negotiating Council with ≥20% representation).</p>
<p>• <strong>Notice for strike:</strong> 14-day mandatory notice for all units; strikes now explicitly include <strong>mass casual leave</strong>.</p>
<p>• <strong>Worker Re-skilling Fund:</strong> Employer contributes an amount equal to 15 days of last-drawn wages per retrenched worker.</p></td>
</tr>
<tr class="odd">
<td><strong>Code on Social Security, 2020</strong></td>
<td><p>• Subsumes 9 laws (EPF, ESI, Maternity Benefit, Gratuity, etc.).</p>
<p>• Extends statutory cover to <strong>gig &amp; platform workers</strong>; aggregators contribute 1–2% of turnover (capped at 5% of payout to workers).</p>
<p>• <strong>Fixed Term Employment (FTE):</strong> Gratuity eligibility reduced to <strong>1 year</strong> continuous service (from 5 years).</p>
<p>• Uniform definition of wages: Basic pay + DA + retaining allowance must form ≥<strong>50% of total remuneration</strong>.</p>
<p>• Commuting accidents (home to workplace) formally brought under employment injury.</p></td>
</tr>
<tr class="even">
<td><strong>Occupational Safety, Health &amp; Working Conditions (OSH) Code, 2020</strong></td>
<td><p>• Subsumes 13 Acts (Factories Act, Mines Act, Contract Labour Act, ISMW Act, etc.).</p>
<p>• Factory definition threshold raised: ≥<strong>20 workers</strong> (with power) and ≥<strong>40 workers</strong> (without power).</p>
<p>• Contract labour licensing threshold raised from 20 to <strong>50 contract workers</strong>.</p>
<p>• Women permitted to work in night shifts (before 6 AM, beyond 7 PM) subject to consent and mandatory safety conditions.</p>
<p>• Working hours capped at 8 hours/day and 48 hours/week.</p></td>
</tr>
</tbody>
</table></div></section>
<section class="blk" data-sec="pib-building-new-india--social-welfare-public-health"><h2 id="pib-building-new-india--social-welfare-public-health">Social Welfare &amp; Public Health</h2>

<ul>

</ul></li>
<li><p><strong>Universal Immunisation Programme (UIP):</strong> Covers 11 diseases nationally (Hep-B, OPV, BCG, IPV, Pentavalent, Rotavirus, PCV, MR, DPT, Td, JE).</p></li>

<li><p><strong>Affordable Medicines:</strong></p>
<ul>
<li><p>PMBJP (<em>Pradhan Mantri Bhartiya Janaushadhi Pariyojana</em>): Generic drugs at 50–90% discount.</p></li>
<li><p>AMRIT (<em>Affordable Medicines and Reliable Implants for Treatment</em>): Branded/generic drugs and high-end tertiary surgical implants.</p></li>
</ul></li>
</ul>
<h3 id="pib-building-new-india--b-women-empowerment-child-development">B. Women Empowerment &amp; Child Development</h3>
<ul>
<li><p><strong>Mission Shakti (MoWCD Umbrella):</strong> Divided into two sub-schemes:</p>
<ul>
<li><p><strong>Sambal (Safety &amp; Security):</strong> One Stop Centres (Sakhi Centres), Women Helpline (181), Beti Bachao Beti Padhao (BBBP), and Nari Adalats.</p></li>
<li><p><strong>Samarthya (Empowerment):</strong> PMMVY, Shakti Sadan, Sakhi Niwas (hostels), Palna (national creche scheme), SANKALP Hub for Empowerment of Women.</p></li>
</ul></li>
<li><p><strong>PMMVY 2.0 (Pradhan Mantri Matru Vandana Yojana):</strong></p>

<li><p>2nd Child: ₹6,000 in a single instalment <strong>only if the second child is a girl</strong>.</p></li>
</ul></li>
<li><p><strong>NaMo Drone Didi Yojana:</strong> Central Sector Scheme under Ministry of Agriculture; targets 15,000 drones for women SHGs; provides 80% Central Financial Assistance (up to ₹8 lakh).</p></li>

<li><p><strong>SHe-Box Portal:</strong> Upgraded August 2024 under PoSH Act, 2013; central tracking portal routing complaints to Internal Committees (IC) or Local Committees (LC).</p></li>
<li><p><strong>SHE-Mart (Union Budget 2026–27):</strong> Community-owned district retail outlets for SHG product marketing.</p></li>

<section class="blk" data-sec="pib-building-new-india--creative-industries-agriculture"><h2 id="pib-building-new-india--creative-industries-agriculture">Creative Industries &amp; Agriculture</h2>

<section class="blk" data-sec="pib-building-new-india--agriculture-allied-sectors-rural-economy"><h2 id="pib-building-new-india--agriculture-allied-sectors-rural-economy">Agriculture, Allied Sectors &amp; Rural Economy</h2>
<h3 id="pib-building-new-india--a-national-agricultural-production-statistics-20">A. National Agricultural &amp; Production Statistics (2024–25)</h3>
<ul>
<li><p><strong>Macro Contribution:</strong> Agriculture and allied activities account for approximately <strong>20% of GVA</strong> (Gross Value Added) at current prices, employ <strong>46.1% of the workforce</strong>, and support <strong>~55% of the population</strong>.</p></li>
<li><p><strong>Record Harvest Output (2024–25):</strong></p>
<ul>
<li><p><strong>Foodgrains:</strong> <strong>357.73 MMT</strong> (an increase of 25.43 MMT YoY).</p></li>
<li><p><strong>Horticulture:</strong> <strong>362.08 MT</strong> (continues to outstrip total foodgrain production).</p></li>
<li><p><strong>Rice &amp; Wheat:</strong> India ranks <strong>2nd globally</strong> in both (Rice: 150.18 MT; Wheat: 117.94 MT).</p></li>
<li><p><strong>Pulses &amp; Millets (Shree Anna):</strong> India ranks <strong>1st globally</strong> in both (Pulses: 25.68 MT; Millets: 18.59 MT).</p></li>
</ul></li>
<li><p><strong>Commercial &amp; Cash Crops Global Standing:</strong></p>
<ul>
<li><p><strong>Dry Onion:</strong> Ranked <strong>1st globally</strong> (~25% of total world output; led by Maharashtra, MP, Gujarat).</p></li>
<li><p><strong>Spices:</strong> Ranked <strong>1st globally</strong> (12 MMT in 2023–24; led by MP, Gujarat, Andhra Pradesh).</p></li>
<li><p><strong>Coconut:</strong> Ranked <strong>1st globally</strong> (21.3 billion nuts annually).</p></li>
<li><p><strong>Sugarcane:</strong> Ranked <strong>2nd globally</strong> (454.61 MT; led by UP and Maharashtra).</p></li>
<li><p><strong>Cotton:</strong> Ranked <strong>2nd globally</strong> (5.05 MT; led by Karnataka, Maharashtra, Gujarat).</p></li>
<li><p><strong>Tea:</strong> Ranked <strong>2nd globally</strong> (1.203 MT; concentrated in Assam, West Bengal, Tamil Nadu, Kerala, Karnataka).</p></li>
<li><p><strong>Coffee:</strong> Output ~0.36 MT; <strong>nearly 70% is exported</strong> (concentrated in Karnataka, Kerala, Tamil Nadu).</p></li>
</ul></li>
</ul>
<h3 id="pib-building-new-india--b-key-agronomic-schemes-inputs">B. Key Agronomic Schemes &amp; Inputs</h3>
<ul>
<li><p><strong>Soil Health Card (SHC):</strong> Tests <strong>12 parameters</strong>:</p>
<ul>
<li><p><em>Macronutrients:</em> Nitrogen (N), Phosphorus (P), Potassium (K).</p></li>
<li><p><em>Secondary nutrient:</em> Sulphur (S).</p></li>
<li><p><em>Micronutrients:</em> Zinc (Zn), Iron (Fe), Copper (Cu), Manganese (Mn), Boron (B).</p></li>
<li><p><em>Physical parameters:</em> pH, Electrical Conductivity (EC), Organic Carbon (OC).</p></li>
<li><p><em>Cycle:</em> Issued every <strong>2 years</strong>.</p></li>
</ul></li>
<li><p><strong>PM Krishi Sinchayee Yojana (PMKSY):</strong> Gross irrigated area in India reached <strong>55.8%</strong>.</p></li>
<li><p><strong>Mission for Aatmanirbharta in Pulses (2025–31):</strong> Mission-mode intervention to achieve domestic pulse self-sufficiency and reduce import dependence.</p></li>
<li><p><strong>Natural Farming Clusters:</strong> Expanded to 17,632 clusters across 6.39 lakh hectares.</p></li>
</ul>
<h3 id="pib-building-new-india--c-livestock-dairy-fisheries">C. Livestock, Dairy &amp; Fisheries</h3>
<ul>
<li><p><strong>Global Output Ranks (2024–25):</strong></p>
<ul>
<li><p><strong>Milk:</strong> <strong>Rank 1 globally</strong> (~25% of global output; 247.87 MT; per capita availability: <strong>485 g/day</strong> vs world average 328 g/day).</p></li>
<li><p><strong>Eggs:</strong> <strong>Rank 2 globally</strong> (149.11 billion eggs; per capita availability: <strong>106 eggs/annum</strong>).</p></li>
<li><p><strong>Fish:</strong> <strong>Rank 2 globally</strong> (19.77 MT total; inland fisheries drive 151.60 MT).</p></li>
<li><p><strong>Meat:</strong> <strong>Rank 4 globally</strong> (10.50 MT).</p></li>
</ul></li>
<li><p><strong>Animal Health &amp; Disease Control:</strong></p>
<ul>
<li><p><strong>NADCP (National Animal Disease Control Programme):</strong> 100% vaccination target against <strong>Foot and Mouth Disease (FMD - viral)</strong> and <strong>Brucellosis (bacterial - female bovine calves aged 4–8 months)</strong>. FMD cases dropped to 6 in 2025; Brucellosis outbreaks dropped to zero.</p></li>
</ul></li>
<li><p><strong>Digital Ecosystems in Allied Sectors:</strong></p>
<ul>
<li><p><strong>Pashu Aadhaar:</strong> 12-digit unique identification tag for livestock registered on the <strong>Bharat Pashudhan Portal</strong>.</p></li>
<li><p><strong>NFDP (National Fisheries Digital Platform):</strong> Centralised digital identity and registry under PM-MKSSY.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="pib-building-new-india--energy-spectrum-power-sector-reforms"><h2 id="pib-building-new-india--energy-spectrum-power-sector-reforms">Energy Spectrum &amp; Power Sector Reforms</h2>
<h3 id="pib-building-new-india--a-generation-renewable-milestones">A. Generation &amp; Renewable Milestones</h3>
<ul>
<li><p><strong>Installed Power Mix (as of 31 Jan 2026):</strong></p>
<ul>
<li><p>Total installed capacity: <strong>520.51 GW</strong>.</p></li>
<li><p><strong>Non-Fossil fuel capacity:</strong> <strong>271.97 GW (&gt;50% of total)</strong>.</p></li>
<li><p>Renewable energy: 263.19 GW (Solar: ~140 GW; Wind: ~54.65 GW).</p></li>
<li><p>Nuclear: 8.78 GW.</p></li>
<li><p>Global IRENA ranking: India ranks <strong>4th globally in installed renewable capacity</strong>.</p></li>
</ul></li>
</ul>
<h3 id="pib-building-new-india--b-national-green-hydrogen-mission-nghm">B. National Green Hydrogen Mission (NGHM)</h3>
<ul>
<li><p><strong>2030 Targets:</strong> Production of <strong>5 MMT per annum</strong>; 50 MMT GHG avoided; ₹1 lakh crore fossil fuel import reduction.</p></li>
<li><p><strong>Standards &amp; Definition:</strong> Carbon emissions cannot exceed <strong>2 kg</strong> CO<sub>2</sub> <strong>equivalent per kg of</strong> H<sub>2</sub> <strong>produced</strong> (calculated as a 12-month rolling average). Production via biomass gasification is also recognized.</p></li>
<li><p><strong>SIGHT Programme:</strong> Strategic Interventions for Green Hydrogen Transition (outlay ₹17,490 crore for electrolyser manufacturing and domestic production).</p></li>
</ul>
<h3 id="pib-building-new-india--c-shanti-act-2025-nuclear-energy-overhaul">C. SHANTI Act, 2025 (Nuclear Energy Overhaul)</h3>
<ul>
<li><p><strong>Full Form:</strong> <em>Sustainable Harnessing and Advancement of Nuclear Energy for Transforming India Act, 2025</em>.</p></li>
<li><p><strong>Repeals &amp; Consolidates:</strong> Replaces both the <strong>Atomic Energy Act, 1962</strong> and the <strong>Civil Liability for Nuclear Damage Act (CLNDA), 2010</strong>.</p></li>
<li><p><strong>Key Provisions:</strong></p>
<ul>
<li><p>Grants <strong>statutory recognition to AERB</strong> (Atomic Energy Regulatory Board).</p></li>
<li><p><strong>Permits regulated private sector participation</strong> in plant construction, operation, and SMR deployment.</p></li>
<li><p><strong>Central Exclusivity:</strong> The Union Government retains a strict sovereign monopoly over sensitive fuel-cycle activities (heavy water production, high-level enrichment, and spent fuel reprocessing/disposal).</p></li>
<li><p><strong>Liability Structure:</strong> Replaces supplier liability with a tiered, capped operator-liability regime based on reactor thermal capacity.</p></li>
<li><p><strong>Targets:</strong> 22.38 GW by 2031–32 and <strong>100 GW by 2047</strong>; allocates ₹20,000 crore for Small Modular Reactors (SMRs).</p></li>
</ul></li>
</ul>
<h3 id="pib-building-new-india--d-efficiency-carbon-markets">D. Efficiency &amp; Carbon Markets</h3>
<ul>
<li><p><strong>Transition:</strong> Migration from the PAT (<em>Perform, Achieve and Trade</em>) scheme to the <strong>Carbon Credit Trading Scheme (CCTS)</strong>.</p></li>
<li><p><strong>India Energy Stack (IES):</strong> Unified open-protocol DPI for energy data exchange, real-time settlements, and monetising distributed renewable energy assets (rooftop solar, EV batteries, flexible loads).</p></li>
</ul></section>
<section class="blk" data-sec="pib-building-new-india--logistics-transport-infrastructure"><h2 id="pib-building-new-india--logistics-transport-infrastructure">Logistics, Transport &amp; Infrastructure</h2>
<h3 id="pib-building-new-india--a-national-logistics-ecosystem">A. National Logistics Ecosystem</h3>
<ul>
<li><p><strong>Logistics Cost Study (DPIIT + NCAER):</strong> Baseline calculated at <strong>7.97% of GDP (2023–24)</strong>, totaling ₹24.01 lakh crore.</p></li>
<li><p><strong>Logistics Cost Breakdown:</strong> Road (41.7%), Storage/Warehousing (24.8%), Material Handling &amp; Admin (16.1%), Water (7.6%), Air (6.7%), Railway (3.1%).</p></li>
<li><p><strong>Dedicated Freight Corridors (DFCs):</strong></p>
<ul>
<li><p>EDFC (1,337 km; Ludhiana to Sonnagar) is fully completed.</p></li>
<li><p>WDFC (1,506 km; JNPT to Dadri) is ~93% completed.</p></li>
<li><p><em>New Budget 2026–27 corridor:</em> <strong>Dankuni (East) to Surat (West)</strong>.</p></li>
</ul></li>
<li><p><strong>SMILE Programme:</strong> <em>Strengthening Multimodal and Integrated Logistics Ecosystem</em> (collaborative initiative with the <strong>Asian Development Bank</strong> piloted across 8 cities in 8 states).</p></li>
<li><p><strong>World Bank Logistics Performance Index (LPI):</strong> India ranked <strong>38th</strong> (up from 44th in 2018).</p></li>
</ul>
<h3 id="pib-building-new-india--b-rail-metro-tunnels">B. Rail, Metro &amp; Tunnels</h3>
<ul>
<li><p><strong>Metro Rail Network:</strong> Over <strong>1,095 km operational across 26 cities</strong> (<strong>3rd largest globally</strong>).</p></li>
<li><p><strong>Mumbai–Ahmedabad High-Speed Rail (MAHSR):</strong> 508 km; operating speed of <strong>320 km/h</strong>; 12 multimodal stations; end-to-end transit in just over 2 hours.</p></li>
<li><p><strong>High-Altitude &amp; Landmark Engineering:</strong></p>
<ul>
<li><p><strong>Chenab Bridge:</strong> World’s highest railway arch bridge (359 m above river bed; 1,315 m length; designed for wind speeds up to 260 km/h) on the USBRL project.</p></li>
<li><p><strong>New Pamban Bridge:</strong> India’s <strong>first vertical lift railway sea bridge</strong> (2.07 km length; 72.5 m lift span rising 17 m) connecting Rameswaram Island to mainland Tamil Nadu.</p></li>
<li><p><strong>Anji Khad Bridge:</strong> India’s <strong>first cable-stayed railway bridge</strong> (inverted Y-shaped pylon, 96 stay cables).</p></li>
<li><p><strong>Atal Tunnel:</strong> 9.02 km highway tunnel through the <strong>Pir Panjal Range</strong> (bypasses Rohtang Pass, connecting Manali to Lahaul-Spiti; world's longest highway tunnel above 10,000 ft).</p></li>
<li><p><strong>Sonamarg (Z-Morh) Tunnel:</strong> 6.4 km main tunnel constructed via the New Austrian Tunnelling Method (NATM) at 8,650 ft to provide all-weather access toward Ladakh.</p></li>
<li><p><strong>Tunnel T50:</strong> 12.77 km (one of India's longest railway tunnels, between Khari and Sumber on the USBRL link).</p></li>
<li><p><strong>Kolkata Underwater Metro:</strong> Runs beneath the <strong>Hooghly River</strong>, connecting Esplanade and Howrah Maidan.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="pib-building-new-india--digital-divide-core-dpi-india-s-ai-stack"><h2 id="pib-building-new-india--digital-divide-core-dpi-india-s-ai-stack">Digital Divide, Core DPI &amp; India’s AI Stack</h2>
<h3 id="pib-building-new-india--a-universal-connectivity-telecom">A. Universal Connectivity &amp; Telecom</h3>
<ul>
<li><p><strong>Optical Fibre Footprint:</strong> Expanded under BharatNet to <strong>42.36 lakh route km</strong>; over 2.15 lakh Gram Panchayats connected.</p></li>
<li><p><strong>Broadband &amp; Tariff Shift:</strong> Broadband subscribers surpassed <strong>100 crore (1 billion)</strong> in late 2025; average data tariff collapsed from ₹269/GB (2014) to <strong>₹8–10/GB</strong>.</p></li>
<li><p><strong>PM-WANI:</strong> Decentralized public Wi-Fi framework using <strong>PDOs</strong> (Public Data Offices), <strong>PDOAs</strong> (Aggregators), and <strong>App Providers</strong>; requires no licence fee.</p></li>
</ul>
<h3 id="pib-building-new-india--b-the-india-ai-stack-indiaai-mission">B. The India AI Stack &amp; IndiaAI Mission</h3>
<ul>
<li><p><strong>Outlay &amp; Mission Pillars:</strong> Approved with a budget of <strong>₹10,300 crore</strong>.</p></li>
<li><p><strong>Compute Infrastructure:</strong> 38,000 GPUs operationalized (subsidized access for startups and researchers at under ₹100/GPU/hour via the IndiaAI Compute Portal).</p></li>
<li><p><strong>IndiaAI Kosh:</strong> Centralized national data platform hosting <strong>9,500+ datasets and 273 AI models</strong>.</p></li>
<li><p><strong>Sovereign Foundation Models:</strong></p>
<ul>
<li><p><strong>Bhashini:</strong> National language translation platform supporting 350+ language AI models.</p></li>
<li><p><strong>BharatGen:</strong> India-centric multimodal foundation model initiative.</p></li>
</ul></li>
</ul>
<h3 id="pib-building-new-india--c-dpi-diplomacy-global-expansion">C. DPI Diplomacy &amp; Global Expansion</h3>
<ul>
<li><p><strong>International Footprint:</strong> DPI cooperation MoUs signed with <strong>24 partner countries</strong> (Armenia, Sierra Leone, Suriname, Cuba, Kenya, Sri Lanka, Brazil, Malaysia, etc.).</p></li>
<li><p><strong>UPI Cross-Border Rails:</strong> Operational in <strong>8 nations</strong> for merchant payments: <strong>UAE, Singapore, Bhutan, Nepal, Sri Lanka, France, Mauritius, and Qatar</strong>.</p></li>
<li><p><strong>Open Source Stack:</strong> CoWIN and MOSIP (<em>Modular Open-Source Identity Platform</em>) shared as global public goods.</p></li>
</ul></section>
<section class="blk" data-sec="pib-building-new-india--green-pathway-climate-commitments"><h2 id="pib-building-new-india--green-pathway-climate-commitments">Green Pathway &amp; Climate Commitments</h2>
<h3 id="pib-building-new-india--a-updated-ndcs-paris-agreement-targets">A. Updated NDCs (Paris Agreement Targets)</h3>
<ul>
<li><p><strong>Emissions Intensity:</strong> Reduce GDP emissions intensity by <strong>45% by 2030</strong> from 2005 levels.</p></li>
<li><p><strong>Non-Fossil Capacity:</strong> Achieve <strong>~50% cumulative electric power installed capacity</strong> from non-fossil sources by 2030 (surpassed ahead of schedule in early 2026).</p></li>
<li><p><strong>Carbon Sink:</strong> Create an additional carbon sink of <strong>2.5 to 3 billion tonnes of</strong> CO<sub>2</sub> <strong>equivalent</strong> through forest and tree cover by 2030.</p></li>
<li><p><strong>Net Zero Deadline:</strong> Target date fixed at <strong>2070</strong>.</p></li>
</ul>
<h3 id="pib-building-new-india--b-forestry-wildlife-conservation-footprint">B. Forestry, Wildlife &amp; Conservation Footprint</h3>
<ul>
<li><p><strong>Forest &amp; Tree Cover:</strong> Total cover stands at <strong>25.17% of India's geographic area</strong> (Forest cover: 21.76%; Tree cover: 3.41%).</p>
<ul>
<li><p>FAO Global Forest Resources Assessment (FRA 2025): India ranks <strong>9th in total forest area globally</strong> and <strong>3rd in annual net forest gain</strong>.</p></li>
</ul></li>
<li><p><strong>Protected Area Network (2014 vs 2025):</strong></p>
<ul>
<li><p>Protected Areas (PAs): Rose from 745 to <strong>1,134</strong>.</p></li>
<li><p>Elephant Reserves: Rose from 26 to <strong>33</strong>.</p></li>
<li><p>Tiger Reserves: Rose from 46 to <strong>58</strong>.</p></li>
</ul></li>
<li><p><strong>Blue Flag Certifications:</strong> <strong>18 beaches</strong> across 7 coastal states and 4 UTs certified under the Foundation for Environmental Education (FEE) eco-label.</p></li>
</ul></section>
<section class="blk" data-sec="pib-building-new-india--india-s-expanding-space-leadership"><h2 id="pib-building-new-india--india-s-expanding-space-leadership">India’s Expanding Space Leadership</h2>
<h3 id="pib-building-new-india--a-key-space-exploration-milestones">A. Key Space Exploration Milestones</h3>
<ul>
<li><p><strong>SPADEX (Space Docking Experiment):</strong> Validated autonomous in-orbit rendezvous and docking capabilities between two spacecraft, establishing a critical foundation for the <em>Bharatiya Antariksh Station (BAS)</em> and sample-return missions.</p></li>
<li><p><strong>ISRO–NASA NISAR:</strong> Dual-frequency synthetic aperture radar (L-band and S-band) joint satellite mission designed for global surface deformation mapping and cryosphere monitoring.</p></li>
<li><p><strong>Chandrayaan-3:</strong> Historic soft-landing on the <strong>lunar South Pole region</strong> achieved on 23 August 2023.</p></li>
</ul>
<h3 id="pib-building-new-india--b-human-spaceflight-gaganyaan-programme">B. Human Spaceflight: Gaganyaan Programme</h3>
<ul>
<li><p><strong>Mission Specs:</strong> Crew of <strong>3 astronauts</strong> placed into a <strong>400 km Low Earth Orbit (LEO)</strong> for a <strong>3-day mission</strong>, culminating in an Indian Ocean splashdown.</p></li>
<li><p><strong>Launch Vehicle:</strong> LVM3 (human-rated).</p></li>
<li><p><strong>Safety Milestones:</strong> Pad Abort Test (Crew Escape System demonstration) completed successfully.</p></li>
</ul>
<h3 id="pib-building-new-india--c-commercial-space-sectoral-reforms">C. Commercial Space &amp; Sectoral Reforms</h3>
<ul>
<li><p><strong>Institutional Roles:</strong></p>
<ul>
<li><p><strong>IN-SPACe (Indian National Space Promotion and Authorization Centre):</strong> Single-window autonomous nodal agency under the Department of Space to authorize, license, and hand-hold non-governmental private space entities (NGEs).</p></li>
<li><p><strong>NSIL (NewSpace India Limited):</strong> Commercial arm responsible for commercial launch services (e.g., launching 36 OneWeb satellites via LVM3) and transferring ISRO technology to industry.</p></li>
</ul></li>
<li><p><strong>POEM (PSLV Orbital Experimental Module):</strong> Utilizes the spent fourth stage (PS4) of the PSLV launch vehicle as a stabilized in-orbit platform for private microgravity and tech payloads.</p></li>
</ul></section>

        trk+=`<path class="trk ${on?'solid':'dash'}" data-h="${h}" ${on?'pathLength="1"':''} d="M${x0} ${y}H${x1}" stroke="${HEADS[h].c}" style="animation-delay:${i*90+k*40}ms"/>`});
      trk+=`<path class="trk dash" data-h="${h}" d="M${X(11)} ${y}H${XT-30}" stroke="${HEADS[h].c}"/>`;

        lines.map((h,k)=>{const on=monthNote(m.key,h);return `<circle class="sdot ${on?'on':'off'}" data-h="${h}" cx="${x}" cy="${Y+off[k]}" r="6" ${on?`fill="${HEADS[h].c}"`:''}/>`}).join('')+`</g>`;

    });

    const term=`<g class="term"><rect x="${XT-42}" y="${Y-52}" width="84" height="104" rx="42" fill="var(--ink)"/><text x="${XT}" y="${Y-6}" text-anchor="middle" fill="var(--bg)" font-family="var(--display)" font-weight="800" font-size="17">Prelims</text><text x="${XT}" y="${Y+16}" text-anchor="middle" fill="var(--bg)" font-family="var(--display)" font-weight="800" font-size="17">2027</text></g>`;
    return `<svg class="map" viewBox="0 52 ${W} 268" role="img" aria-label="Metro map of months and note streams">${trk}${br}${stn}${term}${lab}${extra}</svg>`;
  }

  const W=360, X0=26, off=[0,15,30,45], Y=i=>120+i*96, YT=Y(12)+10;

      trk+=`<path class="trk ${on?'solid':'dash'}" data-h="${h}" ${on?'pathLength="1"':''} d="M${x} ${y0}V${y1}" stroke="${HEADS[h].c}" style="animation-delay:${i*90+k*40}ms"/>`});
    trk+=`<path class="trk dash" data-h="${h}" d="M${x} ${Y(11)}V${YT-30}" stroke="${HEADS[h].c}"/>`;

  SP.forEach(n=>{const m=monthOf(n);const yb=m?Y(m.idx)+26:Y(-1)+18;const x=X0+45;
    br+=`<path class="br" d="M${x} ${yb}L${x+30} ${yb+30}H${x+62}"/>`;

  MONTHS.forEach((m,i)=>{const y=Y(i),fut=isFuture(m.key)&&!lines.some(h=>monthNote(m.key,h));
    stn+=`<g class="stn ${fut?'fut':''}" data-m="${m.key}"><rect class="pill" x="${X0-13}" y="${y-13}" width="${45+26}" height="26" rx="13"/>`+

      `<text class="lab ${fut?'fut':''}" x="${X0+72}" y="${y-2}" font-size="20">${m.name} <tspan class="yr" font-size="14" font-weight="400">${m.year}</tspan></text><text class="hil" x="${X0+72}" y="${y+18}" font-size="13">${m.hi}${m.key===NOW_KEY?'':''}</text>`+

  return `<svg class="map" viewBox="0 0 ${W} ${YT+44}" role="img" aria-label="Metro map of months and note streams">${trk}${br}${stn}${term}${extra}</svg>`;

  if(store.get('keys',false)){art.classList.add('keys');$('.tools [data-a="keys"]').classList.add('on')}
  const st=$('#strip'),scrim=$('#scrim'),close=()=>{st.classList.remove('open');scrim.classList.remove('on')};
  $('#fab').onclick=()=>{st.classList.add('open');scrim.classList.add('on')};scrim.onclick=close;st.addEventListener('click',e=>{if(e.target.closest('a'))close()});
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const id=e.target.dataset.sec;
    $$('#strip li[data-sec]').forEach(li=>{const on=li.dataset.sec===id;li.classList.toggle('open',on);$(':scope > a',li).classList.toggle('active',on)});
    const a=$(`#strip li[data-sec="${CSS.escape(id)}"]`);if(a&&!st.classList.contains('open')){const r=a.getBoundingClientRect(),t=st.getBoundingClientRect();if(r.top<t.top||r.bottom>t.bottom)st.scrollTop+=r.top-t.top-90}}),{rootMargin:'-90px 0px -65% 0px'});
  $$('section.blk[data-sec]',art).forEach(s=>io.observe(s)); mount.io=io;
}
function strip(n){
  const art=$('#note'),st=$('#strip'); if(!st) return;
  const done=new Set(doneOf(n.id)), secs=$$('section.blk[data-sec]',art), d=secs.filter(s=>done.has(s.dataset.sec)).length, tot=n.sections, R=17, C=2*Math.PI*R;
  let h=`<div class="prog"><svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="${R}" fill="none" stroke="var(--rule)" stroke-width="6"/><circle cx="23" cy="23" r="${R}" fill="none" stroke="var(--c)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-(tot?d/tot:0))}" transform="rotate(-90 23 23)" style="transition:stroke-dashoffset .5s"/></svg><div><b>${d} of ${tot} stops</b><small>sections revised</small></div></div><ol class="route">`;
  $$(':scope > .divider, :scope > section.blk[data-sec]',art).forEach(el=>{
    if(el.classList.contains('divider')){h+=`<li><span class="ix">${el.textContent}</span></li>`;return}
    const id=el.dataset.sec, t=($('h2 .tt',el)||$('h2',el)).textContent.replace('Tap to reveal','');
    const active=$(`#strip li[data-sec="${CSS.escape(id)}"] > a.active`);
    const subs=$$('h3',el).map(x=>`<li><a href="#" data-to="${x.id}">${x.textContent}</a></li>`).join('');
    h+=`<li data-sec="${id}" class="${active?'open':''}"><a href="#" data-to="${id}" class="${done.has(id)?'done':''} ${active?'active':''}"><span class="s"></span><span>${esc(t)}</span></a>${subs?`<ol class="sub">${subs}</ol>`:''}</li>`});
  st.innerHTML=h+'</ol>';
  $$('a[data-to]',st).forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById(a.dataset.to)||$(`section[data-sec="${CSS.escape(a.dataset.to)}"]`);el&&el.scrollIntoView({behavior:'smooth',block:'start'})});
}

/* ---------- router ---------- */
let jump=null, scrollTo_=null;
function route(){
  const app=$('#app'), p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  $('#tip').classList.remove('on');$('#scrim').classList.remove('on');if(mount.io){mount.io.disconnect();mount.io=null}
  document.documentElement.style.removeProperty('--c');
  let html,after=()=>{};
  if(!p.length){html=viewHome();after=()=>bindHome(app)}
  else if(p[0]==='m'){html=viewStation(p[1],p[2]);after=()=>{const n=(p[2]&&byId[p[2]]&&byId[p[2]].special)?byId[p[2]]:monthNote(p[1],p[2]||HEAD_ORDER.find(h=>monthNote(p[1],h)));if(n&&$('#note'))mount(n)}}
  else if(p[0]==='s'){html=viewSpecial(p[1]);after=()=>{byId[p[1]]&&mount(byId[p[1]])}}
  else html=viewMissing();
  app.innerHTML=html; after();
  if(jump){const i=jump;jump=null;const el=$$(SEL,$('#note')||document)[i];if(el)setTimeout(()=>{el.scrollIntoView({block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),2500)},60)}
  else if(scrollTo_){const t=scrollTo_;scrollTo_=null;setTimeout(()=>{const el=document.getElementById(t);el&&el.scrollIntoView({behavior:'smooth'})},40)}
  else window.scrollTo(0,0);
  onScroll();
}
function goTo(entry){const n=byId[entry.n];jump=entry.i;const t=href(n);if(location.hash===t)route();else location.hash=t}
addEventListener('hashchange',route);
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();scrollTo_=g.dataset.go;if(!location.hash||location.hash==='#/')route();else location.hash='#/'}
  if(e.target.closest('[data-card]'))openCard()});
let lastVert=matchMedia('(max-width:760px)').matches;
addEventListener('resize',()=>{const v=matchMedia('(max-width:760px)').matches;if(v!==lastVert){lastVert=v;if(!location.hash||location.hash==='#/'){const y=scrollY;route();scrollTo(0,y)}}});

/* ---------- search ---------- */
const sM=$('#searchModal'),sIn=$('#sInput'),sRes=$('#sRes');let sel=0,res=[];
function openSearch(){sM.classList.add('on');sIn.value='';renderS();setTimeout(()=>sIn.focus(),30)}
function closeAll(){$$('.modal').forEach(m=>m.classList.remove('on'))}
function renderS(){
  const q=sIn.value.trim().toLowerCase();
  if(q.length<2){sRes.innerHTML=`<div class="shint">Type two letters or more. Or try ${['IPOI','BRICS','Ramsar','E20','uranium','Lothal','UPI','critical minerals'].map(w=>`<span class="try" data-q="${w}">${w}</span>`).join('')}</div>`;$$('[data-q]',sRes).forEach(c=>c.onclick=()=>{sIn.value=c.dataset.q;renderS();sIn.focus()});res=[];return}
  const terms=q.split(/\s+/);res=INDEX.filter(e=>terms.every(t=>e.lt.includes(t))).sort((a,b)=>/^H/.test(b.tag)-/^H/.test(a.tag)).slice(0,60);sel=0;
  if(!res.length){sRes.innerHTML=`<div class="shint">Nothing matches “${esc(q)}”. Try a shorter word.</div>`;return}
  const rx=new RegExp('('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  sRes.innerHTML=res.map((e,k)=>{const n=byId[e.n];let t=e.text;const pos=t.toLowerCase().indexOf(terms[0]);if(pos>90)t='…'+t.slice(pos-70);
    return `<a href="#" data-k="${k}" class="${k?'':'sel'}">${badge(H(n))}<span><span class="w"><b>${esc(where(n))}</b>${e.ctx?`, ${esc(e.ctx.slice(0,70))}`:''}</span><p>${esc(t).replace(rx,'<mark>$1</mark>')}</p></span></a>`}).join('')+(res.length===60?'<div class="shint">Showing the first 60. Add a word to narrow it down.</div>':'');
  $$('a[data-k]',sRes).forEach(a=>a.onclick=ev=>{ev.preventDefault();closeAll();goTo(res[+a.dataset.k])});
}
sIn.addEventListener('input',renderS);
sIn.addEventListener('keydown',e=>{const it=$$('a[data-k]',sRes);if(!it.length)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+it.length)%it.length;it.forEach((a,k)=>a.classList.toggle('sel',k===sel));it[sel].scrollIntoView({block:'nearest'})}
  if(e.key==='Enter'){e.preventDefault();closeAll();goTo(res[sel])}});
$('#searchBtn').onclick=openSearch;

/* ---------- quick recall ---------- */
let card=null, seen=0;
function openCard(){if(!CARDS.length)return;card=CARDS[Math.floor(Math.random()*CARDS.length)];seen++;const n=byId[card.n],h=H(n);
  const b=$('#cBadge');b.textContent=h.L;b.style.setProperty('--c',h.c);b.className='lb'+(h===HEADS.sp?' sp':'');
  $('#cSrc').textContent=where(n);$('#cCnt').textContent=`Card ${seen}`;$('#cQ').textContent=card.q;$('#cCtx').textContent=card.ctx;
  const a=$('#cA');a.innerHTML=card.ans;a.classList.add('hid');$('#cardModal').classList.add('on')}
$('#cA').onclick=()=>$('#cA').classList.remove('hid');
$('#cardBtn').onclick=openCard;$('#cNext').onclick=openCard;
$('#cOpen').onclick=e=>{e.preventDefault();closeAll();card&&goTo(card)};
$$('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]'))closeAll()}));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeAll();const s=$('#strip');s&&s.classList.remove('open');$('#scrim').classList.remove('on')}
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(!typing&&(e.key==='/'||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'))){e.preventDefault();openSearch()}
  if($('#cardModal').classList.contains('on')&&!typing){if(e.key===' '){e.preventDefault();$('#cA').classList.remove('hid')}if(e.key==='n')openCard()}
});

/* ---------- theme / chrome ---------- */
(()=>{const t=store.get('theme',null);if(t)document.documentElement.dataset.theme=t})();
$('#themeBtn').onclick=()=>{const c=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=c==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;store.set('theme',nx)};
function onScroll(){const d=document.documentElement,mx=d.scrollHeight-innerHeight;$('#bar').style.width=($('#note')&&mx>0?scrollY/mx*100:0)+'%'}
addEventListener('scroll',onScroll,{passive:true});
$('#ftCount').textContent=`${NOTES.length} notes, ${INDEX.length.toLocaleString('en-IN')} searchable points, ${CARDS.length} recall cards`;
route();
</script>
</body>
