<section class="blk" data-sec="2026-05-dte--rising-co2-is-changing-blood-chemistry"><h2 id="2026-05-dte--rising-co2-is-changing-blood-chemistry">Rising CO₂ is changing blood chemistry</h2>
<ul>
<li><p>Humans evolved at <strong>200–300 ppm</strong> CO₂. Today's level is <strong>about 430 ppm</strong>, the highest our species has experienced.</p></li>
<li><p>In red blood cells, CO₂ is converted to <strong>bicarbonate (HCO₃⁻)</strong>, which buffers blood <strong>pH</strong>.</p></li>
<li><p>The study analysed <strong>US NHANES</strong> data on about <strong>7,000 people (1999–2020)</strong>. Over that period:</p>
<ul>
<li><p>blood <strong>HCO₃⁻ rose about 7%</strong>, in step with atmospheric CO₂;</p></li>
<li><p><strong>calcium fell 2%</strong> and <strong>phosphorus fell 7%</strong>.</p></li>
</ul></li>
<li><p><strong>Possible effects:</strong></p>
<ul>
<li><p><strong>compensated respiratory acidosis</strong>;</p></li>
<li><p>kidney overload and <strong>kidney stones</strong>;</p></li>
<li><p><strong>lower bone density</strong>, as calcium leaches from bone;</p></li>
<li><p>protein misfolding;</p></li>
<li><p>"<strong>genetic priming</strong>" of offspring through altered DNA methylation.</p></li>
</ul></li>
<li><p>At current trends, HCO₃⁻ could reach the <strong>edge of the normal range by about 2076</strong> (phosphorus by 2085, calcium by 2099).</p></li>
<li><p><strong>Indoor CO₂</strong> is <strong>700 ppm</strong> in ventilated rooms and up to <strong>4,000 ppm</strong> in crowded ones. Health risks are linked to exposure of about <strong>1,000 ppm</strong> (<em>Nature Sustainability</em>, 2019).</p></li>
</ul></section>
<section class="blk" data-sec="2026-05-dte--ioc-s-sry-gene-screening"><h2 id="2026-05-dte--ioc-s-sry-gene-screening">IOC's SRY gene screening</h2>
<ul>
<li><p>On <strong>26 March 2026</strong> the <strong>International Olympic Committee</strong> ruled that only "biological females" can compete in the women's category. Athletes will be screened once in their careers for the <strong>SRY (Sex-determining Region Y) gene</strong>, by cheek swab or blood test.</p></li>
<li><p><strong>About the SRY gene:</strong></p>
<ul>
<li><p>It sits on the <strong>Y chromosome</strong> and was discovered in <strong>1990</strong> (by Andrew Sinclair and Peter Koopman).</p></li>
<li><p>It switches on about <strong>6 weeks into embryonic development</strong> and sets off about 30 other genes that form the <strong>testes</strong>.</p></li>
</ul></li>
<li><p><strong>The criticism:</strong> having SRY does not guarantee male development, as in <strong>Differences/Disorders of Sex Development (DSDs)</strong>, which cover 40–60 conditions. One example is <strong>Complete Androgen Insensitivity Syndrome (CAIS)</strong>: testosterone is made, but the body has no working androgen receptors.</p></li>
<li><p><strong>World Athletics</strong> adopted SRY screening in 2025, and the <strong>Athletics Federation of India</strong> announced it in April 2026. The next Olympics are <strong>Los Angeles 2028</strong>.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> <strong>SRY is on the Y chromosome</strong>; it is not a hormone. Having the gene ≠ functional testosterone (CAIS). And the CO₂ effect comes from <strong>total exposure, mostly indoors</strong>, not from outdoor air alone.</p></div></section>
<section class="blk" data-sec="2026-05-dte--culture-heritage-and-the-indian-knowledge-system"><h2 id="2026-05-dte--culture-heritage-and-the-indian-knowledge-system">Culture, heritage and the Indian Knowledge System</h2></section>
<section class="blk" data-sec="2026-05-dte--chhipa-block-printing-revived"><h2 id="2026-05-dte--chhipa-block-printing-revived">Chhipa block printing revived</h2>
<ul>
<li><p><strong>Chhipa</strong> is a traditional textile <strong>dyeing and block-printing</strong> craft named after the community that practises it. That community lived in the <strong>erstwhile Central Provinces and Berar</strong> (parts of MP, Maharashtra and Chhattisgarh).</p></li>
<li><p>The craft nearly vanished about 50 years ago, when machine-made textiles took over. <strong>ASHA (Aid and Survival of Handicrafts Artisans)</strong>, set up by <strong>Rohit and Aarti Rusiya</strong> of <strong>Chhindwara (MP)</strong>, is reviving it.</p></li>
<li><p><strong>Natural dyes</strong> come from:</p>
<ul>
<li><p><strong>harad</strong> (<em>Terminalia chebula</em>);</p></li>
<li><p><strong>Indian madder</strong> (<em>Rubia cordifolia</em>);</p></li>
<li><p><strong>axlewood</strong> (<em>Anogeissus latifolia</em>) flowers;</p></li>
<li><p><strong>noni</strong> (<em>Morinda citrifolia</em>) roots;</p></li>
<li><p>pomegranate, iron and alum.</p></li>
</ul></li>
<li><p><strong>Motifs:</strong> <em>belpan</em>, <em>kairi</em> (mango) and <em>sankal buta</em>, plus <strong>Gond <em>godna</em> (tattoo) motifs</strong> from the Gondwana region.</p></li>
</ul>
<p><em><strong>Stories from a Kargili Kitchen</strong></em></p>
<ul>
<li><p><strong>Kargil</strong> is the <strong>joint capital of the UT of Ladakh</strong> (with Leh) and was the site of the <strong>1999 war</strong>.</p></li>
<li><p><strong>Festivals:</strong></p>
<ul>
<li><p><strong>Mamani</strong>, celebrated by <strong>both Muslims and Buddhists</strong> in homage to the ancestors who made the soil farmable;</p></li>
<li><p><strong>Losar</strong>, the Ladakhi New Year;</p></li>
<li><p><strong>Bono Na</strong>, a harvest festival (of the Brokpa).</p></li>
</ul></li>
<li><p><strong>Languages:</strong> <strong>Urdu and Shina</strong> are <strong>Indo-Aryan</strong>; <strong>Purigi, Balti and Ladakhi</strong> are <strong>Sino-Tibetan</strong>. Communities include the <strong>Brokpas</strong>, Purigi Buddhists (Bhotos) and descendants of <strong>Yarkandi</strong> traders.</p></li>
<li><p><strong>Foods:</strong> apricot, buckwheat, yak meat, <em>popot</em>, <em>chhang</em> (barley brew) and <em>shanang</em>.</p></li>
</ul></section>
<section class="blk" data-sec="2026-05-dte--indian-knowledge-system-iks-at-the-iits"><h2 id="2026-05-dte--indian-knowledge-system-iks-at-the-iits">Indian Knowledge System (IKS) at the IITs</h2>
<ul>
<li><p>IKS was introduced through the <strong>National Education Policy</strong>. The article says "NEP 2021", but the policy is <strong>NEP 2020</strong>.</p></li>
<li><p>There are dedicated <strong>IKS centres at IIT Delhi, Mandi, Roorkee and Kharagpur</strong>.</p></li>
<li><p>Projects criticised in the column:</p>
<ul>
<li><p>Raja Yoga (IIT Bombay);</p></li>
<li><p>the <em>Bahi-Khata</em> accounting system (IIT Jodhpur);</p></li>
<li><p>the iron beams of the <strong>Konark Sun Temple</strong> (IIT Bhubaneswar);</p></li>
<li><p><strong>Yoga Nidra</strong> brain mapping (IIT Delhi).</p></li>
</ul></li>
<li><p><strong>IIT Kharagpur (1950)</strong> was the first IIT.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> <strong>Scientific temper</strong> is a <strong>Fundamental Duty, Article 51A(h)</strong>, added by the <strong>42nd Amendment (1976)</strong>; it is not a Directive Principle. Shina belongs to the Indo-Aryan (Dardic) family, while Balti and Purigi are Tibetic.</p></div></section>
<section class="blk" data-sec="2026-05-dte--india-s-first-energy-exodus-and-pmuy-2-0"><h2 id="2026-05-dte--india-s-first-energy-exodus-and-pmuy-2-0">"India's first energy exodus" and PMUY 2.0</h2>
<div class="callout c-news"><span class="c-tag">In the news</span><p><strong>News:</strong> In <strong>March–April 2026</strong>, after the <strong>US–Israel war on Iran</strong> and the <strong>choking of the Strait of Hormuz</strong>, LPG became scarce and costly. Migrant workers in Surat, Mumbai and Delhi returned to their villages; one black-market cylinder could cost up to <strong>a quarter of an informal worker's monthly income</strong>. The column calls this the <strong>first wave of "energy migrants"</strong>.</p></div>
<h4>Facts to know:</h4>
<ul>
<li><p>Migrants are <strong>a large share of India's urban population</strong>, which is projected to reach about <strong>630 million by 2030</strong>.</p></li>
<li><p><strong>PMUY (2016)</strong> did not originally cover urban migrants. <strong>PMUY 2.0 (2021)</strong> lets <strong>migrant families get an LPG connection on a self-declaration of address</strong>. MoPNG says <strong>0.54 million migrant households</strong> got connections in 2023.</p></li>
<li><p><strong>Measures taken after 2020:</strong> portable PDS rations (<strong>One Nation One Ration Card</strong>) and wider health insurance cover.</p></li>
<li><p><strong>Studies:</strong> South Africa found that rural–urban migration <em>reduced</em> migrants' energy poverty. A study of <strong>102 developing countries (2000–22)</strong> found that energy poverty also drives <strong>international</strong> migration.</p></li>
</ul>
<div class="callout c-frame"><span class="c-tag">Prelims lens</span><p><strong>Prelims framing:</strong> Under PMUY 2.0, migrants need <strong>no proof of address</strong>; a self-declaration is enough. Energy poverty is now recognised as a driver of migration.</p></div></section>
<div class="divider" id="2026-05-dte--div-may-2026-part-ii"><span>May 2026 · Part II</span></div>
<section class="blk" data-sec="2026-05-dte--cover-story-human-wildlife-conflict-on-farms"><h2 id="2026-05-dte--cover-story-human-wildlife-conflict-on-farms">Cover story: human–wildlife conflict on farms</h2>
<div class="callout c-concept"><span class="c-tag">Concept</span><p><strong>Core idea:</strong> Farmers across about a dozen states are leaving fields fallow or changing crops because of raids by <strong>nilgai, blackbuck, wild boar, deer, macaques, parrots, elephants, leopards and stray cattle</strong>. Experts argue that policy must move from "protection only" to managed <strong>coexistence</strong>.</p></div>
<h4>Field snapshots:</h4>
<ul>
<li><p><strong>MP, November 2025:</strong> more than <strong>900 blackbuck and nilgai</strong> were translocated by helicopter drive from <strong>Shajapur</strong> to Rani Durgavati TR, Nauradehi WLS, <strong>Gandhi Sagar WLS and Kuno NP</strong>. It was one of India's largest translocations, but relief was brief.</p></li>
<li><p><strong>Odisha (Ganjam):</strong> farmers declared a "<strong>crop holiday</strong>" and switched from paddy to <strong>kewra (screw pine)</strong>.</p></li>
<li><p><strong>Himachal:</strong> <strong>parrots</strong> destroy 5–7% of apples, and monkeys and wild boar also cause losses. Horticulture is about 20% of state GDP.</p></li>
<li><p><strong>Junnar (Pune):</strong> leopards living in sugarcane fields led the forest division to hand out spiked <strong>"neck guards"</strong> for people (October 2024 onwards). Twenty leopards were moved to <strong>Vantara (Jamnagar)</strong>.</p></li>
<li><p><strong>Karnataka:</strong> 35,500+ conflict incidents in 2024–25, <strong>22,000 involving elephants</strong>, plus tiger attacks near <strong>Bandipur</strong>.</p></li>
<li><p><strong>J&amp;K:</strong> <strong>Asiatic black bear</strong> attacks caused <strong>67 deaths and 940 injuries (2023–25)</strong>. Warmer winters are <strong>shortening hibernation</strong>.</p></li>
<li><p><strong>Stray cattle:</strong> the <strong>Rajasthan Bovine Animal Act (amended 2018)</strong> restricts cattle transport and sale (buffaloes are excluded). <strong>UP gaushalas</strong> get <strong>₹1,500 per animal per month</strong>. In Bundelkhand, the practice of leaving cattle unattended is called "<strong>anna pratha</strong>".</p></li>
</ul>
<h4>Data:</h4>
<ul>
<li><p><strong>Gokhale Institute survey (2025, 1,200+ Maharashtra farmers):</strong> losses of <strong>₹10,000–40,000 crore a year</strong>. <strong>62%</strong> of farmers cut the area they cultivate, and <strong>54%</strong> dropped at least one high-value crop. Only <strong>1–2%</strong> of claimants got adequate compensation.</p></li>
<li><p><strong>Uttarakhand Rural Development and Migration Prevention Commission (April 2026):</strong> wildlife damage is the <strong>5th biggest driver of migration (5.61%)</strong>, highest in <strong>Almora (10.99%)</strong>. <strong>57%</strong> of wild animals now live near settlements.</p></li>
</ul>
<h4>Law and policy (key for prelims):</h4>
<div class="table-wrap"><table>

<thead>
<tr class="header">
<th><strong>Provision</strong></th>
<th><strong>What it says</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>WLPA 1972, Section 11</strong></td>
<td>The <strong>Chief Wild Life Warden</strong> may permit hunting (killing or capture) of an animal <strong>dangerous to human life or property</strong>. For Schedule II species this power can be delegated</td>
</tr>
<tr class="even">
<td><strong>Section 62 (vermin)</strong></td>
<td>The <strong>Centre</strong> may declare a species <strong>vermin</strong> in a specified area for a set period, which allows culling. Past examples: <strong>Bihar (nilgai, wild boar, 2015)</strong>; <strong>Uttarakhand (wild boar), HP (rhesus macaque), Gujarat (nilgai), Maharashtra (wild boar)</strong> in 2016</td>
</tr>
<tr class="odd">
<td><strong>2022 amendment</strong></td>
<td>Schedules cut to <strong>four</strong>, and <strong>"conservation"</strong> added to the Preamble. The <strong>rhesus macaque was dropped from the schedules</strong>; in late 2025 the <strong>NBWL recommended putting it back in Schedule II</strong></td>
</tr>
<tr class="even">
<td><strong>Kerala</strong></td>
<td>The Centre refused to declare <strong>wild boar</strong> vermin, so Kerala passed its <strong>own bill</strong> declaring wild-boar attacks a <strong>state disaster</strong>, with panchayats able to call licensed shooters. It went to the <strong>President</strong> (February 2026); assent is pending</td>
</tr>
<tr class="odd">
<td><strong>PMFBY (new)</strong></td>
<td>From <strong>kharif 2026</strong>, crop loss from <strong>animal attacks</strong> is covered. Farmers must report within <strong>72 hours</strong>, and damage is verified by <strong>drones</strong></td>
</tr>
</tbody>
</table></div>
<h4>Expert views:</h4>
<ul>
<li><p><strong>Milind Watve:</strong> wildlife has <strong>lost its fear of humans</strong> since hunting ended in 1972. He suggests limited, scientific culling to restore that avoidance.</p></li>
<li><p><strong>H S Pabla:</strong> proposes three zones: <strong>protected areas</strong>, <strong>buffer zones with sustainable use</strong>, and <strong>farmland with no large mammals</strong>. About 25% of natural forest is already in PAs.</p></li>
<li><p><strong>Qamar Qureshi:</strong> aim for "<strong>co-occurrence</strong>" rather than coexistence, possibly using <strong>immunocontraception</strong> (as proposed for elephants).</p></li>
<li><p><strong>Human–shield hypothesis:</strong> non-lethal human presence can create safe areas for prey species.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> <strong>Vermin</strong> status is declared by the <strong>Central government</strong> (Section 62), not by states, which is why Kerala needed its own law and Presidential assent. Under the WLPA, "hunting" includes <strong>capture</strong>, not just killing.</p></div></section>
<section class="blk" data-sec="2026-05-dte--pfbr-attains-criticality-india-enters-stage-ii"><h2 id="2026-05-dte--pfbr-attains-criticality-india-enters-stage-ii">PFBR attains criticality: India enters Stage II</h2>
<div class="callout c-news"><span class="c-tag">In the news</span><p><strong>News:</strong> The <strong>500 MW(e) Prototype Fast Breeder Reactor (PFBR)</strong> at <strong>Kalpakkam, Tamil Nadu</strong>, <strong>attained criticality on 6 April 2026</strong>. It is India's <strong>first operational fast breeder reactor</strong> and marks entry into <strong>Stage II</strong>. Construction began in <strong>2004</strong> with a target of 2010, so it came about 22 years after the start.</p></div>
<h4>Concepts:</h4>
<ul>
<li><p><strong>Criticality:</strong> the point at which a <strong>self-sustaining, controlled fission chain reaction</strong> begins. It is not the same as generating power.</p></li>
<li><p><strong>Fissile</strong> nuclides (U-235, Pu-239) split readily. <strong>Thorium is not fissile</strong>; it is <em>fertile</em>, meaning it can be <strong>converted into fissile U-233</strong>.</p></li>
<li><p>A <strong>breeder</strong> reactor <strong>produces more fissile fuel than it consumes</strong>. The PFBR is <strong>sodium-cooled</strong> (liquid sodium reacts with air and water, a safety concern).</p></li>
</ul>
<div class="table-wrap"><table>

<thead>
<tr class="header">
<th><strong>Stage</strong></th>
<th><strong>Reactor</strong></th>
<th><strong>Fuel</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>I</strong></td>
<td><strong>Pressurised heavy water reactors (PHWRs)</strong>, with heavy water as the moderator</td>
<td>Natural uranium; spent fuel yields <strong>plutonium</strong></td>
</tr>
<tr class="even">
<td><strong>II</strong></td>
<td><strong>Fast breeder reactors (FBRs)</strong>, starting with the PFBR</td>
<td>Plutonium. They also <strong>breed U-233 from a thorium blanket</strong></td>
</tr>
<tr class="odd">
<td><strong>III</strong></td>
<td>Advanced thorium reactors</td>
<td><strong>Thorium + U-233</strong></td>
</tr>
</tbody>
</table></div>
<h4>Figures:</h4>
<ul>
<li><p>Nuclear is about <strong>9%</strong> of world electricity but <strong>about 3% of India's</strong> (CEA, March 2026).</p></li>
<li><p>India has <strong>8.78 GW</strong> of nuclear capacity from <strong>24 operational reactors</strong> (PHWRs plus 2 BWRs at Tarapur and 2 VVERs at Kudankulam).</p></li>
<li><p>The <strong>Nuclear Energy Mission</strong> (Budget 2025–26) targets <strong>100 GW by 2047</strong>.</p></li>
<li><p><strong>Reserves:</strong> uranium about <strong>90,000 t</strong>; thorium about <strong>3–3.6 lakh t</strong>. This is enough for about <strong>400 years</strong>.</p></li>
<li><p><strong>Uranium mines:</strong> Jaduguda (Jharkhand), Domiasiat (Meghalaya) and Lambapur–Peddagattu (Telangana). <strong>Thorium:</strong> coastal monazite sands in Kerala, Tamil Nadu, Odisha and Andhra Pradesh.</p></li>
</ul>
<h4>Global experience:</h4>
<ul>
<li><p><strong>Russia:</strong> the <strong>BN-600 (Beloyarsk, 1980)</strong> is the longest-running commercial fast reactor. The <strong>BN-800</strong> followed, and Russia is now building the <strong>lead-cooled BREST-OD-300 (Seversk, 2021)</strong>.</p></li>
<li><p><strong>Japan's Monju</strong> closed after a sodium leak. <strong>France's Superphénix</strong> shut down after technical and political problems.</p></li>
<li><p><strong>Cost:</strong> Ramana (2016) estimated PFBR power could cost about <strong>80% more</strong> than PHWR power.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> <strong>PHWRs use natural uranium with heavy water</strong> as the moderator. <strong>VVERs (Kudankulam) are light-water pressurised reactors</strong> of Russian design. The PFBR is cooled by <strong>liquid sodium</strong>, not water. Thorium is <strong>fertile, not fissile</strong>.</p></div></section>
<section class="blk" data-sec="2026-05-dte--power-sector-grid-flexibility-and-the-uae-s-exit"><h2 id="2026-05-dte--power-sector-grid-flexibility-and-the-uae-s-exit">Power sector, grid flexibility and the UAE's exit from OPEC</h2></section>
<section class="blk" data-sec="2026-05-dte--record-peak-demand"><h2 id="2026-05-dte--record-peak-demand">Record peak demand</h2>
<ul>
<li><p>On <strong>25 April 2026</strong>, India's power demand hit an <strong>all-time high of 256 GW</strong>. At the peak, <strong>solar supplied about 24%</strong> and all <strong>non-fossil sources about 30%</strong>.</p></li>
<li><p>During solar hours, coal plants ran down to their <strong>technical minimum of about 55%</strong>. At night, <strong>coal met 78–82%</strong> of demand.</p></li>
<li><p><strong>The fix:</strong> make <strong>coal plants flexible</strong>, add <strong>storage</strong>, and use easier-to-switch sources (<strong>hydro, gas</strong>).</p></li>
<li><p><strong>Supply-chain point:</strong> oil and gas need a continuous <em>flow</em>, whereas renewables are a one-time <em>stock</em> purchase.</p></li>
<li><p><strong>SIAM</strong> opposed Delhi's proposal to allow the sale of only <strong>electric two-wheelers from April 2028</strong>, citing dependence on Chinese batteries and <strong>rare-earth magnets</strong>.</p></li>
</ul></section>
<section class="blk" data-sec="2026-05-dte--crea-quarterly-snapshot-january-march-2026"><h2 id="2026-05-dte--crea-quarterly-snapshot-january-march-2026">CREA quarterly snapshot, January–March 2026</h2>
<ul>
<li><p>Generation grew only <strong>3%</strong>, the <strong>slowest Q4 growth in six years</strong>.</p></li>
<li><p><strong>Growth by source:</strong> solar <strong>+24%</strong>, wind <strong>+11%</strong>, nuclear <strong>+10%</strong> and large hydro <strong>+7%</strong>.</p></li>
<li><p><strong>Coal</strong> supplied <strong>339 billion units, or 73%</strong> of generation.</p></li>
<li><p><strong>Curtailment:</strong></p>
<ul>
<li><p><strong>27 GW of solar and 4 GW of wind</strong> were curtailed directly.</p></li>
<li><p>Much more was curtailed under <strong>Tertiary Reserve Ancillary Services (TRAS)</strong>: 83 GW of solar and 11 GW of wind.</p></li>
<li><p><strong>Solar was about 88%</strong> of all curtailment, concentrated in parks such as <strong>Khavda (Gujarat)</strong>.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-05-dte--the-uae-leaves-opec"><h2 id="2026-05-dte--the-uae-leaves-opec">The UAE leaves OPEC</h2>
<ul>
<li><p>The <strong>UAE withdrew from OPEC with effect from 1 May 2026</strong>, on 72 hours' notice. OPEC was founded in <strong>1960</strong> and now has <strong>11 members</strong>, producing about <strong>30% of world crude</strong>.</p></li>
<li><p><strong>The UAE's position:</strong> it was OPEC's <strong>4th-largest producer</strong>, with a quota of <strong>3.4 million barrels a day</strong>. It is building capacity to <strong>5 mb/d by 2027</strong> (a $150 billion programme) and had long clashed with <strong>Saudi Arabia</strong> over quotas.</p></li>
<li><p>At the same time, the <strong>first conference on "Transitioning Away from Fossil Fuels"</strong> was under way in <strong>Santa Marta, Colombia</strong>, with <strong>57 countries</strong>.</p></li>
<li><p><strong>Sheikh Yamani's line:</strong> "<em>The Stone Age did not end because the world ran out of stones…</em>"</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> OPEC's HQ is in <strong>Vienna</strong>, but it was founded in <strong>Baghdad (1960)</strong>. <strong>OPEC+</strong> is the wider grouping that includes Russia. "Transitioning away from fossil fuels" is wording from the <strong>COP28 (Dubai) Global Stocktake</strong> decision.</p></div></section>
<section class="blk" data-sec="2026-05-dte--nss-80th-round-household-social-consumption-heal"><h2 id="2026-05-dte--nss-80th-round-household-social-consumption-heal">NSS 80th round — "Household Social Consumption: Health"</h2>
<p><strong>Survey:</strong> The <strong>National Statistical Office</strong> released it on <strong>27 April 2026</strong>. It is based on the <strong>NSS 80th round (January–December 2025)</strong> and measures illness over a <strong>15-day reference period</strong>, as the <strong>Proportion of Persons Reporting Ailment (PPRA)</strong>.</p>
<h4>Key figures:</h4>
<ul>
<li><p>Overall morbidity is <strong>13.1%</strong>, about <strong>1 in 8 people</strong>. The disease burden has <strong>more than doubled</strong> since 1995–96:</p></li>
</ul>
<div class="table-wrap"><table>

<thead>
<tr class="header">
<th><strong>Area</strong></th>
<th><strong>1995–96 (52nd round)</strong></th>
<th><strong>2025 (80th round)</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Urban PPRA</td>
<td>5.4%</td>
<td><strong>14.9%</strong></td>
</tr>
<tr class="even">
<td>Rural PPRA</td>
<td>5.5%</td>
<td><strong>12.2%</strong></td>
</tr>
</tbody>
</table></div>
<ul>
<li><p><strong>Women 14.4% vs men 11.8%.</strong> Women have reported more illness than men since 1995–96.</p></li>
<li><p><strong>Cardiovascular disease</strong> is the largest category, <strong>about 24% of all ailments</strong>, ahead of endocrine and metabolic disorders (diabetes, thyroid). Heart disease is up <strong>almost 3 times since 2017–18</strong>.</p></li>
<li><p>CVD-related morbidity rises with age: <strong>2.1%</strong> at 15–29, <strong>15.3%</strong> at 30–44, 30.1% at 45–59 and 37.8% above 60.</p></li>
<li><p><strong>By state:</strong> highest in <strong>Kerala (39.7%)</strong>, West Bengal (24.5%), Andhra Pradesh (21.1%) and Goa (18.7%). Lowest in <strong>Chhattisgarh (8.8%)</strong>, Jharkhand, MP, UP and Bihar. High reporting partly reflects <strong>awareness and an ageing population</strong>.</p></li>
<li><p><strong>Costs:</strong></p>
<ul>
<li><p>Treatment costs about <strong>₹50,508 in private hospitals vs ₹6,631 in government hospitals</strong>.</p></li>
<li><p>A delivery costs about <strong>₹2,299 in a government hospital</strong>.</p></li>
<li><p>The share of deliveries in government facilities <strong>fell from 69.2% to 66.8%</strong>.</p></li>
<li><p>The private-hospital share in rural areas <strong>rose from 21.3% to 28.8%</strong> (2017–18 to 2025).</p></li>
</ul></li>
<li><p>Mental health conditions affect <strong>117 per 100,000</strong> people. The <strong>hospitalisation rate is only 2.9%</strong>.</p></li>
<li><p><strong>Critique (Jan Swasthya Abhiyaan):</strong> the survey is <strong>hospital-centric</strong>. It ignores prevention, ASHAs and sub-centres, and leaves out OPD out-of-pocket spending.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> PPRA uses a <strong>15-day</strong> reference period; hospitalisation uses <strong>365 days</strong>. Higher reported morbidity (e.g. Kerala) can reflect <strong>better reporting and access</strong>, not just worse health.</p></div></section>
<section class="blk" data-sec="2026-05-dte--cultivated-lab-grown-meat"><h2 id="2026-05-dte--cultivated-lab-grown-meat">Cultivated (lab-grown) meat</h2>
<h3 id="2026-05-dte--how-it-is-made">How it is made</h3>
<ol type="1">
<li><p><strong>Biopsy:</strong> a small tissue sample is taken from a living animal.</p></li>
<li><p><strong>Stem-cell selection:</strong> self-renewing cells that can become muscle, fat or connective tissue are chosen.</p></li>
<li><p><strong>Bioreactor growth:</strong> cells multiply in steel tanks fed a <strong>growth medium</strong> (glucose, amino acids, vitamins, growth factors).</p></li>
<li><p><strong>Harvest:</strong> the cell biomass is collected.</p></li>
<li><p><strong>Scaffold:</strong> a <strong>plant-based scaffold (soy or pea)</strong> gives shape for simple products such as nuggets.</p></li>
<li><p><strong>3D printing:</strong> used for structured cuts such as steak.</p></li>
</ol>
<h4>Milestones:</h4>
<div class="table-wrap"><table>

<thead>
<tr class="header">
<th><strong>Year</strong></th>
<th><strong>Event</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>2013</td>
<td><strong>Mark Post (Maastricht, Netherlands)</strong> unveils the first lab-grown beef burger</td>
</tr>
<tr class="even">
<td>2020</td>
<td><strong>Singapore</strong> becomes the <strong>first country to approve sale</strong> (Eat Just)</td>
</tr>
<tr class="odd">
<td>Dec 2023</td>
<td><strong>Italy</strong> becomes the <strong>first and only country to ban</strong> it</td>
</tr>
<tr class="even">
<td>2024</td>
<td>US states <strong>Florida and Alabama</strong> ban it</td>
</tr>
<tr class="odd">
<td>2025</td>
<td>First US retail launch; <strong>Australia</strong> approves sale and builds a 20,000-litre facility</td>
</tr>
</tbody>
</table></div>
<ul>
<li><p><strong>Approved so far in:</strong> the US, Australia, New Zealand and Israel. There are <strong>142 companies worldwide</strong> (GFI, 2025).</p></li>
<li><p><strong>In India:</strong> <strong>six companies</strong> work on chicken and goat products. The <strong>Department of Biotechnology's "Smart Protein"</strong> effort comes under the <strong>BioE3 Policy (2024)</strong> (Biotechnology for Economy, Environment and Employment).</p></li>
</ul>
<h4>Debate:</h4>
<ul>
<li><p><strong>Cost:</strong> the main cost drivers are the <strong>growth medium</strong> and <strong>bioreactor capital costs</strong>. Humbird (2021) estimated at least <strong>$50/kg</strong> at retail. Industry reports media costs of <strong>≤ $0.20 per litre (2025)</strong>, a cut of over 99%.</p></li>
<li><p><strong>Climate impact:</strong></p>
<ul>
<li><p>The footprint depends on the <strong>energy source</strong>: <strong>over 14 kg CO₂e/kg</strong> on today's average grid versus <strong>under 3 kg</strong> on renewables (CE Delft, 2023).</p></li>
<li><p>Risner (2024) puts it at <strong>4–25 times beef's footprint</strong> with pharma-grade purification.</p></li>
</ul></li>
<li><p><strong>Gas profile:</strong> livestock emissions are mostly <strong>methane</strong> (about <strong>80 times CO₂</strong> over 20 years, lasting about 10–12 years). Cultivated meat emits mostly <strong>CO₂</strong>, which lasts centuries.</p></li>
<li><p><strong>Livelihoods:</strong> livestock supports about <strong>1.3 billion people</strong> worldwide (FAO).</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> <strong>Singapore</strong> was the first to <em>approve</em>, while <strong>Italy</strong> was the first to <em>ban</em> nationally. "<strong>Precision fermentation</strong>" uses microbes to make specific proteins, which is different from cultivated meat (animal cells).</p></div></section>
<section class="blk" data-sec="2026-05-dte--critical-minerals-water-and-justice"><h2 id="2026-05-dte--critical-minerals-water-and-justice">Critical minerals, water and justice</h2>
<div class="callout c-news"><span class="c-tag">In the news</span><p><strong>Report:</strong> "<strong>Critical Minerals, Water Insecurity and Injustice</strong>" (April 2026) by the <strong>UN University Institute for Water, Environment and Health (UNU-INWEH), Canada</strong>.</p></div>
<h4>Facts:</h4>
<ul>
<li><p><strong>Demand by 2040:</strong> <strong>lithium 9 times</strong>, <strong>cobalt and nickel double</strong>. Lithium, graphite and cobalt could rise about <strong>500% by 2050</strong>.</p></li>
<li><p><strong>Water use:</strong> 2024 lithium output (about 240,000 t, excluding the US) used about <strong>456 billion litres</strong> of water, equal to the domestic needs of <strong>62 million people</strong> in sub-Saharan Africa.</p></li>
<li><p><strong>16%</strong> of critical-mineral reserves are in <strong>high water-stress</strong> regions, and <strong>54%</strong> of transition minerals lie on or near <strong>indigenous lands</strong>.</p></li>
<li><p><strong>Chile's Salar de Atacama:</strong> lithium and copper mining use up to <strong>65% of regional water</strong>. The <strong>Lithium Triangle</strong> is <strong>Argentina, Bolivia and Chile</strong>.</p></li>
<li><p><strong>Rare earths:</strong> about <strong>2,000 t of toxic waste per tonne</strong> of usable material, or about <strong>707 Mt</strong> of waste in 2024.</p></li>
<li><p><strong>DR Congo (cobalt):</strong></p>
<ul>
<li><p><strong>72%</strong> of people near mines report skin disease;</p></li>
<li><p>about <strong>30%</strong> of mining sites use <strong>child labour</strong>;</p></li>
<li><p>over <strong>70%</strong> of people live on under <strong>$2.15 a day</strong>.</p></li>
</ul></li>
<li><p><strong>Recommendations:</strong> <strong>mandatory</strong> due diligence (not voluntary), stricter pollution controls, and recycling, <strong>circular economy</strong> and <strong>EPR</strong> measures.</p></li>
</ul>
<div class="callout c-frame"><span class="c-tag">Prelims lens</span><p><strong>Prelims framing:</strong> Critical minerals are <strong>non-fuel</strong> minerals whose supply chains are prone to disruption. India's list has <strong>30</strong> (2023), and it has a <strong>National Critical Mineral Mission (2025)</strong>.</p></div></section>
<section class="blk" data-sec="2026-05-dte--conservation-community-conserved-areas-coral-and"><h2 id="2026-05-dte--conservation-community-conserved-areas-coral-and">Conservation: community conserved areas, coral and land</h2></section>
<section class="blk" data-sec="2026-05-dte--tar-village-ladakh-s-first-community-conserved-a"><h2 id="2026-05-dte--tar-village-ladakh-s-first-community-conserved-a">Tar village: Ladakh's first Community Conserved Area</h2>
<ul>
<li><p><strong>Tar</strong> is a small village in <strong>Leh district</strong> with 15 households, reached only on foot, and is known for <strong>snow leopard</strong> sightings.</p></li>
<li><p>The <strong>Ministry of Tourism</strong> named it a winner of the <strong>Best Tourism Villages Competition</strong> (Responsible Tourism category) on <strong>27 September 2024</strong>.</p></li>
<li><p>It <strong>declared itself a CCA on 23 October 2024</strong>, which is <strong>International Snow Leopard Day</strong>. It was supported by <strong>SLC-IT</strong> and <strong>Kalpavriksh</strong>.</p></li>
<li><p>A CCA committee manages the village, and homestay income is shared <strong>on rotation</strong>.</p></li>
<li><p><strong>Traditions:</strong> <strong>langde</strong> (shared labour at sowing and harvest) and ploughing with the <strong>dzo</strong> (a yak–cow hybrid).</p></li>
<li><p>Its next goal is <strong>OECM</strong> (Other Effective Area-based Conservation Measure) status.</p></li>
<li><p>The <strong>snow leopard</strong> (<em>Panthera uncia</em>) is listed as <strong>Vulnerable</strong> by the IUCN (downgraded from Endangered in 2017).</p></li>
</ul></section>
<section class="blk" data-sec="2026-05-dte--pisavare-the-village-of-birds"><h2 id="2026-05-dte--pisavare-the-village-of-birds">Pisavare: the "village of birds"</h2>
<ul>
<li><p>Located in <strong>Bhor taluka, Pune (Maharashtra)</strong>, in the <strong>Sahyadri</strong> hills.</p></li>
<li><p>A school birding drive started in 2013; the youth group "<strong>Barn Owls</strong>" formed in 2018.</p></li>
<li><p>It has recorded <strong>196+ species</strong> and built about <strong>200 sparrow nests</strong> (the "sparrow school").</p></li>
<li><p><strong>Village bird:</strong> the <strong>Indian white-eye</strong>. <strong>Village butterfly:</strong> the <strong>striped tiger</strong>.</p></li>
</ul></section>
<section class="blk" data-sec="2026-05-dte--other-snippets"><h2 id="2026-05-dte--other-snippets">Other snippets</h2>
<ul>
<li><p><strong>Coral reefs and sewage:</strong> a study of <strong>1,855 Marine Protected Areas</strong> found that wastewater nitrogen threatens reefs even inside MPAs. About <strong>55% of coral reefs</strong> and <strong>88% of seagrass</strong> are exposed to wastewater, which acts as a "<strong>threat multiplier</strong>" for bleaching. MPAs are central to the <strong>KMGBF "30×30" target</strong>.</p></li>
<li><p><strong>Damming the Bering Strait to stabilise the AMOC:</strong> the idea goes back to Soviet engineer <strong>P M Borisov (1960s)</strong> and has been re-modelled at Utrecht University. Results are mixed; in some scenarios it <strong>stabilises the AMOC (Atlantic Meridional Overturning Circulation)</strong>, in others it weakens it.</p></li>
<li><p><strong>G7 environment ministers (April 2026):</strong> declared <strong>desertification, land degradation and drought</strong> priorities. About <strong>40% of global land is degraded</strong>, affecting <strong>3.2 billion people</strong>. <strong>Yasmine Fouad</strong> is the UNCCD Executive Secretary.</p></li>
<li><p><strong>Similipal:</strong></p>
<ul>
<li><p>declared a <strong>sanctuary in 1979</strong> (2,200 sq km);</p></li>
<li><p>made a <strong>biosphere reserve in 1994</strong>, added to UNESCO's MAB network in 2009;</p></li>
<li><p>now a <strong>tiger reserve</strong>.</p></li>
<li><p>A new <strong>eco-tourism plan covering 8 ha</strong> raises fears of tree felling.</p></li>
</ul></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> A <strong>CCA</strong> has <strong>no specific legal status</strong> in India. The legal categories under the WLPA are <strong>Community Reserves and Conservation Reserves</strong> (2002 amendment). <strong>OECMs count towards KMGBF Target 3 (30×30)</strong>.</p></div></section>
<section class="blk" data-sec="2026-05-dte--agriculture-legumes-and-coriander"><h2 id="2026-05-dte--agriculture-legumes-and-coriander">Agriculture: legumes and coriander</h2></section>
<section class="blk" data-sec="2026-05-dte--pulse-power"><h2 id="2026-05-dte--pulse-power">"Pulse power"</h2>
<ul>
<li><p><strong>Agriculture produces about 16%</strong> of India's GHG emissions. <strong>N₂O</strong> comes from nitrogen fertiliser and <strong>methane</strong> from flooded paddy.</p></li>
<li><p><strong>Legumes:</strong></p>
<ul>
<li><p>fix about <strong>70 kg N/ha</strong> (equal to <strong>152 kg of urea</strong>);</p></li>
<li><p>leave soils with <strong>11%+ more NPK</strong> and <strong>16–17% more carbon sequestration</strong>;</p></li>
<li><p>need <strong>25% less irrigation</strong>.</p></li>
<li><p>Their ecosystem services are worth about <strong>₹15,000/ha</strong>.</p></li>
</ul></li>
<li><p><strong>Crop area:</strong> legumes cover only <strong>21%</strong> of cropped area, while cereals cover about <strong>half</strong>. <strong>India is the world's largest importer of pulses.</strong></p></li>
<li><p><strong>Existing support:</strong></p>
<ul>
<li><p>the <strong>Technology Mission on Oilseeds and Pulses</strong> (the article says 1985);</p></li>
<li><p>since 2023–24, no procurement ceiling for <strong>tur, urad and masoor</strong>.</p></li>
</ul></li>
<li><p><strong>Proposals:</strong></p>
<ul>
<li><p>pay farmers for ecosystem services through the <strong>Green Credit Programme (2023)</strong>;</p></li>
<li><p>bring legume farmers into the <strong>Carbon Credit Trading Scheme (2023)</strong>;</p></li>
<li><p>redirect part of the fertiliser subsidy;</p></li>
<li><p>add pulses to <strong>PDS and mid-day meals</strong>.</p></li>
</ul></li>
</ul></section>
<section class="blk" data-sec="2026-05-dte--coriander-coriandrum-sativum"><h2 id="2026-05-dte--coriander-coriandrum-sativum">Coriander (<em>Coriandrum sativum</em>)</h2>
<ul>
<li><p>The "seeds" are actually <strong>dried fruits</strong>. The aroma comes from <strong>linalool</strong> (a terpene).</p></li>
<li><p>It probably originated in the <strong>Mediterranean and West Asia</strong>. The name comes from the Greek <em>koris</em> (bedbug).</p></li>
<li><p><strong>Soapy taste:</strong> about <strong>21% of East Asians</strong> find it soapy, versus <strong>7% of South Asians</strong>. This is linked to the olfactory receptor gene <strong>OR6A2</strong>.</p></li>
<li><p><strong>Coriander barfi</strong> is a traditional sweet for <strong>Janmashtami</strong>.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> Legumes fix nitrogen through <em><strong>Rhizobium</strong></em> bacteria in <strong>root nodules</strong>; the plant cannot fix it on its own. The <strong>Green Credit Programme</strong> (under the Environment Protection Act; MoEFCC) is <strong>voluntary</strong>. The <strong>CCTS</strong> sets <strong>mandatory</strong> emission-intensity targets for listed sectors.</p></div></section>

<section class="blk" data-sec="2026-06-dte--cover-story-tiger-conservation-s-success-trap"><h2 id="2026-06-dte--cover-story-tiger-conservation-s-success-trap">Cover story: tiger conservation's "success trap"</h2>
<div class="callout c-concept"><span class="c-tag">Concept</span><p><strong>Core idea:</strong> India's tiger numbers have risen. But tigers are packed into a <strong>few high-density reserves</strong> while many others are almost empty. Infighting, dispersal outside protected areas and human deaths are all rising, so conservation must move beyond counting tigers and adding protected areas.</p></div>
<h4>Then vs now:</h4>
<div class="table-wrap"><table>

<thead>
<tr class="header">
<th><strong>Indicator</strong></th>
<th><strong>Project Tiger launch (1973)</strong></th>
<th><strong>Now</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Tiger reserves</td>
<td><strong>9</strong> (18,278 sq km)</td>
<td><strong>58</strong> (about 84,488 sq km per the article; a box in the same story says 78,000 sq km)</td>
</tr>
<tr class="even">
<td>Tiger population</td>
<td>About <strong>268</strong></td>
<td><strong>3,682</strong> (<em>Status of Tigers, Co-predators and Prey in India – 2022</em>)</td>
</tr>
</tbody>
</table></div>
<h4>Distribution (2022 cycle):</h4>
<ul>
<li><p><strong>2,835</strong> tigers live inside or around the then <strong>53</strong> reserves (77%). About <strong>847 (23%) live outside</strong> protected areas.</p></li>
<li><p><strong>About 40% of tigers are in just 11% of reserves.</strong> Eight reserves hold <strong>1,144</strong> tigers:</p>
<ul>
<li><p><strong>Corbett (260, the highest)</strong>;</p></li>
<li><p>Bandipur (150) and Nagarahole (141);</p></li>
<li><p>Bandhavgarh (135) and Dudhwa (135);</p></li>
<li><p>Mudumalai (114), Kanha (105) and Kaziranga (104).</p></li>
</ul></li>
<li><p><strong>Density</strong> (tigers per 100 sq km): 3–5 counts as low. <strong>Corbett has 14.65</strong>, Kaziranga 13.44, Nagarahole 11.34 and Bandipur 9.5.</p></li>
<li><p><strong>18 reserves have fewer than 10 tigers</strong>, including <strong>5 with zero</strong> (e.g., Dampa, Satkosia, Kamlang and Kawal show 0 in the 2022 map).</p></li>
<li><p><strong>Local extinctions</strong> occurred over <strong>17,992 sq km</strong> between 2006 and 2018. About <strong>45% of tiger-occupied area is shared with 60 million people</strong> (<em>Science</em>, 2025).</p></li>
</ul>
<h4>Signs of stress:</h4>
<ul>
<li><p>Tiger deaths rose from <strong>88 (2012) to 167 (2025)</strong>.</p></li>
<li><p>People killed by tigers rose from <strong>225 (2014–19) to 418 (2020–25)</strong>. In Chandrapur, wildlife attacks killed <strong>173 people between 2021 and May 2025</strong>, 150 of them by tigers.</p></li>
<li><p><strong>NTCA's management effectiveness evaluation (2024), "Bridging the Gap":</strong> <strong>invasive species affect 40 reserves</strong>, and <strong>20 reserves lack anti-poaching staff</strong>.</p></li>
<li><p><strong>Funding:</strong></p>
<ul>
<li><p>Project Tiger spending rose from <strong>₹154.7 crore (2008–09) to ₹290 crore (2025–26 BE)</strong>.</p></li>
<li><p><strong>Adjusted for inflation, that is only about ₹95 crore</strong> at 2008–09 prices.</p></li>
</ul></li>
</ul>
<h4>Law and institutions:</h4>
<ul>
<li><p><strong>NTCA</strong> is a statutory body set up under the <strong>WLPA (2006 amendment)</strong>.</p></li>
<li><p><strong>WLPA Section 11:</strong> the <strong>Chief Wild Life Warden</strong> may permit the hunting of an animal <strong>dangerous to human life</strong> or diseased or disabled beyond recovery. <strong>Capture comes first; killing is the last resort.</strong></p></li>
<li><p><strong>NTCA (2019)</strong> replaced the term "man-eater" with "<strong>dangerous to human life</strong>". The label now needs camera-trap and DNA evidence and a committee decision.</p></li>
<li><p><strong>International Big Cat Alliance (IBCA)</strong>, launched by India in <strong>2023</strong>, covers <strong>seven big cats</strong>: <strong>tiger, lion, leopard, snow leopard, cheetah, jaguar and puma</strong>. India has about <strong>70% of the world's wild tigers</strong> and the <strong>largest leopard population</strong> of any country.</p></li>
</ul>
<h4>Expert views:</h4>
<ul>
<li><p><strong>Ullas Karanth:</strong> stop relocating tigers. Suitable habitat of about <strong>4 lakh sq km</strong> could support about <strong>20,000 tigers</strong>.</p></li>
<li><p><strong>Y V Jhala:</strong> zone landscapes by density (high in cores, low in buffers, few in forests used by people).</p></li>
<li><p><strong>NTCA official:</strong> India captures about <strong>100 tigers a year</strong>, most of which go to zoos.</p></li>
</ul>
<h4>Captive tigers:</h4>
<ul>
<li><p>Worldwide there are more tigers in captivity than in the wild. <strong>China alone has about 6,500</strong>.</p></li>
<li><p>Thailand's <strong>Tiger Temple</strong> (Kanchanaburi) was raided in <strong>2016</strong>.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> Tiger estimation is held <strong>every 4 years</strong>. Use <strong>3,682</strong> (2022) as the latest full figure unless a newer cycle is out. The <strong>Bengal tiger</strong> is <em>Panthera tigris tigris</em>. The IBCA's seven cats include the <strong>jaguar and puma</strong>, but <strong>not the clouded leopard</strong>.</p></div></section>
<section class="blk" data-sec="2026-06-dte--lantana-tigers-invasive-species-and-a-new-confli"><h2 id="2026-06-dte--lantana-tigers-invasive-species-and-a-new-confli">"Lantana tigers": invasive species and a new conflict pattern</h2>
<h3 id="2026-06-dte--argument">Argument</h3>
<ul>
<li><p><em><strong>Lantana camara</strong></em> was introduced in the <strong>early 19th century as an ornamental hedge</strong>. It is now one of India's most aggressive invasives, covering an estimated <strong>about 50% of forest areas, scrub and village commons</strong>.</p></li>
<li><p>Dense lantana <strong>suppresses native grasses</strong>, so wild herbivores (chital, sambar, nilgai) move away. But the thickets give <strong>tigers excellent cover</strong>.</p></li>
<li><p>Tigers outside reserves such as <strong>Bandhavgarh, Tadoba, Kanha and Pench</strong> use lantana patches by day and <strong>hunt free-ranging cattle</strong>. This choice fits <strong>optimal foraging theory</strong>: big, slow, predictable prey.</p></li>
<li><p><strong>"Lantana subsidy trap":</strong> degraded habitat, plus surplus cattle, plus <strong>compensation payments</strong> (sometimes above the animal's market value) produce tolerance. This weakens the push to restore habitat, creating a <strong>socio-ecological trap</strong>.</p></li>
<li><p><strong>The dilemma:</strong> clearing lantana without restoring native grasses can push tigers back into crowded cores or into more exposed areas.</p></li>
<li><p><strong>Earlier parallels:</strong> "<strong>sugarcane tigers</strong>" and the <strong>sugarcane leopards</strong> of Junnar.</p></li>
</ul>
<div class="callout c-frame"><span class="c-tag">Prelims lens</span><p><strong>Prelims framing:</strong> Lantana is native to <strong>tropical America</strong>. Removing it is ecologically good, but must be <strong>paired with native grassland restoration</strong>. An "<strong>ecological trap</strong>" is a habitat that looks attractive but lowers fitness.</p></div></section>
<section class="blk" data-sec="2026-06-dte--namami-gange-in-uttarakhand-cag-audit"><h2 id="2026-06-dte--namami-gange-in-uttarakhand-cag-audit">Namami Gange in Uttarakhand: CAG audit</h2>
<div class="callout c-news"><span class="c-tag">In the news</span><p><strong>News:</strong> A <strong>CAG performance audit</strong> of Namami Gange in Uttarakhand found the state <strong>missed its main milestone</strong> of stopping untreated sewage from reaching the Ganga. Deficiencies persist since the previous audit of <strong>2017–18</strong>.</p></div>
<h4>Audit facts:</h4>
<ul>
<li><p><strong>Namami Gange</strong> was launched in <strong>2014</strong>; it funds STPs and sewer networks in Ganga-front towns.</p></li>
<li><p><strong>44 STPs</strong> (209.75 MLD) serve <strong>16 Ganga-front towns</strong>:</p>
<ul>
<li><p><strong>12 discharge untreated sewage</strong>, e.g. in Rishikesh, Kirti Nagar (Devprayag), Rudraprayag, Srikot, Gopeshwar and Karnaprayag;</p></li>
<li><p><strong>18 were refused</strong> by the operating agency, <strong>Uttarakhand Jal Sansthan</strong>, over construction and safety defects;</p></li>
<li><p><strong>21 have no household connections</strong>; they treat only drain run-off (grey water).</p></li>
</ul></li>
<li><p><strong>Faecal coliform:</strong> the acceptable limit is <strong>1,000 MPN per 100 ml</strong>, but readings were far higher. Heavy metals (<strong>zinc, cadmium</strong>) were also found.</p></li>
<li><p><strong>Funds (2018–23):</strong> <strong>₹1,149 crore sanctioned</strong>, ₹985.98 crore received and <strong>₹873.17 crore spent</strong>.</p></li>
<li><p><strong>Mismatched capacity:</strong></p>
<ul>
<li><p>The <strong>Haridwar 68 MLD</strong> STP was already taking 71–84 MLD.</p></li>
<li><p><strong>Rishikesh 5 MLD</strong> was taking about 17 MLD.</p></li>
<li><p><strong>Devprayag</strong> ran at <strong>3–4%</strong> of capacity.</p></li>
</ul></li>
<li><p><strong>Household sewer connections:</strong> Chamoli–Gopeshwar <strong>6.4%</strong>, Uttarkashi 9.3%, Srinagar 12.2% and Rishikesh <strong>28.6%</strong>.</p></li>
<li><p>The <strong>State Mission for Clean Ganga</strong> has <strong>no state river-basin management plan</strong> even after 13 years, and district Ganga committees have no plans either.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> <strong>Namami Gange</strong> (2014) is implemented by the <strong>National Mission for Clean Ganga (NMCG)</strong>, under the <strong>Ministry of Jal Shakti</strong>. The Ganga was declared the <strong>National River in 2008</strong>. <strong>BOD and faecal coliform</strong> are the key parameters for bathing-water quality.</p></div></section>
<section class="blk" data-sec="2026-06-dte--landraces-and-agrobiodiversity"><h2 id="2026-06-dte--landraces-and-agrobiodiversity">Landraces and agrobiodiversity</h2>
<div class="callout c-concept"><span class="c-tag">Concept</span><p><strong>Concept:</strong> <strong>Landraces</strong> (also called heirloom, heritage or farmers' varieties) are locally adapted cultivars that evolved over generations. They are reservoirs of genes for <strong>drought, flood and pest tolerance</strong> and nutrition. Most survive with <strong>tribal, rainfed farmers</strong> whom the Green Revolution largely bypassed.</p></div>
<h4>Koraput (Odisha):</h4>
<ul>
<li><p><strong>Native finger millets:</strong> <em>jana mandia, dussera mandia, bati mandia, jili mandia</em>.</p></li>
<li><p><strong>Native rice:</strong> <em>machhakanta</em> (flood-tolerant), <em>haldichudi</em> and <em>tikichudi</em> (drought-tolerant), and <em><strong>kalajeera</strong></em>, a black, aromatic rice that got a <strong>GI tag in 2024</strong>.</p></li>
<li><p>In the <strong>1950s, CRRI</strong> recorded <strong>1,745 traditional rice varieties and 150 wild rices</strong> in Koraput.</p></li>
<li><p>The <strong>Amruta Anna Yojana (2025)</strong> grows heirloom rice organically (<strong>kalajeera, Gobind bhog</strong>) for the <em><strong>kotha bhoga</strong></em> offering at the <strong>Puri Jagannath temple</strong>, at a premium over MSP.</p></li>
<li><p>Odisha's <strong>Forgotten Foods and Neglected Crops</strong> scheme has <strong>₹247 crore</strong> for 15 districts until 2029–30.</p></li>
</ul>

<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> <strong>GIAHS</strong> status is awarded by the <strong>FAO</strong>, not UNESCO. Kuttanad farms <strong>below sea level</strong>. <strong>Kalajeera</strong> is from <strong>Koraput, Odisha</strong>, not Assam (Assam's GI-tagged rice is <strong>joha</strong>).</p></div></section>
<section class="blk" data-sec="2026-06-dte--farm-distress-oilseeds-and-agricultural-research"><h2 id="2026-06-dte--farm-distress-oilseeds-and-agricultural-research">Farm distress, oilseeds and agricultural research</h2></section>
<section class="blk" data-sec="2026-06-dte--agriculture-no-longer-remunerative"><h2 id="2026-06-dte--agriculture-no-longer-remunerative">"Agriculture no longer remunerative"</h2>
<ul>
<li><p><strong>NCRB, <em>Accidental Deaths and Suicides in India 2024</em></strong> (released May 2026):</p>
<ul>
<li><p><strong>10,546</strong> farm-sector suicides, about <strong>one every hour</strong>, or <strong>every 15th suicide</strong> in India;</p></li>
<li><p><strong>56% were agricultural labourers</strong>, a trend seen since 2021.</p></li>
</ul></li>
<li><p><strong>Crop Weather Watch Group (April 2026):</strong> wholesale prices of <strong>12 crops were below their MSP</strong>.</p></li>
<li><p><strong>Income and debt:</strong> cultivation is only about <strong>one-third</strong> of a farm household's income. The average debt is <strong>₹91,231</strong> for farm households versus ₹89,074 for non-farm households.</p></li>
<li><p><strong>NABARD survey:</strong> <strong>30%</strong> of farm households reported crop failure over the preceding five years.</p></li>
</ul></section>
<section class="blk" data-sec="2026-06-dte--cashew-apples"><h2 id="2026-06-dte--cashew-apples">Cashew apples</h2>
<ul>
<li><p>The cashew <strong>nut is the true fruit</strong>; the "apple" is a <strong>swollen pedicel</strong>, rich in <strong>vitamin C</strong>.</p></li>
<li><p>India produces about <strong>6 Mt</strong> of cashew apples a year, but <strong>only about 1% is used</strong>, mostly for Goa's <strong>feni</strong>.</p></li>
<li><p><strong>ICAR–Directorate of Cashew Research (Puttur)</strong> and Kerala Agricultural University have developed <strong>47 products</strong> and trained farmers to make juice.</p></li>
</ul></section>
<section class="blk" data-sec="2026-06-dte--the-fossilised-icar"><h2 id="2026-06-dte--the-fossilised-icar">"The fossilised ICAR"</h2>
<ul>
<li><p><strong>China's breakthrough:</strong> a <strong>20K rapeseed gene chip</strong> ("Zhongxin Oil No. 1") for <strong>smart breeding</strong>.</p></li>
<li><p><strong>India's record:</strong> ICAR's <strong>two genome-edited rice varieties</strong> (2025) are not commercialised, because they rely on <strong>patented CRISPR tools</strong>.</p></li>
<li><p><strong>Edible oil imports doubled:</strong> <strong>7.9 Mt (2013–14) to 16.4 Mt (2024–25)</strong>, or <strong>$7.2 bn to $20.8 bn</strong>.</p></li>
<li><p><strong>Rajiv Gandhi's Technology Mission on Oilseeds</strong> (with Verghese Kurien) made India <strong>self-sufficient in edible oil by about 1990</strong>, the only time it has been.</p></li>
<li><p>The current <strong>National Mission on Edible Oils–Oilseeds</strong> aims for <strong>self-reliance by 2030–31</strong>.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> The <strong>cashew apple is a false fruit</strong> (pseudocarp); the nut is the true fruit. <strong>India is the world's largest importer of edible oils</strong>, mostly palm oil. <strong>SDN-1/SDN-2 genome-edited plants</strong> (no foreign DNA) are <strong>exempt from GM rules</strong> in India under the 2022 notification.</p></div></section>
<section class="blk" data-sec="2026-06-dte--economy-forests-and-food-systems"><h2 id="2026-06-dte--economy-forests-and-food-systems">Economy, forests and food systems</h2>

<th><strong>Item</strong></th>
<th><strong>Facts to remember</strong></th>
</tr>

<td>Released on <strong>11 May 2026</strong> at the <strong>21st session of the UN Forum on Forests (UNFF21)</strong>. The world is <strong>off track on GFG 2</strong> (ending extreme poverty among forest-dependent people). The forest sector employs <strong>about 1% of the global workforce</strong> and is worth <strong>$1.5 trillion a year</strong>; forest jobs <strong>fell 3.1% between 2011 and 2022</strong>. Extreme poverty in sub-Saharan Africa is still about <strong>46%</strong>. The goals come under the <strong>UN Strategic Plan for Forests 2017–2030</strong></td>

<section class="blk" data-sec="2026-06-dte--science"><h2 id="2026-06-dte--science">Science</h2></section>
<section class="blk" data-sec="2026-06-dte--the-ngogo-chimpanzee-split"><h2 id="2026-06-dte--the-ngogo-chimpanzee-split">The Ngogo chimpanzee split</h2>
<ul>
<li><p><strong>Ngogo</strong>, in <strong>Kibale National Park, Uganda</strong>, is the <strong>largest known wild chimpanzee community</strong>: eastern chimpanzees (<em>Pan troglodytes schweinfurthii</em>), about <strong>200</strong> individuals.</p></li>
<li><p><strong>How the split unfolded:</strong></p>
<ul>
<li><p>after <strong>March 2015</strong>, there was no breeding between the western and central clusters;</p></li>
<li><p>in <strong>June 2015</strong> the two groups came face to face, the first sign of the rift;</p></li>
<li><p>by <strong>2018</strong> the split was complete.</p></li>
</ul></li>
<li><p>All <strong>24 recorded attacks</strong> came from the <strong>smaller western group</strong>. At least <strong>7 males and 22 infants</strong> are confirmed dead.</p></li>
<li><p><strong>Likely causes:</strong></p>
<ul>
<li><p>feeding competition in a very large group;</p></li>
<li><p>reproductive isolation;</p></li>
<li><p>the death of older "<strong>bridge</strong>" individuals;</p></li>
<li><p>an <strong>alpha-male change</strong>;</p></li>
<li><p>a <strong>respiratory epidemic (2017)</strong>.</p></li>
</ul></li>
<li><p><strong>Precedent:</strong> <strong>Jane Goodall</strong> recorded a split in the <strong>Kasakela</strong> community at <strong>Gombe (Tanzania)</strong> in <strong>1974</strong>, the "Four-Year War".</p></li>
<li><p><strong>Lesson:</strong> conflict can arise from broken relationships even <strong>without ideology or identity</strong>. Humans and chimpanzees share about <strong>99% of their DNA</strong> (per article).</p></li>
</ul></section>
<section class="blk" data-sec="2026-06-dte--a-new-coronavirus-group-in-bats"><h2 id="2026-06-dte--a-new-coronavirus-group-in-bats">A new coronavirus group in bats</h2>
<ul>
<li><p>Japanese and Thai scientists found a new <strong>"Clade B" of SARS-CoV-2-related viruses</strong> in <strong>horseshoe bats</strong> in an artificial cave in <strong>Chachoengsao province, Thailand</strong>.</p></li>
<li><p>Unlike Clade A, Clade B can use the <strong>same human receptor as SARS-CoV-2 (ACE2)</strong>.</p></li>
<li><p>The synthetic test virus <strong>RacCS20637</strong> replicated poorly in human cells and showed no pathology in animal models.</p></li>
</ul>
<div class="callout c-frame"><span class="c-tag">Prelims lens</span><p><strong>Prelims framing:</strong> <strong>Horseshoe bats (<em>Rhinolophus</em>)</strong> are the main reservoir of SARS-related coronaviruses. SARS-CoV-2 enters cells via the <strong>ACE2</strong> receptor.</p></div></section>
<div class="divider" id="2026-06-dte--div-june-2026-part-ii"><span>June 2026 · Part II</span></div>
<section class="blk" data-sec="2026-06-dte--cover-story-ground-level-ozone-the-unseen-danger"><h2 id="2026-06-dte--cover-story-ground-level-ozone-the-unseen-danger">Cover story: ground-level ozone, the "unseen danger"</h2>
<h4>Concept:</h4>
<ul>
<li><p><strong>Stratospheric ozone</strong> shields Earth from <strong>UV</strong>. <strong>Ground-level (tropospheric) ozone</strong> is a <strong>pollutant</strong>.</p></li>
<li><p>It is a <strong>secondary pollutant</strong>: it is not emitted directly. <strong>NOx, VOCs and CO</strong> react in <strong>heat and sunlight</strong> (photochemical reactions) to form it.</p></li>
<li><p><strong>Heat speeds up ozone formation</strong>, which makes heatwaves into ozone episodes.</p></li>
<li><p><strong>Health effects:</strong> cough, chest tightness and reduced lung function; it worsens <strong>asthma and COPD</strong> and is linked to cardiovascular harm.</p></li>
<li><p><strong>State of Global Air 2025:</strong> <strong>India ranks 3rd</strong> worldwide for ozone exposure. Long-term ozone exposure caused about <strong>470,000 deaths worldwide in 2023, roughly half in India</strong>.</p></li>
</ul>
<h4>CSE analysis (CPCB data, 25 cities, 1 March–10 May 2026):</h4>
<ul>
<li><p><strong>15 of 25 cities</strong> had seasonal averages above the <strong>NAAQS 8-hour limit of 100 µg/m³</strong>.</p></li>
<li><p><strong>Highest averages:</strong></p>
<ul>
<li><p><strong>Chandigarh 173 µg/m³</strong>, the highest, and <strong>32% above Delhi–NCR</strong>;</p></li>
<li><p>Jaipur 120, <strong>Delhi–NCR 118</strong>, Ahmedabad 115 and Bhopal 109.</p></li>
</ul></li>
<li><p><strong>Peak spikes:</strong> <strong>Chennai 326</strong> and Mumbai 258.</p></li>
<li><p><strong>Delhi–NCR exceeded the standard on every day</strong> of the 71-day period; the <strong>Pusa</strong> station logged 64 exceedance days. Ozone also <strong>persists at night</strong> and returns in <strong>October–November</strong>.</p></li>
<li><p><strong>Longest daily exposure:</strong> <strong>Bhopal, 17 hours/day</strong>; Lucknow 16.3 and Jaipur 13.5.</p></li>
<li><p><strong>Crop damage:</strong></p>
<ul>
<li><p>wheat yield loss from ozone rose from <strong>25.2% (2005) to 35.3% (2021)</strong>;</p></li>
<li><p><em>PNAS</em> (2023) put the annual wheat loss at about <strong>14–15%</strong>.</p></li>
<li><p>Ozone makes leaves <strong>close their stomata</strong>.</p></li>
</ul></li>
</ul>
<h4>Policy points:</h4>
<ul>
<li><p><strong>Climate role:</strong> the IPCC classes ozone as a <strong>short-lived climate forcer</strong>. The <strong>CCAC</strong> says super pollutants (ozone, methane, black carbon) cause <strong>up to 45%</strong> of today's net warming.</p></li>
<li><p><strong>"VOC-limited" cities</strong> (Delhi, Mumbai): cutting <strong>NOx alone can <em>raise</em> local ozone</strong>, because NOx "scavenges" ozone near its source.</p></li>
<li><p><strong>The "PM–NOx trade-off":</strong> engines that burn hotter to cut soot make more NOx. James Hansen also argues that cleaning up aerosols "unmasks" warming.</p></li>
<li><p><strong>Monitoring:</strong> CPCB real-time stations rose from <strong>264 (2020) to 595 (June 2026)</strong>, with ozone reported at <strong>526</strong>. Ozone is part of the <strong>national AQI</strong>.</p></li>
<li><p><strong>NCAP</strong> targets only <strong>particulate matter (a 40% cut by 2026)</strong>. CSE wants <strong>NCAP 2.0</strong> to be <strong>multi-pollutant and airshed-based</strong>.</p></li>
<li><p><strong>Policies that already cut precursors:</strong></p>
<ul>
<li><p><strong>BS-VI (2020)</strong> cut NOx by up to <strong>87% for heavy vehicles</strong> and 68% for cars;</p></li>
<li><p><strong>PM E-DRIVE</strong> and <strong>PM e-Bus Sewa</strong>;</p></li>
<li><p><strong>vapour recovery systems</strong> at petrol pumps.</p></li>
</ul></li>
<li><p><strong>Global lessons:</strong></p>
<ul>
<li><p><strong>US:</strong> EPA's <strong>Clean Trucks Plan (2024)</strong>, later undone after the Trump administration revoked the <strong>endangerment finding</strong>; the Cross-State Air Pollution Rule.</p></li>
<li><p><strong>EU:</strong> the <strong>NEC Directive</strong> and <strong>Euro 7</strong> standards.</p></li>
<li><p><strong>China:</strong> its <strong>15th Five-Year Plan (2026–30)</strong> sets a binding <strong>8% cut in both NOx and VOCs</strong>.</p></li>
<li><p><strong>California:</strong> peak ozone is down more than 60%.</p></li>
<li><p><strong>London's ULEZ</strong> (Ultra Low Emission Zone).</p></li>
</ul></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> Ozone has <strong>two NAAQS limits</strong>: <strong>100 µg/m³ (8-hour)</strong> and <strong>180 µg/m³ (1-hour)</strong>. It is a <strong>secondary</strong> pollutant, so there is no direct emitter to regulate. Ozone formation needs <strong>sunlight and heat</strong>, and it peaks in <strong>summer afternoons</strong>, not winter.</p></div></section>
<section class="blk" data-sec="2026-06-dte--super-el-ni-o-2026-and-the-monsoon"><h2 id="2026-06-dte--super-el-ni-o-2026-and-the-monsoon">Super El Niño 2026 and the monsoon</h2>
<h3 id="2026-06-dte--forecasts">Forecasts</h3>
<ul>
<li><p><strong>WMO (2 June 2026):</strong> an <strong>80%</strong> chance of El Niño in June–August, and a <strong>90%</strong> chance it lasts until November.</p></li>
<li><p><strong>NOAA (1 June):</strong> <strong>82%</strong> for May–July, and <strong>96%</strong> that it continues into winter 2026–27.</p></li>
<li><p>It could rival <strong>1876–78, the strongest El Niño on record</strong>. That event, along with a <strong>record-strength IOD (1877)</strong> and a warm North Atlantic, caused the worst monsoon-Asia drought in 800 years and about <strong>50 million famine deaths</strong> (<em>Journal of Climate</em>, 2018).</p></li>
<li><p><strong>Background warming:</strong> the world is about <strong>1.4°C above pre-industrial</strong> levels (Copernicus). <strong>2024 was the hottest year</strong> on record (WMO), boosted by the 2023–24 El Niño. 2026 or 2027 could set a new record.</p></li>
</ul>
<h4>ONI scale:</h4>
<ul>
<li><p><strong>0.5–1°C</strong> = weak; <strong>1–1.5°C</strong> = moderate; <strong>above 1.5°C</strong> = strong; <strong>above 2°C</strong> = very strong.</p></li>
<li><p>The <strong>"super" events</strong> were 1982–83, 1997–98 and 2015–16.</p></li>
</ul>
<h4>Science in brief:</h4>
<ul>
<li><p><strong>IPCC SROCC (2019):</strong> <strong>extreme El Niño events could occur about twice as often</strong>, and El Niño/La Niña could become more intense.</p></li>
<li><p><strong>IPCC AR6:</strong> there is <strong>no clear long-term ENSO trend</strong> that can be told apart from natural variability.</p></li>
</ul>
<h3 id="2026-06-dte--editorial-monsoon-in-flux">Editorial: "Monsoon in flux"</h3>
<ul>
<li><p>IMD forecasts a <strong>below-average monsoon</strong>, with a <strong>neutral IOD</strong> turning positive only late in the season.</p></li>
<li><p><strong>Extreme rainfall</strong> (heavy rain, floods, landslides) occurred on <strong>68–95% of days</strong> in recent years. The pattern is more rain on fewer days.</p></li>
<li><p><strong>Western disturbances</strong> now come in <strong>summer and even during the monsoon</strong>, colliding with monsoon low-pressure systems to cause <strong>cloudbursts and flash floods</strong>. A warming Arctic weakens the polar jet stream.</p></li>
<li><p><strong>More than 70% of drinking water</strong> in India comes from <strong>groundwater</strong>; the monsoon is India's "real finance minister".</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> A <strong>positive IOD</strong> (warmer <strong>western</strong> Indian Ocean) <strong>offsets</strong> El Niño's drying effect. <strong>Western disturbances</strong> start as <strong>extratropical</strong> systems over the <strong>Mediterranean</strong>; they are not tropical cyclones.</p></div></section>
<section class="blk" data-sec="2026-06-dte--delhi-s-urban-heat-city-of-two-summers"><h2 id="2026-06-dte--delhi-s-urban-heat-city-of-two-summers">Delhi's urban heat: "city of two summers"</h2>
<div class="callout c-news"><span class="c-tag">In the news</span><p><strong>Report:</strong> CSE, "<strong>Making Delhi Heat-Resilient: A roadmap with the focus on vulnerable groups</strong>", released <strong>2 June 2026</strong>.</p></div>
<h4>Findings:</h4>
<ul>
<li><p><strong>76%</strong> of Delhi is <strong>persistently heat-stressed</strong>: its <strong>land surface temperature (LST)</strong> exceeded <strong>45°C in 6 or more years</strong> out of 2015–24. <strong>99%</strong> of the city crossed 45°C at least once.</p></li>
<li><p><strong>153 wards (56%)</strong> have more than 75% of their area under recurring heat stress, and <strong>17 wards are entirely heat-stressed</strong>.</p></li>
<li><p><strong>Hotspots:</strong> industrial areas (Bawana, Mundka, Mayapuri) and dense low-rise colonies.</p></li>
<li><p><strong>Cool areas:</strong> <strong>Lutyens' Delhi, Civil Lines and Delhi Cantonment</strong>, which have dense tree canopy.</p></li>
<li><p><strong>Green cover fell from 25.4% (2014) to 14.1% (2024)</strong>; waterbodies fell from <strong>1.25% to 0.99%</strong>.</p></li>
<li><p><strong>Nights no longer cool:</strong></p>
<ul>
<li><p>the day–night LST gap fell from <strong>12°C (2001–10) to 9.8°C (2023)</strong>;</p></li>
<li><p>the urban core cools <strong>3.8°C less</strong> than the periphery;</p></li>
<li><p>Delhi had its <strong>warmest night in 14 years on 25 May 2026, at 32.4°C</strong>.</p></li>
</ul></li>
<li><p><strong>Feels-like temperature</strong> reached <strong>52°C</strong> in 2025 (IMD).</p></li>
<li><p><strong>Construction sites:</strong> <strong>92%</strong> are in areas that crossed 45°C. <strong>80%</strong> of Delhi's workforce is informal.</p></li>
<li><p><strong>Air conditioners:</strong> <strong>ownership has tripled</strong> in a decade. They push out waste heat, raising night temperatures by <strong>4.4–4.7°C</strong>; the report calls this "<strong>cooling inequity</strong>". Delhi's peak power demand reached <strong>8,231 MW</strong>.</p></li>
<li><p><strong>Economic cost:</strong> heat stress could cost the equivalent of <strong>4.5% of India's GDP</strong>. The <strong>World Bank</strong> projects <strong>34 million jobs lost</strong> to heat-related productivity decline.</p></li>
<li><p><strong>Recommendations:</strong></p>
<ul>
<li><p><strong>cool roofs</strong> (which cut indoor temperatures by up to 5°C);</p></li>
<li><p>mandatory cooling breaks;</p></li>
<li><p>public cooling centres;</p></li>
<li><p><strong>recognising heatwaves as a notified disaster</strong>;</p></li>
<li><p>adopting the <strong>Energy Conservation and Sustainable Building Code (ECSBC) 2024</strong> in <strong>Master Plan Delhi 2041</strong>.</p></li>
</ul></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> <strong>Heatwaves are <em>not</em></strong> among the notified disasters under the Disaster Management Act for SDRF and NDRF purposes. States can declare local disasters within limits. <strong>LST</strong> (from satellites) is different from <strong>air temperature</strong> measured by IMD.</p></div></section>
<section class="blk" data-sec="2026-06-dte--forest-rights-act-district-committees-rejecting-"><h2 id="2026-06-dte--forest-rights-act-district-committees-rejecting-">Forest Rights Act: district committees rejecting claims</h2>
<div class="callout c-news"><span class="c-tag">In the news</span><p><strong>News:</strong> On <strong>9 April 2026</strong>, the <strong>Lucknow Bench of the Allahabad High Court</strong> set aside the <strong>Lakhimpur Kheri District Level Committee's</strong> 2021 rejection of community forest rights claims made by the <strong>Tharu</strong> tribe over forests in <strong>Dudhwa Tiger Reserve</strong>. The DLC had relied on a <strong>pre-FRA Supreme Court interim order (13 November 2000)</strong> that barred de-reservation of forests. The court ordered a fresh hearing and a reasoned order.</p></div>
<h4>How a claim is decided under the FRA:</h4>
<ol type="1">
<li><p>The <strong>gram sabha</strong> receives and verifies claims and passes a resolution.</p></li>
<li><p>The <strong>Sub-Divisional Level Committee (SDLC)</strong>, headed by the SDO, examines it and prepares a record.</p></li>
<li><p>The <strong>District Level Committee (DLC)</strong>, headed by the Collector, decides; its decision is "<strong>final and binding</strong>".</p></li>
</ol>
<ul>
<li><p><strong>Appeals:</strong> anyone aggrieved can petition the SDLC within <strong>60 days</strong>, and then the DLC.</p></li>
<li><p><strong>Gaps:</strong></p>
<ul>
<li><p>there is <strong>no time limit</strong> for the SDLC or DLC to decide, and about <strong>7 lakh claims were pending in 2026</strong> (Ministry of Tribal Affairs);</p></li>
<li><p>there is <strong>no appellate body above the DLC</strong>, leaving only a <strong>writ under Article 226</strong>.</p></li>
</ul></li>
<li><p><strong>Accountability provisions:</strong> <strong>Section 7</strong> makes contravening the Act by officials an <strong>offence</strong>. Under <strong>Section 8</strong>, a gram sabha must give <strong>60 days' notice to the State Level Monitoring Committee</strong> before courts can take up the offence.</p></li>
<li><p><strong>Proposal (Ritwick Dutta):</strong> a <strong>Forest Rights Appellate Tribunal (FORAT)</strong> for merit review.</p></li>
<li><p>Experts say the FRA, as a later central law, <strong>overrides</strong> the Indian Forest Act 1927, the Forest (Conservation) Act 1980 and the WLPA 1972 where they conflict, and the <strong>Ministry of Tribal Affairs</strong> has said the same.</p></li>
<li><p>The <strong>"Wildlife First vs Union of India"</strong> challenge to the FRA's validity was transferred to the Supreme Court in <strong>2015</strong> and is still pending. It affects about <strong>2 million</strong> rejected claimants.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> The FRA's <strong>nodal ministry is Tribal Affairs</strong>, not Environment. The <strong>gram sabha initiates</strong> claims; the <strong>DLC gives the final decision</strong>. FRA covers <strong>Scheduled Tribes and Other Traditional Forest Dwellers</strong>; OTFDs must prove <strong>three generations (75 years)</strong> of residence.</p></div></section>
<section class="blk" data-sec="2026-06-dte--health-and-demography"><h2 id="2026-06-dte--health-and-demography">Health and demography</h2></section>
<section class="blk" data-sec="2026-06-dte--nfhs-6-2023-24-on-child-nutrition"><h2 id="2026-06-dte--nfhs-6-2023-24-on-child-nutrition">NFHS-6 (2023–24) on child nutrition</h2>
<ul>
<li><p><strong>Only about 15%</strong> of children aged <strong>6–23 months</strong> get a <strong>minimum adequate diet</strong> (15% of breastfed, 16% of non-breastfed).</p></li>
<li><p><strong>29%</strong> of children under five are <strong>stunted</strong> (low height for age) and <strong>19%</strong> are <strong>wasted</strong> (low weight for height). Both rates are higher in <strong>rural</strong> areas.</p></li>
<li><p><strong>Wealth or governance does not predict outcomes:</strong></p>
<ul>
<li><p><strong>Gujarat:</strong> only about <strong>8%</strong> get an adequate diet, over a third are stunted and a fifth wasted;</p></li>
<li><p><strong>Jharkhand</strong> does better, at about 13%;</p></li>
<li><p><strong>Andhra Pradesh</strong> about 19%.</p></li>
</ul></li>
<li><p><strong>Madhya Pradesh is worst:</strong></p>
<ul>
<li><p>stunting <strong>31%</strong>;</p></li>
<li><p><strong>underweight up from 33% to 39.7%</strong>;</p></li>
<li><p><strong>wasting up from 19% to 24%</strong>.</p></li>
</ul></li>
<li><p>The <strong>first 1,000 days</strong> (from conception to age 2) are critical.</p></li>
</ul></section>
<section class="blk" data-sec="2026-06-dte--srs-statistical-report-2024"><h2 id="2026-06-dte--srs-statistical-report-2024">SRS Statistical Report 2024</h2>
<ul>
<li><p><strong>India's TFR is 1.9</strong>, below the <strong>replacement level of 2.1</strong>. It was 5.2 in 1971, 4.5 in 1981 and 3.6 in 1991.</p></li>
<li><p><strong>Rural TFR is 2.1</strong> and <strong>urban 1.5</strong>.</p></li>
<li><p><strong>Highest: Bihar 2.9. Lowest: Delhi 1.2.</strong></p></li>
</ul></section>

<ul>
<li><p><strong>WHO, "A World on the Edge":</strong> <strong>7 Public Health Emergencies of International Concern</strong> declared in the last 10 years. WHO detected <strong>almost twice as many</strong> health emergency events in 2024 as in 2015.</p></li>
