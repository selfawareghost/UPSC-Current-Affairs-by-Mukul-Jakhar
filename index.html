<section class="blk" data-sec="2026-04-dte--environmental-harm-in-armed-conflict"><h2 id="2026-04-dte--environmental-harm-in-armed-conflict">Environmental harm in armed conflict</h2>
<ul>
<li><p>Conflict harms ecosystems through oil fires, toxic releases, attacks on industrial sites, herbicide use and damage to water and energy systems. The issue cites reported <strong>white phosphorus</strong> use and aerial <strong>glyphosate</strong> spraying in southern Lebanon, oil-depot fires around Tehran and soot-laden "black rain". The UK-based <strong>Conflict and Environment Observatory</strong> logged <strong>120</strong> environmental-harm incidents in this conflict.</p></li>
<li><p><strong>Additional Protocol I (1977) to the Geneva Conventions:</strong> prohibits methods or means of warfare expected to cause <strong>widespread, long-term and severe</strong> damage to the natural environment (cumulative threshold).</p></li>
<li><p><strong>Rome Statute (1998), Article 8(2)(b)(iv):</strong> an attack can be a war crime when the attacker knows it will cause widespread, long-term and severe environmental damage clearly excessive to the anticipated military advantage. High evidentiary threshold; <strong>never invoked before the ICC</strong> as of the issue.</p></li>
<li><p><strong>Rio Declaration (1992), Principle 24:</strong> warfare is inherently destructive of sustainable development.</p></li>
<li><p><strong>Ecocide:</strong> proposed international crime for severe environmental destruction. An independent panel (Stop Ecocide International) proposed a definition in <strong>2021</strong>; <strong>Vanuatu, Fiji and Samoa</strong> proposed it as a <strong>fifth Rome Statute crime in 2024</strong>. Adoption is uncertain.</p></li>
<li><p>The US signed the Rome Statute (2000) but withdrew its signature (2002); Israel is a non-party. Classic precedent: <strong>Agent Orange</strong> in the Vietnam War.</p></li>
<li><p>Climate and Community Institute estimate: first 14 days of bombardment ≈ <strong>5 million tonnes CO₂e</strong> — more than <strong>Iceland's</strong> annual emissions (~4.28 Mt).</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Legal trap:</strong> Ecocide is presented as a proposal and active debate, <strong>not</strong> an adopted fifth Rome Statute crime. Conflict details are time-bound.</p></div></section>
<section class="blk" data-sec="2026-04-dte--pharmaceutical-supply-chains-and-public-health"><h2 id="2026-04-dte--pharmaceutical-supply-chains-and-public-health">Pharmaceutical supply chains and public health</h2>
<ul>
<li><p>A drug chain runs: <strong>key starting materials (KSMs)</strong> → intermediates → <strong>active pharmaceutical ingredients (APIs)</strong> → formulation → distribution. China dominates the bottom two layers.</p></li>
<li><p>Disruption to energy, shipping, air cargo and chemical inputs can hit drug production before finished medicines run short.</p></li>
<li><p>Issue-reported FY25 API trade: <strong>exports ₹41,500 cr vs imports ₹39,215 cr</strong> — but <strong>China's share of API imports rose from 70% to 74%</strong> (₹29,064 cr). About <strong>70% of vaccine raw materials</strong> are imported, mainly from the US and China.</p></li>
<li><p>Items flagged at the time: <strong>paracetamol</strong> (benzene chain), diabetes medicines, some antibiotics; refinery-grade <strong>propylene</strong> for isopropyl alcohol; <strong>polypropylene</strong> for syringes, IV bags, blood bags; helium for MRI.</p></li>
<li><p>India supplies affordable generics to ~200 countries and most of UNICEF/WHO's DPT, BCG and measles vaccines, so domestic input security has global public-health effects.</p></li>
<li><p>Resilience options: diversify sources, make critical inputs at home (PLI), invest in research, plan inventories, build logistics redundancy.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-dte--environmental-governance-and-landmark-principles"><h2 id="2026-04-dte--environmental-governance-and-landmark-principles">Environmental governance and landmark principles</h2>
<ul>
<li><p>The Supreme Court <strong>formally closed <em>M C Mehta v Union of India</em></strong> (Delhi air pollution) on <strong>12 March 2026</strong>, after ~40 years; implementation responsibility now rests with the executive.</p></li>
<li><p><strong>Shriram Fertilizer oleum gas leak (1985):</strong> the case line gave the doctrine of <strong>absolute liability</strong> — enterprises in hazardous activity owe an absolute, non-delegable duty to compensate harm.</p></li>
<li><p><strong>Article 21 (Right to Life)</strong> includes the right to a clean/wholesome environment.</p></li>
<li><p><strong>Precautionary principle:</strong> lack of full scientific certainty does not justify delaying prevention of serious harm.</p></li>
<li><p><strong>Polluter pays:</strong> the polluter bears costs of prevention, control and remedy. The burden of proof shifted towards polluters.</p></li>
<li><p>Measures from the litigation: <strong>CNG</strong> public transport in Delhi; leaded petrol phased out (1990s); leap from Euro 0 → BS-IV → <strong>BS-VI</strong> (skipping BS-V); 10-year diesel / 15-year petrol vehicle phase-out; <strong>Environment Compensation Charge</strong> on heavy diesel trucks entering Delhi; ban on coal, pet coke and furnace oil; all four coal power plants in Delhi shut; <strong>GRAP</strong>; in <strong>2004</strong> action plans extended to <strong>13 more cities</strong>; SOx/NOx standards for industry.</p></li>
<li><p>Outcomes cited: PM2.5 down ~<strong>46%</strong> since 2012 at Delhi's five oldest stations; diesel's share of Delhi's energy mix halved (40% → 20%). Delhi still needs a further ~60% cut to meet standards.</p></li>
<li><p>The article says the Court created <strong>EPCA</strong> (Environment Pollution (Prevention and Control) Authority) under <strong>Section 5</strong> of the Environment (Protection) Act, 1986. ⚠ EPCA is usually cited as constituted under <strong>Section 3</strong>; and it has since been replaced by the <strong>Commission for Air Quality Management (CAQM)</strong> <em>(static)</em>.</p></li>
</ul>
<div class="table-wrap"><table>

<thead>
<tr class="header">
<th><strong>Principle</strong></th>
<th><strong>Recall</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Absolute liability</td>
<td>Hazardous enterprise liable without the exceptions available under strict liability</td>
</tr>
<tr class="even">
<td>Precautionary principle</td>
<td>Prevent serious harm despite uncertainty</td>
</tr>
<tr class="odd">
<td>Polluter pays</td>
<td>Polluter bears prevention, control and remediation costs</td>
</tr>
<tr class="even">
<td>Article 21</td>
<td>Right to life includes a wholesome environment</td>
</tr>
</tbody>
</table></div>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Common trap:</strong> Absolute liability is stricter than the traditional strict-liability rule (<em>Rylands v Fletcher</em>) and carries none of its exceptions.</p></div></section>
<section class="blk" data-sec="2026-04-dte--clean-cooking-biomass-and-household-energy"><h2 id="2026-04-dte--clean-cooking-biomass-and-household-energy">Clean cooking, biomass and household energy</h2>
<ul>
<li><p>LPG disruption pushed households and eateries back to <strong>fuelwood</strong> — exposing last-mile access, affordability and reliability issues. In the 1974 oil crisis India saw a similar LPG shortage.</p></li>
<li><p>Fuelwood and dung cakes stay important in rural energy because they are accessible, familiar, affordable and support local livelihood markets (~18% of collected fuelwood is sold to towns).</p></li>
<li><p>Survey figures cited: <strong>NSO (2021)</strong> — over <strong>one-third</strong> of Indian households use fuelwood as the primary cooking fuel (about half of rural households; ~75% in 2009–10); urban LPG use ~89%; 11 states have &gt;50% households on solid fuels. <strong>NFHS-5</strong> — <strong>41%</strong> of the population cooks with biomass. Survey-period data. (Magazine p. 58)</p></li>
<li><p>Solid-fuel cooking causes household air pollution and health risks; LPG improves indoor air but creates import exposure.</p></li>
<li><p>Energy access should weigh reliability, affordability, health, women's time and local alternatives such as <strong>biogas/CBG</strong> and reliable electricity ("sovereign clean cooking").</p></li>
<li><p>A connection alone does not guarantee sustained clean-fuel use; refill affordability and supply reliability matter.</p></li>
</ul></section>
<div class="divider" id="2026-04-dte--div-april-2026-part-ii"><span>April 2026 · Part II</span></div>
<section class="blk" data-sec="2026-04-dte--india-s-ndc-3-0-and-the-energy-transition"><h2 id="2026-04-dte--india-s-ndc-3-0-and-the-energy-transition">India's NDC 3.0 and the energy transition</h2>
<div class="callout c-concept"><span class="c-tag">Concept</span><p><strong>Concept — NDC:</strong> A country's self-determined climate pledge under the <strong>Paris Agreement (2015)</strong>, submitted to the UNFCCC and expected to be <strong>ratcheted up every five years</strong>. NDC 3.0 is the round after the <strong>first Global Stocktake</strong> (completed <strong>December 2023, COP28</strong>), which found the world off track for 1.5°C.</p></div>
<div class="callout c-news"><span class="c-tag">In the news</span><p><strong>News:</strong> The <strong>Union Cabinet approved India's third NDC on 25 March 2026</strong>, covering <strong>2031–2035</strong> (Magazine p. 14). India joins 130+ countries that have submitted third NDCs.</p></div>
<div class="table-wrap"><table>

<thead>
<tr class="header">
<th><strong>Target</strong></th>
<th><strong>NDC 1.0 (2015)</strong></th>
<th><strong>NDC 2.0 (2022)</strong></th>
<th><strong>NDC 3.0 (2026)</strong></th>
<th><strong>Progress (PIB, as of Apr 2026)</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Emissions intensity of GDP</td>
<td>33–35% by 2030</td>
<td>45% by 2030</td>
<td><strong>47% by 2035</strong></td>
<td>36% cut in 2005–20</td>
</tr>
<tr class="even">
<td>Non-fossil share of <strong>installed power capacity</strong></td>
<td>40% by 2030</td>
<td>50% by 2030</td>
<td><strong>60% by 2035</strong></td>
<td>52.57% in 2025</td>
</tr>
<tr class="odd">
<td>Additional carbon sink (forest + tree cover)</td>
<td>2.5–3 bn t CO₂e</td>
<td>2.5–3 bn t CO₂e</td>
<td><strong>3.5–4 bn t CO₂e by 2035</strong></td>
<td>2.29 bn t in 2005–21</td>
</tr>
</tbody>
</table></div>
<p><em>All intensity and sink figures are measured from the <strong>2005 baseline</strong>.</em></p>
<p><strong>Five qualitative goals:</strong> cleaner development pathways; climate-resilient infrastructure; mobilising low-cost domestic and international finance; capacity building and R&amp;D; and alignment with <strong>LiFE (Lifestyle for Environment)</strong>.</p>
<h4>Context figures:</h4>
<ul>
<li><p>Non-fossil installed capacity <strong>283 GW</strong> as of 31 March 2026, more than half of the total. Mix: solar <strong>150.26 GW</strong>, wind <strong>56.09 GW</strong>, large hydro <strong>51.41 GW</strong>, bio-power <strong>11.75 GW</strong>, nuclear <strong>8.78 GW</strong> (MNRE) (Magazine p. 15–16).</p></li>
<li><p>But only <strong>~29% of actual generation</strong> is non-fossil.</p></li>
<li><p><strong>Ember:</strong> 2.3 TWh of solar was curtailed in May–Dec 2025, ~40% of it in October, because coal plants could not ramp down (Magazine p. 16).</p></li>
<li><p><strong>NITI Aayog (Feb 2026):</strong> about <strong>$8 trillion</strong> is needed for net zero over 2025–2050, of which <strong>$5 trillion</strong> is for power. In January 2026 NITI also released decarbonisation roadmaps for <strong>cement, aluminium and MSMEs</strong>.</p></li>
<li><p><strong>China's NDC (Sept 2025)</strong> sets an absolute cut of <strong>7–10% from peak</strong>. India still uses <strong>intensity</strong>, not absolute, targets.</p></li>
<li><p>India's <strong>net-zero year is 2070</strong> (announced at COP26, Glasgow, 2021).</p></li>
<li><p><strong>COP29 (Baku, 2024)</strong> set the NCQG at <strong>$300 bn a year by 2035</strong>, against the <strong>$1.3 trillion</strong> demanded by developing countries.</p></li>
</ul>
<div class="callout c-news"><span class="c-tag">In the news</span><p><strong>Editorial — IRENA, March 2026:</strong> renewables made up close to <strong>50%</strong> of global installed capacity by end-2025, and <strong>85%</strong> of new additions in 2025. Ember and a coalition of <strong>74 climate-vulnerable countries</strong> report Namibia and Togo leading in solar generation, Jordan and Kyrgyzstan in battery sales, and <strong>Nepal and Sri Lanka in EV uptake (~70% of new vehicles electric)</strong>. The <strong>Strait of Hormuz</strong> carries about <strong>20%</strong> of global oil flows.</p></div>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> Capacity share ≠ generation share. 60% is a target for <em>installed capacity</em>; generation is only about 29% non-fossil. Also, the emissions-intensity target is "from <strong>2005</strong> levels", not 2015 or 2020.</p></div></section>
<section class="blk" data-sec="2026-04-dte--rural-energy-poverty-and-clean-cooking"><h2 id="2026-04-dte--rural-energy-poverty-and-clean-cooking">Rural energy poverty and clean cooking</h2>
<div class="callout c-concept"><span class="c-tag">Concept</span><p><strong>Core idea:</strong> Rural India now has <em>access</em> to LPG and electricity, but not <em>affordability</em>. Households therefore <strong>"stack" fuels</strong>, using LPG alongside firewood and dung cakes.</p></div>
<h4>Schemes to know:</h4>
<div class="table-wrap"><table>

<thead>
<tr class="header">
<th><strong>Scheme</strong></th>
<th><strong>Key facts</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>PM Ujjwala Yojana (PMUY)</strong></td>
<td>Launched <strong>May 2016</strong> by MoPNG. Free stove and first cylinder. <strong>₹300 targeted subsidy per 14.2 kg cylinder, up to 9 refills a year</strong> (2025–26). <strong>103.4 million</strong> beneficiaries as of 1 Jan 2026 (PPAC).</td>
</tr>
<tr class="even">
<td><strong>Saubhagya</strong> (PM Sahaj Bijli Har Ghar Yojana)</td>
<td>Near-universal household electrification. Rural supply rose from ~10 hours to 16–18 hours a day, and 20–22 hours in many places.</td>
</tr>
</tbody>
</table></div>
<h4>Data snapshots:</h4>
<ul>
<li><p><strong>NFHS-5 (2019–21):</strong> <strong>56.1%</strong> of the rural population relies on firewood, dung or other biomass.</p></li>
<li><p><strong>NSSO 78th round Multiple Indicator Survey (2020–21):</strong> rural cooking fuel is <strong>49.4% LPG</strong> and <strong>46.7% firewood / chips / crop residue</strong>. Urban LPG use is <strong>89%</strong>.</p></li>
<li><p><strong>Highest biomass reliance: Chhattisgarh (84.2%)</strong>, followed by West Bengal (77.2%), Odisha (76%) and MP (75.6%). <strong>Rural UP has the highest dung-cake use, at 9.1%.</strong></p></li>
<li><p><strong>HCES:</strong> rural MPCE on energy (fuel, lighting, conveyance) rose from <strong>₹174 (12%)</strong> in 2011–12 to <strong>₹565 (13.7%)</strong> in 2023–24, an increase of <strong>224%</strong>, versus 156% for food.</p></li>
<li><p>Domestic LPG consumption rose from <strong>17.2 Mt (2015–16) to 33.2 Mt (2025–26)</strong>. There are <strong>330.5 million</strong> active consumers (1 July 2025), and <strong>~14%</strong> of connections were inactive in 2024–25. PMUY households take fewer than <strong>3 refills a year</strong>, against 7–8 for others.</p></li>
<li><p><strong>IISD (Feb 2026), "India's Clean Cooking Shift":</strong> <strong>37%</strong> of households (rural <strong>51%</strong>) still mainly use polluting fuels. It recommends <strong>decentralised biogas</strong> (no recurring fuel cost) and <strong>e-cooking</strong> (cheaper than LPG at about ₹6/kWh).</p></li>
<li><p><strong>Household air pollution:</strong> <strong>3.2 million</strong> premature deaths worldwide (2020, WHO) and <strong>0.6 million in India (2019)</strong>. HAP contributes about <strong>30%</strong> of India's outdoor air pollution. Women spend about <strong>5 hours a day</strong> on cooking-related tasks (FAO).</p></li>
<li><p><strong>Global fuelwood market:</strong> <strong>Europe accounts for 60%</strong> of consumption (policy-led biomass heating). <strong>51.5%</strong> of global supply comes from natural forests.</p></li>
</ul>
<div class="callout c-concept"><span class="c-tag">Concept</span><p><strong>Concept — Engel's law:</strong> As incomes rise, the <em>share</em> of spending on food falls, even if absolute food spending increases. In rural India, energy is now taking a larger slice of the budget.</p></div>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> Clean cooking is mapped to <strong>SDG 7 (Affordable and Clean Energy)</strong>, not SDG 3. The PMUY subsidy is <strong>targeted</strong> (₹300 per cylinder, ≤ 9 refills); it is not a free unlimited supply.</p></div></section>
<section class="blk" data-sec="2026-04-dte--land-consolidation-chakbandi"><h2 id="2026-04-dte--land-consolidation-chakbandi">Land consolidation (chakbandi)</h2>
<div class="callout c-concept"><span class="c-tag">Concept</span><p><strong>Concept:</strong> <strong>Land consolidation (chakbandi)</strong> rearranges a farmer's small, scattered plots into one contiguous holding. It lowers costs, enables mechanisation and irrigation, and lets land be reserved for roads, grazing and water sources. There are two methods: <strong>voluntary</strong> (all owners consent in writing) and <strong>majority / compulsory</strong> (implemented once a majority approves).</p></div>
<h4>History:</h4>
<ul>
<li><p><strong>First tried in Punjab in 1920</strong>, on an experimental basis through <strong>cooperative societies</strong> (voluntary). India started consolidation earlier than any other Asian country.</p></li>
<li><p><strong>Royal Commission on Agriculture (1928)</strong> recommended extending it to other provinces.</p></li>
<li><p>After Independence, the <strong>J C Kumarappa Committee</strong> recommended agrarian reforms. The four pillars of land reform were <strong>zamindari abolition, tenancy reform, land ceilings and consolidation</strong>.</p></li>
<li><p><strong>17 states and 1 UT</strong> enacted consolidation laws. It has been completed in <strong>Punjab, Haryana and (largely) UP</strong>, which is linked to the Green Revolution there. The absence of consolidation in <strong>Bihar and Odisha</strong> is seen as a constraint on development there.</p></li>
</ul>
<h4>State laws worth recalling:</h4>
<ul>
<li><p><strong>UP Consolidation of Holdings Act, 1953</strong>, first applied in <strong>1954</strong> in Muzaffarnagar and Sultanpur. The second cycle is ongoing. The UP CM has ordered that consolidation proceed only with the <strong>written consent of ≥ 75% of farmers</strong>.</p></li>
<li><p><strong>East Punjab Holdings (Consolidation and Prevention of Fragmentation) Act, 1948</strong> covers Punjab, Haryana, Chandigarh and Delhi.</p></li>
<li><p><strong>Karnataka's Act of 1966 was repealed in 1991.</strong></p></li>
<li><p><strong>MP Land Revenue Code, 1959 (Sections 205–221)</strong> allows compulsory consolidation once <strong>two-thirds</strong> of owners consent.</p></li>
<li><p><strong>HP Act of 1971</strong> sets a <strong>"standard area"</strong> (the minimum viable holding). Smaller plots count as "fragments" and cannot be freely transferred.</p></li>
<li><p><strong>Uttarakhand Hills Consolidation of Holdings and Land Reforms Act, 2016</strong>, with <strong>Rules approved on 21 May 2020</strong> but not yet implemented. Ganesh Garib of Pauri led the hill consolidation movement.</p></li>
</ul>
<h4>Data:</h4>
<ul>
<li><p><strong>Agriculture Census 2021–22:</strong> small and marginal holdings (&lt; 2 ha) are <strong>86.2%</strong> of operational holdings.</p></li>
<li><p><strong>NABARD survey:</strong> average holding fell from <strong>1.08 ha (2016–17) to 0.74 ha (2021–22)</strong>.</p></li>
<li><p><strong>FAO "Legal Guide on Land Consolidation" (2020)</strong> links consolidation to <strong>SDG 1 and SDG 2</strong>.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> Land is a <strong>State List</strong> subject, which is why progress varies by state. Consolidation is a <em>land-reform</em> measure distinct from land <em>ceilings</em>.</p></div></section>
<section class="blk" data-sec="2026-04-dte--access-and-benefit-sharing-abs-dapur-village"><h2 id="2026-04-dte--access-and-benefit-sharing-abs-dapur-village">Access and Benefit Sharing (ABS): Dapur village</h2>
<div class="callout c-news"><span class="c-tag">In the news</span><p><strong>News:</strong> <strong>Dapur gram panchayat (Nashik district, Maharashtra)</strong> received <strong>₹67.69 lakh (about ₹68 lakh)</strong> in November 2025 under ABS.</p></div>
<ul>
<li><p>In 2024, <strong>Advanced Enzyme Technologies</strong> (headquartered in Thane, lab at Sinnar) collected <strong>2 kg of soil</strong> from Dapur. It contained the bacterium <em><strong>Bacillus coagulans</strong></em>, which has probiotic and digestive-enzyme properties.</p></li>
<li><p>The firm used the strain in <strong>42 probiotic products</strong> and acknowledged to the <strong>Maharashtra State Biodiversity Board</strong> that it came from Dapur.</p></li>
<li><p>The village plans a <strong>botanical garden or sacred grove</strong> on common land and is preparing its <strong>People's Biodiversity Register</strong>. Local plants include <strong>gulvel/giloy (<em>Tinospora cordifolia</em>)</strong> and <strong>kadamba (<em>Neolamarckia cadamba</em>)</strong>.</p></li>
</ul>
<h4>ABS framework:</h4>
<div class="table-wrap"><table>

<thead>
<tr class="header">
<th><strong>Element</strong></th>
<th><strong>Detail</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>Global basis</td>
<td><strong>CBD (1992)</strong>, with ABS as its third objective, and the <strong>Nagoya Protocol (2010; in force 2014)</strong></td>
</tr>
<tr class="even">
<td>Indian law</td>
<td><strong>Biological Diversity Act, 2002</strong> (amended 2023)</td>
</tr>
<tr class="odd">
<td>Three-tier bodies</td>
<td><strong>National Biodiversity Authority (Chennai)</strong> → <strong>State Biodiversity Boards</strong> → <strong>Biodiversity Management Committees</strong> (local bodies)</td>
</tr>
<tr class="even">
<td>Benefit rate (per article)</td>
<td><strong>1–5% of purchase price</strong> or <strong>0.1–0.5% of sale price</strong> of the final product</td>
</tr>
<tr class="odd">
<td>Split (per article)</td>
<td>Boards retain about <strong>5%</strong> for administration; about <strong>95%</strong> goes to the local community</td>
</tr>
<tr class="even">
<td>Use of funds</td>
<td><strong>Only biodiversity conservation and sustainable ecological management</strong>, <em>not</em> roads or water tanks</td>
</tr>
</tbody>
</table></div></section>
<section class="blk" data-sec="2026-04-dte--wetlands-tadag-tal-almora-and-the-wetlands-rules"><h2 id="2026-04-dte--wetlands-tadag-tal-almora-and-the-wetlands-rules">Wetlands: Tadag Tal (Almora) and the Wetlands Rules, 2017</h2>
<div class="callout c-news"><span class="c-tag">In the news</span><p><strong>News:</strong> Villages around <strong>Tadag Tal</strong> (Chaukhutia, <strong>Almora district, Uttarakhand</strong>; more than 50 ha; in the <strong>Ramganga valley</strong>) want the seasonal lake made <strong>perennial</strong> for tourism. Experts say it is a <strong>marshy wetland</strong> that should be left alone (Magazine pp. 42–44).</p></div>
<ul>
<li><p>In December 2025 the district committee found <strong>54.2 ha</strong> seasonally waterlogged and farmed in winter (mainly wheat). It concluded the site <strong>does not meet the wetland definition</strong>.</p></li>
<li><p>A <strong>Wadia Institute of Himalayan Geology (Dehradun)</strong> preliminary report (February 2026) found <strong>no solid bedrock</strong> beneath the site, so water drains away in 2–3 days. A perennial lake is therefore unlikely.</p></li>
<li><p>The lake was likely formed by a <strong>landslide</strong> that dammed the Tadag stream. Its feeder streams rise in the <strong>Dharpani Dhar Spring Sanctuary</strong>, where groundwater is declining.</p></li>
</ul>
<h4>Wetland facts:</h4>
<ul>
<li><p><strong>ISRO Wetland Atlas (2021)</strong> maps <strong>231,195+ wetlands</strong> in India, <strong>192 in Uttarakhand</strong>. Uttarakhand has ground-verified 155 of them, following a <strong>2017 Supreme Court</strong> directive to all states.</p></li>
</ul>
<p><strong>Definition under the 2017 Rules:</strong> marsh, fen, peatland or water; natural or artificial; permanent or temporary; static or flowing; fresh, brackish or salt; including marine water up to <strong>6 m deep at low tide</strong>.</p>
<p><strong>Excluded:</strong> <strong>river channels, paddy fields</strong>, human-made water bodies or tanks built for <strong>drinking water</strong>, and structures built for <strong>aquaculture, salt production, recreation and irrigation</strong>.</p>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> <strong>Paddy fields and river channels are <em>not</em> wetlands</strong> under the 2017 Rules, though Ramsar's broader definition can include rice fields. The 6 m low-tide depth limit is shared with Ramsar.</p></div></section>
<section class="blk" data-sec="2026-04-dte--biodiversity-and-wildlife"><h2 id="2026-04-dte--biodiversity-and-wildlife">Biodiversity and wildlife</h2></section>
<section class="blk" data-sec="2026-04-dte--great-indian-bustard-gib-the-jumpstart-approach"><h2 id="2026-04-dte--great-indian-bustard-gib-the-jumpstart-approach">Great Indian Bustard (GIB): the "jumpstart approach"</h2>
<ul>
<li><p>On <strong>30 March 2026</strong> Gujarat confirmed a <strong>GIB chick born in Kutch</strong>, the <strong>first breeding in Gujarat since 2016</strong>.</p></li>
<li><p><strong>How the jumpstart approach worked:</strong> this was the first use of the method in India. A fertile, partly incubated egg was collected from the <strong>Sam region (Jaisalmer, Rajasthan)</strong> and carried about <strong>770 km in ~19 hours</strong> in a portable incubator. It was then placed in the <strong>natural nest of a wild female</strong> in the <strong>Naliya grasslands, Kutch</strong>.</p></li>
<li><p><strong>GIB facts:</strong> <strong>Critically Endangered</strong> (IUCN); one of the heaviest flying birds; lays <strong>one egg at a time</strong>. The main threats are <strong>overhead power-line collisions</strong> and grassland loss. <strong>Kutch has only three females and no breeding males.</strong></p></li>
</ul></section>
<section class="blk" data-sec="2026-04-dte--cms-cop15"><h2 id="2026-04-dte--cms-cop15">CMS COP15</h2>
<ul>
<li><p>Held in <strong>Brazil</strong>, ending <strong>29 March 2026</strong>. <strong>40 species</strong> were added to the CMS appendices, including the <strong>cheetah, striped hyena, snowy owl, giant otter and great hammerhead shark</strong>, plus several shorebirds.</p></li>
<li><p><strong>"State of the World's Migratory Species: Interim Report (2026)"</strong>: <strong>49%</strong> of listed migratory species are declining and <strong>24%</strong> face extinction.</p></li>
<li><p>It launched the <strong>Global Initiative on the Taking of Migratory Species</strong>, on illegal and unsustainable removal of wildlife.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-dte--national-chambal-sanctuary-illegal-sand-mining"><h2 id="2026-04-dte--national-chambal-sanctuary-illegal-sand-mining">National Chambal Sanctuary: illegal sand mining</h2>
<ul>
<li><p>The sanctuary is <strong>tri-state: Rajasthan, Madhya Pradesh and Uttar Pradesh</strong>. It is known for gharials and the Gangetic dolphin.</p></li>
<li><p>On <strong>2 April 2026</strong>, the <strong>SC-appointed Central Empowered Committee (CEC)</strong> reported continuous sand mining, caused by poor inter-state coordination and <strong>denotification of forest areas without permission</strong>.</p></li>
<li><p>It recommended a <strong>ban on all mining in the sanctuary and its eco-sensitive zone</strong>.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-dte--beeran-a-baiga-handicraft"><h2 id="2026-04-dte--beeran-a-baiga-handicraft">Beeran: A Baiga handicraft</h2>
<ul>
<li><p><strong>Beeran</strong> is a garland of <strong>60–80 woven grass rings</strong> made by the <strong>Baiga</strong> (a <strong>PVTG</strong>) of <strong>Kabirdham district, Chhattisgarh</strong>, in the <strong>Maikal hills</strong>.</p></li>
<li><p>The rings are woven from <strong>sutakhar or vetiver (<em>Chrysopogon zizanioides</em>)</strong>, which grows in <strong>kodo and kutki millet</strong> fields. They are tied with fibre from <strong>parijat or night-flowering jasmine (<em>Nyctanthes arbor-tristis</em>)</strong>.</p></li>
<li><p>The craft is declining because <strong>paddy and sugarcane monocropping</strong> is replacing millets. A <strong>Beeran Utsav</strong> was held in <strong>Taregaon in November 2025</strong>.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-dte--health-maternal-mortality-and-the-pandemic-agree"><h2 id="2026-04-dte--health-maternal-mortality-and-the-pandemic-agree">Health: maternal mortality and the Pandemic Agreement (PABS)</h2></section>
<section class="blk" data-sec="2026-04-dte--maternal-mortality-lancet-gbd-2023-analysis"><h2 id="2026-04-dte--maternal-mortality-lancet-gbd-2023-analysis">Maternal mortality — <em>Lancet</em> GBD 2023 analysis</h2>
<ul>
<li><p><strong>MMR</strong> = maternal deaths per <strong>100,000 live births</strong>.</p></li>
<li><p>India's MMR fell from <strong>508 (1990) to 116 (2023)</strong>, about an <strong>80% drop</strong>. But India still recorded <strong>24,700</strong> maternal deaths in 2023, <strong>second only to Nigeria (32,900)</strong>.</p></li>
<li><p><strong>Nigeria, India, Ethiopia, Pakistan and Cameroon</strong> account for <strong>36%</strong> of global maternal deaths.</p></li>
<li><p>Globally there were about <strong>240,000</strong> maternal deaths, an <strong>MMR of 190.5</strong>. That is roughly three times the <strong>SDG 3.1 target of &lt; 70 by 2030</strong>.</p></li>
<li><p><strong>Haemorrhage and hypertensive disorders</strong> cause more than 40% of deaths. The hypertension share rose from <strong>16.6% to 20.1%</strong>.</p></li>
<li><p><strong>Late maternal deaths</strong> (from <strong>43 days to 1 year</strong> after childbirth) rose from <strong>1.3% to 3.2%</strong>.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-dte--pathogen-access-and-benefit-sharing-pabs"><h2 id="2026-04-dte--pathogen-access-and-benefit-sharing-pabs">Pathogen Access and Benefit Sharing (PABS)</h2>
<ul>
<li><p>The <strong>WHO Pandemic Agreement</strong> was adopted by the <strong>World Health Assembly in May 2025</strong>. Its <strong>PABS annex</strong> is still being negotiated in the <strong>Intergovernmental Working Group (IGWG)</strong>.</p></li>
<li><p><strong>Trade-off at the core of PABS:</strong> countries share pathogen samples and <strong>genetic sequence data</strong>. In return they receive timely vaccines, therapeutics and diagnostics.</p></li>
<li><p>At the <strong>6th IGWG (from 23 March 2026)</strong>, the <strong>Africa Group</strong> (led by <strong>South Africa and Namibia</strong>) and the <strong>Group for Equity</strong> rejected the Bureau's diluted draft of 9 March. They insisted on the <strong>on-screen text agreed on 14 February</strong>. No deal was reached; the next round was due in late April.</p></li>
<li><p><strong>Points of division:</strong> the <strong>EU</strong> backs <strong>anonymous access</strong> to pathogen data in the name of open science. Developing countries want enforceable, contract-based benefit sharing and <strong>sovereignty over pathogens</strong>, as recognised under the <strong>CBD and Nagoya Protocol</strong>.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-dte--space-artemis-ii-and-the-new-lunar-race"><h2 id="2026-04-dte--space-artemis-ii-and-the-new-lunar-race">Space: Artemis II and the new lunar race</h2>
<h3 id="2026-04-dte--artemis-ii">Artemis II</h3>
<ul>
<li><p>This is the <strong>first crewed flight to the Moon since Apollo (which ended in 1972)</strong>. It is a <strong>~10-day test flight with no landing</strong>. The crew are <strong>3 NASA astronauts and 1 from the Canadian Space Agency</strong>.</p></li>
<li><p>It launched about <strong>2 April 2026</strong> from <strong>Kennedy Space Center, Florida</strong>, in the <strong>Orion</strong> spacecraft (on the SLS rocket).</p></li>
<li><p>On <strong>6 April 2026</strong> the crew flew around the far side, passing <strong>6,513 km above the lunar far side</strong>. They travelled farther from Earth than any humans before.</p></li>
<li><p><strong>Purpose:</strong> to confirm that Orion's systems work with crew in deep space. It paves the way for an <strong>Artemis III landing at the lunar south pole</strong>. The long-term aim is a base for <strong>Mars</strong> missions.</p></li>
<li><p><strong>Terms:</strong> <strong>ICPS</strong> (Interim Cryogenic Propulsion Stage) is the in-space stage. <strong>Perigee</strong> and <strong>apogee</strong> are the lowest and highest points of an orbit around Earth.</p></li>
</ul>
<h4>Other players:</h4>
<ul>
<li><p><strong>India — Chandrayaan-3</strong> soft-landed near the <strong>south pole on 23 August 2023</strong>. <strong>Chandrayaan-4 (2027)</strong> is a <strong>lunar sample-return</strong> mission targeting the south pole region, with its <strong>permanently shadowed regions (PSRs)</strong> and possible water ice.</p></li>
<li><p><strong>China:</strong> <strong>Chang'e-4</strong> made the <strong>first far-side landing (2019)</strong>. Chang'e-5 returned samples (2020), and <strong>Chang'e-6 returned far-side samples (2024)</strong>. China plans a <strong>crewed landing by 2030</strong>; Rimae Bode, near the equator, is a candidate site.</p></li>
<li><p><strong>China and Russia</strong> announced the <strong>International Lunar Research Station (ILRS)</strong> in <strong>2021</strong>, aiming for a permanently crewed station by <strong>2035</strong>.</p></li>
<li><p><strong>Resources:</strong> the Moon holds <strong>helium-3</strong> and water ice. All major actors have signed the <strong>Outer Space Treaty (1967)</strong>.</p></li>
</ul>

<section class="blk" data-sec="2026-04-dte--climate-finance-trapped-in-incrementalism"><h2 id="2026-04-dte--climate-finance-trapped-in-incrementalism">Climate finance: "trapped in incrementalism"</h2>
<h4>Key figures:</h4>
<ul>
<li><p>The <strong>Independent High-Level Expert Group on Climate Finance</strong> estimates that <strong>EMDEs excluding China</strong> need <strong>$2.3–2.5 trillion a year by 2030</strong>. About <strong>$1 trillion</strong> of this must come from international sources, and <strong>adaptation alone needs ~$500 bn a year</strong>.</p></li>
<li><p>In 2023, EMDEs excluding China mobilised only <strong>$385 bn</strong>, about <strong>15% of need</strong>. Including China the total was <strong>$1.07 trillion</strong>, of which only <strong>$196 bn</strong> was international.</p></li>
<li><p>The gap could reach <strong>$2 trillion a year</strong> by 2030.</p></li>
<li><p>The <strong>Loss and Damage Fund</strong> had pledges of only about <strong>$700 million</strong> as of January 2026.</p></li>
<li><p><strong>COP30 (2025, Belém, Brazil)</strong> called for scaling up finance and reforming MDBs, but made <strong>no binding commitments</strong>.</p></li>
</ul>
<h4>Mitigation vs adaptation:</h4>
<ul>
<li><p><strong>Mitigation is ~90%</strong> of climate finance flows because it earns monetisable cash flows.</p></li>
<li><p><strong>Adaptation is under 10%</strong> (strictly defined, <strong>3–5%</strong>), even though building in resilience adds only <strong>1–5%</strong> to upfront costs and yields <strong>benefit-cost ratios of 4:1 or more</strong>.</p></li>
<li><p><strong>India's cyclone shelters</strong> achieved a <strong>BCR above 7:1</strong> (World Bank).</p></li>
<li><p>High risk pushes the <strong>cost of capital to 12–15%</strong> in much of Africa and South Asia, so private money flows to China and India.</p></li>
</ul>
<h4>Examples to know:</h4>
<ul>
<li><p><strong>National Cyclone Risk Mitigation Project</strong> (India, World Bank-supported): shifted disaster management from relief to <strong>ex-ante risk reduction</strong>, using public and multilateral money.</p></li>
<li><p><strong>Rewa Ultra Mega Solar Park</strong> (Madhya Pradesh, World Bank Group-backed): built on earlier MDB-supported power-sector reforms.</p></li>
<li><p><strong>Mission 300</strong> (World Bank-led): to connect <strong>300 million Africans</strong> to electricity by <strong>2030</strong>.</p></li>
<li><p><strong>South Africa:</strong> a <strong>$1.5 bn</strong> World Bank infrastructure loan in 2025, aligned with its <strong>Just Energy Transition</strong>.</p></li>
</ul>
<div class="callout c-frame"><span class="c-tag">Prelims lens</span><p><strong>Prelims framing:</strong> NCQG = <strong>$300 bn a year by 2035</strong> (COP29, Baku). It replaced the old <strong>$100 bn a year</strong> goal. Adaptation gives the highest returns but gets the least money.</p></div></section>
<section class="blk" data-sec="2026-04-dte--forest-economy-mahua"><h2 id="2026-04-dte--forest-economy-mahua">Forest economy: mahua</h2>
<h3 id="2026-04-dte--facts">Facts</h3>
<ul>
<li><p><strong>Mahua (<em>Madhuca longifolia</em>)</strong> is a sacred tree of central India's tribes, especially the <strong>Gonds</strong>. It is never felled, and its flowers are <strong>gathered after they fall</strong>, never plucked.</p></li>
<li><p><strong>Phenology:</strong> flowers from about the <strong>10th–15th year</strong>. Flowers fall from the <strong>third week of February to the first week of May</strong>, with peak flowering in <strong>March–April</strong>, the lean season. <strong>Fruit</strong> comes in <strong>June–July</strong>; its seeds give oil (10 kg of seed yields 2–3 kg of oil).</p></li>
<li><p><strong>Uses:</strong> food, liquor, medicine, barter, and seed oil (used for cough, cold and fever).</p></li>
<li><p><strong>Economy:</strong></p>
<ul>
<li><p>India produces about <strong>0.85 million tonnes</strong> of mahua flowers a year, and about <strong>75% of the tribal population</strong> is involved in collecting them (IIED study).</p></li>
<li><p><strong>Chhattisgarh</strong> produces about <strong>50,000 t</strong>. Its <strong>MSP for dried mahua flowers is ₹33/kg</strong> (including a ₹3 bonus), while the market rate is about ₹45/kg.</p></li>
<li><p>In <strong>Gariaband district</strong>, about <strong>82%</strong> of households collect mahua. Mahua contributes 14–22% of income in 10 Odisha districts.</p></li>
</ul></li>
<li><p><strong>Commons:</strong> a mahua tree is both private property and a community resource. A tree in the forest belongs to whoever spots it first (marked with painted stones). Mahua trees are often <strong>excluded from land sales</strong> and stay shared after partition.</p></li>
<li><p><strong>Culture:</strong> the anecdote comes from <strong>Verrier Elwin's <em>Leaves from the Jungle: Life in a Gond Village</em> (1936)</strong>. Other species mentioned: <strong>saaj (<em>Terminalia elliptica</em>)</strong>, the abode of the Gond supreme deity, and <strong>tendu (<em>Diospyros melanoxylon</em>)</strong>.</p></li>
</ul></section>
<section class="blk" data-sec="2026-04-dte--human-capital-and-adult-height-world-bank"><h2 id="2026-04-dte--human-capital-and-adult-height-world-bank">Human capital and adult height (World Bank)</h2>
<div class="callout c-news"><span class="c-tag">In the news</span><p><strong>Report:</strong> World Bank Group, <strong>"Building Human Capital — Where it Matters"</strong></p></div>
<ul>
<li><p><strong>Human capital</strong> is defined as "people's <strong>health, skills and knowledge</strong>". The report uses <strong>adult height</strong> as a proxy for health.</p></li>
<li><p>It compares adults <strong>born in 1966 with those born in 1996</strong>. People in upper-middle- and high-income countries have grown taller; people in low- and lower-middle-income countries are now shorter.</p></li>
<li><p><strong>Western Europe</strong> gained about <strong>1 cm per decade</strong> during the 20th century, and <strong>China</strong> has gained at a similar pace recently. <strong>Sub-Saharan Africa:</strong> an adult born in 1996 is <strong>3 cm shorter</strong> than one born in 1966.</p></li>
<li><p><strong>India:</strong> average adult height has stayed <strong>flat or declined slightly</strong>.</p></li>
<li><p>Human capital explains roughly <strong>two-thirds</strong> of the per-capita GDP gap between rich and poor countries.</p></li>
<li><p>An earlier 2023 World Bank analysis warned of a COVID-driven <strong>"collapse in human capital"</strong>, when <strong>2.6 billion</strong> people were under 20.</p></li>
</ul>
<div class="callout c-frame"><span class="c-tag">Prelims lens</span><p><strong>Prelims framing:</strong> The <strong>Human Capital Index</strong> (World Bank, <strong>2018</strong>) is separate from UNDP's HDI. Stunting is a low height-for-age indicator in children; adult height reflects the cumulative effect of that childhood health.</p></div></section>

<section class="blk" data-sec="2026-05-dte--a-possible-super-el-ni-o-and-the-2026-monsoon-fo"><h2 id="2026-05-dte--a-possible-super-el-ni-o-and-the-2026-monsoon-fo">A possible "super" El Niño and the 2026 monsoon forecast</h2>
<div class="callout c-concept"><span class="c-tag">Concept</span><p><strong>Concept — El Niño:</strong> El Niño is the <strong>warm phase of ENSO</strong> in the equatorial Pacific. Westward <strong>trade winds weaken or reverse</strong>, so warm water builds up in the <strong>eastern Pacific</strong>. Rainfall then rises over the eastern Pacific and falls over <strong>Australia and the Maritime Continent</strong>. In India, El Niño usually <strong>weakens the southwest monsoon</strong> and <strong>strengthens the northeast monsoon</strong>.</p></div>
<p><strong>How an El Niño is declared:</strong> the <strong>Oceanic Niño Index (ONI)</strong> must be <strong>≥ 0.5°C</strong> above normal. The ONI is a 3-month average of sea-surface temperature in the <strong>Niño 3.4</strong> region.</p>
<div class="table-wrap"><table>

<thead>
<tr class="header">
<th><strong>ONI anomaly</strong></th>
<th><strong>Strength (NOAA)</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>0.5°C</td>
<td>Weak</td>
</tr>
<tr class="even">
<td>1.0°C</td>
<td>Moderate</td>
</tr>
<tr class="odd">
<td>1.5°C</td>
<td>Strong</td>
</tr>
<tr class="even">
<td>2.0°C and above</td>
<td>Very strong (informally called a "super" El Niño)</td>
</tr>
</tbody>
</table></div>
<h4>News:</h4>
<ul>
<li><p>On <strong>6 April 2026</strong>, <strong>NOAA's Climate Prediction Center</strong> gave a <strong>62%</strong> chance of El Niño in June–August. The UK Met Office says it could be the <strong>strongest this century</strong>, comparable to 1997–98.</p></li>
<li><p>Only <strong>three very strong El Niños</strong> have occurred since 1950: <strong>1982–83, 1997–98 and 2015–16</strong> (<em>Nature Communications</em>, Dec 2025).</p></li>
<li><p><strong>Spring predictability barrier:</strong> forecasts made in <strong>March–May</strong> are unreliable because ocean–atmosphere coupling is weak then. Clarity improves from late May–June.</p></li>
<li><p><strong>La Niña collapsed in January 2026</strong>; by April the Pacific was ENSO-neutral and moving towards El Niño.</p></li>
<li><p><strong>2025 was the third-warmest year</strong> on record (WMO). <strong>2023–24</strong> was the hottest two-year period, when El Niño and warming combined. The UK Met Office expects global temperature to <strong>exceed 1.5°C</strong> next year.</p></li>
<li><p><strong>Economic cost</strong> (Callahan, <em>Science</em> 2023): the 1982–83 El Niño caused <strong>$4.1 trillion</strong> in losses and 1997–98 caused <strong>$5.7 trillion</strong>. Losses this century could reach <strong>$84 trillion</strong>.</p></li>
</ul>
<h4>IMD long-range forecast (13 April 2026):</h4>
<ul>
<li><p>The southwest monsoon gives about <strong>70%</strong> of India's annual rainfall. Its <strong>LPA is about 870 mm</strong> (June–September). IMD expects about <strong>800 mm</strong> in 2026.</p></li>
<li><p><strong>Chance of a deficient monsoon (&lt; 90% of LPA) is 35%</strong>, more than double the climatological 16%. Below normal (90–95%) is 31%; normal (96–104%) is 27%.</p></li>
<li><p>About <strong>60% of farmers</strong> depend on monsoon rain for kharif.</p></li>
<li><p><strong>Precedent, 2015:</strong> IMD forecast 93% of LPA, revised it to 88%, and actual rainfall was <strong>86%</strong>.</p></li>
</ul>
<h4>Three factors shaping the 2026 monsoon:</h4>
<ol type="1">
<li><p><strong>ENSO:</strong> the developing El Niño is a negative factor.</p></li>
<li><p><strong>IOD:</strong> currently neutral, and <strong>positive by the end of the season</strong>. A positive IOD (warm west, cool east Indian Ocean) favours rain.</p></li>
<li><p><strong>Eurasian snow cover:</strong> <strong>slightly below normal (January–March)</strong>, which favours a good monsoon.</p></li>
</ol>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> A <strong>positive IOD helps</strong> the monsoon, and <strong>low Eurasian snow cover helps</strong> it. El Niño <strong>suppresses the southwest monsoon but boosts the northeast monsoon</strong>. "Super El Niño" is an informal label, not an official NOAA category.</p></div></section>
<section class="blk" data-sec="2026-05-dte--pre-monsoon-extreme-weather-and-crop-loss"><h2 id="2026-05-dte--pre-monsoon-extreme-weather-and-crop-loss">Pre-monsoon extreme weather and crop loss</h2>
<div class="callout c-concept"><span class="c-tag">Concept</span><p><strong>Core idea:</strong> Risk is no longer limited to the monsoon (June–September). The <strong>pre-monsoon (March–May)</strong> and <strong>post-monsoon (October–November)</strong> months are becoming risky too, which adds up to a "<strong>365-day bad season</strong>".</p></div>
<h4>Why the timing hurts:</h4>
<ul>
<li><p><strong>March–April</strong> is the <strong>rabi harvest</strong> (wheat, mustard, pulses). Crops lost days before harvest cannot be replanted.</p></li>
<li><p><strong>Pre-monsoon showers</strong> restore soil moisture before <strong>kharif sowing</strong>. This matters most in <strong>rainfed areas</strong> (about 60% of net sown area, per article).</p></li>
</ul>
<h4>2026 figures:</h4>
<ul>
<li><p>From <strong>1 March to 7 April 2026</strong>, unseasonal rain or hail fell on <strong>29 of 38 days</strong> in <strong>24+ states</strong>.</p></li>
<li><p>At least <strong>6.27 lakh ha</strong> of crops were damaged in <strong>13 states</strong>: <strong>UP (3.47 lakh ha), Maharashtra (2.05 lakh ha) and Bihar (45,000 ha)</strong>. This is already close to the total for the whole 2023 pre-monsoon season (about 6.36 lakh ha).</p></li>
<li><p><strong>Bikaner (Rajasthan):</strong> hailstorms on 2–4 April destroyed <strong>wheat, mustard, barley, chana and isabgol (psyllium)</strong>.</p></li>
<li><p><strong>Warm February:</strong> India had <strong>24 cold wave or cold day events in January 2026 but none in February</strong>. Wheat needs a sustained cold spell during <strong>grain filling</strong>, so yields fell (e.g., a 30–35% loss in Moga, Punjab). Potatoes in Jalandhar were also hit by heat.</p></li>
<li><p><strong>Telangana:</strong> fog and unusual cold in December–January caused <strong>mango flower drop</strong>.</p></li>
</ul>
<h4>Studies:</h4>
<ul>
<li><p><strong><em>Ecofeminism and Climate Change</em> (2025):</strong> pre-monsoon (March–May) surface temperature anomalies now exceed <strong>0.75°C</strong> across most of India. About <strong>70%</strong> of surveyed Telangana farmers reported <strong>sowing delays</strong>.</p></li>
<li><p><strong>Mercator Institute + Potsdam Institute for Climate Impact Research (2024), on 1966–2014 data:</strong> every <strong>1°C rise in October–November temperature cuts rice yield by about 9.1%</strong>. Under worst-case warming, rice yields could fall <strong>22% by 2081–2100</strong>. A projected 9–24% rise in monsoon rain will not make up for this.</p></li>
<li><p><strong>Hailstorms cannot be predicted</strong> with current models (ICAR's <strong>NICRA</strong> — National Innovations in Climate Resilient Agriculture).</p></li>
</ul>
<h4>Relief steps:</h4>
<ul>
<li><p>The <strong>Centre relaxed wheat grain quality norms</strong> for <strong>Punjab, Chandigarh and Rajasthan</strong>.</p></li>
<li><p><strong>UP</strong> let farmers sell wheat at <strong>MSP without prior online registration</strong>.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> The main risk to wheat is <strong>terminal heat</strong> during grain filling (February–March), not just rain. Post-monsoon heat hits <strong>kharif rice</strong> near harvest, not rabi crops.</p></div></section>
<section class="blk" data-sec="2026-05-dte--poverty-s-own-republic-india-s-geography-of-pove"><h2 id="2026-05-dte--poverty-s-own-republic-india-s-geography-of-pove">"Poverty's own republic" — India's geography of poverty</h2>
<p><strong>Core argument:</strong> The same districts in <strong>central and eastern India</strong> have been the poorest since <strong>1951</strong>, across every regime. These are Odisha, Chhattisgarh, MP, parts of Maharashtra, Bihar and Jharkhand. They overlap with India's richest <strong>forests, minerals and river basins</strong>.</p>
<h4>Official lists of poorest districts:</h4>
<div class="table-wrap"><table>

<thead>
<tr class="header">
<th><strong>Year</strong></th>
<th><strong>Exercise</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td>1951</td>
<td>Poorest regions identified with the <strong>First Five-Year Plan</strong></td>
</tr>
<tr class="even">
<td>1996</td>
<td><strong>Kalahandi</strong> declared one of <strong>41 starvation-prone districts</strong></td>
</tr>
<tr class="odd">
<td>1997</td>
<td><strong>100 poorest districts</strong> identified (since split into about 200)</td>
</tr>
<tr class="even">
<td>2003</td>
<td><strong>150 most backward districts</strong> listed (to target wage programmes)</td>
</tr>
<tr class="odd">
<td>Jan 2018</td>
<td><strong>Aspirational Districts Programme</strong> launched for <strong>112</strong> districts</td>
</tr>
</tbody>
</table></div>
<h4>Schemes and terms:</h4>
<ul>
<li><p><strong>Antyodaya Anna Yojana (AAY):</strong> launched in <strong>December 2000</strong> after a survey found <strong>5%</strong> of people went to bed without two square meals. It covers the poorest BPL households, initially about <strong>10 million</strong>, with up to <strong>35 kg of foodgrain a month</strong> (now free).</p></li>
<li><p><strong>Chronic poor</strong> (Chronic Poverty Research Centre, led by <strong>Aasha Kapur Mehta</strong>): people poor for long periods who may pass poverty on to their children. They are about <strong>half of the poor</strong>, live mostly in forest and resource-rich areas, and fall back into poverty when hit by shocks.</p></li>
<li><p><strong>Dadan:</strong> advance-wage, debt-bonded <strong>seasonal migrant labour</strong>, from the Persian "<em>dadni</em>" (advance) used in the East India Company's textile trade. It is regulated by the <strong>Orissa Dadan Labour (Control and Regulation) Act, 1975</strong>.</p></li>
<li><p><strong>KBK region</strong> (<strong>Kalahandi–Balangir–Koraput</strong>): now <strong>8 districts</strong> covering 30%+ of Odisha. Over 125 years it has seen about 100 drought years and 10 famines, and <strong>10,000+ starvation deaths (1956–2005)</strong>. About <strong>7 lakh people migrate each year</strong>. "<em>Sukhbasi</em>" is the local term for the landless.</p></li>
<li><p><strong>Chhappania Akal (1899–1900 famine):</strong> an estimated <strong>9 million deaths</strong> across India.</p></li>
<li><p><strong>Phanas Punji, Amlapali (Kalahandi, now Nuapada):</strong> her sale of her sister-in-law for food led to a <strong>visit by PM Rajiv Gandhi on 27 July 1985</strong> and his "<strong>15 paise of a rupee reaches</strong>" remark.</p></li>
<li><p><strong>Tribes in the story:</strong> the <strong>Kamar</strong> (a PVTG, bamboo artisans, Dhamtari, Chhattisgarh) and the <strong>Madiya</strong> of <strong>Abujhmad</strong> (Narayanpur), closed to outsiders until <strong>2009</strong>. Baba Amte called this central belt India's "<strong>cummerbund</strong>".</p></li>
<li><p><strong>Railways and loss of livelihood:</strong> the <strong>235-km Dallirajhara–Rowghat–Jagdalpur line</strong> (2022, Kanker) carries Rowghat iron ore. It cleared <strong>tendu, sal and mahua</strong> forests, and villages lost forest income.</p></li>
</ul>
<h4>Poverty estimation (2011–12, the last official count):</h4>

<th><strong>Poverty line (₹/person/month)</strong></th>
<th><strong>Rural poor</strong></th>
<th><strong>Urban poor</strong></th>

<tr class="even">

<ul>
<li><p>The <strong>absolute number of poor stayed at about 260–300 million</strong> until 2011–12, even as the poverty <em>rate</em> fell from 1973–74. No official headcount has been done for <strong>15+ years</strong>.</p></li>
</ul>
<h4>Inequality and natural capital:</h4>
<ul>
<li><p><strong>World Inequality Lab:</strong> in 2022 the bottom 50% earned <strong>₹53,610 per head a year</strong>. The <strong>top 1% hold over a fifth of national income</strong> and the bottom half only <strong>13%</strong>.</p></li>
<li><p><strong>Natural capital</strong> is about <strong>9% of wealth globally</strong> but <strong>47%</strong> in low-income countries. More than <strong>1 billion</strong> people worldwide depend on forests, about <strong>200 million</strong> of them in India.</p></li>
<li><p><strong>IPBES:</strong> <strong>14 of 18</strong> categories of nature's contributions to people have declined since 1970.</p></li>
<li><p><strong>UNEP (1992–2014):</strong> produced capital per head <strong>doubled</strong>, human capital rose <strong>13%</strong>, and natural capital per head <strong>fell about 40%</strong>.</p></li>
<li><p><strong>Tribal people:</strong> <strong>104 million</strong> (Census 2011), more than half of whom live <strong>outside the 809 tribal-majority blocks</strong>. Villages with a 100% tribal population fell <strong>32%</strong> between 2001 and 2011. Tribal cultivators fell <strong>10%</strong>, while tribal agricultural labourers rose <strong>9%</strong>.</p></li>
</ul>
<div class="callout c-trap"><span class="c-tag">Watch out</span><p><strong>Prelims trap:</strong> The ADP covers <strong>112</strong> districts (launched in 2018), not 115 or 100. AAY was launched in <strong>2000</strong> with <strong>35 kg</strong> per household. The Tendulkar rural line is ₹816; ₹972 is the Rangarajan rural line. (The article's "₹32 a day" rural line matches <strong>Rangarajan</strong>, not Tendulkar.)</p></div></section>
<section class="blk" data-sec="2026-05-dte--industrial-unrest-in-the-ncr-and-contract-labour"><h2 id="2026-05-dte--industrial-unrest-in-the-ncr-and-contract-labour">Industrial unrest in the NCR and contract labour</h2>
<div class="callout c-news"><span class="c-tag">In the news</span><p><strong>News:</strong> In <strong>March–April 2026</strong>, worker strikes began in the <strong>Gurugram–Manesar</strong> auto belt (Haryana) and spread to <strong>Faridabad and Noida</strong> (UP). The causes were wages of ₹10,000–15,000 a month against demands of ₹20,000–26,000, and inflation in food, rent and LPG after the <strong>Strait of Hormuz</strong> closure.</p></div>
<ul>
<li><p><strong>UP raised minimum wages by 20–21%</strong>, and <strong>Haryana announced about a 35% increase</strong>.</p></li>
<li><p>About <strong>300–400 workers</strong> were arrested across the NCR.</p></li>
</ul>
<h4>Contract labour, explained:</h4>
<ul>
<li><p>It is governed by the <strong>Contract Labour (Regulation and Abolition) Act, 1970</strong>. That Act has since been subsumed in the <strong>Occupational Safety, Health and Working Conditions Code, 2020</strong>; the four labour codes were brought into force in November 2025.</p></li>
<li><p>It involves <strong>three parties</strong>:</p>
<ol type="1">
<li><p>the <strong>principal employer</strong> (the factory);</p></li>
<li><p>the <strong>contractor</strong>, who supplies the workers and pays them;</p></li>
<li><p>the <strong>contract worker</strong>, who is legally the contractor's employee.</p></li>
</ol></li>
<li><p><strong>If the contractor defaults, the principal employer must pay</strong> and can then recover the amount from the contractor.</p></li>
<li><p><strong>Annual Survey of Industries (MoSPI):</strong> the share of contract labour in organised industry rose from about <strong>15% to over 40%</strong> in 30 years.</p></li>
</ul>
<h4>Growth and jobs (the author's analysis):</h4>
<ul>
<li><p><strong>2004–14:</strong> savings and investment peaked (investment at <strong>32–38% of GDP</strong>). Non-farm jobs grew by about <strong>7.5 million a year</strong>, and <strong>farm workers fell in absolute numbers for the first time</strong>. Real wages rose, and the <strong>absolute number of poor fell</strong> (2004–12).</p></li>
<li><p><strong>2014–24:</strong> GDP growth averaged about <strong>6.2%</strong>, investment was <strong>26–32%</strong>, <strong>real wages stagnated</strong> (PLFS), and agriculture absorbed about <strong>80 million</strong> more workers after 2020.</p></li>
</ul>
<div class="callout c-frame"><span class="c-tag">Prelims lens</span><p><strong>Prelims framing:</strong> In law, the contract worker is the <strong>contractor's</strong> employee, but the principal employer is <strong>ultimately liable</strong> for unpaid wages.</p></div></section>
